<!DOCTYPE html>

<style>

.topin{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:.4rem;padding:.45rem .8rem}

h1{font-size:1.6rem;line-height:1.35;margin:.4rem 0 .8rem;color:var(--pri)}

.notice{background:#fff5e8;border:1.5px solid #f0c9a0;border-radius:20px;padding:.8rem 1rem;color:#4a2a12}
.verse{background:#eef6e9;border-left:5px solid #9cc58f;border-radius:16px;padding:.7rem .9rem;margin:.7rem 0}

.verse sup{color:#3d6b33;font-weight:700;font-size:.72em;margin-right:.15em}
.verse .vn{color:var(--muted);font-size:.85rem}

.banner{display:block;width:100%;height:150px;object-fit:cover;border-radius:22px;border:3px solid #fffaf0;box-shadow:0 6px 16px rgba(120,96,50,.14);margin:.2rem 0 .7rem}
img[data-img]:not([src]){background:linear-gradient(135deg,#f3ead2,#e3eedc 55%,#dfeaf1)}

.notes{display:flex;gap:.8rem;align-items:center;background:#fff7e0;border:2px solid #ecd08e;border-radius:22px;padding:.7rem 1rem;margin:.8rem 0}
.notes .nb{flex:0 0 auto;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--sky);color:var(--pri);display:flex;align-items:center;justify-content:center}

.howto{background:linear-gradient(180deg,#fff4d6,#fffcf3);border:3px solid #edc36a;border-radius:26px;padding:1.1rem 1.1rem 1.2rem;margin:1rem 0;box-shadow:0 10px 26px rgba(200,150,50,.18)}

.howto ol>li+li{border-top:1px dashed #ecd9a8}
.howto .btnrow{justify-content:center}
.steps .st{font-weight:800;color:var(--pri)}

/* quiz */
.progwrap{display:flex;align-items:center;gap:.5rem;padding-top:30px}
.prog{flex:1;position:relative;height:16px;background:#efe7d4;border:1px solid #e0d4b8;border-radius:99px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#9cc58f,#5f9cc0);width:0;transition:width .25s;border-radius:99px}
.walker{position:absolute;bottom:100%;width:28px;height:28px;color:#d9963a;transition:left .25s;margin-left:-14px}

.fin{width:30px;height:30px;color:#d9963a;stroke-width:2.6}
.progtxt{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);margin:.35rem 0 .2rem}
.qcard{position:relative;overflow:hidden;padding-right:3.2rem}
.qcard .deco{position:absolute;right:.6rem;top:.6rem;width:2.4rem;height:2.4rem;color:#9cc58f;opacity:.7}
.qtext{font-size:1.32rem;font-weight:700;line-height:1.6;margin:.3rem 0;min-height:4.4em}
.opts{display:grid;gap:.6rem}
.opt{display:flex;align-items:center;gap:.8rem;width:100%;min-height:62px;padding:.6rem 1rem;border:2px solid #d8ccb2;border-radius:18px;background:#fffdf7;color:var(--ink);font-size:1.1rem;font-family:inherit;text-align:left;cursor:pointer}
.opt .dot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:3px solid #a99d86;display:inline-block}

.qnav{display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
/* chips / tiles */
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}

.tiles{display:grid;grid-template-columns:1fr;gap:.7rem}

.tile{display:flex;flex-direction:column;gap:.15rem;border:2px solid var(--pl,#eadfc6);border-radius:20px;padding:.7rem .9rem;background:linear-gradient(180deg,var(--pb,#fff),#fffdf6);text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);font-size:1rem;box-shadow:0 4px 14px rgba(120,96,50,.08);min-height:96px;width:100%}

.tile .tr{font-size:.9rem;color:var(--muted)}
.tile .tg2{font-size:.92rem;color:var(--ink)}
.pA{--pb:#e6f0f5;--pl:#c6dcea;--pf:#2c5a78}
.pB{--pb:#e3f0dc;--pl:#bcd9ad;--pf:#3d6b33}
.pC{--pb:#f6e7dc;--pl:#e7c3a8;--pf:#8a3f1c}
.pD{--pb:#ece6f6;--pl:#cdbfe6;--pf:#5a4790}
.plab{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:0 .6rem;background:var(--pb);color:var(--pf);border:1px solid var(--pl)}

.dhead h1{color:var(--pf);margin:.2rem 0}
.lbl{font-weight:800;color:var(--pf,var(--pri));margin:.8rem 0 .2rem;display:flex;align-items:center;gap:.35rem}
.dist{background:#f4eefb;border:1.5px dashed #b9a6e0;border-radius:16px;padding:.6rem .9rem;margin:.4rem 0}
.contr{background:#eef6e9;border:1.5px solid #bcd9ad;border-radius:16px;padding:.6rem .9rem;margin:.4rem 0}
.qbox{background:#fff7e0;border:2px solid #ecd08e;border-radius:18px;padding:.7rem 1rem;font-weight:700;color:#5a3d06;font-size:1.08rem}
textarea{width:100%;min-height:7.5em;font-family:inherit;font-size:1rem;line-height:1.6;padding:.7rem .8rem;border-radius:16px;border:2px solid #d8ccb2;background:#fffefb;color:var(--ink);resize:vertical}
textarea:focus,input[type=search]:focus{outline:3px solid #f6c453;border-color:#e0a64a}
input[type=search]{width:100%;font-family:inherit;font-size:1.1rem;min-height:56px;padding:.5rem 1rem;border-radius:999px;border:2px solid #b9d0de;background:#fff;color:var(--ink)}
mark{background:#fbe39a;color:inherit;border-radius:4px;padding:0 .1em}

.rhero{background:linear-gradient(135deg,#e6f0f5,#fffaf0);border:2px solid #cfe0ea;border-radius:26px;padding:1rem 1.1rem;margin:.8rem 0}
.rank{display:flex;gap:.8rem;align-items:flex-start}
.rank .no{flex:0 0 auto;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--pf,#5f9cc0);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.rank>div{min-width:0;flex:1}
.mitem{border-top:1px dashed #e3d3ab;padding-top:.6rem;margin-top:.6rem}
.confirm{background:#fff5e8;border:2px solid #e7b9a0;border-radius:18px;padding:.8rem 1rem;margin:.6rem 0}
footer{max-width:960px;margin:0 auto;padding:1rem .9rem 2.5rem;font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#3d3a33;color:#fff;padding:.7rem 1.2rem;border-radius:999px;font-size:1rem;z-index:20;display:none;max-width:90vw;text-align:center}
.hidden{display:none!important}
@media(min-width:1000px){:root{--fs:20px}}
/* v2 */
.brand{font-size:clamp(.78rem,3.75vw,1.08rem);gap:.3rem}.topin{gap:.3rem;padding:.45rem .6rem}@media(max-width:360px){.brand .ic{display:none}}
.tbtn.mus{display:inline-flex;align-items:center;gap:.25rem;padding:0 .6rem;font-weight:700}.tbtn.mus .ic{width:1.15em;height:1.15em;stroke-width:2.4}.tbtn.mus.off{color:#8a8170;background:#f4efe4}.tbtn.mus.off .ic{opacity:.55}
.strip{display:block;width:100%;height:70px;object-fit:cover;border-radius:18px;border:3px solid #fffaf0;margin:.1rem 0 .5rem;opacity:.95}
h1.big{font-size:2rem;line-height:1.3;margin:.5rem 0 .4rem}
.start{display:flex;width:100%;min-height:84px;font-size:1.6rem;letter-spacing:.2em;max-width:none;margin:1rem 0 .6rem}
.links{display:flex;flex-direction:column;gap:.5rem;margin:.4rem 0 1rem}
.links .btn{width:100%;margin:0}
details.fold{background:var(--card);border:1px solid #eee3ca;border-radius:20px;padding:.4rem 1rem;margin:.8rem 0}
details.fold summary{cursor:pointer;min-height:48px;display:flex;align-items:center;gap:.4rem;font-weight:700;color:var(--pri)}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.2rem 0 .4rem}
.qnum{font-size:1.15rem;font-weight:800;color:var(--pri)}
.bar{height:14px;background:#efe7d4;border:1px solid #e0d4b8;border-radius:99px;overflow:hidden;margin:.2rem 0 1rem}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#9cc58f,#5f9cc0);border-radius:99px;transition:width .25s}
.qbig{font-size:1.65rem;font-weight:800;line-height:1.55;margin:.6rem 0 1.4rem;min-height:6.2em;display:flex;align-items:center}
.ansrow{display:grid;gap:.8rem}
.ans{min-height:80px;border-radius:24px;font-size:1.6rem;font-weight:800;font-family:inherit;cursor:pointer;border:3px solid #d8ccb2;background:#fffdf7;color:var(--ink);letter-spacing:.15em}

.picks{display:grid;gap:.9rem;margin:.8rem 0}

.pick .pt{display:block;font-size:1.35rem;font-weight:800;color:var(--pf);line-height:1.45}
.pick .pd{display:block;font-size:1.05rem;margin-top:.3rem;color:var(--muted)}

.ask{font-size:1.4rem;font-weight:800;color:var(--acc);margin:1.2rem 0 .2rem}
.truebox{background:#eef6e9;border:2px solid #bcd9ad;border-radius:24px;padding:.8rem 1rem;margin:1rem 0}

.list{display:flex;flex-direction:column;gap:.5rem}
.li{display:block;width:100%;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;border:2px solid var(--pl);background:var(--card);border-radius:18px;padding:.6rem .9rem;min-height:60px}
.li b{display:block;color:var(--pf);font-size:1.1rem;line-height:1.45}
.li span{font-size:.9rem;color:var(--muted)}
.ghd{margin:1.4rem 0 .5rem;font-size:1.2rem;color:var(--pf);border-left:6px solid var(--pl);padding-left:.6rem}

.gentle{background:#fff5e8;border:1.5px solid #f0c9a0;border-radius:18px;padding:.6rem .9rem;font-size:1rem}
</style>

<script>var DATA={"parts": [["A", "一、按神形像被造與更新"], ["B", "二、聖經中的神形像比喻"], ["C", "三、聖經中較嚴厲或令人不安的神形像"], ["D", "四、屬靈導引中常見的扭曲神形像"]], "items": [{"id": "A1", "p": "A", "t": "渴望關係、願意分享自己的神", "ref": "創世記 1:26-27", "key": "創1:26-27", "bk": "創世記", "q": "你覺得神想與你建立關係，還是只是要求你？", "kw": "關係 相交 創造", "verses": [[26, "神說：「我們要照著我們的形像、按著我們的樣式造人，使他們管理海裡的魚、空中的鳥、地上的牲畜，和全地，並地上所爬的一切昆蟲。」"], [27, "神就照著自己的形像造人，乃是照著他的形像造男造女。"]], "god": "神主動將自己的形像和樣式賜給人，盼望人回應祂、與祂相交。"}, {"id": "A2", "p": "A", "t": "願意將生命傳承下去的神", "ref": "創世記 5:1-3", "key": "創5:1-3", "bk": "創世記", "q": "你身上哪些地方反映出神的樣式？", "kw": "傳承 生命 樣式", "verses": [[1, "亞當的後代記在下面。（當　神造人的日子，是照著自己的樣式造的，"], [2, "並且造男造女。在他們被造的日子，　神賜福給他們，稱他們為「人」。）"], [3, "亞當活到一百三十歲，生了一個兒子，形像樣式和自己相似，就給他起名叫塞特。"]], "god": "神甘願將自己的樣式一代一代延續下去。"}, {"id": "A3", "p": "A", "t": "珍惜每一個生命的神", "ref": "創世記 9:6", "key": "創9:6", "bk": "創世記", "q": "你相信神珍惜你嗎？你在甚麼時候感受到？", "kw": "珍惜 生命 接納", "verses": [[6, "凡流人血的，他的血也必被人所流，因為　神造人是照自己的形像造的。"]], "god": "神十分認真看待每一個人的生命，連罪人也不例外。"}, {"id": "A4", "p": "A", "t": "賜人尊榮、信任人的神", "ref": "詩篇 8:4-8", "key": "詩8:4-8", "bk": "詩篇", "q": "你覺得神信得過你，還是看不起你？", "kw": "尊榮 信任 眷顧", "verses": [[4, "便說：人算甚麼，你竟顧念他？世人算甚麼，你竟眷顧他？"], [5, "你叫他比天使（或譯：　神）微小一點，並賜他榮耀尊貴為冠冕。"], [6, "你派他管理你手所造的，使萬物，就是一切的牛羊、田野的獸、空中的鳥、海裡的魚，凡經行海道的，都服在他的腳下。"]], "vnote": "（和合本把第7–8節併入第6節）", "god": "神眷顧渺小的人，以榮耀尊貴為人加冠，更放心將萬物交託給人。"}, {"id": "A5", "p": "A", "t": "與每個人認同的神", "ref": "雅各書 3:9", "key": "雅3:9", "bk": "雅各書", "q": "你最難接納的人，神會怎樣看他？", "kw": "認同 接納 別人", "verses": [[9, "我們用舌頭頌讚那為主、為父的，又用舌頭咒詛那照著　神形像被造的人。"]], "god": "神將自己與每個人連在一起；咒詛人，就等於傷害祂的形像。"}, {"id": "A6", "p": "A", "t": "不容被縮小、扭曲的神", "ref": "羅馬書 1:23", "key": "羅1:23", "bk": "羅馬書", "q": "你心裡有沒有一個「太小」的神？", "kw": "偶像 榮耀 扭曲", "verses": [[23, "將不能朽壞之　神的榮耀變為偶像，彷彿必朽壞的人和飛禽、走獸、昆蟲的樣式。"]], "god": "神的榮耀不能朽壞，遠超過人按自己投射出來的偶像。"}, {"id": "A7", "p": "A", "t": "透過人彰顯榮耀的神", "ref": "哥林多前書 11:7", "key": "林前11:7", "bk": "哥林多前書", "q": "神怎樣透過你身邊的人向你顯出祂自己？", "kw": "榮耀 人", "verses": [[7, "男人本不該蒙著頭，因為他是　神的形像和榮耀；但女人是男人的榮耀。"]], "god": "神樂意在人身上顯出祂的榮耀。"}, {"id": "A8", "p": "A", "t": "讓人可以看見的神", "ref": "哥林多後書 4:4", "key": "林後4:4", "bk": "哥林多後書", "q": "你是透過耶穌認識神，還是透過其他經驗？", "kw": "基督 耶穌 光 認識", "verses": [[4, "此等不信之人被這世界的神弄瞎了心眼，不叫基督榮耀福音的光照著他們。基督本是　神的像。"]], "god": "神在基督裡照出光來，使人可以真實地認識祂。"}, {"id": "A9", "p": "A", "t": "不可見卻願意被認識的神", "ref": "歌羅西書 1:15", "key": "西1:15", "bk": "歌羅西書", "q": "神在你生命中是遙遠的，還是親近的？", "kw": "認識 親近 遙遠 耶穌", "verses": [[15, "愛子是那不能看見之　神的像，是首生的，在一切被造的以先。"]], "god": "神本來不能看見，卻在愛子身上表明自己。"}, {"id": "A10", "p": "A", "t": "光輝而真實的神", "ref": "希伯來書 1:3", "key": "來1:3", "bk": "希伯來書", "q": "耶穌的哪一面最使你認識神？", "kw": "基督 耶穌 榮耀", "verses": [[3, "他是　神榮耀所發的光輝，是　神本體的真像，常用他權能的命令托住萬有。他洗淨了人的罪，就坐在高天至大者的右邊。"]], "god": "神的本體和榮耀，在基督身上完全顯明出來。"}, {"id": "A11", "p": "A", "t": "虛己謙卑、俯就人的神", "ref": "腓立比書 2:6-7", "key": "腓2:6-7", "bk": "腓立比書", "q": "你能否想像神彎下身來服侍你？", "kw": "謙卑 僕人 虛己 耶穌", "verses": [[6, "他本有　神的形像，不以自己與　神同等為強奪的；"], [7, "反倒虛己，取了奴僕的形像，成為人的樣式；"]], "god": "神不緊抓自己的地位，反而降卑成為僕人。"}, {"id": "A12", "p": "A", "t": "有心意、有計劃的神", "ref": "羅馬書 8:29", "key": "羅8:29", "bk": "羅馬書", "q": "你覺得神在你身上有心意嗎？", "kw": "心意 計劃 塑造", "verses": [[29, "因為他預先所知道的人，就預先定下效法他兒子的模樣，使他兒子在許多弟兄中作長子。"]], "god": "神早已定意塑造人，使人效法祂兒子的模樣。"}, {"id": "A13", "p": "A", "t": "耐心地改變人的神", "ref": "哥林多後書 3:18", "key": "林後3:18", "bk": "哥林多後書", "q": "你覺得神改變你時是有耐性的，還是催逼的？", "kw": "耐心 改變 更新", "verses": [[18, "我們眾人既然敞著臉得以看見主的榮光，好像從鏡子裡返照，就變成主的形狀，榮上加榮，如同從主的靈變成的。"]], "god": "神一步一步改變人，榮上加榮。"}, {"id": "A14", "p": "A", "t": "聖潔公義而更新人的神", "ref": "以弗所書 4:24", "key": "弗4:24", "bk": "以弗所書", "q": "神的聖潔使你想親近，還是想逃避？", "kw": "聖潔 公義 更新", "verses": [[24, "並且穿上新人；這新人是照著　神的形像造的，有真理的仁義和聖潔。"]], "god": "神的性情是真理、仁義和聖潔，祂重新塑造人。"}, {"id": "A15", "p": "A", "t": "不斷更新、陪伴成長的神", "ref": "歌羅西書 3:10", "key": "西3:10", "bk": "歌羅西書", "q": "最近你怎樣經驗到神陪伴你成長？", "kw": "陪伴 成長 更新 同在", "verses": [[10, "穿上了新人。這新人在知識上漸漸更新，正如造他主的形像。"]], "god": "神很有耐性，使人在認識祂的過程中漸漸更新。"}, {"id": "A16", "p": "A", "t": "信守應許、帶人走到底的神", "ref": "哥林多前書 15:49", "key": "林前15:49", "bk": "哥林多前書", "q": "你信得過神會帶你走到最後嗎？", "kw": "應許 信實 將來", "verses": [[49, "我們既有屬土的形狀，將來也必有屬天的形狀。"]], "god": "神應許將來必定完成祂在人身上的工作。"}, {"id": "A17", "p": "A", "t": "終必顯現、與人面對面的神", "ref": "約翰壹書 3:2", "key": "約一3:2", "bk": "約翰壹書", "q": "你期待與神面對面，還是感到害怕？", "kw": "面對面 盼望 將來 恐懼", "verses": [[2, "親愛的弟兄啊，我們現在是　神的兒女，將來如何，還未顯明；但我們知道，主若顯現，我們必要像他，因為必得見他的真體。"]], "god": "神會向人完全顯現，使人變得像祂。"}, {"id": "A18", "p": "A", "t": "令人心滿意足的神", "ref": "詩篇 17:15", "key": "詩17:15", "bk": "詩篇", "q": "你心底最深的渴望是甚麼？神在其中嗎？", "kw": "滿足 渴望", "verses": [[15, "至於我，我必在義中見你的面；我醒了的時候，得見（或譯：著）你的形像就心滿意足了。"]], "god": "見到神的面，人最深的渴望便得到滿足。"}, {"id": "B1", "p": "B", "t": "牧養看顧的神（牧者）", "ref": "詩篇 23:1", "key": "詩23:1", "bk": "詩篇", "q": "你最近有沒有感受到被神帶領？", "kw": "牧人 牧者 帶領 供應", "verses": [[1, "（大衛的詩。）耶和華是我的牧者，我必不致缺乏。"]], "god": "神帶領、供應、保護人，使人一無缺乏。"}, {"id": "B2", "p": "B", "t": "等候擁抱浪子的神（父親）", "ref": "路加福音 15:20", "key": "路15:20", "bk": "路加福音", "q": "你回轉的時候，你預期神會怎樣迎接你？", "kw": "父親 浪子 接納 擁抱", "verses": [[20, "於是起來，往他父親那裡去。相離還遠，他父親看見，就動了慈心，跑去抱著他的頸項，連連與他親嘴。"]], "god": "父親遠遠望見兒子，就跑去擁抱他，沒有責備。"}, {"id": "B3", "p": "B", "t": "永不忘記孩子的神（母親）", "ref": "以賽亞書 49:15", "key": "賽49:15", "bk": "以賽亞書", "q": "你有沒有覺得被神遺忘？", "kw": "母親 忘記 遺忘", "verses": [[15, "婦人焉能忘記她吃奶的嬰孩，不憐恤她所生的兒子？即或有忘記的，我卻不忘記你。"]], "god": "婦人或會忘記吃奶的嬰孩，神卻永不忘記。"}, {"id": "B4", "p": "B", "t": "溫柔安慰的神（母親）", "ref": "以賽亞書 66:13", "key": "賽66:13", "bk": "以賽亞書", "q": "你需要神怎樣安慰你？", "kw": "母親 安慰 溫柔", "verses": [[13, "母親怎樣安慰兒子，我就照樣安慰你們；你們也必因（或譯：在）耶路撒冷得安慰。"]], "god": "神像母親安慰兒女一樣安慰人。"}, {"id": "B5", "p": "B", "t": "保護聚集的神（母雞）", "ref": "馬太福音 23:37", "key": "太23:37", "bk": "馬太福音", "q": "你願意讓神保護你嗎？", "kw": "母雞 保護 聚集", "verses": [[37, "「耶路撒冷啊，耶路撒冷啊，你常殺害先知，又用石頭打死那奉差遣到你這裡來的人。我多次願意聚集你的兒女，好像母雞把小雞聚集在翅膀底下，只是你們不願意。"]], "god": "耶穌像母雞把小雞聚集在翅膀底下。"}, {"id": "B6", "p": "B", "t": "塑造生命的神（陶匠）", "ref": "以賽亞書 64:8", "key": "賽64:8", "bk": "以賽亞書", "q": "被神塑造，你感到安全還是不安？", "kw": "陶匠 窯匠 塑造", "verses": [[8, "耶和華啊，現在你仍是我們的父！我們是泥，你是窯匠；我們都是你手的工作。"]], "god": "我們是泥，神是窯匠，我們都是祂親手所造的。"}, {"id": "B7", "p": "B", "t": "穩固可靠的神（磐石）", "ref": "詩篇 18:2", "key": "詩18:2", "bk": "詩篇", "q": "你生命中最不穩定的地方在哪裡？", "kw": "磐石 巖石 可靠 穩固", "verses": [[2, "耶和華是我的巖石，我的山寨，我的救主，我的　神，我的磐石，我所投靠的。他是我的盾牌，是拯救我的角，是我的高臺。"]], "god": "神是人的巖石、山寨、救主。"}, {"id": "B8", "p": "B", "t": "隨時幫助的神（避難所）", "ref": "詩篇 46:1", "key": "詩46:1", "bk": "詩篇", "q": "遇到困難時，你第一時間會走到哪裡？", "kw": "避難所 幫助 患難", "verses": [[1, "（可拉後裔的詩歌，交與伶長。調用女音。）　神是我們的避難所，是我們的力量，是我們在患難中隨時的幫助。"]], "god": "神是人的避難所，是患難中隨時的幫助。"}, {"id": "B9", "p": "B", "t": "醫治人的神（醫生）", "ref": "出埃及記 15:26", "key": "出15:26", "bk": "出埃及記", "q": "你有哪一部分需要神醫治？", "kw": "醫生 醫治", "verses": [[26, "又說：「你若留意聽耶和華─你　神的話，又行我眼中看為正的事，留心聽我的誡命，守我一切的律例，我就不將所加與埃及人的疾病加在你身上，因為我─耶和華是醫治你的。」"]], "god": "神親自宣告：「我─耶和華是醫治你的。」"}, {"id": "B10", "p": "B", "t": "栽培修剪的神（園丁）", "ref": "約翰福音 15:1-2", "key": "約15:1-2", "bk": "約翰福音", "q": "你最近正經歷哪一種修剪？", "kw": "園丁 修剪 栽培", "verses": [[1, "「我是真葡萄樹，我父是栽培的人。"], [2, "凡屬我不結果子的枝子，他就剪去；凡結果子的，他就修理乾淨，使枝子結果子更多。"]], "god": "父是栽培的人，修理枝子，使它結果子更多。"}, {"id": "B11", "p": "B", "t": "承托教導的神（母鷹）", "ref": "申命記 32:11", "key": "申32:11", "bk": "申命記", "q": "神是否正推動你學習飛翔？", "kw": "母鷹 鷹 學飛 承托", "verses": [[11, "又如鷹攪動巢窩，在雛鷹以上兩翅搧展，接取雛鷹，背在兩翼之上。"]], "god": "神好像鷹攪動巢窩，展開翅膀接住雛鷹。"}, {"id": "B12", "p": "B", "t": "歡喜人的神（新郎）", "ref": "以賽亞書 62:5", "key": "賽62:5", "bk": "以賽亞書", "q": "你能否相信神歡喜你？", "kw": "新郎 喜悅 歡喜", "verses": [[5, "少年人怎樣娶處女，你的眾民（民：原文是子）也要照樣娶你；新郎怎樣喜悅新婦，你的　神也要照樣喜悅你。"]], "god": "新郎怎樣喜悅新婦，神也怎樣喜悅祂的子民。"}, {"id": "B13", "p": "B", "t": "視人為朋友的神（朋友）", "ref": "約翰福音 15:15", "key": "約15:15", "bk": "約翰福音", "q": "你與神的關係，像主僕還是像朋友？", "kw": "朋友 關係", "verses": [[15, "以後我不再稱你們為僕人，因僕人不知道主人所做的事。我乃稱你們為朋友；因我從我父所聽見的，已經都告訴你們了。"]], "god": "耶穌不再稱人為僕人，而是稱人為朋友。"}, {"id": "B14", "p": "B", "t": "光明無暗的神（光）", "ref": "約翰壹書 1:5", "key": "約一1:5", "bk": "約翰壹書", "q": "你有沒有甚麼地方不敢放在神面前？", "kw": "光 黑暗", "verses": [[5, "神就是光，在他毫無黑暗。這是我們從主所聽見、又報給你們的信息。"]], "god": "神是光，在祂裡面毫無黑暗。"}, {"id": "B15", "p": "B", "t": "本質是愛的神（愛）", "ref": "約翰壹書 4:8", "key": "約一4:8", "bk": "約翰壹書", "q": "你所經驗的神，是愛多一些，還是要求多一些？", "kw": "愛 接納", "verses": [[8, "沒有愛心的，就不認識　神，因為　神就是愛。"]], "god": "神就是愛。"}, {"id": "C1", "p": "C", "t": "烈火般的神", "ref": "希伯來書 12:29", "key": "來12:29", "bk": "希伯來書", "q": "你覺得神的火是燒毀你，還是煉淨你？", "kw": "烈火 火 恐懼", "verses": [[29, "因為我們的　神乃是烈火。"]], "god": "經文說：「我們的　神乃是烈火。」"}, {"id": "C2", "p": "C", "t": "忌邪的神", "ref": "出埃及記 20:5", "key": "出20:5", "bk": "出埃及記", "q": "你會不會把神的「忌邪」與控制混淆？", "kw": "忌邪 偶像 控制", "verses": [[5, "不可跪拜那些像，也不可事奉它，因為我耶和華─你的　神是忌邪的　神。恨我的，我必追討他的罪，自父及子，直到三四代；"]], "god": "神不容許人敬拜其他偶像，祂的愛十分專一。"}, {"id": "C3", "p": "C", "t": "施行審判的神", "ref": "詩篇 7:11", "key": "詩7:11", "bk": "詩篇", "q": "一想到審判，你是害怕，還是有盼望？", "kw": "審判 公義 恐懼 發怒", "verses": [[11, "神是公義的審判者，又是天天向惡人發怒的　神。"]], "god": "神是公義的審判者，天天向惡人發怒。"}, {"id": "C4", "p": "C", "t": "報仇發怒的神", "ref": "那鴻書 1:2", "key": "鴻1:2", "bk": "那鴻書", "q": "神的怒氣是否使你覺得祂不可親近？", "kw": "報仇 發怒 忿怒", "verses": [[2, "耶和華是忌邪施報的　神。耶和華施報大有忿怒；向他的敵人施報，向他的仇敵懷怒。"]], "god": "神忌邪施報，向祂的仇敵懷怒。"}, {"id": "C5", "p": "C", "t": "好像猛獸的神", "ref": "何西阿書 13:7-8", "key": "何13:7-8", "bk": "何西阿書", "q": "你曾否覺得神像獵食者一樣追趕你？", "kw": "猛獸 獅子 熊 恐懼", "verses": [[7, "因此，我向他們如獅子，又如豹伏在道旁。"], [8, "我遇見他們必像丟崽子的母熊，撕裂他們的胸膛（或譯：心膜）。在那裡，我必像母獅吞吃他們；野獸必撕裂他們。"]], "god": "神向悖逆的以色列好像獅子、豹和丟了崽子的母熊。"}, {"id": "C6", "p": "C", "t": "好像埋伏之熊的神", "ref": "耶利米哀歌 3:10-11", "key": "哀3:10-11", "bk": "耶利米哀歌", "q": "你在苦難中有沒有覺得神與你為敵？", "kw": "熊 苦難 敵", "verses": [[10, "他向我如熊埋伏，如獅子在隱密處。"], [11, "他使我轉離正路，將我撕碎，使我淒涼。"]], "god": "詩人在苦難中說：「他向我如熊埋伏，如獅子在隱密處。」"}, {"id": "C7", "p": "C", "t": "好像仇敵的神", "ref": "耶利米哀歌 2:5", "key": "哀2:5", "bk": "耶利米哀歌", "q": "你敢不敢向神說出你對祂的憤怒？", "kw": "仇敵 憤怒 苦難", "verses": [[5, "主如仇敵吞滅以色列和錫安的一切宮殿，拆毀百姓的保障；在猶大民中加增悲傷哭號。"]], "god": "經文說：「主如仇敵吞滅以色列」。"}, {"id": "C8", "p": "C", "t": "攻擊人的神", "ref": "約伯記 16:12-13", "key": "伯16:12-13", "bk": "約伯記", "q": "你可否像約伯一樣誠實地禱告？", "kw": "攻擊 約伯 苦難 誠實", "verses": [[12, "我素來安逸，他折斷我，掐住我的頸項，把我摔碎，又立我為他的箭靶子。"], [13, "他的弓箭手四面圍繞我；他破裂我的肺腑，並不留情，把我的膽傾倒在地上，"]], "god": "約伯形容神掐住他的頸項，把他摔碎。"}, {"id": "C9", "p": "C", "t": "離棄人的神", "ref": "詩篇 22:1", "key": "詩22:1", "bk": "詩篇", "q": "你有沒有經歷過被神離棄的感覺？", "kw": "離棄 苦難 呼喊", "verses": [[1, "（大衛的詩，交與伶長。調用朝鹿。）我的　神，我的　神！為甚麼離棄我？為甚麼遠離不救我？不聽我唉哼的言語？"]], "god": "詩人呼喊：「我的　神，我的　神！為甚麼離棄我？」"}, {"id": "C10", "p": "C", "t": "隱藏自己的神", "ref": "以賽亞書 45:15", "key": "賽45:15", "bk": "以賽亞書", "q": "神沉默的時候，你怎樣與祂相處？", "kw": "隱藏 沉默 自隱", "verses": [[15, "救主─以色列的　神啊，你實在是自隱的　神。"]], "god": "先知說：「你實在是自隱的　神。」"}, {"id": "C11", "p": "C", "t": "遙遠沉默的神", "ref": "詩篇 88:14", "key": "詩88:14", "bk": "詩篇", "q": "在黑暗之中，你仍然願意向神說話嗎？", "kw": "遙遠 沉默 黑暗 掩面", "verses": [[14, "耶和華啊，你為何丟棄我？為何掩面不顧我？"]], "god": "詩人問：「耶和華啊，你為何丟棄我？為何掩面不顧我？」"}, {"id": "C12", "p": "C", "t": "管教人的神", "ref": "希伯來書 12:6", "key": "來12:6", "bk": "希伯來書", "q": "你所經歷的管教，是出於愛，還是懲罰？", "kw": "管教 愛 懲罰", "verses": [[6, "因為主所愛的，他必管教，又鞭打凡所收納的兒子。"]], "god": "「主所愛的，他必管教」。"}, {"id": "C13", "p": "C", "t": "與人摔跤的神", "ref": "創世記 32:24-25", "key": "創32:24-25", "bk": "創世記", "q": "你與神之間，有沒有一場未完的角力？", "kw": "摔跤 角力 掙扎 雅各", "verses": [[24, "只剩下雅各一人。有一個人來和他摔跤，直到黎明。"], [25, "那人見自己勝不過他，就將他的大腿窩摸了一把，雅各的大腿窩正在摔跤的時候就扭了。"]], "god": "神與雅各角力，扭傷了他的大腿窩。"}, {"id": "C14", "p": "C", "t": "可畏的神", "ref": "希伯來書 10:31", "key": "來10:31", "bk": "希伯來書", "q": "敬畏與恐懼，在你心裡有甚麼分別？", "kw": "可畏 敬畏 恐懼", "verses": [[31, "落在永生　神的手裡，真是可怕的！"]], "god": "「落在永生　神的手裡，真是可怕的！」"}, {"id": "D1", "p": "D", "t": "警察／監視者", "ref": "詩篇 139:1-10", "key": "詩139:1-10", "bk": "詩篇", "q": "你覺得神看著你，是保護還是監視？", "kw": "警察 監視 恐懼 同在", "verses": [[1, "（大衛的詩，交與伶長。）耶和華啊，你已經鑒察我，認識我。"], [2, "我坐下，我起來，你都曉得；你從遠處知道我的意念。"], [3, "我行路，我躺臥，你都細察；你也深知我一切所行的。"], [4, "耶和華啊，我舌頭上的話，你沒有一句不知道的。"], [5, "你在我前後環繞我，按手在我身上。"], [6, "這樣的知識奇妙，是我不能測的，至高，是我不能及的。"], [7, "我往哪裡去躲避你的靈？我往哪裡逃、躲避你的面？"], [8, "我若升到天上，你在那裡；我若在陰間下榻，你也在那裡。"], [9, "我若展開清晨的翅膀，飛到海極居住，"], [10, "就是在那裡，你的手必引導我；你的右手也必扶持我。"]], "dist": "時刻盯著你，等你犯錯就懲罰。", "con": "神鑒察人，是為了同在和保護。"}, {"id": "D2", "p": "D", "t": "會計師", "ref": "以弗所書 2:8-9", "key": "弗2:8-9", "bk": "以弗所書", "q": "你覺得要做多少，神才會接納你？", "kw": "會計師 功過 恩典 接納", "verses": [[8, "你們得救是本乎恩，也因著信；這並不是出於自己，乃是　神所賜的；"], [9, "也不是出於行為，免得有人自誇。"]], "dist": "計算你的功過，做得好才愛你。", "con": "得救是本乎恩，不在乎行為。"}, {"id": "D3", "p": "D", "t": "嚴厲苛刻的父親", "ref": "路加福音 15:20", "key": "路15:20", "bk": "路加福音", "q": "你心目中的神，像不像你自己的父親？", "kw": "父親 嚴厲 要求 接納", "verses": [[20, "於是起來，往他父親那裡去。相離還遠，他父親看見，就動了慈心，跑去抱著他的頸項，連連與他親嘴。"]], "dist": "永遠不滿意，只會要求。", "con": "父親奔跑去擁抱回家的兒子。"}, {"id": "D4", "p": "D", "t": "遙遠的鐘錶匠", "ref": "馬太福音 10:29-30", "key": "太10:29-30", "bk": "馬太福音", "q": "你覺得神有沒有參與你的日常生活？", "kw": "鐘錶匠 遙遠 冷漠 同在", "verses": [[29, "兩個麻雀不是賣一分銀子嗎？若是你們的父不許，一個也不能掉在地上；"], [30, "就是你們的頭髮也都被數過了。"]], "dist": "創造完就不理，冷漠旁觀。", "con": "神連你的頭髮都數過了。"}, {"id": "D5", "p": "D", "t": "許願機／聖誕老人", "ref": "腓立比書 4:11-13", "key": "腓4:11-13", "bk": "腓立比書", "q": "禱告不蒙應允的時候，你怎樣看神？", "kw": "許願 禱告 聖誕老人 知足", "verses": [[11, "我並不是因缺乏說這話；我無論在甚麼景況都可以知足，這是我已經學會了。"], [12, "我知道怎樣處卑賤，也知道怎樣處豐富；或飽足，或飢餓；或有餘，或缺乏，隨事隨在，我都得了祕訣。"], [13, "我靠著那加給我力量的，凡事都能做。"]], "dist": "只是用來滿足願望，乖就有獎賞。", "con": "在凡事上靠主知足。"}, {"id": "D6", "p": "D", "t": "交易的老闆", "ref": "馬太福音 20:1-16", "key": "太20:1-16", "bk": "馬太福音", "q": "你與神之間，是關係還是交易？", "kw": "交易 老闆 恩典 葡萄園", "verses": [[1, "「因為天國好像家主清早去雇人進他的葡萄園做工，"], [2, "和工人講定一天一錢銀子，就打發他們進葡萄園去。"], [3, "約在巳初出去，看見市上還有閒站的人，"], [4, "就對他們說：『你們也進葡萄園去，所當給的，我必給你們。』他們也進去了。"], [5, "約在午正和申初又出去，也是這樣行。"], [6, "約在酉初出去，看見還有人站在那裡，就問他們說：『你們為甚麼整天在這裡閒站呢？』"], [7, "他們說：『因為沒有人雇我們。』他說：『你們也進葡萄園去。』"], [8, "到了晚上，園主對管事的說：『叫工人都來，給他們工錢，從後來的起，到先來的為止。』"], [9, "約在酉初雇的人來了，各人得了一錢銀子。"], [10, "及至那先雇的來了，他們以為必要多得；誰知也是各得一錢。"], [11, "他們得了，就埋怨家主說："], [12, "『我們整天勞苦受熱，那後來的只做了一小時，你竟叫他們和我們一樣嗎？』"], [13, "家主回答其中的一人說：『朋友，我不虧負你，你與我講定的不是一錢銀子嗎？"], [14, "拿你的走吧！我給那後來的和給你一樣，這是我願意的。"], [15, "我的東西難道不可隨我的意思用嗎？因為我作好人，你就紅了眼嗎？』"], [16, "這樣，那在後的，將要在前；在前的，將要在後了。（有古卷加：因為被召的人多，選上的人少。）」"]], "dist": "你付出，祂才回報。", "con": "葡萄園主慷慨，按恩典賞賜。"}, {"id": "D7", "p": "D", "t": "失望的神", "ref": "西番雅書 3:17", "key": "番3:17", "bk": "西番雅書", "q": "你想像神看著你的時候，祂是甚麼表情？", "kw": "失望 喜樂 歡喜 接納", "verses": [[17, "耶和華─你的　神是施行拯救、大有能力的主。他在你中間必因你歡欣喜樂，默然愛你，且因你喜樂而歡呼。"]], "dist": "對你很失望，嘆氣搖頭。", "con": "神因你歡欣喜樂。"}, {"id": "D8", "p": "D", "t": "不可以質疑的神", "ref": "詩篇 13 篇", "key": "詩13:1-6", "bk": "詩篇", "q": "你敢不敢在神面前說出真實的感受？", "kw": "質疑 憤怒 軟弱 哀歌 誠實", "verses": [[1, "（大衛的詩，交與伶長。）耶和華啊，你忘記我要到幾時呢？要到永遠嗎？你掩面不顧我要到幾時呢？"], [2, "我心裡籌算，終日愁苦，要到幾時呢？我的仇敵升高壓制我，要到幾時呢？"], [3, "耶和華─我的　神啊，求你看顧我，應允我！使我眼目光明，免得我沉睡至死；"], [4, "免得我的仇敵說：我勝了他；免得我的敵人在我搖動的時候喜樂。"], [5, "但我倚靠你的慈愛；我的心因你的救恩快樂。"], [6, "我要向耶和華歌唱，因他用厚恩待我。"]], "dist": "不准人有疑問、憤怒或軟弱。", "con": "哀歌容許人向神誠實傾訴。"}, {"id": "D9", "p": "D", "t": "只愛好人的神", "ref": "羅馬書 5:8", "key": "羅5:8", "bk": "羅馬書", "q": "在你最失敗的時候，你覺得神仍然愛你嗎？", "kw": "好人 失敗 愛 接納", "verses": [[8, "惟有基督在我們還作罪人的時候為我們死，　神的愛就在此向我們顯明了。"]], "dist": "只接納敬虔、成功的人。", "con": "我們還作罪人的時候，基督為我們死。"}, {"id": "D10", "p": "D", "t": "控制操縱的神", "ref": "加拉太書 5:1", "key": "加5:1", "bk": "加拉太書", "q": "順服神，對你來說是自由還是束縛？", "kw": "控制 自由 順服 恐懼", "verses": [[1, "基督釋放了我們，叫我們得以自由。所以要站立得穩，不要再被奴僕的軛挾制。"]], "dist": "沒有自由，凡事要聽命，否則有禍。", "con": "基督釋放了我們，叫我們得以自由。"}], "guide": ["邀請受導者選出一至兩個最觸動他、或他最抗拒的神形像，再問：「你今天經驗的神，與經文中那位神有甚麼分別？」", "第三部分是聖經真實的啟示，不需要急於解釋或淡化；可以陪伴受導者像哀歌、約伯記一樣，誠實地向神傾訴。", "第四部分多數源於成長經歷，可以溫柔地問：「這個神形像是從哪裡來的？」"], "l1": [["想起神，你心裡多數覺得溫暖、安心。", {"P": 2}], ["有時你覺得神很嚴厲，甚至有點可怕。", {"H": 2}], ["你覺得神很遙遠，好像不太理會你。", {"H": 1, "D": 1}], ["你覺得要做得夠好、夠乖，神才會喜歡你。", {"D": 2}]], "pools": {"P": [["p2", "你軟弱或跌倒的時候，相信神會溫柔地接納你、安慰你。"], ["p3", "你覺得神很想親近你，像朋友一樣，而且真心喜歡你。"], ["p1", "你覺得神像牧人、磐石或避難所，一直帶領你、保護你。"], ["p5", "你覺得神很有耐性，正一步一步地改變你、栽培你。"], ["p6", "你相信神對你的人生有計劃，一定會帶你走到最後。"], ["p4", "你覺得神看重你、信任你，也同樣看重你身邊每一個人。"], ["p7", "你主要是透過耶穌的一生，認識神是一位怎樣的神。"], ["p8", "你覺得神又聖潔又偉大，只有祂才能真正滿足你的心。"]], "H": [["h1", "在痛苦中，你曾經覺得被神丟下、離棄。"], ["h3", "在苦難中，你覺得神好像敵人一樣對付你。"], ["h2", "你禱告的時候，常覺得神沉默不語，好像躲起來了。"], ["h5", "想到神的聖潔和大能，你會戰兢、害怕。"], ["h6", "你很害怕神的審判和怒氣。"], ["h4", "你和神之間好像在角力：你掙扎、質問，卻仍然不肯放手。"], ["h7", "你經歷過神的管教，雖然很痛，但相信背後有愛。"], ["h8", "你覺得神要你全心屬於祂，不容許你心裡有別的偶像。"]], "D": [["d2", "你常常計算自己做得好不好，覺得神也在替你記分。"], ["d3", "你想像神看著你的時候，祂像一位嚴厲的父親，總是不滿意、對你失望。"], ["d1", "你覺得神時刻盯著你，等你一犯錯就懲罰你。"], ["d5", "你覺得只要你付出、守規矩，神就應該回報你、答應你的禱告。"], ["d6", "你不敢在神面前說出懷疑、憤怒或軟弱。"], ["d4", "你覺得神創造了世界之後，就不太理會你的日常生活。"], ["d7", "你覺得神只愛敬虔、成功的人；你失敗的時候，祂就不再愛你。"], ["d8", "跟從神，你覺得好像被綁住，沒有自由。"]]}, "cmap": {"A1": ["p3", "p8"], "A2": ["p6", "p4"], "A3": ["p4", "p2"], "A4": ["p4", "p3"], "A5": ["p4", "p1"], "A6": ["p8", "p7"], "A7": ["p4", "p8"], "A8": ["p7", "p8"], "A9": ["p7", "p3"], "A10": ["p7", "p6"], "A11": ["p2", "p7"], "A12": ["p6", "p5"], "A13": ["p5", "p2"], "A14": ["p5", "p8"], "A15": ["p5", "p3"], "A16": ["p6", "p1"], "A17": ["p6", "p8"], "A18": ["p8", "p3"], "B1": ["p1", "p3"], "B2": ["p2", "p3"], "B3": ["p2", "p6"], "B4": ["p2", "p1"], "B5": ["p1", "p7"], "B6": ["p5", "p6"], "B7": ["p1", "p6"], "B8": ["p1", "p2"], "B9": ["p2", "p5"], "B10": ["p5", "p1"], "B11": ["p1", "p5"], "B12": ["p3", "p4"], "B13": ["p3", "p7"], "B14": ["p8", "p2"], "B15": ["p3", "p2"], "C1": ["h5", "h7"], "C2": ["h8", "h6"], "C3": ["h6", "h5"], "C4": ["h6", "h8"], "C5": ["h3", "h6"], "C6": ["h3", "h1"], "C7": ["h3", "h5"], "C8": ["h3", "h4"], "C9": ["h1", "h3"], "C10": ["h2", "h4"], "C11": ["h1", "h2"], "C12": ["h7", "h5"], "C13": ["h4", "h7"], "C14": ["h5", "h6"], "D1": ["d1", "d8"], "D2": ["d2", "d7"], "D3": ["d3", "d2"], "D4": ["d4", null], "D5": ["d5", null], "D6": ["d5", "d2"], "D7": ["d3", "d7"], "D8": ["d6", "d1"], "D9": ["d7", "d2"], "D10": ["d8", "d1"]}, "true": {"D1": "B1", "D2": "B15", "D3": "B2", "D4": "B3", "D5": "A18", "D6": "B13", "D7": "B12", "D8": "B4", "D9": "A3", "D10": "B11"}, "ans": [["係", 2], ["有時", 1], ["唔係", 0]]};
