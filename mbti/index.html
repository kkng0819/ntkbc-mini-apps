<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fbf5e6">
<title>牛頭角浸信會門徒訓練，自我認識 (MBTI)</title>
<style>
:root{--ink:#2a2723;--muted:#4a443b;--bg:#fbf5e6;--card:#fffdf6;--line:#eadfc6;--pri:#2c5a78;--pri2:#3a7096;--acc:#a8502a;--soft:#e6f0f5;--gold:#80600f;--ok:#4a7a38;--sky:#dcecf5;--meadow:#e3efd6;--sun:#f3cf7a;--fs:19px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;line-height:1.75;letter-spacing:.02em}
a{color:var(--pri2)}
header.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topin{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:.4rem;padding:.45rem .8rem}
.brand{font-weight:700;font-size:clamp(.8rem,4.1vw,1.08rem);line-height:1.3;flex:1 1 auto;min-width:0;cursor:pointer;background:none;border:0;color:#fff;text-align:left;padding:.3rem 0;font-family:inherit;display:flex;align-items:center;gap:.45rem;overflow-wrap:anywhere}
.brand .ic{width:1.5em;height:1.5em;flex:0 0 auto;color:#f6c453;stroke-width:2.4}
.tbtn{flex:0 0 auto}
.tbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;min-height:44px;min-width:44px;padding:0 .6rem;font-size:.9rem;font-family:inherit;cursor:pointer}
nav.tabs{max-width:960px;margin:0 auto;display:flex;overflow-x:auto;gap:.3rem;padding:0 .6rem .5rem}
nav.tabs button{flex:0 0 auto;background:transparent;color:#e5edf7;border:0;border-bottom:3px solid transparent;font-size:.92rem;padding:.35rem .45rem;min-height:44px;font-family:inherit;cursor:pointer}
nav.tabs button.on{color:#fff;border-bottom-color:#f6c453;font-weight:700}
main{max-width:960px;margin:0 auto;padding:1rem .9rem 4rem}
h1{font-size:1.6rem;line-height:1.35;margin:.4rem 0 .8rem;color:var(--pri)}
h2{font-size:1.3rem;line-height:1.4;margin:1.6rem 0 .6rem;color:var(--pri);border-left:6px solid var(--acc);padding-left:.55rem}
h3{font-size:1.1rem;margin:1.1rem 0 .4rem;color:var(--ink)}
p{margin:.5rem 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin:.9rem 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.lead{font-size:1.08rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:56px;padding:.6rem 1.3rem;border-radius:14px;border:2px solid var(--pri);background:var(--pri);color:#fff;font-size:1.05rem;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;margin:.3rem .3rem .3rem 0}
.btn.ghost{background:#fff;color:var(--pri)}
.btn.warn{background:#fff;color:var(--acc);border-color:var(--acc)}
.btn:focus-visible,.opt:focus-visible,.tbtn:focus-visible,nav.tabs button:focus-visible,.tile:focus-visible{outline:4px solid #f6c453;outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:.2rem;margin:.8rem 0}
.notice{background:#fff7ed;border:2px solid #fdba74;border-radius:14px;padding:.8rem 1rem;color:#431407}
.verse{background:var(--soft);border-left:5px solid var(--pri2);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0}
.verse .vt{font-size:1.05rem}
.verse .vr{font-weight:700;color:var(--pri);margin-top:.25rem}
.verse .vw{color:var(--muted);font-size:.93rem;margin-top:.3rem}
ul.clean{padding-left:1.2rem;margin:.4rem 0}
ul.clean li{margin:.35rem 0}
.dimgrid{display:grid;gap:.7rem}
@media(min-width:720px){.dimgrid{grid-template-columns:1fr 1fr}}
/* quiz */
.prog{height:16px;background:#e5e7eb;border-radius:99px;overflow:hidden;border:1px solid #cbd5e1}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));width:0;transition:width .25s}
.progtxt{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);margin:.35rem 0 .2rem}
.qtext{font-size:1.35rem;font-weight:700;line-height:1.6;margin:1rem 0 1.1rem;min-height:4.4em}
.opts{display:grid;gap:.6rem}
.opt{display:flex;align-items:center;gap:.8rem;width:100%;min-height:62px;padding:.6rem 1rem;border:2px solid #9ca3af;border-radius:14px;background:#fff;color:var(--ink);font-size:1.1rem;font-family:inherit;text-align:left;cursor:pointer}
.opt .dot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:3px solid #6b7280;display:inline-block}
.opt.sel{border-color:var(--pri);background:#e8eef7;font-weight:700}
.opt.sel .dot{border-color:var(--pri);background:radial-gradient(circle,var(--pri) 0 45%,#fff 50%)}
@media(hover:hover){.opt:hover{border-color:var(--pri2)}}
.qnav{display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem}
/* result */
.typehero{background:var(--pri);color:#fff;border-radius:18px;padding:1.1rem 1.2rem;margin:.8rem 0}
.typehero .code{font-size:3rem;font-weight:800;letter-spacing:.12em;line-height:1.1}
.typehero .nm{font-size:1.45rem;font-weight:700}
.typehero .tg{opacity:.95;margin-top:.3rem}
.bar{margin:.9rem 0}
.bar .lbl{display:flex;justify-content:space-between;font-weight:700;font-size:1rem}
.bar .trk{position:relative;height:24px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:.3rem 0;border:1px solid #cbd5e1}
.bar .fl{position:absolute;top:0;bottom:0;background:var(--pri2)}
.bar .fl.b{background:var(--acc)}
.bar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#111}
.bar .cl{font-size:.92rem;color:var(--muted)}
.near{background:#fefce8;border:2px solid #facc15;border-radius:12px;padding:.6rem .8rem;margin:.4rem 0;font-size:.95rem;color:#422006}
.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem}
.stack div{border:1px solid var(--line);border-radius:12px;padding:.55rem .7rem;background:#fff}
.stack b{color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.chips button{font-family:inherit;color:var(--pri2);cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:0 .8rem;border:1px solid var(--pri2);border-radius:99px;background:#fff;text-decoration:none;font-size:.92rem}
.blind{border-left:5px solid var(--acc);padding:.2rem .8rem;margin:.6rem 0;background:#fff}
.blind b{color:var(--acc)}
.disc{border:1px solid var(--line);border-radius:14px;padding:.7rem .9rem;margin:.7rem 0;background:#fff}
.disc.str{border:2px dashed var(--gold);background:#fffbeb}
.disc h3{margin:.1rem 0 .3rem}
.disc ol{margin:.3rem 0;padding-left:1.4rem}
.disc ol li{margin:.25rem 0}
.why{color:var(--muted);font-size:.95rem}
.tag{display:inline-block;font-size:.8rem;background:var(--gold);color:#fff;border-radius:6px;padding:0 .4rem;margin-left:.3rem;vertical-align:middle}
/* browse */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:block;border:2px solid var(--line);border-radius:14px;padding:.7rem;background:#fff;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);min-height:96px}
.tile .c{font-size:1.4rem;font-weight:800;color:var(--pri);letter-spacing:.06em}
.tile .n{font-size:.95rem}
.tile.me{border-color:var(--acc);background:#fff7ed}
.small{font-size:.9rem;color:var(--muted)}
footer{max-width:960px;margin:0 auto;padding:1rem .9rem 2.5rem;font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#111;color:#fff;padding:.7rem 1.1rem;border-radius:12px;font-size:1rem;z-index:20;display:none}
.printonly{display:none}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:0 0 auto}
.hero,.guideart{display:block;width:100%;height:auto;border-radius:18px;margin:.6rem 0 .4rem;box-shadow:0 2px 8px rgba(31,58,95,.18)}
.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.08em;margin:.6rem 0 0}
.notes{display:flex;gap:.8rem;align-items:center;background:#fffbeb;border:2px solid #c9a54a;border-radius:16px;padding:.7rem 1rem;margin:.8rem 0;color:#1f2937}
.notes .nb{flex:0 0 auto;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--pri);color:#f6c453;display:flex;align-items:center;justify-content:center}
.notes .nb .ic{width:1.6em;height:1.6em;stroke-width:2.6}
.notes ul{list-style:none;margin:0;padding:0}
.notes li{font-weight:700;color:var(--pri);line-height:1.55;padding:.1rem 0}
.notes li+li{border-top:1px dashed #e5d3a1}
h2.ih{display:flex;align-items:center;gap:.55rem}
.hic{display:inline-flex;width:1.9em;height:1.9em;border-radius:50%;background:var(--pri);color:#f6c453;align-items:center;justify-content:center;flex:0 0 auto}
.hic .ic{width:1.15em;height:1.15em;stroke-width:2.1}
.dimcard h3{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.pole{display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border-radius:12px;background:var(--soft);color:var(--pri)}
.pole.b{background:#fdf0e8;color:var(--acc)}
.bar .lbl span{display:inline-flex;align-items:center;gap:.3rem}
.bar .lbl .ic{color:var(--pri2)} .bar .lbl span+span .ic{color:var(--acc)}
.progwrap{display:flex;align-items:center;gap:.5rem;padding-top:30px}
.progwrap .prog{flex:1;position:relative;overflow:visible}
.prog>i{border-radius:99px}
.walker{position:absolute;bottom:100%;width:28px;height:28px;color:var(--gold);transition:left .25s}
.walker .ic{width:28px;height:28px;stroke-width:2}
.fin{width:30px;height:30px;color:var(--gold);stroke-width:2.6}
.qcard{position:relative;overflow:hidden;padding-right:3.2rem}
.qcard .deco{position:absolute;right:.6rem;top:.6rem;width:2.4rem;height:2.4rem;color:#c9a54a;opacity:.7}
.qcard .qtext{margin:.3rem 0}
.disc h3{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.dic{display:inline-flex;width:2.1em;height:2.1em;border-radius:12px;background:var(--soft);color:var(--pri);align-items:center;justify-content:center;flex:0 0 auto}
.disc.str .dic{background:#fdf3c8;color:var(--gold)}
.emb{width:3.4rem;height:3.4rem;flex:0 0 auto}
.typehero{display:flex;gap:1rem;align-items:center}
.typehero .emb{width:4.6rem;height:4.6rem}
.typehero>div{min-width:0}
.tile{display:flex!important;gap:.6rem;align-items:center}
.tile .emb{width:2.4rem;height:2.4rem}
h2.gh{display:flex;align-items:center;gap:.6rem}
h2.gh .emb{width:2.4rem;height:2.4rem}
footer .fnotes{font-weight:700;color:var(--pri);margin-bottom:.4rem}

/* ===== rev2: soft watercolour / cream paper theme ===== */
body{background:var(--bg);background-image:radial-gradient(1200px 500px at 10% -10%,rgba(190,220,238,.55),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(250,226,170,.35),transparent 60%),radial-gradient(1200px 600px at 50% 110%,rgba(200,226,180,.45),transparent 60%);background-attachment:fixed}
header.top{background:rgba(255,251,240,.96);color:var(--pri);box-shadow:0 3px 14px rgba(120,96,50,.12);border-bottom:1px solid #efe3c8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{color:var(--pri)}
.brand .ic{color:#d9963a}
.tbtn{background:#fff;color:var(--pri);border:1.5px solid #d9cba8;border-radius:999px}
nav.tabs button{color:#4a5b66;border-radius:12px 12px 0 0}
nav.tabs button.on{color:var(--pri);border-bottom-color:#e0a64a;background:#fdf1d6}
h1{color:var(--pri);letter-spacing:.02em}
h2{border-left:0;padding-left:0;color:var(--pri)}
.card{background:var(--card);border:1px solid #eee3ca;border-radius:22px;box-shadow:0 6px 18px rgba(120,96,50,.08)}
.btn{border-radius:999px;border:0;background:linear-gradient(180deg,#4a83a8,#2c5a78);box-shadow:0 4px 12px rgba(44,90,120,.25);font-weight:700}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid #b9d0de;box-shadow:0 2px 8px rgba(120,96,50,.08)}
.btn.warn{background:#fff;color:var(--acc);border:2px solid #e7b9a0;box-shadow:none}
.btn.big{min-height:64px;font-size:1.2rem;padding:.7rem 1.8rem;width:100%;max-width:520px}
.notice{background:#fff5e8;border:1.5px solid #f0c9a0;border-radius:20px;color:#4a2a12}
.verse{background:#eef6e9;border-left:5px solid #9cc58f;border-radius:16px}
.verse .vr{color:#3d6b33}
.hic{background:var(--sky);color:var(--pri)}
.pole{background:var(--sky);color:var(--pri);border-radius:50%}
.pole.b{background:#fbe9d8;color:var(--acc)}
.notes{background:#fff7e0;border:2px solid #ecd08e;border-radius:22px}
.notes .nb{background:var(--sky);color:var(--pri)}
.notes li+li{border-top:1px dashed #ecd9a8}
.opt{border:2px solid #d8ccb2;border-radius:18px;background:#fffdf7}
.opt .dot{border-color:#a99d86}
.opt.sel{border-color:var(--pri2);background:#e6f1f8}
.prog{background:#efe7d4;border:1px solid #e0d4b8}
.prog>i{background:linear-gradient(90deg,#9cc58f,#5f9cc0)}
.walker{color:#d9963a}
.qcard .deco{color:#9cc58f}
.bar .trk{background:#f0e9d8;border:1px solid #e3d8bf}
.bar .fl{background:#5f9cc0}.bar .fl.b{background:#d48a5e}
.bar .mid{background:#6b6253}
.near{background:#fff7dc;border:1.5px solid #ecd08e}
.stack div{border:1px solid #eadfc6;border-radius:16px;background:#fffaf0}
.chips button{border-radius:999px;border:1.5px solid #b9d0de;color:var(--pri);background:#fff}
.blind{border-left:5px solid #e7b9a0;border-radius:0 14px 14px 0;background:#fffaf3}
.disc{border:1px solid #eee3ca;border-radius:22px;background:var(--card);box-shadow:0 6px 18px rgba(120,96,50,.07)}
.disc.str{border:2px dashed #e0b85a;background:#fff8e4}
.dic{background:var(--meadow);color:#3d6b33;border-radius:50%}
.disc.str .dic{background:#fbecc0;color:var(--gold)}
.tag{background:#e0a64a;color:#2a2723;border-radius:999px;padding:0 .55rem;font-weight:700}
.hero,.guideart{border-radius:26px;box-shadow:0 8px 24px rgba(120,96,50,.18);border:4px solid #fffaf0;object-fit:cover}
.banner{display:block;width:100%;height:auto;max-height:150px;object-fit:cover;border-radius:22px;border:3px solid #fffaf0;box-shadow:0 6px 16px rgba(120,96,50,.14);margin:.2rem 0 .7rem}
.eyebrow{color:#9a6b1a}
.toast{background:#3d3a33;border-radius:999px}
/* how-to card */
.howto{background:linear-gradient(180deg,#fff4d6,#fffcf3);border:3px solid #edc36a;border-radius:26px;padding:1.1rem 1.1rem 1.2rem;margin:1rem 0;box-shadow:0 10px 26px rgba(200,150,50,.18)}
.howto h2{margin:.1rem 0 .7rem;font-size:1.45rem;display:flex;align-items:center;gap:.55rem}
.howto h2 .hic{background:#f3cf7a;color:#5a3d06}
.howto ol{list-style:none;margin:0;padding:0;counter-reset:hs}
.howto ol>li{counter-increment:hs;position:relative;padding:.45rem 0 .45rem 3rem;min-height:2.6rem;font-size:1.08rem}
.howto ol>li::before{content:counter(hs);position:absolute;left:0;top:.35rem;width:2.2rem;height:2.2rem;border-radius:50%;background:#5f9cc0;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(44,90,120,.25)}
.howto ol>li+li{border-top:1px dashed #ecd9a8}
.likert{display:grid;gap:.25rem;margin:.4rem 0 .1rem;padding:0;list-style:none}
.likert li{display:flex;gap:.5rem;align-items:baseline;font-size:1rem}
.likert b{flex:0 0 7.2em;color:var(--pri)}
.howto .btnrow{justify-content:center;margin:1rem 0 .1rem}
/* characters */
.char{display:block;flex:0 0 auto;width:6.2rem;height:auto;aspect-ratio:280/313;border-radius:20px;background:#fbf5e6;object-fit:cover}
.typehero{background:linear-gradient(135deg,var(--gbg,#e6f0f5),#fffaf0);color:var(--ink);border:2px solid var(--gln,#cfe0ea);border-radius:26px;box-shadow:0 8px 22px rgba(120,96,50,.12)}
.typehero .code{color:var(--gfg,var(--pri))}
.typehero .nm{color:var(--ink)}
.typehero .tg{color:var(--muted)}
.typehero .meta{color:var(--muted);font-size:.9rem}
.typehero .grp{display:inline-block;background:#fff;border:1.5px solid var(--gln,#cfe0ea);color:var(--gfg,var(--pri));border-radius:999px;padding:0 .7rem;font-weight:700;font-size:.9rem}
.typehero .char{width:7.4rem;border:3px solid #fff;box-shadow:0 4px 12px rgba(120,96,50,.15)}
.g-NT{--gbg:#ece6f6;--gln:#cdbfe6;--gfg:#5a4790}
.g-NF{--gbg:#e3f0dc;--gln:#bcd9ad;--gfg:#3d6b33}
.g-SJ{--gbg:#ddeeee;--gln:#acd3d1;--gfg:#2c6664}
.g-SP{--gbg:#fbefcc;--gln:#ebd28e;--gfg:#7a5a0c}
.tiles{gap:.8rem}
.tile{flex-direction:column;align-items:center!important;text-align:center!important;border:2px solid var(--gln,#eadfc6);border-radius:22px;background:linear-gradient(180deg,var(--gbg,#fff),#fffdf6);box-shadow:0 4px 14px rgba(120,96,50,.08);padding:.7rem .5rem .8rem}
.tile .char{width:100%;max-width:150px;border-radius:18px}
.tile .c{color:var(--gfg,var(--pri))}
.tile.me{border-color:#e0a64a;border-width:3px;background:linear-gradient(180deg,#fff1cf,#fffdf6)}
h2.gh{color:var(--gfg,var(--pri))}
.c0{background:#f3cf7a}.c1{background:#bcdcae}.c2{background:#a9cfe4}.c3{background:#d5c8ee}.c4{background:#f2c9b2}
@media(min-width:720px){.char{width:7rem}.typehero .char{width:9rem}}
@media(max-width:560px){.typehero{flex-direction:column;text-align:center;align-items:center}.typehero .char{width:11rem}}
img[data-img]:not([src]){background:linear-gradient(135deg,#f3ead2,#e3eedc 55%,#dfeaf1);color:transparent}
@media print{
  :root{--fs:12pt}
  header.top,nav,.btnrow,.qnav,footer,.toast,.chips,.noprint{display:none!important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .card,.disc,.verse,.blind{break-inside:avoid;box-shadow:none}
  .typehero{background:#fff;color:#000;border:3px solid #000}
  .banner{display:none}
  .char,.howto ol>li::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar .fl{background:#555!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar .fl.b{background:#999!important}
  h2{break-after:avoid}
  .printonly{display:block}
  .hero,.guideart{box-shadow:none;max-height:2.2in;object-fit:cover}
  .hero,.guideart,.emb,.notes,.hic,.pole,.dic{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .typehero .emb circle{stroke:#000}
  .notes{border-color:#7a5a00}
}
</style>

<script>var DATA={"items": [{"id": 1, "dim": "EI", "key": "E", "text": "小組聚會完結後，我通常感到更有精神，還想多留一會與人傾談。"}, {"id": 2, "dim": "SN", "key": "S", "text": "讀聖經時，我最留意經文中具體的人物、地點和事件細節。"}, {"id": 3, "dim": "TF", "key": "T", "text": "作決定時，我首先考慮怎樣做才最合理、最公平。"}, {"id": 4, "dim": "JP", "key": "J", "text": "我喜歡預早計劃，把事情安排妥當。"}, {"id": 5, "dim": "EI", "key": "I", "text": "與人相處了一整天之後，我需要一段安靜獨處的時間，才能恢復元氣。"}, {"id": 6, "dim": "SN", "key": "N", "text": "讀聖經時，我常被經文背後的象徵、主題和整體脈絡所吸引。"}, {"id": 7, "dim": "TF", "key": "F", "text": "作決定時，我首先考慮這個決定對身邊的人有甚麼影響。"}, {"id": 8, "dim": "JP", "key": "P", "text": "我喜歡保留彈性，看看情況才作決定。"}, {"id": 9, "dim": "EI", "key": "I", "text": "在小組分享時，我傾向先在心裏想清楚，才開口發言。"}, {"id": 10, "dim": "SN", "key": "N", "text": "我常常想像將來的種種可能，多於留意眼前的實際情況。"}, {"id": 11, "dim": "TF", "key": "F", "text": "當弟兄姊妹難過時，我很自然就感受到他們的情緒。"}, {"id": 12, "dim": "JP", "key": "P", "text": "臨近限期時，我反而最有動力和靈感。"}, {"id": 13, "dim": "EI", "key": "E", "text": "我喜歡一邊說出來，一邊整理自己的想法。"}, {"id": 14, "dim": "SN", "key": "S", "text": "我比較信任親身經歷過、證明行之有效的做法。"}, {"id": 15, "dim": "TF", "key": "T", "text": "即使會令人不舒服，我認為直接指出問題才是負責任的做法。"}, {"id": 16, "dim": "JP", "key": "J", "text": "事情遲遲未有定案，會令我感到不安，想盡快作出決定。"}, {"id": 17, "dim": "EI", "key": "E", "text": "在教會遇見新朋友，我通常會主動上前打招呼。"}, {"id": 18, "dim": "SN", "key": "S", "text": "別人給我指示時，我希望他們說得清楚、具體、一步一步。"}, {"id": 19, "dim": "TF", "key": "T", "text": "在討論中，我很容易察覺別人論點中的矛盾或漏洞。"}, {"id": 20, "dim": "JP", "key": "J", "text": "我的靈修通常有固定的時間和讀經計劃。"}, {"id": 21, "dim": "EI", "key": "I", "text": "比起大型聚會，我更享受與一兩位知心朋友深入傾談。"}, {"id": 22, "dim": "SN", "key": "N", "text": "即使舊方法仍然可行，我也喜歡嘗試新的做法。"}, {"id": 23, "dim": "TF", "key": "F", "text": "小組中出現爭拗時，我最在意的是彼此關係能否保持和睦。"}, {"id": 24, "dim": "JP", "key": "P", "text": "計劃突然改變時，我通常能輕鬆適應，甚至覺得新鮮。"}, {"id": 25, "dim": "EI", "key": "E", "text": "如果長時間獨自工作或獨處，我會感到納悶，想找人聯絡。"}, {"id": 26, "dim": "SN", "key": "N", "text": "我常在看似無關的事物之間看見關連，並因此產生新的念頭。"}, {"id": 27, "dim": "TF", "key": "F", "text": "給別人意見之前，我會先想一想對方會否因此受傷。"}, {"id": 28, "dim": "JP", "key": "P", "text": "我喜歡同時開展幾件事，而不是按次序一件一件完成。"}, {"id": 29, "dim": "EI", "key": "I", "text": "我在安靜、無人打擾的環境中靈修和禱告，最能投入。"}, {"id": 30, "dim": "SN", "key": "S", "text": "我很容易記得別人說過的具體話語、日期和數字。"}, {"id": 31, "dim": "TF", "key": "T", "text": "評估一項事工時，我較看重成效，以及是否達到目標。"}, {"id": 32, "dim": "JP", "key": "J", "text": "先完成工作才去休息，會令我感到踏實。"}, {"id": 33, "dim": "EI", "key": "I", "text": "別人常常要多問幾次，才知道我心裏真正的想法。"}, {"id": 34, "dim": "SN", "key": "S", "text": "籌備事奉時，我會先把實際需要（人手、物資、時間）逐項想清楚。"}, {"id": 35, "dim": "TF", "key": "T", "text": "面對困難時，我傾向先分析原因，而不是先表達感受。"}, {"id": 36, "dim": "JP", "key": "J", "text": "參與事奉時，我希望分工清楚、流程有序。"}, {"id": 37, "dim": "EI", "key": "E", "text": "我喜歡參與熱鬧的活動，例如營會、佈道會或節期聚會。"}, {"id": 38, "dim": "SN", "key": "N", "text": "談到教會或事工的長遠異象時，我很容易感到興奮。"}, {"id": 39, "dim": "TF", "key": "F", "text": "對我來說，被人明白和接納，比被認為「說得對」更重要。"}, {"id": 40, "dim": "JP", "key": "P", "text": "比起嚴格的時間表，我較喜歡隨心而行的生活節奏。"}], "dims": {"EI": {"name": "能量方向", "a": "E", "b": "I", "an": "外向 Extraversion", "bn": "內向 Introversion", "ad": "從與人互動和外在世界中得力，傾向邊做邊想、邊說邊整理。", "bd": "從安靜和內在世界中得力，傾向先想後說、深度多於廣度。"}, "SN": {"name": "接收資訊", "a": "S", "b": "N", "an": "實感 Sensing", "bn": "直覺 Intuition", "ad": "留意具體、現實、經驗和細節，重視「現在是怎樣」。", "bd": "留意模式、意義、可能性和整體，重視「將來可以怎樣」。"}, "TF": {"name": "作出決定", "a": "T", "b": "F", "an": "思考 Thinking", "bn": "情感 Feeling", "ad": "以邏輯、原則和客觀分析作主要考慮，重視公平與真理。", "bd": "以價值、關係和對人的影響作主要考慮，重視和諧與憐憫。"}, "JP": {"name": "生活方式", "a": "J", "b": "P", "an": "判斷 Judging", "bn": "感知 Perceiving", "ad": "喜歡計劃、秩序和有結論，傾向早作決定、按部就班。", "bd": "喜歡彈性、開放和隨機應變，傾向保留選擇、邊行邊調整。"}}, "func": {"Se": "外傾實感", "Si": "內傾實感", "Ne": "外傾直覺", "Ni": "內傾直覺", "Te": "外傾思考", "Ti": "內傾思考", "Fe": "外傾情感", "Fi": "內傾情感"}, "funcDesc": {"Se": "活在當下，敏銳捕捉環境中的具體細節與機會，善於即時行動。", "Si": "以過往經驗作參照，重視傳統、穩定和可靠，記憶細緻。", "Ne": "在外在世界看見多種可能與連繫，好奇、靈活、富創意。", "Ni": "向內整合出洞見與遠景，常有「預感」，關注深層意義。", "Te": "把外在世界組織得有效率，重視目標、結構與成果。", "Ti": "在內心建立精確的邏輯框架，追求理解事物如何運作。", "Fe": "敏銳感受群體氣氛與他人需要，重視和諧與彼此關顧。", "Fi": "忠於內心深處的價值與信念，重視真誠和個人意義。"}, "stack": {"ISTJ": ["Si", "Te", "Fi", "Ne"], "ISFJ": ["Si", "Fe", "Ti", "Ne"], "INFJ": ["Ni", "Fe", "Ti", "Se"], "INTJ": ["Ni", "Te", "Fi", "Se"], "ISTP": ["Ti", "Se", "Ni", "Fe"], "ISFP": ["Fi", "Se", "Ni", "Te"], "INFP": ["Fi", "Ne", "Si", "Te"], "INTP": ["Ti", "Ne", "Si", "Fe"], "ESTP": ["Se", "Ti", "Fe", "Ni"], "ESFP": ["Se", "Fi", "Te", "Ni"], "ENFP": ["Ne", "Fi", "Te", "Si"], "ENTP": ["Ne", "Ti", "Fe", "Si"], "ESTJ": ["Te", "Si", "Ne", "Fi"], "ESFJ": ["Fe", "Si", "Ne", "Ti"], "ENFJ": ["Fe", "Ni", "Se", "Ti"], "ENTJ": ["Te", "Ni", "Se", "Fi"]}, "disc": {"examen": {"n": "依納爵省察（Examen）", "d": "每日回顧，在生活細節中察覺神的同在與帶領，也看見自己需要更新之處。", "s": ["睡前用10分鐘，求聖靈光照你回顧今天。", "感恩：數算今天三件值得感恩的事。", "回顧：像看影片一樣重溫今天，留意甚麼時候感到與神親近（安慰），甚麼時候感到疏離（神枯）。", "認罪：為一件今天做得不好的事向神坦白，接受祂的饒恕。", "展望：求神幫助你面對明天的一件具體事情。"]}, "fellowship": {"n": "團契與彼此代禱", "d": "在真實的肢體關係中被認識、被扶持，也學習愛不同的人。", "s": ["固定參加一個小組，並承諾持續出席。", "每次聚會主動問候一位較少交談的組員。", "與一兩位同伴結成「代禱伙伴」，每週互相分享一項真實需要。", "學習在小組中分享軟弱，而不只是分享成功。", "每季與一位組員單獨吃飯傾談。"]}, "gratitude": {"n": "感恩操練", "d": "刻意數算恩典，改變心思的焦點，從缺乏和批評轉向神的信實。", "s": ["每晚寫下三件具體值得感恩的事（越具體越好）。", "每週向一位人表達具體的感謝（訊息、卡片或當面）。", "在禱告中先感恩，後祈求。", "遇到困難時，問：「在這處境中，神仍然給了我甚麼？」", "每月與家人或小組分享一個感恩見證。"]}, "hospitality": {"n": "款待", "d": "打開家門和心門接待人，把基督的愛具體地帶給陌生人和有需要的人。", "s": ["每月邀請一位新朋友或較少聯絡的組員吃飯或飲茶。", "聚會時留意落單的人，主動陪伴。", "準備時不求完美，重點是陪伴和聆聽。", "聆聽對方的故事多於講自己的事。", "聚會後為對方禱告，並跟進一個具體需要。"]}, "imaginative": {"n": "福音默觀（想像式默想）", "d": "依納爵傳統的讀經方法，運用想像進入福音書的場景，與耶穌相遇。", "s": ["選一段福音書敘事，例如路加福音10:38–42。", "慢讀兩遍，然後閉上眼睛，想像當時的情景：聲音、氣味、人物表情。", "把自己放進場景中，成為其中一個人物或旁觀者。", "留意耶穌對你說甚麼、怎樣看你，你又想對祂說甚麼。", "結束時與耶穌對話禱告，並記下感受。"]}, "journal": {"n": "屬靈日記", "d": "用文字記錄與神同行的歷程，幫助整理內心、記念恩典、看見成長軌跡。", "s": ["準備一本專用的簿子或手機筆記。", "每次寫下日期、所讀經文、一句觸動你的話。", "誠實寫下心中的感受、掙扎和禱告，不必修飾。", "每月翻閱一次，圈出神回應禱告和帶領的痕跡。", "年底寫一篇「恩典回顧」。"]}, "lectio": {"n": "聖言誦讀（Lectio Divina）", "d": "古老的讀經禱告方法，慢讀一小段經文，讓神的話語從頭腦進入內心。", "s": ["誦讀（Lectio）：選4–8節經文，慢慢讀兩三遍，留意哪個字或詞句觸動你。", "默想（Meditatio）：反覆咀嚼那個詞句，問：「神透過這句話對我說甚麼？」", "禱告（Oratio）：用自己的說話回應神，感恩、認罪或祈求。", "默觀（Contemplatio）：安靜地在神面前停留，享受與祂同在。", "行動：定下一個今天可以實踐的小回應。"]}, "memorize": {"n": "背誦經文", "d": "把神的話藏在心裏，在需要時成為提醒、安慰和抵擋試探的力量。", "s": ["每週選一節經文，寫在小卡或設為手機桌布。", "每天早晚各讀三遍，連經文出處一起背。", "把經文分成短句，逐句背熟。", "與一位同伴每週互相背誦一次。", "每月複習之前背過的經文。"]}, "service": {"n": "服事（隱藏的服事）", "d": "效法基督「不是要受人的服事，乃是要服事人」，在不被看見的地方擺上自己。", "s": ["每星期選一件不會被表揚的小事去做，例如聚會後執拾、探望長者。", "服事前禱告：「主啊，這是為你做的。」", "刻意不向人提起自己做了甚麼。", "事後反思：做的時候，我心裏在尋求誰的認同？", "嘗試一次與自己恩賜不同的崗位，學習謙卑。"]}, "silence": {"n": "靜默與獨處", "d": "離開聲音和人群，單單在神面前安靜，學習不靠忙碌和表現來證明自己。", "s": ["每天定一個固定時段（初時5–10分鐘），關掉手機通知，找一個安靜角落。", "先用一句短禱開始，例如：「主啊，我在這裏。」", "不急於說話或求甚麼，只是安靜地留在神面前；分心時，溫和地重複那句短禱。", "結束時記下一句心中最清晰的感受或領受。", "每月嘗試一次半天的「退修」，到郊外或教會安靜的房間。"]}}, "types": {"ISTJ": {"name": "盡忠的管家", "tag": "可靠、踏實、守信，是群體中穩定的基石。", "overview": "ISTJ 做事認真負責、言出必行，重視承諾、傳統和秩序。你習慣以過往經驗作參照，細心留意事實和細節，然後有條理地把工作完成。在教會裏，你往往是那位默默把事情做好、令人放心的人。你對神的信實有深刻體會，信仰表現在日復一日的忠心。", "gifts": ["忠心可靠：承諾了的事必定做到，是「在小事上忠心」的好榜樣。", "細心嚴謹：善於處理數據、財務、流程和記錄。", "重視傳承：珍惜教會的傳統、信仰根基和前人的經驗。", "實事求是：在討論中帶來穩定和現實的考慮。", "管家恩賜：善於管理資源，令事工長遠而可持續。"], "blind": [["人際關係", "容易以「做得對不對」衡量人，較少表達欣賞和感受，令身邊的人覺得你嚴肅、難以親近。"], ["事奉", "可能過於堅持「一向都是這樣做」，對新方法和年輕人的嘗試缺乏耐性，無意中壓抑了別人的創意。"], ["信仰生活", "容易把信仰變成責任清單，靈修變成「打卡」，忘記了與神之間的親密和恩典的喜樂。"], ["自我要求", "對自己和別人要求高，難以接受錯誤，也不易求助。"]], "stress": "在長期壓力下，你較不熟悉的「外傾直覺」（Ne）可能以負面方式出現：腦海充滿災難性的可能，對未來過度憂慮，甚至變得衝動、悲觀。這時你需要的不是更多計劃，而是休息、傾訴和把未知交託給神。", "growth": ["每週刻意對一位同工說出具體的欣賞，練習表達感受。", "開會時先問「有沒有其他可能？」，給新意見一個試行的機會。", "把「完美」換成「足夠好」，容許自己和別人犯錯。", "嘗試一次全新的崇拜或靈修形式，培養對未知的開放。", "留意自己何時以規則代替愛，問：「這件事背後的精意是甚麼？」"], "disc": [{"k": "examen", "why": "你喜歡有規律的操練，每日省察能讓你在責任之中看見神的恩典。"}], "stretch": {"k": "imaginative", "why": "福音默觀需要想像和感受，對你是陌生的；正因如此，它能幫你從「認識關於神的事」走進「與神相遇」。"}, "reflect": ["我在甚麼時候以「做得對」代替了「愛得真」？", "有哪些教會的新嘗試，我可以先以開放的心去了解？", "我的靈修最近是與神相交，還是完成任務？"], "group": "分享一件你一直忠心持守的事，以及你在其中曾否失去喜樂。請組員為你禱告，讓忠心與喜樂並存。"}, "ISFJ": {"name": "溫柔的照顧者", "tag": "體貼、謙和、默默付出，令人感到被關心。", "overview": "ISFJ 溫柔體貼，記得別人的需要和喜好，總是在背後默默照顧身邊的人。你重視和諧、穩定和承諾，樂意以實際行動表達愛。在教會中，你常是最早到、最遲走，留意誰沒有來、誰需要關心的那一位。你的信仰樸實而真摯，像馬大一樣殷勤，也有一顆柔軟的心。", "gifts": ["關懷恩賜：敏銳察覺別人的實際需要，並即時伸出援手。", "忠誠可靠：對人和事奉都長久委身。", "記得細節：記得別人的生日、病況和家庭狀況，令人感到被重視。", "締造和諧：令群體溫暖、安全，使人有歸屬感。", "謙卑服事：不求名，樂於在幕後付出。"], "blind": [["人際關係", "難以說「不」，害怕令人失望，結果過度承擔，累積委屈卻不說出口。"], ["事奉", "容易把別人的需要放在神的呼召之上，忙於服侍卻忽略了自己與主同在的時間。"], ["自我形象", "價值感容易建基於「被需要」和別人的肯定，被忽略時會受傷。"], ["面對衝突", "傾向逃避衝突，把不滿藏在心裏，久而久之變成苦毒或身心疲累。"]], "stress": "長期壓力下，較弱的「外傾直覺」（Ne）可能令你陷入最壞的想像，擔心一切都會出錯，變得悲觀和焦慮。你需要停下來，讓別人照顧你，並把對未來的擔憂帶到神面前。", "growth": ["練習溫和而清楚地說「不」，例如：「這次我未能幫忙，但我會為你禱告。」", "每週為自己預留一段被照顧、休息的時間。", "有不滿時，在三天內以「我感到……」的方式坦白說出。", "學習問「為甚麼」和「長遠會怎樣」，培養宏觀思考。", "記得：你被神愛，不是因為你有用，而是因為你是祂的兒女。"], "disc": [{"k": "lectio", "why": "慢讀經文能讓你從「為別人做」轉回「與主同在」。"}], "stretch": {"k": "silence", "why": "靜默獨處要求你暫時放下所有人的需要；這對你很不習慣，卻能讓你經歷單單被神所愛。"}, "reflect": ["我最近有沒有因為怕令人失望而勉強答應？", "如果沒有人需要我，我仍然知道自己是寶貴的嗎？", "有哪一份不滿，我需要溫柔地說出來？"], "group": "分享一次你很想說「不」卻說了「好」的經歷。讓組員學習以行動支持你，例如分擔一項工作。"}, "INFJ": {"name": "深思的引導者", "tag": "有洞見、有理想，關心人的內心與成長。", "overview": "INFJ 內斂而深刻，常常看見事情背後的意義和人心深處的需要。你有清晰的價值和遠象，渴望幫助人成長、使世界更美好。你的直覺敏銳，往往能預感問題的發展。在教會中，你可能是別人願意傾訴心事的對象，也是對群體方向有洞見的人。你的信仰重視內在真實與屬靈深度。", "gifts": ["洞察恩賜：看見人和事的深層模式，給予有深度的意見。", "輔導與勸勉：善於聆聽，能說出觸動人心的話。", "異象：對群體的長遠方向有清晰感受。", "委身理想：為有意義的使命付上代價。", "寫作與表達：善於以文字或比喻傳達屬靈真理。"], "blind": [["人際關係", "內心標準很高，容易對人失望；受傷後可能突然「關門」，切斷關係。"], ["事奉", "容易背負太多別人的情緒，把群體的問題視為自己的責任，導致耗盡。"], ["自我與信仰", "活在思想和理想中，忽略身體、休息和實際生活；也可能把自己的直覺等同神的心意。"], ["溝通", "覺得別人應該明白自己，不夠直接表達需要，令人難以了解你。"]], "stress": "在壓力之下，較弱的「外傾實感」（Se）可能失控：過度沉迷感官享受（暴食、狂看劇集、購物），或對環境細節變得異常煩躁。這是你需要回到身體、休息、讓神重新整理你內心的信號。", "growth": ["把洞見具體化：每個異象寫下一個本週可以做的小步驟。", "定期做運動或戶外活動，照顧身體。", "說出需要，不要期望別人自動明白。", "對你的直覺保持謙卑，與群體一同分辨，而非獨自判斷。", "練習接受不完美的人和教會，以恩典代替失望。"], "disc": [{"k": "silence", "why": "你天生需要內在空間，靜默獨處是你與神最自然的相遇方式。"}], "stretch": {"k": "service", "why": "具體、動手的服事（例如清潔、搬運、煮食）能平衡你的思想世界，讓信仰在當下落實。"}, "reflect": ["最近有沒有一個人，我因失望而在心裏「關門」？", "我的異象中，有哪一步是本週可以實行的？", "我怎樣分辨「我的直覺」與「神的引導」？"], "group": "分享一個你心中的負擔或異象，請組員幫你想出一個具體的第一步，並為你禱告。"}, "INTJ": {"name": "遠見的策劃者", "tag": "獨立、有策略，追求真理和卓越。", "overview": "INTJ 思想獨立、有遠見，善於把複雜的資訊整合成清晰的策略。你重視能力、真理和效率，對事物有很高的標準。你喜歡深入研究，不輕易接受未經思考的說法。在教會中，你可能是那位能看見系統問題、提出長遠方案的人。你的信仰重視理性和真理，渴望對神有深入而整全的認識。", "gifts": ["策略思維：能看見全局，制定長遠可行的計劃。", "追求真理：願意深入研讀聖經和神學，捍衛純正信仰。", "獨立判斷：不隨波逐流，敢於提出改進建議。", "解決問題：能找出系統性問題的根源。", "專注堅毅：為重要目標長期努力。"], "blind": [["人際關係", "容易顯得冷淡或高傲，以能力評價人，令別人感到不被接納；對「低效率」缺乏耐性。"], ["事奉", "傾向自己想好一切再推行，忽略團隊參與和群體的感受，令人覺得被命令。"], ["信仰生活", "容易把信仰知識化，「知道很多」卻較少經歷神的愛；也可能難以接受奧祕和不確定。"], ["自我", "不易承認自己需要別人，獨力承擔，內心的情感常被忽略。"]], "stress": "壓力之下，較弱的「外傾實感」（Se）可能令你沉溺感官刺激（暴飲暴食、過度上網），或對環境的細節變得異常挑剔和衝動。這提醒你：你不是一台思考機器，你需要休息和被愛。", "growth": ["在提出方案前，先問同工的意見和感受。", "每次指出問題時，同時說出一項欣賞。", "安排時間純粹與人相處，不為任何目的。", "在禱告中容許情感和眼淚，不只是理性分析。", "承認「我可能錯了」，與群體一同分辨。"], "disc": [{"k": "lectio", "why": "把研讀轉化為默想，讓真理從頭腦進入內心。"}], "stretch": {"k": "hospitality", "why": "款待和陪伴人看似「沒有效率」，卻能培養你較弱的情感功能，讓你學習基督的溫柔。"}, "reflect": ["我最近有沒有因為別人「不夠能幹」而輕看他們？", "我認識的真理，有多少化成了愛？", "有甚麼是我需要承認自己不明白、交託給神的？"], "group": "分享一個你曾經堅持己見、後來發現需要聆聽別人的經驗。邀請組員誠實地給你一個回饋。"}, "ISTP": {"name": "靈巧的解難者", "tag": "冷靜、務實、手巧，危急時最可靠。", "overview": "ISTP 冷靜、獨立、好奇事物如何運作。你善於觀察，動手能力強，遇到危機時能沉著地找出解決方法。你不喜歡空談，寧願以行動證明。在教會中，你可能是修理器材、處理技術、在突發情況中出手幫忙的人。你的信仰樸實直接，重視真實多於形式。", "gifts": ["解難恩賜：冷靜分析問題，迅速找出實際解決方法。", "技術才能：擅長音響、影音、維修、資訊科技等。", "臨危不亂：在突發事件中保持鎮定。", "真誠直接：不虛偽，說話實在。", "靈活應變：適應力強，不拘泥形式。"], "blind": [["人際關係", "較少表達感受，別人可能覺得你冷淡或難以接近；不喜歡被期望投入情感交流。"], ["事奉", "偏好獨自處理，不喜歡長期承諾和開會，容易被誤以為不夠委身。"], ["信仰生活", "覺得靈修和聚會「沒有實際作用」時便容易鬆懈；也可能把信仰保持在私人範圍。"], ["群體", "對冗長的程序和情緒化的討論缺乏耐性，可能突然抽離。"]], "stress": "長期壓力下，較弱的「外傾情感」（Fe）可能爆發：平日冷靜的你突然情緒失控，覺得不被欣賞，或過度在意別人的看法。這是你需要被理解和陪伴的時候。", "growth": ["每週向一位同伴說出一件自己的感受或想法。", "承諾參與一項長期的事奉，練習委身。", "在解決問題之前，先問對方：「你需要我聆聽，還是需要我幫手？」", "嘗試用一句說話表達欣賞別人。", "讓信仰與生活連結：在工作中留意神的同在。"], "disc": [{"k": "service", "why": "你最能在動手服事中經歷信仰。"}], "stretch": {"k": "fellowship", "why": "投入團契、分享內心，對你是很大的伸展，卻能培養你較弱的情感功能，讓你經歷被肢體扶持。"}, "reflect": ["我最近一次向人表達內心感受是甚麼時候？", "在我的技術和服事中，我怎樣看見神？", "我是否用「忙著做事」逃避與人深入交往？"], "group": "分享一次你出手幫忙解決問題的經歷，並嘗試說出當時你內心的感受。"}, "ISFP": {"name": "謙和的藝術家", "tag": "溫柔、真誠、有美感，以行動默默愛人。", "overview": "ISFP 溫柔、謙和、忠於自己的價值。你對美和感受很敏銳，常以藝術、音樂或貼心的行動表達愛。你不喜歡衝突和被控制，重視真誠和自由。在教會中，你可能是在幕後佈置、創作或安靜陪伴人的那一位。你的信仰真摯而個人化，常在大自然和美善事物中感受神。", "gifts": ["美感與創意：音樂、藝術、設計和佈置的恩賜。", "溫柔憐憫：對受苦的人有天然的同情。", "真誠：不虛偽，令人感到安全。", "活在當下：懂得欣賞生活中神所賜的美好。", "以行動愛人：不多說話，卻默默付出。"], "blind": [["人際關係", "逃避衝突，有不滿時傾向沉默或退出，令人摸不著頭腦。"], ["事奉", "不喜歡長遠規劃和架構，可能較難持續或承擔領導角色。"], ["自我形象", "容易低估自己，覺得自己不夠好，不敢站出來。"], ["信仰生活", "傾向憑感受親近神，感受低落時信仰也隨之低落；對有系統的讀經可能缺乏動力。"]], "stress": "壓力之下，較弱的「外傾思考」（Te）可能以負面方式出現：變得異常挑剔、急於控制，或嚴厲批評自己和別人的能力。這時請溫柔地對待自己，並尋求可信任的人傾訴。", "growth": ["練習把不滿化為溫和的表達，不要默默退出。", "為一個事奉定下三個月的小目標，培養持續力。", "每天記下一項自己的優點或神在你身上的恩賜。", "以有系統的讀經計劃補足憑感受的靈修。", "接受一次帶領小組環節的機會，發現自己的能力。"], "disc": [{"k": "gratitude", "why": "你善於欣賞美好，感恩操練能把這份敏銳轉化為敬拜。"}], "stretch": {"k": "memorize", "why": "有系統地背誦經文需要結構和紀律，能穩固你較弱的思考功能，讓信仰不只隨感受起伏。"}, "reflect": ["我最近有沒有因逃避衝突而默默退出一段關係或事奉？", "神在我身上放了甚麼恩賜，我卻不敢使用？", "當感受不到神時，我怎樣持守信仰？"], "group": "帶一件代表你與神關係的作品或相片來分享，並說出一個你想踏出的小步。"}, "INFP": {"name": "理想的調和者", "tag": "真誠、有理想、富同理心，追求生命的意義。", "overview": "INFP 內心豐富、理想崇高，渴望活出真實和有意義的生命。你有深厚的同理心，能體會別人的痛苦，也重視每個人的獨特價值。你常有創意和想像力，喜歡以文字或藝術表達內心。在教會中，你可能是那位關心邊緣人、提出「我們為甚麼要這樣做」的人。你的信仰重視真誠和內在的與神關係。", "gifts": ["同理心：深刻明白別人的感受，令人感到被接納。", "理想與價值：持守信念，為公義和憐憫發聲。", "創意表達：寫作、詩歌、藝術等恩賜。", "真誠：不追求表面，重視內在的真實。", "調和：能看見不同立場背後的價值，促進和好。"], "blind": [["人際關係", "對人和關係有很高理想，現實不符時容易失望和退縮；不易表達不滿。"], ["事奉", "理想多於執行，容易開始很多卻難以完成；對細節和行政較為抗拒。"], ["自我形象", "自我批評很重，常覺得自己不夠好、不夠屬靈，容易陷入內疚。"], ["信仰生活", "可能把「感受真實」看得比「委身順服」更重要，靈修時有時無。"]], "stress": "壓力之下，較弱的「外傾思考」（Te）可能令你變得異常批判、急躁，執著於效率，或嚴厲否定自己和別人。這時你需要被接納，並記得「在基督耶穌裏的就不定罪了」。", "growth": ["為每個理想定下一個具體期限和第一步。", "練習完成一件事後才開始另一件。", "用「恩典的眼光」看自己：每天寫下一件自己做得好的事。", "建立固定的靈修時間，不只等候感動。", "學習接受別人和自己的不完美。"], "disc": [{"k": "journal", "why": "你的內心世界豐富，屬靈日記讓你在文字中遇見神。"}], "stretch": {"k": "examen", "why": "依納爵省察有固定架構，每晚按步驟回顧，能培養你較弱的實感和秩序，讓理想落實到每一天。"}, "reflect": ["我最近有沒有因為自己「不夠好」而遠離神或群體？", "有哪一個理想，我需要定下具體的第一步？", "我的信仰是否太倚賴感受？"], "group": "分享一個你心中很想實現的理想，並請組員幫你計劃第一步和期限。"}, "INTP": {"name": "求真的思考者", "tag": "好奇、理性、思想深邃，追求理解萬事。", "overview": "INTP 好奇心強，喜歡探索概念和理論，追求準確和一致。你能看見別人忽略的邏輯問題，喜歡問「為甚麼」。你重視獨立思考，對權威和傳統保持審慎。在教會中，你可能是對神學和聖經難題最感興趣、提出深刻問題的人。你的信仰經過思考和探索，因而更為堅實。", "gifts": ["分析恩賜：清晰分析問題，找出邏輯漏洞。", "求真精神：深入探究聖經和神學，不滿足於膚淺答案。", "創新思考：為舊問題提出新角度。", "客觀公正：能冷靜看待爭議。", "教導：善於解釋複雜的概念。"], "blind": [["人際關係", "容易沉醉在思想中而忽略身邊的人；說話直接，可能無意中傷人。"], ["事奉", "想得多做得少，對執行和細節缺乏興趣，令同工感到不可靠。"], ["信仰生活", "可能把信仰變成智力遊戲，懷疑多於信靠；難以接受不能被解釋的奧祕。"], ["情感", "不易察覺和表達自己的情緒，壓抑後可能突然爆發。"]], "stress": "壓力之下，較弱的「外傾情感」（Fe）可能以負面方式出現：變得過度敏感，覺得沒有人喜歡自己，或突然情緒化。這是你需要承認情感、接受別人關心的信號。", "growth": ["每個想法定下一個實行的小行動和期限。", "在討論中先說「我明白你的意思」，才提出不同看法。", "每週主動關心一位朋友的近況。", "承認信仰中有奧祕，練習在不完全明白時仍然信靠。", "讓信仰化為行動：每月參與一次實際服事。"], "disc": [{"k": "lectio", "why": "把分析式讀經轉為默想，讓經文對你說話而非只被你分析。"}], "stretch": {"k": "hospitality", "why": "款待人需要情感投入和實際行動，正好伸展你較弱的外傾情感，讓你在人的面上看見神。"}, "reflect": ["我對神的認識，有多少化成了對人的愛？", "有甚麼疑問，我需要學習帶著信心與它共處？", "我最近有沒有忽略了身邊人的感受？"], "group": "分享一個你最近思考的信仰問題，以及你在其中怎樣學習信靠神。"}, "ESTP": {"name": "敏捷的行動者", "tag": "爽快、果敢、充滿活力，善於把握當下。", "overview": "ESTP 精力充沛、反應敏捷，喜歡行動多於空談。你善於觀察環境、把握機會，在危機和變化中表現出色。你務實、直接，擅長與人打交道，也富有說服力。在教會中，你可能是那位帶動氣氛、迅速組織人手、敢於嘗試的人。你的信仰重視實際和經歷，渴望看見神在生活中的作為。", "gifts": ["行動力：迅速把想法付諸實行。", "應變能力：在突發情況中冷靜果斷。", "說服力和感染力：善於與人建立關係、帶動氣氛。", "務實：重視實際效果，不拖泥帶水。", "冒險精神：敢於踏出去，嘗試新的事工。"], "blind": [["人際關係", "說話直接爽快，可能傷人而不自知；容易追求刺激，對沉悶的人和事失去耐性。"], ["事奉", "衝動行事，計劃不足；新鮮感過後便難以持守長期的事奉。"], ["信仰生活", "靈修、等候和默想對你較困難，信仰可能停留在活動和經歷層面。"], ["自我", "容易忽略行為的長遠後果，也不易面對內心較深的問題。"]], "stress": "壓力之下，較弱的「內傾直覺」（Ni）可能令你突然陷入對未來的陰暗預感，疑神疑鬼，覺得一切都會失敗。這是你需要停下、安靜，把未來交給神的時候。", "growth": ["行動前問自己：「這件事三個月後會怎樣？」", "承諾一項事奉至少半年，練習持守。", "說話前停三秒，想一想對方的感受。", "每天用五分鐘安靜，培養內在生命。", "找一位同伴問責你的長期目標。"], "disc": [{"k": "service", "why": "你最能在行動中服事神，參與外展和實際服事。"}], "stretch": {"k": "silence", "why": "靜默與獨處對好動的你是最大的伸展，卻能開發你較弱的內傾直覺，讓你聽見神微小的聲音。"}, "reflect": ["我最近有沒有因衝動而說了或做了令自己後悔的事？", "我的信仰有沒有深度，還是只停留在活動？", "有哪一項事奉，我需要學習持守下去？"], "group": "分享一次你憑衝動行動、結果神仍然使用或提醒你的經歷。"}, "ESFP": {"name": "熱誠的款待者", "tag": "熱情、活潑、慷慨，令身邊的人感到快樂。", "overview": "ESFP 熱情、友善、充滿活力，喜歡與人分享生活的樂趣。你活在當下，善於感受和回應身邊人的需要，令聚會充滿歡笑。你慷慨、實際，願意以行動幫助人。在教會中，你可能是讓新朋友感到被歡迎、帶動氣氛的人。你的信仰熱切、真摯，重視在生活中經歷神的喜樂。", "gifts": ["款待恩賜：令人感到被歡迎和接納。", "喜樂與感染力：為群體帶來歡笑和活力。", "實際的愛：看見需要，立刻幫忙。", "表演與表達：在戲劇、音樂、司儀等方面發光。", "適應力：容易融入不同群體。"], "blind": [["人際關係", "逃避衝突和沉重話題，傾向保持表面的開心，較少深入處理問題。"], ["事奉", "容易被新鮮有趣的事吸引，對需要長期規劃和細節的工作缺乏耐性。"], ["信仰生活", "靈修可能隨心情起伏；對有系統的讀經和神學學習較少興趣。"], ["自我管理", "可能衝動消費或過度承諾，忽略長遠的計劃和後果。"]], "stress": "壓力之下，較弱的「內傾直覺」（Ni）可能令你陷入陰暗的想像，覺得前景黑暗、沒有出路。這時你需要可信任的人陪伴，並在神面前安靜。", "growth": ["每週撥出固定時間有系統地讀經。", "在承諾前先查看月曆和能力。", "學習在關係中面對困難的話題，不只保持氣氛。", "為事奉定下長期目標和計劃。", "每天花幾分鐘安靜反思。"], "disc": [{"k": "fellowship", "why": "你在群體中最有活力，團契是你成長的土壤。"}], "stretch": {"k": "lectio", "why": "聖言誦讀需要安靜和專注，能培養你較弱的內傾直覺，讓你的喜樂紮根更深。"}, "reflect": ["我的喜樂是建立在環境，還是建立在神身上？", "我有沒有逃避一段需要面對的困難對話？", "有甚麼長遠計劃，我需要開始？"], "group": "分享最近一件令你喜樂的事，並說出神在其中的作為。"}, "ENFP": {"name": "熱情的鼓舞者", "tag": "熱情、有創意、看見每個人的潛能。", "overview": "ENFP 熱情洋溢、充滿創意，總能看見人和事的可能性。你善於鼓勵人，令身邊的人相信自己。你好奇心強，喜歡新的意念和體驗，也重視真誠的關係和個人價值。在教會中，你可能是那位帶來新點子、鼓勵別人參與、建立關係的人。你的信仰充滿熱情和想像，渴望在生活中經歷神的同在。", "gifts": ["鼓勵恩賜：看見人的潛能，激發他們成長。", "創意：為事工帶來新點子和活力。", "建立關係：容易與不同的人連結。", "熱誠：感染群體投入異象。", "真誠關懷：重視每個人的價值。"], "blind": [["人際關係", "對很多人熱情，但可能難以維持深入的長期關係；容易因新事物而分心。"], ["事奉", "開始很多項目卻難以完成；對細節、行政和重複性工作缺乏耐性。"], ["信仰生活", "靈修容易時有時無，追求新鮮的屬靈經歷多於穩定的操練。"], ["自我管理", "時間管理困難，容易過度承諾，令人失望。"]], "stress": "壓力之下，較弱的「內傾實感」（Si）可能令你執著於身體不適或細節，變得退縮、沮喪，覺得自己一無是處。你需要休息、回到簡單的規律，並讓神提醒你祂的信實。", "growth": ["每次只開展一個新項目，完成後才開始下一個。", "使用簡單的時間表或清單管理承諾。", "建立固定的靈修時間，即使沒有新鮮感。", "練習在一段關係中持續投入。", "承諾前先問：「我真的有時間和精力做好嗎？」"], "disc": [{"k": "fellowship", "why": "你在關係中得力，團契是你屬靈生命的養分。"}], "stretch": {"k": "examen", "why": "每日固定的省察操練需要規律和細心，能培養你較弱的內傾實感，讓熱情得以持久。"}, "reflect": ["我現在手上有多少未完成的事？哪一件是神要我先完成的？", "我的靈修是否只在有感動時才進行？", "有哪段關係，我需要更深入地投入？"], "group": "分享一個你開始了但未完成的計劃，請組員幫你決定下一步並問責你。"}, "ENTP": {"name": "創意的開拓者", "tag": "機智、好辯、勇於創新，挑戰既有框架。", "overview": "ENTP 機智靈活、思想敏捷，喜歡探索新觀念和挑戰傳統。你善於看見問題的多個角度，享受辯論和腦力激盪。你充滿創意和開拓精神，不怕嘗試新事物。在教會中，你可能是那位提出「為甚麼不試試……」、推動改變的人。你的信仰經過質疑和思考，也渴望讓信仰回應時代。", "gifts": ["創新：為事工帶來突破性的點子。", "辯證思考：能從多角度分析問題。", "溝通與說服：善於表達和帶動討論。", "開拓精神：願意嘗試新的事工模式。", "解難：在困難中找出創意出路。"], "blind": [["人際關係", "喜歡辯論，可能令人感到被挑戰或不被尊重；為贏得辯論而忽略對方的感受。"], ["事奉", "容易厭倦已建立的事工，追求新鮮而忽略持續和跟進。"], ["信仰生活", "可能把質疑變成習慣，難以安靜順服；靈修缺乏規律。"], ["自我", "不易面對自己的弱點，常以幽默或理論逃避深層問題。"]], "stress": "壓力之下，較弱的「內傾實感」（Si）可能令你過度關注身體或細節，變得退縮、疲累、對過去的錯誤耿耿於懷。這是你需要休息和回歸簡單信靠的時候。", "growth": ["在討論中先聆聽和複述對方的意思，才提出不同意見。", "承諾跟進一項事工直至穩定。", "每天定時靈修，即使覺得沉悶。", "練習以溫柔代替機智，造就人而非勝過人。", "誠實面對自己的軟弱，不以幽默迴避。"], "disc": [{"k": "journal", "why": "記錄你的思考和疑問，讓神在你的探索中說話。"}], "stretch": {"k": "memorize", "why": "背誦經文需要重複和紀律，能培養你較弱的內傾實感，讓神的話成為你思想的錨。"}, "reflect": ["我最近有沒有為了贏得辯論而傷害了人？", "有哪一項事工，我需要持守而非放棄？", "我的質疑是為了尋求真理，還是逃避順服？"], "group": "分享一個你對教會的新點子，並請組員中性格最穩重的一位給你回應。"}, "ESTJ": {"name": "務實的組織者", "tag": "有條理、負責任、果斷，令事情順利完成。", "overview": "ESTJ 務實、有條理、重視秩序和效率。你善於組織人和資源，清楚訂立目標並推動完成。你重視承諾和責任，處事公正、直接。在教會中，你可能是那位擔任領導、統籌大型活動、確保事情按時完成的人。你的信仰穩重、實際，重視真理和正確的教導。", "gifts": ["組織與行政：能有效統籌人手和資源。", "領導力：果斷，敢於承擔。", "可靠：說到做到，令人信任。", "公正：重視規則和公平。", "實際：把異象化為具體步驟。"], "blind": [["人際關係", "說話直接，可能令人覺得被命令或批評；忽略別人的感受和節奏。"], ["事奉", "容易以效率和結果衡量事工，忽略人的屬靈成長；難以接受不同的做法。"], ["信仰生活", "可能把信仰變成規條和責任，忽略恩典和與神的親密關係。"], ["自我", "難以停下來，以忙碌和成就定義自己價值。"]], "stress": "壓力之下，較弱的「內傾情感」（Fi）可能令你突然覺得沒有人欣賞自己，情緒低落或過度敏感。這時你需要承認自己的情感，並在神面前領受無條件的愛。", "growth": ["開會前先關心同工的近況。", "指出問題前，先肯定對方的付出。", "練習問：「你認為怎樣做較好？」", "每週守安息，學習停下。", "讓恩典多於規條：問「這件事中愛的做法是甚麼？」"], "disc": [{"k": "examen", "why": "有規律的每日省察適合你，並讓你察覺神在細節中的工作。"}], "stretch": {"k": "imaginative", "why": "福音默觀需要想像和感受，能培養你較弱的內傾情感，讓你經歷耶穌的溫柔。"}, "reflect": ["我最近有沒有因追求效率而傷害了同工？", "我的價值是否建立在成就上？", "我上一次單單享受神的同在是甚麼時候？"], "group": "分享一次你在事奉中太看重結果的經歷，以及你學到甚麼。"}, "ESFJ": {"name": "熱心的服侍者", "tag": "熱心、合群、樂於助人，是群體的凝聚者。", "overview": "ESFJ 熱心、友善、重視人際關係和群體和諧。你善於察覺別人的需要，樂意實際地照顧和組織人。你重視傳統和承諾，喜歡令每個人都感到被接納。在教會中，你可能是那位籌備團契活動、關心組員、維繫群體的人。你的信仰溫暖而實際，重視在群體中活出愛。", "gifts": ["關懷與款待：令人感到溫暖和被照顧。", "凝聚力：建立和維繫群體關係。", "組織能力：善於安排活動和照顧細節。", "忠誠：對人和教會長期委身。", "實際的愛：以行動表達關心。"], "blind": [["人際關係", "過於在意別人的看法和認同，難以面對批評；容易討好人。"], ["事奉", "忙於照顧別人而忽略自己的需要；可能過度介入別人的事。"], ["信仰生活", "可能把群體的期望當作神的旨意，忙於服侍而少有安靜與神相交。"], ["面對衝突", "為維持和諧而逃避必要的衝突，或在群體中形成「小圈子」。"]], "stress": "壓力之下，較弱的「內傾思考」（Ti）可能令你變得異常挑剔和冷漠，過度分析別人的言行，懷疑自己是否被利用。這是你需要休息和被照顧的信號。", "growth": ["練習在神面前問：「我做這事是要得人的心，還是要得神的心？」", "每週有固定時間獨處靈修。", "學習接受批評，把它看為成長的機會。", "溫和地表達不同意見，不必一味附和。", "尊重別人的界線，不過度介入。"], "disc": [{"k": "fellowship", "why": "你在群體中最得力，小組是你屬靈成長的家。"}], "stretch": {"k": "silence", "why": "靜默獨處要你離開群體和別人的認同，正好伸展你較弱的內傾思考，讓你單單在神面前確認自己的身份。"}, "reflect": ["我的服侍是否太在乎別人的認同？", "最近一次單獨與主同在是甚麼時候？", "有沒有一件事，我因為怕破壞和諧而沒有說出來？"], "group": "分享你最近一次很想被欣賞的經歷，並一同思考怎樣在神裏面得著滿足。"}, "ENFJ": {"name": "關懷的牧養者", "tag": "有感染力、關心人成長，天生的牧者和導師。", "overview": "ENFJ 熱情、有感染力，天生關心人的成長和群體的和諧。你善於理解別人的需要，並鼓勵他們發揮潛能。你有遠象，也有能力凝聚人一同前進。在教會中，你可能是小組組長、導師或帶領者，讓人感到被看見和被栽培。你的信仰充滿使命感，渴望幫助更多人認識基督。", "gifts": ["牧養恩賜：關心並栽培人的屬靈成長。", "領導與感染力：凝聚人朝同一方向前進。", "溝通：善於表達，能觸動人心。", "洞察：明白人的潛能和需要。", "建立群體：營造互相支持的環境。"], "blind": [["人際關係", "過度投入別人的問題，難以設立界線；期望別人依照你的看法成長。"], ["事奉", "容易過勞，把群體的成敗視為自己的責任；害怕令人失望。"], ["自我形象", "價值感建基於幫助別人和被需要，忽略自己的軟弱和需要。"], ["信仰生活", "忙於牧養別人，自己的靈修和安息被犧牲。"]], "stress": "壓力之下，較弱的「內傾思考」（Ti）可能令你變得過度挑剔，嚴厲批評自己和別人，或陷入冷漠的分析。這時你需要卸下重擔，讓別人牧養你。", "growth": ["學習設立界線：不是每個需要都是你的責任。", "每週至少半天完全休息。", "讓別人看見你的軟弱和需要。", "尊重別人按自己的步伐成長。", "在幫助人之前，先問自己的動機。"], "disc": [{"k": "fellowship", "why": "你在關係中成長，但需要一個你被牧養而非帶領的群體。"}], "stretch": {"k": "silence", "why": "靜默與獨處要你放下帶領和幫助人的角色，正好培養你較弱的內傾思考，讓你單單作神的兒女。"}, "reflect": ["我是否把群體的成敗看成自己的責任？", "誰在牧養我？", "我最近有沒有因為幫助別人而忽略了自己與神的關係？"], "group": "分享你現在背負最重的一個擔子，並讓組員為你禱告和分擔。"}, "ENTJ": {"name": "果斷的領航者", "tag": "有遠象、果斷、善於領導，推動群體向前。", "overview": "ENTJ 有遠見、果斷、天生的領導者。你善於制定策略、組織資源，並帶領團隊達成目標。你重視效率、能力和成果，敢於作出艱難的決定。在教會中，你可能是那位能看見方向、推動改革、帶領大型事工的人。你的信仰重視使命和果效，渴望為神國成就大事。", "gifts": ["領導力：清晰帶領團隊向目標前進。", "策略：制定長遠而有效的計劃。", "果斷：在關鍵時刻作出決定。", "組織：善於調動資源和人才。", "異象：為群體指出方向。"], "blind": [["人際關係", "可能顯得強勢、不耐煩，令人覺得被壓迫；忽略別人的感受和節奏。"], ["事奉", "以成果衡量一切，可能把人當作完成目標的工具。"], ["信仰生活", "容易倚靠自己的能力而非倚靠神；難以承認軟弱和需要。"], ["自我", "以成就定義自己，難以停下休息，情感常被壓抑。"]], "stress": "壓力之下，較弱的「內傾情感」（Fi）可能令你突然情緒失控，覺得不被欣賞，或陷入自憐。這時你需要承認自己也是需要恩典的人。", "growth": ["推動計劃前，先聆聽受影響者的感受。", "練習說「我需要幫助」和「我錯了」。", "每週有一段時間不工作、不計劃。", "以僕人的心態領導：問「我可以怎樣服侍你？」", "在禱告中承認：成就事情的是神的靈。"], "disc": [{"k": "examen", "why": "每日省察幫助你在忙碌中留意神，也看見自己的驕傲。"}], "stretch": {"k": "hospitality", "why": "款待和陪伴人看似「沒有成效」，卻能培養你較弱的內傾情感，讓你學習以人為本。"}, "reflect": ["我最近有沒有把人當作完成目標的工具？", "我在甚麼事上倚靠自己多於倚靠神？", "誰可以誠實地指出我的盲點？"], "group": "分享你目前帶領的一項事工，並說出你可以怎樣更多以僕人的心去帶領。"}}, "verses": {"來10:24-25": {"ref": "希伯來書 10:24-25", "text": "又要彼此相顧，激發愛心，勉勵行善。你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉，既知道（原文是看見）那日子臨近，就更當如此。"}, "創1:27": {"ref": "創世記 1:27", "text": "神就照著自己的形像造人，乃是照著他的形像造男造女。"}, "加2:20": {"ref": "加拉太書 2:20", "text": "我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信　神的兒子而活；他是愛我，為我捨己。"}, "林前12:12": {"ref": "哥林多前書 12:12", "text": "就如身子是一個，卻有許多肢體；而且肢體雖多，仍是一個身子；基督也是這樣。"}, "林前12:4-7": {"ref": "哥林多前書 12:4-7", "text": "恩賜原有分別，聖靈卻是一位。職事也有分別，主卻是一位。功用也有分別，　神卻是一位，在眾人裡面運行一切的事。聖靈顯在各人身上，是叫人得益處。"}, "林前13:12": {"ref": "哥林多前書 13:12", "text": "我們如今彷彿對著鏡子觀看，模糊不清（原文是如同猜謎），到那時就要面對面了。我如今所知道的有限，到那時就全知道，如同主知道我一樣。"}, "林後5:17": {"ref": "哥林多後書 5:17", "text": "若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。"}, "羅12:4-5": {"ref": "羅馬書 12:4-5", "text": "正如我們一個身子上有好些肢體，肢體也不都是一樣的用處。我們這許多人，在基督裡成為一身，互相聯絡作肢體，也是如此。"}}};

<script>
"use strict";
const KEY='discipleMBTI.v1', FKEY='discipleMBTI.font';
const ITEMS=DATA.items, N=ITEMS.length, DIMS=DATA.dims, ORDER=['EI','SN','TF','JP'];
const LIK=[[5,'非常同意'],[4,'同意'],[3,'中立／一半半'],[2,'不同意'],[1,'非常不同意']];
const app=document.getElementById('app');
const APP='牛頭角浸信會門徒訓練，自我認識 (MBTI)';
const store={get(k){try{return window.localStorage.getItem(k)}catch(e){return null}},set(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}};
function ic(id,c){return `<svg class="ic${c?' '+c:''}" aria-hidden="true"><use href="#${id}"/></svg>`}
const GRP={NT:['i-star','#9a88c9','分析家'],NF:['i-dove','#8dbb7f','外交家'],SJ:['i-shield','#6fb0ad','守護者'],SP:['i-peak','#dcb24f','探險家']};
function im(k,w,h){const u=IMG[k];return `data-img="${k}" style="aspect-ratio:${w}/${h}"${u?` src="${u}"`:''}`}
function fillImgs(){document.querySelectorAll('img[data-img]:not([src])').forEach(i=>{const u=IMG[i.dataset.img];if(u)i.src=u})}
function charImg(c){return `<img class="char" ${im(c,280,313)} width="280" height="313" alt="${c} ${esc(DATA.types[c].name)}（${GRP[grpOf(c)][2]}）插圖">`}
function grpOf(c){return c[1]==='S'?'S'+c[3]:'N'+c[2]}
function emblemG(g,label){const [id,col]=GRP[g];return `<svg class="emb" viewBox="0 0 48 48" role="img" aria-label="${label||GRP[g][2]}"><circle cx="24" cy="24" r="21.5" fill="${col}" stroke="#fffaf0" stroke-width="3"/><use href="#${id}" x="12" y="12" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function emblem(c){const g=grpOf(c);return emblemG(g,c+' '+GRP[g][2])}
const DICON={silence:'d-silence',lectio:'i-book',examen:'d-examen',journal:'d-journal',service:'d-service',fellowship:'i-E',sabbath:'d-sabbath',fasting:'d-fasting',gratitude:'d-gratitude',memorize:'d-memorize',direction:'d-direction',imaginative:'d-imaginative',hospitality:'d-hospitality',confession:'d-confession',simplicity:'d-simplicity'};
const NOTES=['內容謹供參考之用','牛頭角浸信會門徒訓練參與者使用','吳國强牧師 2026年建立'];
function notesCard(){return `<div class="notes" role="note" aria-label="使用說明"><span class="nb">${ic('i-cross')}</span><ul>${NOTES.map(n=>`<li>${n}</li>`).join('')}</ul></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{const s=JSON.parse(store.get(KEY)||'null');if(s&&Array.isArray(s.answers)&&s.answers.length===N)return s}catch(e){}return {answers:Array(N).fill(null),idx:0,result:null}}
let S=load();
function save(){store.set(KEY,JSON.stringify(S))}
function answered(){return S.answers.filter(v=>v!==null).length}
function score(ans){
  const sum={EI:0,SN:0,TF:0,JP:0};
  ITEMS.forEach((it,i)=>{const v=ans[i];if(v==null)return;let s=v-3;if(it.key===DIMS[it.dim].b)s=-s;sum[it.dim]+=s});
  const dims={};let code='';
  ORDER.forEach(d=>{const x=sum[d],max=2*ITEMS.filter(it=>it.dim===d).length;const pa=Math.round(50+50*x/max);const L=x>0?DIMS[d].a:DIMS[d].b;code+=L;dims[d]={sum:x,max,pa,pb:100-pa,letter:L,clar:Math.abs(x)/max}});
  return {code,dims};
}
function clarLabel(c){return c<=0.2?'接近平衡':c<=0.5?'輕微傾向':c<=0.75?'中等傾向':'清晰傾向'}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
function fontStep(d){const cur=parseInt(store.get(FKEY)||'19',10);const n=Math.max(16,Math.min(28,cur+d*2));store.set(FKEY,String(n));document.documentElement.style.setProperty('--fs',n+'px')}
(function(){const f=store.get(FKEY);if(f)document.documentElement.style.setProperty('--fs',f+'px')})();
function verse(k,why){const v=DATA.verses[k];return `<div class="verse"><div class="vt">${esc(v.text)}</div><div class="vr">——${esc(v.ref)}（和合本）</div>${why?`<div class="vw">${esc(why)}</div>`:''}</div>`}
let CUR='home',NOHASH=false;
function curView(){return NOHASH?CUR:((location.hash||'').slice(1)||'home')}
function go(v){CUR=v;if(!NOHASH){if(location.hash==='#'+v){route();return}try{location.hash=v}catch(e){}if(location.hash==='#'+v)return;NOHASH=true}route()}
function route(){
  const h=curView();const [v,arg]=h.split('/');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(v==='type'&&b.dataset.v==='types')));

let busy=false;
function answer(v){
  if(busy)return;const i=Math.min(S.idx||0,N-1);S.answers[i]=v;
  document.querySelectorAll('.opt').forEach(b=>{const on=+b.dataset.v===v;b.classList.toggle('sel',on);b.setAttribute('aria-checked',on)});
  busy=true;
  setTimeout(()=>{busy=false;
    if(i===N-1){if(answered()===N){finish()}else{S.idx=S.answers.indexOf(null);save();toast('尚有題目未作答');viewQuiz()}return}
    S.idx=i+1;save();viewQuiz();
  },180);
  save();
}
function prevQ(){if(S.idx>0){S.idx--;save();viewQuiz()}}
function nextQ(){if(S.idx<N-1){S.idx++;save();viewQuiz()}}
function finish(){const first=S.answers.indexOf(null);if(first>=0){S.idx=first;save();toast('尚有題目未作答');viewQuiz();return}
  const r=score(S.answers);S.result={code:r.code,dims:r.dims,date:(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))(new Date())};S.idx=N;save();go('result')}
