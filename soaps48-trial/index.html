<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>門徒小組 SOAPS 靈修｜馬太福音下篇試用版｜牛頭角浸信會</title>
<style>
:root{--ink:#16302a;--muted:#3e5a52;--bg:#e4efe8;--card:#f4faf6;--pri:#1a6b57;--pri-d:#0f473b;--gold:#b8893a;--sky:#cfe8df;--leaf:#d7edd8;--sun:#d3ece3;--rose:#ead9d1;--line:#c3d9cf;--fs:20px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;line-height:1.7;letter-spacing:.02em;background:var(--bg);background-image:radial-gradient(1100px 520px at 8% -12%,rgba(140,196,186,.55),transparent 62%),radial-gradient(1000px 580px at 100% 0%,rgba(186,214,168,.45),transparent 58%),radial-gradient(1200px 600px at 50% 110%,rgba(120,176,168,.42),transparent 60%);background-attachment:fixed;min-height:100vh}
header.top{position:sticky;top:0;z-index:5;background:rgba(228,239,232,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:.35rem;padding:.45rem .7rem}
.brand{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:.4rem;background:none;border:0;padding:.3rem 0;font:inherit;font-weight:800;font-size:clamp(.88rem,4.3vw,1.05rem);color:var(--pri);cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .logo{width:1.6em;height:1.6em;flex:0 0 auto}
.tbtn{flex:0 0 auto;min-height:44px;min-width:44px;padding:0 .55rem;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--pri);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
.tbtn.mus{display:inline-flex;align-items:center;gap:.25rem;padding:0 .65rem;background:var(--leaf);color:#1f5a2d;border-color:#b7d4b4}
.tbtn.mus.mid{background:#dceee4;color:#0f473b;border-color:#afd0c4}
.tbtn.mus.off{background:#eef1ef;color:#7a8581;border-color:#d3d8d5}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:0 0 auto}
main{max-width:640px;margin:0 auto;padding:.6rem 1.05rem 2.5rem}
.scr{animation:fin .35s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:1.7rem;line-height:1.35;margin:.3rem 0 .4rem;font-weight:800;color:var(--pri-d)}
h1.big{font-size:1.36rem;margin:.2rem 0 .1rem}
h2{font-size:1.25rem;margin:.2rem 0 .5rem;color:var(--pri-d)}
p{margin:.45rem 0}
.sub{color:var(--muted);font-size:1.02rem;margin:0 0 .6rem}
.art{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:24px;margin:.2rem 0 .6rem;background:linear-gradient(135deg,#dceee4,#c5ddd8)}
.art.sm{aspect-ratio:21/9}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:1rem 1.1rem;margin:.9rem 0;box-shadow:0 8px 24px rgba(15,71,59,.08)}
.notice{background:#fff;border-radius:18px;padding:.6rem .95rem;color:var(--muted);font-size:.92rem;border:1px solid var(--line)}
.notice b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:56px;padding:.55rem 1.2rem;border-radius:999px;border:0;font:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;text-align:center;color:#fff;background:var(--pri);box-shadow:0 4px 12px rgba(15,71,59,.28)}
.btn:active{background:#22856c}
.btn.soft{background:#fff;color:var(--pri);border:2px solid #b7cfc4;box-shadow:none}
.btn.gold{background:var(--gold);box-shadow:0 4px 12px rgba(184,137,58,.35)}
.btn.warn{background:#fff;color:#b5523a;border:2px solid #efd3c9;box-shadow:none}
.btn.sm{min-height:46px;font-size:.95rem;padding:.3rem 1rem}
.btn.wide{display:flex;width:100%}
.btn:focus-visible,.tbtn:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible,.vbtn:focus-visible{outline:4px solid #5bb39a;outline-offset:3px}
.start{display:flex;width:100%;min-height:84px;font-size:1.7rem;letter-spacing:.2em;margin:1rem 0 .5rem}
.linkbtn{background:none;border:0;color:var(--pri);font:inherit;font-size:1rem;font-weight:700;text-decoration:underline;cursor:pointer;padding:.5rem;min-height:44px;display:block;margin:0 auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.6rem 0}
.row2 .btn{width:100%;font-size:1rem;padding:.5rem .6rem}
.field{margin:.7rem 0}
.field label{display:block;font-weight:800;font-size:1.05rem;margin:0 0 .3rem}
.field .hint{font-weight:400;color:var(--muted);font-size:.85rem}
textarea,input.tx{width:100%;font:inherit;font-size:1.12rem;line-height:1.6;color:var(--ink);background:#fff;border:2px solid #b7cfc4;border-radius:16px;padding:.6rem .85rem}
input.tx{min-height:3.2rem}
textarea{min-height:8rem;resize:vertical}
.clbl{font-weight:800;font-size:1.05rem;margin:0 0 .35rem}
.chc{display:flex;flex-wrap:wrap;gap:.5rem}
.chc button{flex:1 1 auto;min-width:3.4rem;min-height:52px;padding:.3rem .8rem;border-radius:16px;border:2px solid #b7cfc4;background:#fff;color:var(--ink);font:inherit;font-size:1.15rem;font-weight:800;cursor:pointer}
.chc button.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 3px 10px rgba(15,71,59,.28)}
.chc button.on::before{content:"✔ "}
.err{color:#c0271d;font-weight:700;min-height:1.4rem;margin:.3rem 0}
/* today card */
.today{background:var(--sky);border:0;border-radius:24px;padding:.85rem 1.05rem;margin:.9rem 0}
.today .wk{font-weight:800;color:var(--pri-d);font-size:1rem}
.today .rf{font-size:1.3rem;font-weight:800;margin:.1rem 0}
.today .th{font-size:1.05rem;margin:.1rem 0}
/* group */
.grp .gh{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.grp .gh h2{margin:0}
.grp .cnt{font-weight:800;color:#1f5a2d;font-size:1rem}
.mem{list-style:none;margin:.5rem 0 0;padding:0}
.mem li{display:flex;align-items:center;gap:.6rem;padding:.55rem .2rem;border-top:1px dashed var(--line);font-size:1.1rem}
.mem li:first-child{border-top:0}
.mem .nm{flex:1 1 auto;min-width:0;font-weight:700;overflow-wrap:anywhere}
.mem .me{font-size:.75rem;background:var(--sky);color:var(--pri);border-radius:8px;padding:0 .4rem;margin-left:.3rem;font-weight:700}
.mem .wkc{font-size:.85rem;color:var(--muted);white-space:nowrap}
.mem .st{flex:0 0 auto;min-width:3.4rem;text-align:center;border-radius:999px;font-weight:800;font-size:1rem;padding:.1rem .5rem}
.mem .st.y{background:#d6ecd0;color:#245c2c}
.mem .st.n{background:#e8eeea;color:#5c6b66}
.gmsg{color:var(--muted);font-size:.98rem;margin:.4rem 0}
/* step */
.dots{display:flex;gap:.45rem;justify-content:center;margin:.3rem 0 .4rem}
.dots i{width:.75rem;height:.75rem;border-radius:50%;background:#c5d6cf}
.dots i.on{background:var(--pri)}
.dots i.cur{background:var(--gold);transform:scale(1.35)}
.snum{text-align:center;color:var(--muted);font-size:.95rem;font-weight:700;margin:0}
.lhead{display:flex;align-items:center;justify-content:center;gap:.6rem;margin:.2rem 0 .4rem}
.letter{width:3.2rem;height:3.2rem;border-radius:16px;background:var(--pri);color:#fff;font-weight:900;font-size:2rem;display:flex;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif}
.stitle{font-size:1.9rem;margin:0;color:var(--pri-d)}
.stitle small{display:block;font-size:.95rem;color:var(--muted);font-weight:700;letter-spacing:.05em}
.q{font-size:1.3rem;line-height:1.75;font-weight:700;background:var(--sky);border-radius:20px;padding:.75rem 1rem;margin:.6rem 0}
.verse{background:#f3faf6;border-radius:20px;padding:.75rem 1rem;margin:.7rem 0;box-shadow:inset 0 0 0 2px #c9e0d6}
.verse .vr{font-size:.95rem;font-weight:800;color:var(--pri-d)}
.verse .vh{font-size:.85rem;color:var(--muted);margin:.1rem 0 .3rem}
.vbtn{display:block;width:100%;text-align:left;background:none;border:0;border-radius:12px;font:inherit;font-size:1.15rem;line-height:1.85;color:var(--ink);padding:.15rem .3rem;margin:.1rem 0;cursor:pointer}
.vbtn:active,.vbtn.added{background:var(--sun)}
.vbtn sup,.vp sup{font-size:.7em;color:var(--pri);margin-right:.15em;font-weight:700}
.vp{font-size:1.15rem;line-height:1.85;margin:.15rem 0}
.mine{background:var(--leaf);border-radius:18px;padding:.6rem .9rem;margin:.6rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
.mine b{display:block;font-size:.9rem;color:#1f5a2d}
details.fold{background:#fff;border:1px solid var(--line);border-radius:20px;padding:.3rem 1rem;margin:.7rem 0}
details.fold summary{cursor:pointer;min-height:48px;display:flex;align-items:center;gap:.45rem;font-weight:800;color:var(--pri);list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details.fold[open] summary::after{content:"－"}
.ex{font-size:1.08rem;line-height:1.8;background:#e8f3ed;border-radius:14px;padding:.55rem .8rem;margin:.2rem 0 .6rem}
.nav{display:grid;grid-template-columns:1fr 1.5fr;gap:.7rem;margin:1.1rem 0 .4rem}
.nav .btn{width:100%;white-space:nowrap;padding:.5rem .6rem}
.small{font-size:.88rem;color:var(--muted)}
/* final */
.done-badge{display:flex;align-items:center;justify-content:center;gap:.5rem;background:#d6ecd0;color:#245c2c;border-radius:18px;padding:.6rem .9rem;font-weight:800;margin:.6rem 0;text-align:center}
.sum{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.05rem;line-height:1.75;background:#fff;border:2px solid var(--line);border-radius:20px;padding:.8rem 1rem;margin:.6rem 0;-webkit-user-select:text;user-select:text}
.copy{display:flex;width:100%;min-height:80px;font-size:1.8rem;letter-spacing:.2em;margin:.8rem 0 .3rem;background:var(--gold);box-shadow:0 4px 12px rgba(184,137,58,.35)}
.copy.ok{background:#3f8a4c}
.copied{text-align:center;font-weight:800;color:#1f5a2d;font-size:1.2rem;min-height:1.8rem;margin:.1rem 0}
.manual{width:100%;min-height:10rem;font-size:1rem}
/* list */
.wkh{font-weight:800;color:var(--pri-d);margin:1rem 0 .3rem;font-size:1.05rem}
.pick{list-style:none;padding:0;margin:0}
.pick button{display:flex;width:100%;gap:.6rem;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:.55rem .8rem;margin:.35rem 0;font:inherit;color:var(--ink);cursor:pointer;min-height:56px}
.pick button.cur{border-color:var(--pri);background:#eaf6f1}
.pick .pt{flex:1 1 auto;min-width:0}
.pick .pr{font-weight:800;font-size:1rem;display:block}
.pick .pm{font-size:.92rem;color:var(--muted);display:block}
footer{max-width:640px;margin:0 auto;padding:.6rem 1.1rem 2.4rem;font-size:.82rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:1.3rem;transform:translateX(-50%);background:#16302a;color:#fff;padding:.65rem 1.2rem;border-radius:18px;font-size:1rem;z-index:20;display:none;max-width:90vw;text-align:center}
@media(prefers-reduced-motion:reduce){.scr{animation:none}}
@media(max-width:350px){.brand span{display:none}}
/* quiet countdown on home */
.quiet{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:1rem 1.05rem 1.05rem;margin:.9rem 0;text-align:center;box-shadow:0 8px 24px rgba(15,71,59,.08)}
.quiet .qmsg{font-size:1.12rem;font-weight:800;color:var(--pri-d);margin:0 0 .45rem;line-height:1.65}
.quiet .qtime{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-weight:900;font-size:3.1rem;line-height:1;color:var(--pri);letter-spacing:.08em;margin:.15rem 0 .1rem}
.quiet .qunit{color:var(--muted);font-weight:700;font-size:.95rem;margin:0 0 .7rem}
.quiet .qbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.quiet .qbtns .btn{min-height:52px;font-size:.98rem;letter-spacing:.06em;padding:.3rem .3rem;box-shadow:none}
.quiet .qbtns .btn:disabled{opacity:.45;cursor:default}
.copied.fail{color:#b5523a}
@media(max-width:360px){.quiet .qtime{font-size:2.4rem}}

</style>

<script>var DATA={"weeks":[{"w":1,"theme":"跟從的代價與對耶穌的爭議","sref":"太 10:34-12:37"},{"w":2,"theme":"約拿的神蹟、天國比喻與家鄉的厭棄","sref":"太 12:38-13:58"},{"w":3,"theme":"約翰之死、曠野的供應與清潔的內心","sref":"太 14:1-15:39"},{"w":4,"theme":"認信基督、受難預告與登山變像","sref":"太 16:1-17:27"},{"w":5,"theme":"天國裡誰為大：饒恕、跟隨與服事","sref":"太 18:1-20:34"},{"w":6,"theme":"進聖城、潔淨聖殿與對質的話","sref":"太 21:1-22:46"},{"w":7,"theme":"禍哉、聖殿被毀與警醒等候","sref":"太 23:1-25:46"},{"w":8,"theme":"受難、埋葬與復活的使命","sref":"太 26:1-28:20"}],"plan":[{"w":1,"d":1,"ref":"馬太福音 10:34-11:1","sref":"太 10:34-11:1","t":"不是叫地上太平：愛主過於親人，並接待祂所差的人。","theme":"跟從的代價與對耶穌的爭議","v":[[10,34,"「你們不要想我來是叫地上太平；我來並不是叫地上太平，乃是叫地上動刀兵。"],[10,35,"因為我來是叫人與父親生疏，女兒與母親生疏，媳婦與婆婆生疏。"],[10,36,"人的仇敵就是自己家裡的人。"],[10,37,"「愛父母過於愛我的，不配作我的門徒；愛兒女過於愛我的，不配作我的門徒；"],[10,38,"不背著他的十字架跟從我的，也不配作我的門徒。"],[10,39,"得著生命的，將要失喪生命；為我失喪生命的，將要得著生命。」"],[10,40,"「人接待你們就是接待我；接待我就是接待那差我來的。"],[10,41,"人因為先知的名接待先知，必得先知所得的賞賜；人因為義人的名接待義人，必得義人所得的賞賜。"],[10,42,"無論何人，因為門徒的名，只把一杯涼水給這小子裡的一個喝，我實在告訴你們，這人不能不得賞賜。」"],[11,1,"耶穌吩咐完了十二個門徒，就離開那裡，往各城去傳道、教訓人。"]]},{"w":1,"d":2,"ref":"馬太福音 11:2-15","sref":"太 11:2-15","t":"約翰在監裡差人問主；耶穌為施洗約翰作見證。","theme":"跟從的代價與對耶穌的爭議","v":[[11,2,"約翰在監裡聽見基督所做的事，就打發兩個門徒去，"],[11,3,"問他說：「那將要來的是你嗎？還是我們等候別人呢？」"],[11,4,"耶穌回答說：「你們去，把所聽見、所看見的事告訴約翰。"],[11,5,"就是瞎子看見，瘸子行走，長大痲瘋的潔淨，聾子聽見，死人復活，窮人有福音傳給他們。"],[11,6,"凡不因我跌倒的就有福了！」"],[11,7,"他們走的時候，耶穌就對眾人講論約翰說：「你們從前出到曠野是要看甚麼呢？要看風吹動的蘆葦嗎？"],[11,8,"你們出去到底是要看甚麼？要看穿細軟衣服的人嗎？那穿細軟衣服的人是在王宮裡。"],[11,9,"你們出去究竟是為甚麼？是要看先知嗎？我告訴你們，是的，他比先知大多了。"],[11,10,"經上記著說：『我要差遣我的使者在你前面預備道路』，所說的就是這個人。"],[11,11,"我實在告訴你們，凡婦人所生的，沒有一個興起來大過施洗約翰的；然而天國裡最小的比他還大。"],[11,12,"從施洗約翰的時候到如今，天國是努力進入的，努力的人就得著了。"],[11,13,"因為眾先知和律法說預言，到約翰為止。"],[11,14,"你們若肯領受，這人就是那應當來的以利亞。"],[11,15,"有耳可聽的，就應當聽！"]]},{"w":1,"d":3,"ref":"馬太福音 11:16-24","sref":"太 11:16-24","t":"這世代好像街市上的孩童；哥拉汛、伯賽大與迦百農有禍了。","theme":"跟從的代價與對耶穌的爭議","v":[[11,16,"我可用甚麼比這世代呢？好像孩童坐在街市上招呼同伴，說："],[11,17,"我們向你們吹笛，你們不跳舞；我們向你們舉哀，你們不捶胸。"],[11,18,"約翰來了，也不吃也不喝，人就說他是被鬼附著的；"],[11,19,"人子來了，也吃也喝，人又說他是貪食好酒的人，是稅吏和罪人的朋友。但智慧之子總以智慧為是（有古卷：但智慧在行為上就顯為是）。」"],[11,20,"耶穌在諸城中行了許多異能，那些城的人終不悔改，就在那時候責備他們，說："],[11,21,"「哥拉汛哪，你有禍了！伯賽大啊，你有禍了！因為在你們中間所行的異能，若行在泰爾、西頓，他們早已披麻蒙灰悔改了。"],[11,22,"但我告訴你們，當審判的日子，泰爾、西頓所受的，比你們還容易受呢！"],[11,23,"迦百農啊，你已經升到天上（或譯：你將要升到天上嗎），將來必墜落陰間；因為在你那裡所行的異能，若行在所多瑪，它還可以存到今日。"],[11,24,"但我告訴你們，當審判的日子，所多瑪所受的，比你還容易受呢！」"]]},{"w":1,"d":4,"ref":"馬太福音 11:25-30","sref":"太 11:25-30","t":"這些事向嬰孩顯出來；凡勞苦擔重擔的人可以到我這裡來。","theme":"跟從的代價與對耶穌的爭議","v":[[11,25,"那時，耶穌說：「父啊，天地的主，我感謝你！因為你將這些事向聰明通達人就藏起來，向嬰孩就顯出來。"],[11,26,"父啊，是的，因為你的美意本是如此。"],[11,27,"一切所有的，都是我父交付我的；除了父，沒有人知道子；除了子和子所願意指示的，沒有人知道父。"],[11,28,"凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。"],[11,29,"我心裡柔和謙卑，你們當負我的軛，學我的樣式；這樣，你們心裡就必得享安息。"],[11,30,"因為我的軛是容易的，我的擔子是輕省的。」"]]},{"w":1,"d":5,"ref":"馬太福音 12:1-21","sref":"太 12:1-21","t":"人子是安息日的主；耶穌退去，應驗神所揀選的僕人。","theme":"跟從的代價與對耶穌的爭議","v":[[12,1,"那時，耶穌在安息日從麥地經過。他的門徒餓了，就掐起麥穗來吃。"],[12,2,"法利賽人看見，就對耶穌說：「看哪，你的門徒做安息日不可做的事了！」"],[12,3,"耶穌對他們說：「經上記著大衛和跟從他的人飢餓之時所做的事，你們沒有念過嗎？"],[12,4,"他怎麼進了　神的殿，吃了陳設餅，這餅不是他和跟從他的人可以吃得，惟獨祭司才可以吃。"],[12,5,"再者，律法上所記的，當安息日，祭司在殿裡犯了安息日還是沒有罪，你們沒有念過嗎？"],[12,6,"但我告訴你們，在這裡有一人比殿更大。"],[12,7,"『我喜愛憐恤，不喜愛祭祀。』你們若明白這話的意思，就不將無罪的當作有罪的了。"],[12,8,"因為人子是安息日的主。」"],[12,9,"耶穌離開那地方，進了一個會堂。"],[12,10,"那裡有一個人枯乾了一隻手。有人問耶穌說：「安息日治病可以不可以？」意思是要控告他。"],[12,11,"耶穌說：「你們中間誰有一隻羊，當安息日掉在坑裡，不把牠抓住，拉上來呢？"],[12,12,"人比羊何等貴重呢！所以，在安息日做善事是可以的。」"],[12,13,"於是對那人說：「伸出手來！」他把手一伸，手就復了原，和那隻手一樣。"],[12,14,"法利賽人出去，商議怎樣可以除滅耶穌。"],[12,15,"耶穌知道了，就離開那裡，有許多人跟著他。他把其中有病的人都治好了；"],[12,16,"又囑咐他們，不要給他傳名。"],[12,17,"這是要應驗先知以賽亞的話，說："],[12,18,"看哪！我的僕人，我所揀選、所親愛、心裡所喜悅的，我要將我的靈賜給他；他必將公理傳給外邦。"],[12,19,"他不爭競，不喧嚷；街上也沒有人聽見他的聲音。"],[12,20,"壓傷的蘆葦，他不折斷；將殘的燈火，他不吹滅；等他施行公理，叫公理得勝。"],[12,21,"外邦人都要仰望他的名。"]]},{"w":1,"d":6,"ref":"馬太福音 12:22-37","sref":"太 12:22-37","t":"靠著別西卜趕鬼的指控：褻瀆聖靈總不得赦免，也要憑話語受審判。","theme":"跟從的代價與對耶穌的爭議","v":[[12,22,"當下，有人將一個被鬼附著、又瞎又啞的人帶到耶穌那裡，耶穌就醫治他，甚至那啞巴又能說話，又能看見。"],[12,23,"眾人都驚奇，說：「這不是大衛的子孫嗎？」"],[12,24,"但法利賽人聽見，就說：「這個人趕鬼，無非是靠著鬼王別西卜啊。」"],[12,25,"耶穌知道他們的意念，就對他們說：「凡一國自相紛爭，就成為荒場；一城一家自相紛爭，必站立不住；"],[12,26,"若撒但趕逐撒但，就是自相紛爭，他的國怎能站得住呢？"],[12,27,"我若靠著別西卜趕鬼，你們的子弟趕鬼又靠著誰呢？這樣，他們就要斷定你們的是非。"],[12,28,"我若靠著　神的靈趕鬼，這就是　神的國臨到你們了。"],[12,29,"人怎能進壯士家裡，搶奪他的家具呢？除非先捆住那壯士，才可以搶奪他的家財。"],[12,30,"不與我相合的，就是敵我的；不同我收聚的，就是分散的。」"],[12,31,"所以我告訴你們：「人一切的罪和褻瀆的話都可得赦免，惟獨褻瀆聖靈，總不得赦免。"],[12,32,"凡說話干犯人子的，還可得赦免；惟獨說話干犯聖靈的，今世來世總不得赦免。」"],[12,33,"「你們或以為樹好，果子也好；樹壞，果子也壞；因為看果子就可以知道樹。"],[12,34,"毒蛇的種類！你們既是惡人，怎能說出好話來呢？因為心裡所充滿的，口裡就說出來。"],[12,35,"善人從他心裡所存的善就發出善來；惡人從他心裡所存的惡就發出惡來。"],[12,36,"我又告訴你們，凡人所說的閒話，當審判的日子，必要句句供出來；"],[12,37,"因為要憑你的話定你為義，也要憑你的話定你有罪。」"]]},{"w":2,"d":1,"ref":"馬太福音 12:38-50","sref":"太 12:38-50","t":"除了先知約拿的神蹟以外再沒有神蹟；凡遵行天父旨意的就是主的親人。","theme":"約拿的神蹟、天國比喻與家鄉的厭棄","v":[[12,38,"當時，有幾個文士和法利賽人對耶穌說：「夫子，我們願意你顯個神蹟給我們看。」"],[12,39,"耶穌回答說：「一個邪惡淫亂的世代求看神蹟，除了先知約拿的神蹟以外，再沒有神蹟給他們看。"],[12,40,"約拿三日三夜在大魚肚腹中，人子也要這樣三日三夜在地裡頭。"],[12,41,"當審判的時候，尼尼微人要起來定這世代的罪，因為尼尼微人聽了約拿所傳的就悔改了。看哪，在這裡有一人比約拿更大！"],[12,42,"當審判的時候，南方的女王要起來定這世代的罪，因為她從地極而來，要聽所羅門的智慧話。看哪，在這裡有一人比所羅門更大。」"],[12,43,"「污鬼離了人身，就在無水之地過來過去，尋求安歇之處，卻尋不著。"],[12,44,"於是說：『我要回到我所出來的屋裡去。』到了，就看見裡面空閒，打掃乾淨，修飾好了，"],[12,45,"便去另帶了七個比自己更惡的鬼來，都進去住在那裡。那人末後的景況比先前更不好了。這邪惡的世代也要如此。」"],[12,46,"耶穌還對眾人說話的時候，不料他母親和他弟兄站在外邊，要與他說話。"],[12,47,"有人告訴他說：「看哪，你母親和你弟兄站在外邊，要與你說話。」"],[12,48,"他卻回答那人說：「誰是我的母親？誰是我的弟兄？」"],[12,49,"就伸手指著門徒，說：「看哪，我的母親，我的弟兄。"],[12,50,"凡遵行我天父旨意的人，就是我的弟兄姊妹和母親了。」"]]},{"w":2,"d":2,"ref":"馬太福音 13:1-23","sref":"太 13:1-23","t":"撒種的比喻：為甚麼用比喻，並把這比喻講解清楚。","theme":"約拿的神蹟、天國比喻與家鄉的厭棄","v":[[13,1,"當那一天，耶穌從房子裡出來，坐在海邊。"],[13,2,"有許多人到他那裡聚集，他只得上船坐下，眾人都站在岸上。"],[13,3,"他用比喻對他們講許多道理，說：「有一個撒種的出去撒種；"],[13,4,"撒的時候，有落在路旁的，飛鳥來吃盡了；"],[13,5,"有落在土淺石頭地上的，土既不深，發苗最快，"],[13,6,"日頭出來一曬，因為沒有根，就枯乾了；"],[13,7,"有落在荊棘裡的，荊棘長起來，把它擠住了；"],[13,8,"又有落在好土裡的，就結實，有一百倍的，有六十倍的，有三十倍的。"],[13,9,"有耳可聽的，就應當聽！」"],[13,10,"門徒進前來，問耶穌說：「對眾人講話，為甚麼用比喻呢？」"],[13,11,"耶穌回答說：「因為天國的奧祕只叫你們知道，不叫他們知道。"],[13,12,"凡有的，還要加給他，叫他有餘；凡沒有的，連他所有的，也要奪去。"],[13,13,"所以我用比喻對他們講，是因他們看也看不見，聽也聽不見，也不明白。"],[13,14,"在他們身上，正應了以賽亞的預言，說：你們聽是要聽見，卻不明白；看是要看見，卻不曉得；"],[13,15,"因為這百姓油蒙了心，耳朵發沉，眼睛閉著，恐怕眼睛看見，耳朵聽見，心裡明白，回轉過來，我就醫治他們。"],[13,16,"「但你們的眼睛是有福的，因為看見了；你們的耳朵也是有福的，因為聽見了。"],[13,17,"我實在告訴你們，從前有許多先知和義人要看你們所看的，卻沒有看見，要聽你們所聽的，卻沒有聽見。」"],[13,18,"「所以，你們當聽這撒種的比喻。"],[13,19,"凡聽見天國道理不明白的，那惡者就來，把所撒在他心裡的奪了去；這就是撒在路旁的了。"],[13,20,"撒在石頭地上的，就是人聽了道，當下歡喜領受，"],[13,21,"只因心裡沒有根，不過是暫時的，及至為道遭了患難，或是受了逼迫，立刻就跌倒了。"],[13,22,"撒在荊棘裡的，就是人聽了道，後來有世上的思慮、錢財的迷惑把道擠住了，不能結實。"],[13,23,"撒在好地上的，就是人聽道明白了，後來結實，有一百倍的，有六十倍的，有三十倍的。」"]]},{"w":2,"d":3,"ref":"馬太福音 13:24-35","sref":"太 13:24-35","t":"稗子、芥菜種與麵酵的比喻。","theme":"約拿的神蹟、天國比喻與家鄉的厭棄","v":[[13,24,"耶穌又設個比喻對他們說：「天國好像人撒好種在田裡，"],[13,25,"及至人睡覺的時候，有仇敵來，將稗子撒在麥子裡就走了。"],[13,26,"到長苗吐穗的時候，稗子也顯出來。"],[13,27,"田主的僕人來告訴他說：『主啊，你不是撒好種在田裡嗎？從哪裡來的稗子呢？』"],[13,28,"主人說：『這是仇敵做的。』僕人說：『你要我們去薅出來嗎？』"],[13,29,"主人說：『不必，恐怕薅稗子，連麥子也拔出來。"],[13,30,"容這兩樣一齊長，等著收割。當收割的時候，我要對收割的人說，先將稗子薅出來，捆成捆，留著燒；惟有麥子要收在倉裡。』」"],[13,31,"他又設個比喻對他們說：「天國好像一粒芥菜種，有人拿去種在田裡。"],[13,32,"這原是百種裡最小的，等到長起來，卻比各樣的菜都大，且成了樹，天上的飛鳥來宿在它的枝上。」"],[13,33,"他又對他們講個比喻說：「天國好像麵酵，有婦人拿來，藏在三斗麵裡，直等全團都發起來。」"],[13,34,"這都是耶穌用比喻對眾人說的話；若不用比喻，就不對他們說甚麼。"],[13,35,"這是要應驗先知的話，說：我要開口用比喻，把創世以來所隱藏的事發明出來。"]]},{"w":2,"d":4,"ref":"馬太福音 13:36-43","sref":"太 13:36-43","t":"在屋子裡講解稗子的比喻。","theme":"約拿的神蹟、天國比喻與家鄉的厭棄","v":[[13,36,"當下，耶穌離開眾人，進了房子。他的門徒進前來，說：「請把田間稗子的比喻講給我們聽。」"],[13,37,"他回答說：「那撒好種的就是人子；"],[13,38,"田地就是世界；好種就是天國之子；稗子就是那惡者之子；"],[13,39,"撒稗子的仇敵就是魔鬼；收割的時候就是世界的末了；收割的人就是天使。"],[13,40,"將稗子薅出來用火焚燒，世界的末了也要如此。"],[13,41,"人子要差遣使者，把一切叫人跌倒的和作惡的，從他國裡挑出來，"],[13,42,"丟在火爐裡；在那裡必要哀哭切齒了。"],[13,43,"那時，義人在他們父的國裡，要發出光來，像太陽一樣。有耳可聽的，就應當聽！」"]]},{"w":2,"d":5,"ref":"馬太福音 13:44-52","sref":"太 13:44-52","t":"藏在地裡的寶貝、重價的珠子與撒網的比喻。","theme":"約拿的神蹟、天國比喻與家鄉的厭棄","v":[[13,44,"「天國好像寶貝藏在地裡，人遇見了就把它藏起來，歡歡喜喜地去變賣一切所有的，買這塊地。"],[13,45,"天國又好像買賣人尋找好珠子，"],[13,46,"遇見一顆重價的珠子，就去變賣他一切所有的，買了這顆珠子。"],[13,47,"天國又好像網撒在海裡，聚攏各樣水族，"],[13,48,"網既滿了，人就拉上岸來，坐下，揀好的收在器具裡，將不好的丟棄了。"],[13,49,"世界的末了也要這樣。天使要出來，從義人中把惡人分別出來，"],[13,50,"丟在火爐裡；在那裡必要哀哭切齒了。」"],[13,51,"耶穌說：「這一切的話你們都明白了嗎？」他們說：「我們明白了。」"],[13,52,"他說：「凡文士受教作天國的門徒，就像一個家主從他庫裡拿出新舊的東西來。」"]]},{"w":2,"d":6,"ref":"馬太福音 13:53-58","sref":"太 13:53-58","t":"耶穌在家鄉不被尊敬：因他們不信，就在那裡不多行異能。","theme":"約拿的神蹟、天國比喻與家鄉的厭棄","v":[[13,53,"耶穌說完了這些比喻，就離開那裡，"],[13,54,"來到自己的家鄉，在會堂裡教訓人，甚至他們都希奇，說：「這人從哪裡有這等智慧和異能呢？"],[13,55,"這不是木匠的兒子嗎？他母親不是叫馬利亞嗎？他弟兄們不是叫雅各、約西（有古卷：約瑟）、西門、猶大嗎？"],[13,56,"他妹妹們不是都在我們這裡嗎？這人從哪裡有這一切的事呢？」"],[13,57,"他們就厭棄他（厭棄他：原文是因他跌倒）。耶穌對他們說：「大凡先知，除了本地本家之外，沒有不被人尊敬的。」"],[13,58,"耶穌因為他們不信，就在那裡不多行異能了。"]]},{"w":3,"d":1,"ref":"馬太福音 14:1-12","sref":"太 14:1-12","t":"希律在監裡斬了施洗約翰。","theme":"約翰之死、曠野的供應與清潔的內心","v":[[14,1,"那時，分封的王希律聽見耶穌的名聲，"],[14,2,"就對臣僕說：「這是施洗的約翰從死裡復活，所以這些異能從他裡面發出來。」"],[14,3,"起先，希律為他兄弟腓力的妻子希羅底的緣故，把約翰拿住，鎖在監裡。"],[14,4,"因為約翰曾對他說：「你娶這婦人是不合理的。」"],[14,5,"希律就想要殺他，只是怕百姓，因為他們以約翰為先知。"],[14,6,"到了希律的生日，希羅底的女兒在眾人面前跳舞，使希律歡喜。"],[14,7,"希律就起誓，應許隨她所求的給她。"],[14,8,"女兒被母親所使，就說：「請把施洗約翰的頭放在盤子裡，拿來給我。」"],[14,9,"王便憂愁，但因他所起的誓，又因同席的人，就吩咐給她；"],[14,10,"於是打發人去，在監裡斬了約翰，"],[14,11,"把頭放在盤子裡，拿來給了女子；女子拿去給她母親。"],[14,12,"約翰的門徒來，把屍首領去埋葬了，就去告訴耶穌。"]]},{"w":3,"d":2,"ref":"馬太福音 14:13-21","sref":"太 14:13-21","t":"五餅二魚：他們都吃，並且吃飽了。","theme":"約翰之死、曠野的供應與清潔的內心","v":[[14,13,"耶穌聽見了，就上船從那裡獨自退到野地裡去。眾人聽見，就從各城裡步行跟隨他。"],[14,14,"耶穌出來，見有許多的人，就憐憫他們，治好了他們的病人。"],[14,15,"天將晚的時候，門徒進前來，說：「這是野地，時候已經過了，請叫眾人散開，他們好往村子裡去，自己買吃的。」"],[14,16,"耶穌說：「不用他們去，你們給他們吃吧！」"],[14,17,"門徒說：「我們這裡只有五個餅，兩條魚。」"],[14,18,"耶穌說：「拿過來給我。」"],[14,19,"於是吩咐眾人坐在草地上，就拿著這五個餅，兩條魚，望著天祝福，擘開餅，遞給門徒，門徒又遞給眾人。"],[14,20,"他們都吃，並且吃飽了；把剩下的零碎收拾起來，裝滿了十二個籃子。"],[14,21,"吃的人，除了婦女孩子，約有五千。"]]},{"w":3,"d":3,"ref":"馬太福音 14:22-36","sref":"太 14:22-36","t":"耶穌在海面上走；到了革尼撒勒，凡摸著的人都好了。","theme":"約翰之死、曠野的供應與清潔的內心","v":[[14,22,"耶穌隨即催門徒上船，先渡到那邊去，等他叫眾人散開。"],[14,23,"散了眾人以後，他就獨自上山去禱告。到了晚上，只有他一人在那裡。"],[14,24,"那時船在海中，因風不順，被浪搖撼。"],[14,25,"夜裡四更天，耶穌在海面上走，往門徒那裡去。"],[14,26,"門徒看見他在海面上走，就驚慌了，說：「是個鬼怪！」便害怕，喊叫起來。"],[14,27,"耶穌連忙對他們說：「你們放心，是我，不要怕！」"],[14,28,"彼得說：「主，如果是你，請叫我從水面上走到你那裡去。」"],[14,29,"耶穌說：「你來吧。」彼得就從船上下去，在水面上走，要到耶穌那裡去；"],[14,30,"只因見風甚大，就害怕，將要沉下去，便喊著說：「主啊，救我！」"],[14,31,"耶穌趕緊伸手拉住他，說：「你這小信的人哪，為甚麼疑惑呢？」"],[14,32,"他們上了船，風就住了。"],[14,33,"在船上的人都拜他，說：「你真是　神的兒子了。」"],[14,34,"他們過了海，來到革尼撒勒地方。"],[14,35,"那裡的人一認出是耶穌，就打發人到周圍地方去，把所有的病人帶到他那裡，"],[14,36,"只求耶穌准他們摸他的衣裳繸子；摸著的人就都好了。"]]},{"w":3,"d":4,"ref":"馬太福音 15:1-20","sref":"太 15:1-20","t":"因著遺傳犯神的誡命；入口的不能污穢人，出口的乃能污穢人。","theme":"約翰之死、曠野的供應與清潔的內心","v":[[15,1,"那時，有法利賽人和文士從耶路撒冷來見耶穌，說："],[15,2,"「你的門徒為甚麼犯古人的遺傳呢？因為吃飯的時候，他們不洗手。」"],[15,3,"耶穌回答說：「你們為甚麼因著你們的遺傳犯　神的誡命呢？"],[15,4,"　神說：『當孝敬父母』；又說：『咒罵父母的，必治死他。』"],[15,5,"你們倒說：『無論何人對父母說：我所當奉給你的已經作了供獻，"],[15,6,"他就可以不孝敬父母。』這就是你們藉著遺傳，廢了　神的誡命。"],[15,7,"假冒為善的人哪，以賽亞指著你們說的預言是不錯的。他說："],[15,8,"這百姓用嘴唇尊敬我，心卻遠離我；"],[15,9,"他們將人的吩咐當作道理教導人，所以拜我也是枉然。」"],[15,10,"耶穌就叫了眾人來，對他們說：「你們要聽，也要明白。"],[15,11,"入口的不能污穢人，出口的乃能污穢人。」"],[15,12,"當時，門徒進前來對他說：「法利賽人聽見這話，不服（原文是跌倒），你知道嗎？」"],[15,13,"耶穌回答說：「凡栽種的物，若不是我天父栽種的，必要拔出來。"],[15,14,"任憑他們吧！他們是瞎眼領路的；若是瞎子領瞎子，兩個人都要掉在坑裡。」"],[15,15,"彼得對耶穌說：「請將這比喻講給我們聽。」"],[15,16,"耶穌說：「你們到如今還不明白嗎？"],[15,17,"豈不知凡入口的，是運到肚子裡，又落在茅廁裡嗎？"],[15,18,"惟獨出口的，是從心裡發出來的，這才污穢人。"],[15,19,"因為從心裡發出來的，有惡念、凶殺、姦淫、苟合、偷盜、妄證、謗讟。"],[15,20,"這都是污穢人的；至於不洗手吃飯，那卻不污穢人。」"]]},{"w":3,"d":5,"ref":"馬太福音 15:21-28","sref":"太 15:21-28","t":"迦南婦人的信心：狗也吃牠主人桌子上掉下來的碎渣兒。","theme":"約翰之死、曠野的供應與清潔的內心","v":[[15,21,"耶穌離開那裡，退到泰爾、西頓的境內去。"],[15,22,"有一個迦南婦人，從那地方出來，喊著說：「主啊，大衛的子孫，可憐我！我女兒被鬼附得甚苦。」"],[15,23,"耶穌卻一言不答。門徒進前來，求他說：「這婦人在我們後頭喊叫，請打發她走吧。」"],[15,24,"耶穌說：「我奉差遣不過是到以色列家迷失的羊那裡去。」"],[15,25,"那婦人來拜他，說：「主啊，幫助我！」"],[15,26,"他回答說：「不好拿兒女的餅丟給狗吃。」"],[15,27,"婦人說：「主啊，不錯；但是狗也吃牠主人桌子上掉下來的碎渣兒。」"],[15,28,"耶穌說：「婦人，你的信心是大的！照你所要的，給你成全了吧。」從那時候，她女兒就好了。"]]},{"w":3,"d":6,"ref":"馬太福音 15:29-39","sref":"太 15:29-39","t":"耶穌憐憫眾人，治好許多病人，又使四千人吃飽。","theme":"約翰之死、曠野的供應與清潔的內心","v":[[15,29,"耶穌離開那地方，來到靠近加利利的海邊，就上山坐下。"],[15,30,"有許多人到他那裡，帶著瘸子、瞎子、啞巴、有殘疾的，和好些別的病人，都放在他腳前；他就治好了他們。"],[15,31,"甚至眾人都希奇；因為看見啞巴說話，殘疾的痊癒，瘸子行走，瞎子看見，他們就歸榮耀給以色列的　神。"],[15,32,"耶穌叫門徒來，說：「我憐憫這眾人；因為他們同我在這裡已經三天，也沒有吃的了。我不願意叫他們餓著回去，恐怕在路上困乏。」"],[15,33,"門徒說：「我們在這野地，哪裡有這麼多的餅叫這許多人吃飽呢？」"],[15,34,"耶穌說：「你們有多少餅？」他們說：「有七個，還有幾條小魚。」"],[15,35,"他就吩咐眾人坐在地上，"],[15,36,"拿著這七個餅和幾條魚，祝謝了，擘開，遞給門徒；門徒又遞給眾人。"],[15,37,"眾人都吃，並且吃飽了，收拾剩下的零碎，裝滿了七個筐子。"],[15,38,"吃的人，除了婦女孩子，共有四千。"],[15,39,"耶穌叫眾人散去，就上船，來到馬加丹的境界。"]]},{"w":4,"d":1,"ref":"馬太福音 16:1-12","sref":"太 16:1-12","t":"請他從天上顯個神蹟；要謹慎，防備法利賽人和撒都該人的酵。","theme":"認信基督、受難預告與登山變像","v":[[16,1,"法利賽人和撒都該人來試探耶穌，請他從天上顯個神蹟給他們看。"],[16,2,"耶穌回答說：「晚上天發紅，你們就說：『天必要晴。』"],[16,3,"早晨天發紅，又發黑，你們就說：『今日必有風雨。』你們知道分辨天上的氣色，倒不能分辨這時候的神蹟。"],[16,4,"一個邪惡淫亂的世代求神蹟，除了約拿的神蹟以外，再沒有神蹟給他看。」耶穌就離開他們去了。"],[16,5,"門徒渡到那邊去，忘了帶餅。"],[16,6,"耶穌對他們說：「你們要謹慎，防備法利賽人和撒都該人的酵。」"],[16,7,"門徒彼此議論說：「這是因為我們沒有帶餅吧。」"],[16,8,"耶穌看出來，就說：「你們這小信的人，為甚麼因為沒有餅彼此議論呢？"],[16,9,"你們還不明白嗎？不記得那五個餅分給五千人、又收拾了多少籃子的零碎嗎？"],[16,10,"也不記得那七個餅分給四千人、又收拾了多少筐子的零碎嗎？"],[16,11,"我對你們說：『要防備法利賽人和撒都該人的酵』，這話不是指著餅說的，你們怎麼不明白呢？」"],[16,12,"門徒這才曉得他說的不是叫他們防備餅的酵，乃是防備法利賽人和撒都該人的教訓。"]]},{"w":4,"d":2,"ref":"馬太福音 16:13-20","sref":"太 16:13-20","t":"西門彼得認耶穌是基督，是永生神的兒子。","theme":"認信基督、受難預告與登山變像","v":[[16,13,"耶穌到了該撒利亞•腓立比的境內，就問門徒說：「人說我─（有古卷沒有我字）─人子是誰？」"],[16,14,"他們說：「有人說是施洗的約翰；有人說是以利亞；又有人說是耶利米或是先知裡的一位。」"],[16,15,"耶穌說：「你們說我是誰？」"],[16,16,"西門•彼得回答說：「你是基督，是永生　神的兒子。」"],[16,17,"耶穌對他說：「西門•巴•約拿，你是有福的！因為這不是屬血肉的指示你的，乃是我在天上的父指示的。"],[16,18,"我還告訴你，你是彼得，我要把我的教會建造在這磐石上；陰間的權柄（權柄：原文是門），不能勝過他。"],[16,19,"我要把天國的鑰匙給你，凡你在地上所捆綁的，在天上也要捆綁；凡你在地上所釋放的，在天上也要釋放。」"],[16,20,"當下，耶穌囑咐門徒，不可對人說他是基督。"]]},{"w":4,"d":3,"ref":"馬太福音 16:21-28","sref":"太 16:21-28","t":"從此指示門徒他必須上耶路撒冷去；若有人要跟從我，就當捨己。","theme":"認信基督、受難預告與登山變像","v":[[16,21,"從此，耶穌才指示門徒，他必須上耶路撒冷去，受長老、祭司長、文士許多的苦，並且被殺，第三日復活。"],[16,22,"彼得就拉著他，勸他說：「主啊，萬不可如此！這事必不臨到你身上。」"],[16,23,"耶穌轉過來，對彼得說：「撒但，退我後邊去吧！你是絆我腳的；因為你不體貼　神的意思，只體貼人的意思。」"],[16,24,"於是耶穌對門徒說：「若有人要跟從我，就當捨己，背起他的十字架來跟從我。"],[16,25,"因為，凡要救自己生命（生命：或譯靈魂；下同）的，必喪掉生命；凡為我喪掉生命的，必得著生命。"],[16,26,"人若賺得全世界，賠上自己的生命，有甚麼益處呢？人還能拿甚麼換生命呢？"],[16,27,"人子要在他父的榮耀裡，同著眾使者降臨；那時候，他要照各人的行為報應各人。"],[16,28,"我實在告訴你們，站在這裡的，有人在沒嘗死味以前必看見人子降臨在他的國裡。」"]]},{"w":4,"d":4,"ref":"馬太福音 17:1-13","sref":"太 17:1-13","t":"耶穌帶著彼得、雅各、約翰登山，就在他們面前變了形像。","theme":"認信基督、受難預告與登山變像","v":[[17,1,"過了六天，耶穌帶著彼得、雅各，和雅各的兄弟約翰，暗暗地上了高山，"],[17,2,"就在他們面前變了形像，臉面明亮如日頭，衣裳潔白如光。"],[17,3,"忽然，有摩西、以利亞向他們顯現，同耶穌說話。"],[17,4,"彼得對耶穌說：「主啊，我們在這裡真好！你若願意，我就在這裡搭三座棚，一座為你，一座為摩西，一座為以利亞。」"],[17,5,"說話之間，忽然有一朵光明的雲彩遮蓋他們，且有聲音從雲彩裡出來，說：「這是我的愛子，我所喜悅的。你們要聽他！」"],[17,6,"門徒聽見，就俯伏在地，極其害怕。"],[17,7,"耶穌進前來，摸他們，說：「起來，不要害怕！」"],[17,8,"他們舉目不見一人，只見耶穌在那裡。"],[17,9,"下山的時候，耶穌吩咐他們說：「人子還沒有從死裡復活，你們不要將所看見的告訴人。」"],[17,10,"門徒問耶穌說：「文士為甚麼說以利亞必須先來？」"],[17,11,"耶穌回答說：「以利亞固然先來，並要復興萬事；"],[17,12,"只是我告訴你們，以利亞已經來了，人卻不認識他，竟任意待他。人子也將要這樣受他們的害。」"],[17,13,"門徒這才明白耶穌所說的是指著施洗的約翰。"]]},{"w":4,"d":5,"ref":"馬太福音 17:14-23","sref":"太 17:14-23","t":"因信心小而不能趕鬼；人子將要被交在人手裡。","theme":"認信基督、受難預告與登山變像","v":[[17,14,"耶穌和門徒到了眾人那裡，有一個人來見耶穌，跪下，"],[17,15,"說：「主啊，憐憫我的兒子！他害癲癇的病很苦，屢次跌在火裡，屢次跌在水裡。"],[17,16,"我帶他到你門徒那裡，他們卻不能醫治他。」"],[17,17,"耶穌說：「噯！這又不信又悖謬的世代啊，我在你們這裡要到幾時呢？我忍耐你們要到幾時呢？把他帶到我這裡來吧！」"],[17,18,"耶穌斥責那鬼，鬼就出來；從此孩子就痊癒了。"],[17,19,"門徒暗暗地到耶穌跟前，說：「我們為甚麼不能趕出那鬼呢？」"],[17,20,"耶穌說：「是因你們的信心小。我實在告訴你們，你們若有信心，像一粒芥菜種，就是對這座山說：『你從這邊挪到那邊』，它也必挪去；並且你們沒有一件不能做的事了。"],[17,21,"至於這一類的鬼，若不禱告、禁食，他就不出來（或譯：不能趕他出來）。」"],[17,22,"他們還住在加利利的時候，耶穌對門徒說：「人子將要被交在人手裡。"],[17,23,"他們要殺害他，第三日他要復活。」門徒就大大地憂愁。"]]},{"w":4,"d":6,"ref":"馬太福音 17:24-27","sref":"太 17:24-27","t":"收丁稅的來見彼得；恐怕觸犯他們，可以去釣魚得稅銀。","theme":"認信基督、受難預告與登山變像","v":[[17,24,"到了迦百農，有收丁稅的人來見彼得，說：「你們的先生不納丁稅（丁稅約有半塊錢）嗎？」"],[17,25,"彼得說：「納。」他進了屋子，耶穌先向他說：「西門，你的意思如何？世上的君王向誰征收關稅、丁稅？是向自己的兒子呢？是向外人呢？」"],[17,26,"彼得說：「是向外人。」耶穌說：「既然如此，兒子就可以免稅了。"],[17,27,"但恐怕觸犯（觸犯：原文是絆倒）他們，你且往海邊去釣魚，把先釣上來的魚拿起來，開了牠的口，必得一塊錢，可以拿去給他們，作你我的稅銀。」"]]},{"w":5,"d":1,"ref":"馬太福音 18:1-14","sref":"太 18:1-14","t":"天國裡誰是最大的：要變成小孩子的樣式，並去尋找迷路的羊。","theme":"天國裡誰為大：饒恕、跟隨與服事","v":[[18,1,"當時，門徒進前來，問耶穌說：「天國裡誰是最大的？」"],[18,2,"耶穌便叫一個小孩子來，使他站在他們當中，"],[18,3,"說：「我實在告訴你們，你們若不回轉，變成小孩子的樣式，斷不得進天國。"],[18,4,"所以，凡自己謙卑像這小孩子的，他在天國裡就是最大的。"],[18,5,"凡為我的名接待一個像這小孩子的，就是接待我。」"],[18,6,"「凡使這信我的一個小子跌倒的，倒不如把大磨石拴在這人的頸項上，沉在深海裡。"],[18,7,"這世界有禍了，因為將人絆倒；絆倒人的事是免不了的，但那絆倒人的有禍了！"],[18,8,"倘若你一隻手，或是一隻腳，叫你跌倒，就砍下來丟掉。你缺一隻手，或是一隻腳，進入永生，強如有兩手兩腳被丟在永火裡。"],[18,9,"倘若你一隻眼叫你跌倒，就把它剜出來丟掉。你只有一隻眼進入永生，強如有兩隻眼被丟在地獄的火裡。」"],[18,10,"「你們要小心，不可輕看這小子裡的一個；我告訴你們，他們的使者在天上，常見我天父的面。（有古卷加："],[18,11,"人子來，為要拯救失喪的人。）"],[18,12,"一個人若有一百隻羊，一隻走迷了路，你們的意思如何？他豈不撇下這九十九隻，往山裡去找那隻迷路的羊嗎？"],[18,13,"若是找著了，我實在告訴你們，他為這一隻羊歡喜，比為那沒有迷路的九十九隻歡喜還大呢！"],[18,14,"你們在天上的父也是這樣，不願意這小子裡失喪一個。」"]]},{"w":5,"d":2,"ref":"馬太福音 18:15-35","sref":"太 18:15-35","t":"指出弟兄的錯來；不是到七次，乃是到七十個七次。","theme":"天國裡誰為大：饒恕、跟隨與服事","v":[[18,15,"「倘若你的弟兄得罪你，你就去，趁著只有他和你在一處的時候，指出他的錯來。他若聽你，你便得了你的弟兄；"],[18,16,"他若不聽，你就另外帶一兩個人同去，要憑兩三個人的口作見證，句句都可定準。"],[18,17,"若是不聽他們，就告訴教會；若是不聽教會，就看他像外邦人和稅吏一樣。"],[18,18,"「我實在告訴你們，凡你們在地上所捆綁的，在天上也要捆綁；凡你們在地上所釋放的，在天上也要釋放。"],[18,19,"我又告訴你們，若是你們中間有兩個人在地上同心合意地求甚麼事，我在天上的父必為他們成全。"],[18,20,"因為無論在哪裡，有兩三個人奉我的名聚會，那裡就有我在他們中間。」"],[18,21,"那時，彼得進前來，對耶穌說：「主啊，我弟兄得罪我，我當饒恕他幾次呢？到七次可以嗎？」"],[18,22,"耶穌說：「我對你說，不是到七次，乃是到七十個七次。"],[18,23,"天國好像一個王要和他僕人算帳。"],[18,24,"才算的時候，有人帶了一個欠一千萬銀子的來。"],[18,25,"因為他沒有甚麼償還之物，主人吩咐把他和他妻子兒女，並一切所有的都賣了償還。"],[18,26,"那僕人就俯伏拜他，說：『主啊，寬容我，將來我都要還清。』"],[18,27,"那僕人的主人就動了慈心，把他釋放了，並且免了他的債。"],[18,28,"「那僕人出來，遇見他的一個同伴欠他十兩銀子，便揪著他，掐住他的喉嚨，說：『你把所欠的還我！』"],[18,29,"他的同伴就俯伏央求他，說：『寬容我吧，將來我必還清。』"],[18,30,"他不肯，竟去把他下在監裡，等他還了所欠的債。"],[18,31,"眾同伴看見他所做的事就甚憂愁，去把這事都告訴了主人。"],[18,32,"於是主人叫了他來，對他說：『你這惡奴才！你央求我，我就把你所欠的都免了，"],[18,33,"你不應當憐恤你的同伴，像我憐恤你嗎？』"],[18,34,"主人就大怒，把他交給掌刑的，等他還清了所欠的債。"],[18,35,"你們各人若不從心裡饒恕你的弟兄，我天父也要這樣待你們了。」"]]},{"w":5,"d":3,"ref":"馬太福音 19:1-15","sref":"太 19:1-15","t":"神配合的，人不可分開；讓小孩子到我這裡來，不要禁止他們。","theme":"天國裡誰為大：饒恕、跟隨與服事","v":[[19,1,"耶穌說完了這些話，就離開加利利，來到猶太的境界約旦河外。"],[19,2,"有許多人跟著他，他就在那裡把他們的病人治好了。"],[19,3,"有法利賽人來試探耶穌，說：「人無論甚麼緣故都可以休妻嗎？」"],[19,4,"耶穌回答說：「那起初造人的，是造男造女，"],[19,5,"並且說：『因此，人要離開父母，與妻子連合，二人成為一體。』這經你們沒有念過嗎？"],[19,6,"既然如此，夫妻不再是兩個人，乃是一體的了。所以，　神配合的，人不可分開。」"],[19,7,"法利賽人說：「這樣，摩西為甚麼吩咐給妻子休書，就可以休她呢？」"],[19,8,"耶穌說：「摩西因為你們的心硬，所以許你們休妻，但起初並不是這樣。"],[19,9,"我告訴你們，凡休妻另娶的，若不是為淫亂的緣故，就是犯姦淫了；有人娶那被休的婦人，也是犯姦淫了。」"],[19,10,"門徒對耶穌說：「人和妻子既是這樣，倒不如不娶。」"],[19,11,"耶穌說：「這話不是人都能領受的，惟獨賜給誰，誰才能領受。"],[19,12,"因為有生來是閹人，也有被人閹的，並有為天國的緣故自閹的。這話誰能領受就可以領受。」"],[19,13,"那時，有人帶著小孩子來見耶穌，要耶穌給他們按手禱告，門徒就責備那些人。"],[19,14,"耶穌說：「讓小孩子到我這裡來，不要禁止他們；因為在天國的，正是這樣的人。」"],[19,15,"耶穌給他們按手，就離開那地方去了。"]]},{"w":5,"d":4,"ref":"馬太福音 19:16-30","sref":"太 19:16-30","t":"那少年人憂憂愁愁地走了；凡為主的名撇下一切的，必要得著百倍。","theme":"天國裡誰為大：饒恕、跟隨與服事","v":[[19,16,"有一個人來見耶穌，說：「夫子（有古卷：良善的夫子），我該做甚麼善事才能得永生？」"],[19,17,"耶穌對他說：「你為甚麼以善事問我呢？只有一位是善的（有古卷：你為甚麼稱我是良善的？除了　神以外，沒有一個良善的）。你若要進入永生，就當遵守誡命。」"],[19,18,"他說：「甚麼誡命？」耶穌說：「就是不可殺人；不可姦淫；不可偷盜；不可作假見證；"],[19,19,"當孝敬父母；又當愛人如己。」"],[19,20,"那少年人說：「這一切我都遵守了，還缺少甚麼呢？」"],[19,21,"耶穌說：「你若願意作完全人，可去變賣你所有的，分給窮人，就必有財寶在天上；你還要來跟從我。」"],[19,22,"那少年人聽見這話，就憂憂愁愁地走了，因為他的產業很多。"],[19,23,"耶穌對門徒說：「我實在告訴你們，財主進天國是難的。"],[19,24,"我又告訴你們，駱駝穿過針的眼，比財主進　神的國還容易呢！」"],[19,25,"門徒聽見這話，就希奇得很，說：「這樣誰能得救呢？」"],[19,26,"耶穌看著他們，說：「在人這是不能的，在　神凡事都能。」"],[19,27,"彼得就對他說：「看哪，我們已經撇下所有的跟從你，將來我們要得甚麼呢？」"],[19,28,"耶穌說：「我實在告訴你們，你們這跟從我的人，到復興的時候，人子坐在他榮耀的寶座上，你們也要坐在十二個寶座上，審判以色列十二個支派。"],[19,29,"凡為我的名撇下房屋，或是弟兄、姊妹、父親、母親、（有古卷加：妻子、）兒女、田地的，必要得著百倍，並且承受永生。"],[19,30,"然而，有許多在前的，將要在後；在後的，將要在前。」"]]},{"w":5,"d":5,"ref":"馬太福音 20:1-16","sref":"太 20:1-16","t":"葡萄園雇工的比喻：那在後的將要在前，在前的將要在後。","theme":"天國裡誰為大：饒恕、跟隨與服事","v":[[20,1,"「因為天國好像家主清早去雇人進他的葡萄園做工，"],[20,2,"和工人講定一天一錢銀子，就打發他們進葡萄園去。"],[20,3,"約在巳初出去，看見市上還有閒站的人，"],[20,4,"就對他們說：『你們也進葡萄園去，所當給的，我必給你們。』他們也進去了。"],[20,5,"約在午正和申初又出去，也是這樣行。"],[20,6,"約在酉初出去，看見還有人站在那裡，就問他們說：『你們為甚麼整天在這裡閒站呢？』"],[20,7,"他們說：『因為沒有人雇我們。』他說：『你們也進葡萄園去。』"],[20,8,"到了晚上，園主對管事的說：『叫工人都來，給他們工錢，從後來的起，到先來的為止。』"],[20,9,"約在酉初雇的人來了，各人得了一錢銀子。"],[20,10,"及至那先雇的來了，他們以為必要多得；誰知也是各得一錢。"],[20,11,"他們得了，就埋怨家主說："],[20,12,"『我們整天勞苦受熱，那後來的只做了一小時，你竟叫他們和我們一樣嗎？』"],[20,13,"家主回答其中的一人說：『朋友，我不虧負你，你與我講定的不是一錢銀子嗎？"],[20,14,"拿你的走吧！我給那後來的和給你一樣，這是我願意的。"],[20,15,"我的東西難道不可隨我的意思用嗎？因為我作好人，你就紅了眼嗎？』"],[20,16,"這樣，那在後的，將要在前；在前的，將要在後了。（有古卷加：因為被召的人多，選上的人少。）」"]]},{"w":5,"d":6,"ref":"馬太福音 20:17-34","sref":"太 20:17-34","t":"上耶路撒冷去，人子將被釘十字架；誰願為大就必作用人；兩個瞎子得看見。","theme":"天國裡誰為大：饒恕、跟隨與服事","v":[[20,17,"耶穌上耶路撒冷去的時候，在路上把十二個門徒帶到一邊，對他們說："],[20,18,"「看哪，我們上耶路撒冷去，人子要被交給祭司長和文士。他們要定他死罪，"],[20,19,"又交給外邦人，將他戲弄，鞭打，釘在十字架上；第三日他要復活。」"],[20,20,"那時，西庇太兒子的母親同她兩個兒子上前來拜耶穌，求他一件事。"],[20,21,"耶穌說：「你要甚麼呢？」她說：「願你叫我這兩個兒子在你國裡，一個坐在你右邊，一個坐在你左邊。」"],[20,22,"耶穌回答說：「你們不知道所求的是甚麼；我將要喝的杯，你們能喝嗎？」他們說：「我們能。」"],[20,23,"耶穌說：「我所喝的杯，你們必要喝；只是坐在我的左右，不是我可以賜的，乃是我父為誰預備的，就賜給誰。」"],[20,24,"那十個門徒聽見，就惱怒他們弟兄二人。"],[20,25,"耶穌叫了他們來，說：「你們知道外邦人有君王為主治理他們，有大臣操權管束他們。"],[20,26,"只是在你們中間，不可這樣；你們中間誰願為大，就必作你們的用人；"],[20,27,"誰願為首，就必作你們的僕人。"],[20,28,"正如人子來，不是要受人的服事，乃是要服事人，並且要捨命，作多人的贖價。」"],[20,29,"他們出耶利哥的時候，有極多的人跟隨他。"],[20,30,"有兩個瞎子坐在路旁，聽說是耶穌經過，就喊著說：「主啊，大衛的子孫，可憐我們吧！」"],[20,31,"眾人責備他們，不許他們作聲；他們卻越發喊著說：「主啊，大衛的子孫，可憐我們吧！」"],[20,32,"耶穌就站住，叫他們來，說：「要我為你們做甚麼？」"],[20,33,"他們說：「主啊，要我們的眼睛能看見！」"],[20,34,"耶穌就動了慈心，把他們的眼睛一摸，他們立刻看見，就跟從了耶穌。"]]},{"w":6,"d":1,"ref":"馬太福音 21:1-17","sref":"太 21:1-17","t":"騎著驢進耶路撒冷；耶穌進了神的殿，趕出做買賣的人。","theme":"進聖城、潔淨聖殿與對質的話","v":[[21,1,"耶穌和門徒將近耶路撒冷，到了伯法其，在橄欖山那裡。"],[21,2,"耶穌就打發兩個門徒，對他們說：「你們往對面村子裡去，必看見一匹驢拴在那裡，還有驢駒同在一處；你們解開，牽到我這裡來。"],[21,3,"若有人對你們說甚麼，你們就說：『主要用牠。』那人必立時讓你們牽來。"],[21,4,"這事成就是要應驗先知的話，說："],[21,5,"要對錫安的居民（原文是女子）說：看哪，你的王來到你這裡，是溫柔的，又騎著驢，就是騎著驢駒子。」"],[21,6,"門徒就照耶穌所吩咐的去行，"],[21,7,"牽了驢和驢駒來，把自己的衣服搭在上面，耶穌就騎上。"],[21,8,"眾人多半把衣服鋪在路上；還有人砍下樹枝來鋪在路上。"],[21,9,"前行後隨的眾人喊著說：和散那（原有求救的意思，在此是稱頌的話）歸於大衛的子孫！奉主名來的是應當稱頌的！高高在上和散那！"],[21,10,"耶穌既進了耶路撒冷，合城都驚動了，說：「這是誰？」"],[21,11,"眾人說：「這是加利利拿撒勒的先知耶穌。」"],[21,12,"耶穌進了　神的殿，趕出殿裡一切做買賣的人，推倒兌換銀錢之人的桌子，和賣鴿子之人的凳子，"],[21,13,"對他們說：「經上記著說：我的殿必稱為禱告的殿，你們倒使它成為賊窩了。」"],[21,14,"在殿裡有瞎子、瘸子到耶穌跟前，他就治好了他們。"],[21,15,"祭司長和文士看見耶穌所行的奇事，又見小孩子在殿裡喊著說：「和散那歸於大衛的子孫！」就甚惱怒，"],[21,16,"對他說：「這些人所說的，你聽見了嗎？」耶穌說：「是的。經上說『你從嬰孩和吃奶的口中完全了讚美』的話，你們沒有念過嗎？」"],[21,17,"於是離開他們，出城到伯大尼去，在那裡住宿。"]]},{"w":6,"d":2,"ref":"馬太福音 21:18-32","sref":"太 21:18-32","t":"無花果樹立刻枯乾了；權柄的質問與兩個兒子的比喻。","theme":"進聖城、潔淨聖殿與對質的話","v":[[21,18,"早晨回城的時候，他餓了，"],[21,19,"看見路旁有一棵無花果樹，就走到跟前，在樹上找不著甚麼，不過有葉子，就對樹說：「從今以後，你永不結果子。」那無花果樹就立刻枯乾了。"],[21,20,"門徒看見了，便希奇說：「無花果樹怎麼立刻枯乾了呢？」"],[21,21,"耶穌回答說：「我實在告訴你們，你們若有信心，不疑惑，不但能行無花果樹上所行的事，就是對這座山說：『你挪開此地，投在海裡！』也必成就。"],[21,22,"你們禱告，無論求甚麼，只要信，就必得著。」"],[21,23,"耶穌進了殿，正教訓人的時候，祭司長和民間的長老來問他說：「你仗著甚麼權柄做這些事？給你這權柄的是誰呢？」"],[21,24,"耶穌回答說：「我也要問你們一句話，你們若告訴我，我就告訴你們我仗著甚麼權柄做這些事。"],[21,25,"約翰的洗禮是從哪裡來的？是從天上來的？是從人間來的呢？」他們彼此商議說：「我們若說『從天上來』，他必對我們說：『這樣，你們為甚麼不信他呢？』"],[21,26,"若說『從人間來』，我們又怕百姓，因為他們都以約翰為先知。」"],[21,27,"於是回答耶穌說：「我們不知道。」耶穌說：「我也不告訴你們我仗著甚麼權柄做這些事。」"],[21,28,"又說：「一個人有兩個兒子。他來對大兒子說：『我兒，你今天到葡萄園裡去做工。』"],[21,29,"他回答說：『我不去』，以後自己懊悔，就去了。"],[21,30,"又來對小兒子也是這樣說。他回答說：『父啊，我去』，他卻不去。"],[21,31,"你們想，這兩個兒子是哪一個遵行父命呢？」他們說：「大兒子。」耶穌說：「我實在告訴你們，稅吏和娼妓倒比你們先進　神的國。"],[21,32,"因為約翰遵著義路到你們這裡來，你們卻不信他；稅吏和娼妓倒信他。你們看見了，後來還是不懊悔去信他。」"]]},{"w":6,"d":3,"ref":"馬太福音 21:33-46","sref":"太 21:33-46","t":"兇惡園戶的比喻：神的國必從你們奪去，賜給那能結果子的百姓。","theme":"進聖城、潔淨聖殿與對質的話","v":[[21,33,"「你們再聽一個比喻：有個家主栽了一個葡萄園，周圍圈上籬笆，裡面挖了一個壓酒池，蓋了一座樓，租給園戶，就往外國去了。"],[21,34,"收果子的時候近了，就打發僕人到園戶那裡去收果子。"],[21,35,"園戶拿住僕人，打了一個，殺了一個，用石頭打死一個。"],[21,36,"主人又打發別的僕人去，比先前更多；園戶還是照樣待他們。"],[21,37,"後來打發他的兒子到他們那裡去，意思說：『他們必尊敬我的兒子。』"],[21,38,"不料，園戶看見他兒子，就彼此說：『這是承受產業的。來吧，我們殺他，佔他的產業！』"],[21,39,"他們就拿住他，推出葡萄園外，殺了。"],[21,40,"園主來的時候要怎樣處治這些園戶呢？」"],[21,41,"他們說：「要下毒手除滅那些惡人，將葡萄園另租給那按著時候交果子的園戶。」"],[21,42,"耶穌說：「經上寫著：匠人所棄的石頭已作了房角的頭塊石頭。這是主所做的，在我們眼中看為希奇。這經你們沒有念過嗎？"],[21,43,"所以我告訴你們，　神的國必從你們奪去，賜給那能結果子的百姓。"],[21,44,"誰掉在這石頭上，必要跌碎；這石頭掉在誰的身上，就要把誰砸得稀爛。」"],[21,45,"祭司長和法利賽人聽見他的比喻，就看出他是指著他們說的。"],[21,46,"他們想要捉拿他，只是怕眾人，因為眾人以他為先知。"]]},{"w":6,"d":4,"ref":"馬太福音 22:1-14","sref":"太 22:1-14","t":"婚筵的比喻：被召的人多，選上的人少。","theme":"進聖城、潔淨聖殿與對質的話","v":[[22,1,"耶穌又用比喻對他們說："],[22,2,"「天國好比一個王為他兒子擺設娶親的筵席，"],[22,3,"就打發僕人去，請那些被召的人來赴席，他們卻不肯來。"],[22,4,"王又打發別的僕人，說：『你們告訴那被召的人，我的筵席已經預備好了，牛和肥畜已經宰了，各樣都齊備，請你們來赴席。』"],[22,5,"那些人不理就走了；一個到自己田裡去；一個做買賣去；"],[22,6,"其餘的拿住僕人，凌辱他們，把他們殺了。"],[22,7,"王就大怒，發兵除滅那些兇手，燒燬他們的城。"],[22,8,"於是對僕人說：『喜筵已經齊備，只是所召的人不配。"],[22,9,"所以你們要往岔路口上去，凡遇見的，都召來赴席。』"],[22,10,"那些僕人就出去，到大路上，凡遇見的，不論善惡都召聚了來，筵席上就坐滿了客。"],[22,11,"王進來觀看賓客，見那裡有一個沒有穿禮服的，"],[22,12,"就對他說：『朋友，你到這裡來怎麼不穿禮服呢？』那人無言可答。"],[22,13,"於是王對使喚的人說：『捆起他的手腳來，把他丟在外邊的黑暗裡；在那裡必要哀哭切齒了。』"],[22,14,"因為被召的人多，選上的人少。」"]]},{"w":6,"d":5,"ref":"馬太福音 22:15-33","sref":"太 22:15-33","t":"該撒的物當歸給該撒；神不是死人的神，乃是活人的神。","theme":"進聖城、潔淨聖殿與對質的話","v":[[22,15,"當時，法利賽人出去商議，怎樣就著耶穌的話陷害他，"],[22,16,"就打發他們的門徒同希律黨的人去見耶穌，說：「夫子，我們知道你是誠實人，並且誠誠實實傳　神的道，甚麼人你都不徇情面，因為你不看人的外貌。"],[22,17,"請告訴我們，你的意見如何？納稅給該撒可以不可以？」"],[22,18,"耶穌看出他們的惡意，就說：「假冒為善的人哪，為甚麼試探我？"],[22,19,"拿一個上稅的錢給我看！」他們就拿一個銀錢來給他。"],[22,20,"耶穌說：「這像和這號是誰的？」"],[22,21,"他們說：「是該撒的。」耶穌說：「這樣，該撒的物當歸給該撒；　神的物當歸給　神。」"],[22,22,"他們聽見就希奇，離開他走了。"],[22,23,"撒都該人常說沒有復活的事。那天，他們來問耶穌說："],[22,24,"「夫子，摩西說：『人若死了，沒有孩子，他兄弟當娶他的妻，為哥哥生子立後。』"],[22,25,"從前，在我們這裡有弟兄七人，第一個娶了妻，死了，沒有孩子，撇下妻子給兄弟。"],[22,26,"第二、第三、直到第七個，都是如此。"],[22,27,"末後，婦人也死了。"],[22,28,"這樣，當復活的時候，她是七個人中哪一個的妻子呢？因為他們都娶過她。」"],[22,29,"耶穌回答說：「你們錯了；因為不明白聖經，也不曉得　神的大能。"],[22,30,"當復活的時候，人也不娶也不嫁，乃像天上的使者一樣。"],[22,31,"論到死人復活，　神在經上向你們所說的，你們沒有念過嗎？"],[22,32,"他說：『我是亞伯拉罕的　神，以撒的　神，雅各的　神。』　神不是死人的　神，乃是活人的　神。」"],[22,33,"眾人聽見這話，就希奇他的教訓。"]]},{"w":6,"d":6,"ref":"馬太福音 22:34-46","sref":"太 22:34-46","t":"盡心、盡性、盡意愛神，並愛人如己；大衛既稱基督為主，他怎麼又是大衛的子孫呢？","theme":"進聖城、潔淨聖殿與對質的話","v":[[22,34,"法利賽人聽見耶穌堵住了撒都該人的口，他們就聚集。"],[22,35,"內中有一個人是律法師，要試探耶穌，就問他說："],[22,36,"「夫子，律法上的誡命，哪一條是最大的呢？」"],[22,37,"耶穌對他說：「你要盡心、盡性、盡意愛主─你的　神。"],[22,38,"這是誡命中的第一，且是最大的。"],[22,39,"其次也相倣，就是要愛人如己。"],[22,40,"這兩條誡命是律法和先知一切道理的總綱。」"],[22,41,"法利賽人聚集的時候，耶穌問他們說："],[22,42,"「論到基督，你們的意見如何？他是誰的子孫呢？」他們回答說：「是大衛的子孫。」"],[22,43,"耶穌說：「這樣，大衛被聖靈感動，怎麼還稱他為主，說："],[22,44,"主對我主說：你坐在我的右邊，等我把你仇敵放在你的腳下。"],[22,45,"大衛既稱他為主，他怎麼又是大衛的子孫呢？」"],[22,46,"他們沒有一個人能回答一言。從那日以後，也沒有人敢再問他甚麼。"]]},{"w":7,"d":1,"ref":"馬太福音 23:1-12","sref":"太 23:1-12","t":"文士和法利賽人坐在摩西的位上；他們能說，不能行。","theme":"禍哉、聖殿被毀與警醒等候","v":[[23,1,"那時，耶穌對眾人和門徒講論，"],[23,2,"說：「文士和法利賽人坐在摩西的位上，"],[23,3,"凡他們所吩咐你們的，你們都要謹守遵行。但不要效法他們的行為；因為他們能說，不能行。"],[23,4,"他們把難擔的重擔捆起來，擱在人的肩上，但自己一個指頭也不肯動。"],[23,5,"他們一切所做的事都是要叫人看見，所以將佩戴的經文做寬了，衣裳的繸子做長了，"],[23,6,"喜愛筵席上的首座，會堂裡的高位，"],[23,7,"又喜愛人在街市上問他安，稱呼他拉比（拉比就是夫子）。"],[23,8,"但你們不要受拉比的稱呼，因為只有一位是你們的夫子；你們都是弟兄。"],[23,9,"也不要稱呼地上的人為父，因為只有一位是你們的父，就是在天上的父。"],[23,10,"也不要受師尊的稱呼，因為只有一位是你們的師尊，就是基督。"],[23,11,"你們中間誰為大，誰就要作你們的用人。"],[23,12,"凡自高的，必降為卑；自卑的，必升為高。"]]},{"w":7,"d":2,"ref":"馬太福音 23:13-36","sref":"太 23:13-36","t":"向假冒為善的文士和法利賽人連聲說「有禍了」。","theme":"禍哉、聖殿被毀與警醒等候","v":[[23,13,"「你們這假冒為善的文士和法利賽人有禍了！因為你們正當人前，把天國的門關了，自己不進去，正要進去的人，你們也不容他們進去。（有古卷加："],[23,14,"你們這假冒為善的文士和法利賽人有禍了！因為你們侵吞寡婦的家產，假意做很長的禱告，所以要受更重的刑罰。）"],[23,15,"「你們這假冒為善的文士和法利賽人有禍了！因為你們走遍洋海陸地，勾引一個人入教，既入了教，卻使他作地獄之子，比你們還加倍。"],[23,16,"「你們這瞎眼領路的有禍了！你們說：『凡指著殿起誓的，這算不得甚麼；只是凡指著殿中金子起誓的，他就該謹守。』"],[23,17,"你們這無知瞎眼的人哪，甚麼是大的？是金子呢？還是叫金子成聖的殿呢？"],[23,18,"你們又說：『凡指著壇起誓的，這算不得甚麼；只是凡指著壇上禮物起誓的，他就該謹守。』"],[23,19,"你們這瞎眼的人哪，甚麼是大的？是禮物呢？還是叫禮物成聖的壇呢？"],[23,20,"所以，人指著壇起誓，就是指著壇和壇上一切所有的起誓；"],[23,21,"人指著殿起誓，就是指著殿和那住在殿裡的起誓；"],[23,22,"人指著天起誓，就是指著　神的寶座和那坐在上面的起誓。"],[23,23,"「你們這假冒為善的文士和法利賽人有禍了！因為你們將薄荷、茴香、芹菜，獻上十分之一，那律法上更重的事，就是公義、憐憫、信實，反倒不行了。這更重的是你們當行的；那也是不可不行的。"],[23,24,"你們這瞎眼領路的，蠓蟲你們就濾出來，駱駝你們倒吞下去。"],[23,25,"「你們這假冒為善的文士和法利賽人有禍了！因為你們洗淨杯盤的外面，裡面卻盛滿了勒索和放蕩。"],[23,26,"你這瞎眼的法利賽人，先洗淨杯盤的裡面，好叫外面也乾淨了。"],[23,27,"「你們這假冒為善的文士和法利賽人有禍了！因為你們好像粉飾的墳墓，外面好看，裡面卻裝滿了死人的骨頭和一切的污穢。"],[23,28,"你們也是如此，在人前，外面顯出公義來，裡面卻裝滿了假善和不法的事。"],[23,29,"「你們這假冒為善的文士和法利賽人有禍了！因為你們建造先知的墳，修飾義人的墓，說："],[23,30,"『若是我們在我們祖宗的時候，必不和他們同流先知的血。』"],[23,31,"這就是你們自己證明是殺害先知者的子孫了。"],[23,32,"你們去充滿你們祖宗的惡貫吧！"],[23,33,"你們這些蛇類、毒蛇之種啊，怎能逃脫地獄的刑罰呢？"],[23,34,"所以我差遣先知和智慧人並文士到你們這裡來，有的你們要殺害，要釘十字架；有的你們要在會堂裡鞭打，從這城追逼到那城，"],[23,35,"叫世上所流義人的血都歸到你們身上，從義人亞伯的血起，直到你們在殿和壇中間所殺的巴拉加的兒子撒迦利亞的血為止。"],[23,36,"我實在告訴你們，這一切的罪都要歸到這世代了。」"]]},{"w":7,"d":3,"ref":"馬太福音 23:37-24:14","sref":"太 23:37-24:14","t":"為耶路撒冷哀哭；這殿要被拆毀，這都是災難的起頭。","theme":"禍哉、聖殿被毀與警醒等候","v":[[23,37,"「耶路撒冷啊，耶路撒冷啊，你常殺害先知，又用石頭打死那奉差遣到你這裡來的人。我多次願意聚集你的兒女，好像母雞把小雞聚集在翅膀底下，只是你們不願意。"],[23,38,"看哪，你們的家成為荒場留給你們。"],[23,39,"我告訴你們，從今以後，你們不得再見我，直等到你們說：『奉主名來的是應當稱頌的。』」"],[24,1,"耶穌出了聖殿，正走的時候，門徒進前來，把殿宇指給他看。"],[24,2,"耶穌對他們說：「你們不是看見這殿宇嗎？我實在告訴你們，將來在這裡沒有一塊石頭留在石頭上，不被拆毀了。」"],[24,3,"耶穌在橄欖山上坐著，門徒暗暗地來說：「請告訴我們，甚麼時候有這些事？你降臨和世界的末了有甚麼預兆呢？」"],[24,4,"耶穌回答說：「你們要謹慎，免得有人迷惑你們。"],[24,5,"因為將來有好些人冒我的名來，說：『我是基督』，並且要迷惑許多人。"],[24,6,"你們也要聽見打仗和打仗的風聲，總不要驚慌；因為這些事是必須有的，只是末期還沒有到。"],[24,7,"民要攻打民，國要攻打國；多處必有饑荒、地震。"],[24,8,"這都是災難（災難：原文是生產之難）的起頭。"],[24,9,"那時，人要把你們陷在患難裡，也要殺害你們；你們又要為我的名被萬民恨惡。"],[24,10,"那時，必有許多人跌倒，也要彼此陷害，彼此恨惡；"],[24,11,"且有好些假先知起來，迷惑多人。"],[24,12,"只因不法的事增多，許多人的愛心才漸漸冷淡了。"],[24,13,"惟有忍耐到底的，必然得救。"],[24,14,"這天國的福音要傳遍天下，對萬民作見證，然後末期才來到。」"]]},{"w":7,"d":4,"ref":"馬太福音 24:15-35","sref":"太 24:15-35","t":"那行毀壞可憎的；人子有能力、有大榮耀，駕著天上的雲降臨。","theme":"禍哉、聖殿被毀與警醒等候","v":[[24,15,"「你們看見先知但以理所說的『那行毀壞可憎的』站在聖地（讀這經的人須要會意）。"],[24,16,"那時，在猶太的，應當逃到山上；"],[24,17,"在房上的，不要下來拿家裡的東西；"],[24,18,"在田裡的，也不要回去取衣裳。"],[24,19,"當那些日子，懷孕的和奶孩子的有禍了。"],[24,20,"你們應當祈求，叫你們逃走的時候，不遇見冬天或是安息日。"],[24,21,"因為那時必有大災難，從世界的起頭直到如今，沒有這樣的災難，後來也必沒有。"],[24,22,"若不減少那日子，凡有血氣的總沒有一個得救的；只是為選民，那日子必減少了。"],[24,23,"那時，若有人對你們說：『基督在這裡』，或說：『基督在那裡』，你們不要信！"],[24,24,"因為假基督、假先知將要起來，顯大神蹟、大奇事，倘若能行，連選民也就迷惑了。"],[24,25,"看哪，我預先告訴你們了。"],[24,26,"若有人對你們說：『看哪，基督在曠野裡』，你們不要出去！或說：『看哪，基督在內屋中』，你們不要信！"],[24,27,"閃電從東邊發出，直照到西邊。人子降臨也要這樣。"],[24,28,"屍首在哪裡，鷹也必聚在那裡。」"],[24,29,"「那些日子的災難一過去，日頭就變黑了，月亮也不放光，眾星要從天上墜落，天勢都要震動。"],[24,30,"那時，人子的兆頭要顯在天上，地上的萬族都要哀哭。他們要看見人子，有能力，有大榮耀，駕著天上的雲降臨。"],[24,31,"他要差遣使者，用號筒的大聲，將他的選民，從四方（方：原文是風），從天這邊到天那邊，都招聚了來。」"],[24,32,"「你們可以從無花果樹學個比方：當樹枝發嫩長葉的時候，你們就知道夏天近了。"],[24,33,"這樣，你們看見這一切的事，也該知道人子近了，正在門口了。"],[24,34,"我實在告訴你們，這世代還沒有過去，這些事都要成就。"],[24,35,"天地要廢去，我的話卻不能廢去。」"]]},{"w":7,"d":5,"ref":"馬太福音 24:36-25:13","sref":"太 24:36-25:13","t":"那日子那時辰沒有人知道，所以要警醒：忠心的僕人與十個童女。","theme":"禍哉、聖殿被毀與警醒等候","v":[[24,36,"「但那日子，那時辰，沒有人知道，連天上的使者也不知道，子也不知道，惟獨父知道。"],[24,37,"挪亞的日子怎樣，人子降臨也要怎樣。"],[24,38,"當洪水以前的日子，人照常吃喝嫁娶，直到挪亞進方舟的那日；"],[24,39,"不知不覺洪水來了，把他們全都沖去。人子降臨也要這樣。"],[24,40,"那時，兩個人在田裡，取去一個，撇下一個。"],[24,41,"兩個女人推磨，取去一個，撇下一個。"],[24,42,"所以，你們要警醒，因為不知道你們的主是哪一天來到。"],[24,43,"家主若知道幾更天有賊來，就必警醒，不容人挖透房屋；這是你們所知道的。"],[24,44,"所以，你們也要預備，因為你們想不到的時候，人子就來了。」"],[24,45,"「誰是忠心有見識的僕人，為主人所派，管理家裡的人，按時分糧給他們呢？"],[24,46,"主人來到，看見他這樣行，那僕人就有福了。"],[24,47,"我實在告訴你們，主人要派他管理一切所有的。"],[24,48,"倘若那惡僕心裡說：『我的主人必來得遲』，"],[24,49,"就動手打他的同伴，又和酒醉的人一同吃喝。"],[24,50,"在想不到的日子，不知道的時辰，那僕人的主人要來，"],[24,51,"重重地處治他（或譯：把他腰斬了），定他和假冒為善的人同罪；在那裡必要哀哭切齒了。」"],[25,1,"「那時，天國好比十個童女拿著燈出去迎接新郎。"],[25,2,"其中有五個是愚拙的，五個是聰明的。"],[25,3,"愚拙的拿著燈，卻不預備油；"],[25,4,"聰明的拿著燈，又預備油在器皿裡。"],[25,5,"新郎遲延的時候，她們都打盹，睡著了。"],[25,6,"半夜有人喊著說：『新郎來了，你們出來迎接他！』"],[25,7,"那些童女就都起來收拾燈。"],[25,8,"愚拙的對聰明的說：『請分點油給我們，因為我們的燈要滅了。』"],[25,9,"聰明的回答說：『恐怕不夠你我用的；不如你們自己到賣油的那裡去買吧。』"],[25,10,"她們去買的時候，新郎到了。那預備好了的，同他進去坐席，門就關了。"],[25,11,"其餘的童女隨後也來了，說：『主啊，主啊，給我們開門！』"],[25,12,"他卻回答說：『我實在告訴你們，我不認識你們。』"],[25,13,"所以，你們要警醒；因為那日子，那時辰，你們不知道。」"]]},{"w":7,"d":6,"ref":"馬太福音 25:14-46","sref":"太 25:14-46","t":"主人把家業交給僕人；人子要坐在榮耀的寶座上，分別綿羊與山羊。","theme":"禍哉、聖殿被毀與警醒等候","v":[[25,14,"「天國又好比一個人要往外國去，就叫了僕人來，把他的家業交給他們，"],[25,15,"按著各人的才幹給他們銀子：一個給了五千，一個給了二千，一個給了一千，就往外國去了。"],[25,16,"那領五千的隨即拿去做買賣，另外賺了五千。"],[25,17,"那領二千的也照樣另賺了二千。"],[25,18,"但那領一千的去掘開地，把主人的銀子埋藏了。"],[25,19,"過了許久，那些僕人的主人來了，和他們算帳。"],[25,20,"那領五千銀子的又帶著那另外的五千來，說：『主啊，你交給我五千銀子。請看，我又賺了五千。』"],[25,21,"主人說：『好，你這又良善又忠心的僕人，你在不多的事上有忠心，我要把許多事派你管理；可以進來享受你主人的快樂。』"],[25,22,"那領二千的也來，說：『主啊，你交給我二千銀子。請看，我又賺了二千。』"],[25,23,"主人說：『好，你這又良善又忠心的僕人，你在不多的事上有忠心，我要把許多事派你管理；可以進來享受你主人的快樂。』"],[25,24,"那領一千的也來，說：『主啊，我知道你是忍心的人，沒有種的地方要收割，沒有散的地方要聚斂，"],[25,25,"我就害怕，去把你的一千銀子埋藏在地裡。請看，你的原銀子在這裡。』"],[25,26,"主人回答說：『你這又惡又懶的僕人，你既知道我沒有種的地方要收割，沒有散的地方要聚斂，"],[25,27,"就當把我的銀子放給兌換銀錢的人，到我來的時候，可以連本帶利收回。"],[25,28,"奪過他這一千來，給那有一萬的。"],[25,29,"因為凡有的，還要加給他，叫他有餘；沒有的，連他所有的也要奪過來。"],[25,30,"把這無用的僕人丟在外面黑暗裡；在那裡必要哀哭切齒了。』」"],[25,31,"「當人子在他榮耀裡、同著眾天使降臨的時候，要坐在他榮耀的寶座上。"],[25,32,"萬民都要聚集在他面前。他要把他們分別出來，好像牧羊的分別綿羊山羊一般，"],[25,33,"把綿羊安置在右邊，山羊在左邊。"],[25,34,"於是王要向那右邊的說：『你們這蒙我父賜福的，可來承受那創世以來為你們所預備的國；"],[25,35,"因為我餓了，你們給我吃，渴了，你們給我喝；我作客旅，你們留我住；"],[25,36,"我赤身露體，你們給我穿；我病了，你們看顧我；我在監裡，你們來看我。』"],[25,37,"義人就回答說：『主啊，我們甚麼時候見你餓了，給你吃，渴了，給你喝？"],[25,38,"甚麼時候見你作客旅，留你住，或是赤身露體，給你穿？"],[25,39,"又甚麼時候見你病了，或是在監裡，來看你呢？』"],[25,40,"王要回答說：『我實在告訴你們，這些事你們既做在我這弟兄中一個最小的身上，就是做在我身上了。』"],[25,41,"王又要向那左邊的說：『你們這被咒詛的人，離開我！進入那為魔鬼和他的使者所預備的永火裡去！"],[25,42,"因為我餓了，你們不給我吃，渴了，你們不給我喝；"],[25,43,"我作客旅，你們不留我住；我赤身露體，你們不給我穿；我病了，我在監裡，你們不來看顧我。』"],[25,44,"他們也要回答說：『主啊，我們甚麼時候見你餓了，或渴了，或作客旅，或赤身露體，或病了，或在監裡，不伺候你呢？』"],[25,45,"王要回答說：『我實在告訴你們，這些事你們既不做在我這弟兄中一個最小的身上，就是不做在我身上了。』"],[25,46,"這些人要往永刑裡去；那些義人要往永生裡去。」"]]},{"w":8,"d":1,"ref":"馬太福音 26:1-16","sref":"太 26:1-16","t":"逾越節到了，人子將要被釘十字架；香膏為安葬而澆，猶大拿了三十塊錢。","theme":"受難、埋葬與復活的使命","v":[[26,1,"耶穌說完了這一切的話，就對門徒說："],[26,2,"「你們知道，過兩天是逾越節，人子將要被交給人，釘在十字架上。」"],[26,3,"那時，祭司長和民間的長老聚集在大祭司稱為該亞法的院裡。"],[26,4,"大家商議要用詭計拿住耶穌，殺他，"],[26,5,"只是說：「當節的日子不可，恐怕民間生亂。」"],[26,6,"耶穌在伯大尼長大痲瘋的西門家裡，"],[26,7,"有一個女人拿著一玉瓶極貴的香膏來，趁耶穌坐席的時候，澆在他的頭上。"],[26,8,"門徒看見就很不喜悅，說：「何用這樣的枉費呢！"],[26,9,"這香膏可以賣許多錢，賙濟窮人。」"],[26,10,"耶穌看出他們的意思，就說：「為甚麼難為這女人呢？她在我身上做的是一件美事。"],[26,11,"因為常有窮人和你們同在；只是你們不常有我。"],[26,12,"她將這香膏澆在我身上是為我安葬做的。"],[26,13,"我實在告訴你們，普天之下，無論在甚麼地方傳這福音，也要述說這女人所行的，作個紀念。」"],[26,14,"當下，十二門徒裡有一個稱為加略人猶大的，去見祭司長，說："],[26,15,"「我把他交給你們，你們願意給我多少錢？」他們就給了他三十塊錢。"],[26,16,"從那時候，他就找機會要把耶穌交給他們。"]]},{"w":8,"d":2,"ref":"馬太福音 26:17-46","sref":"太 26:17-46","t":"同門徒守逾越節並設立晚餐；在客西馬尼禱告：「不要照我的意思，只要照你的意思。」","theme":"受難、埋葬與復活的使命","v":[[26,17,"除酵節的第一天，門徒來問耶穌說：「你吃逾越節的筵席，要我們在哪裡給你預備？」"],[26,18,"耶穌說：「你們進城去，到某人那裡，對他說：『夫子說：我的時候快到了，我與門徒要在你家裡守逾越節。』」"],[26,19,"門徒遵著耶穌所吩咐的就去預備了逾越節的筵席。"],[26,20,"到了晚上，耶穌和十二個門徒坐席。"],[26,21,"正吃的時候，耶穌說：「我實在告訴你們，你們中間有一個人要賣我了。」"],[26,22,"他們就甚憂愁，一個一個地問他說：「主，是我嗎？」"],[26,23,"耶穌回答說：「同我蘸手在盤子裡的，就是他要賣我。"],[26,24,"人子必要去世，正如經上指著他所寫的；但賣人子的人有禍了！那人不生在世上倒好。」"],[26,25,"賣耶穌的猶大問他說：「拉比，是我嗎？」耶穌說：「你說的是。」"],[26,26,"他們吃的時候，耶穌拿起餅來，祝福，就擘開，遞給門徒，說：「你們拿著吃，這是我的身體」；"],[26,27,"又拿起杯來，祝謝了，遞給他們，說：「你們都喝這個；"],[26,28,"因為這是我立約的血，為多人流出來，使罪得赦。"],[26,29,"但我告訴你們，從今以後，我不再喝這葡萄汁，直到我在我父的國裡同你們喝新的那日子。」"],[26,30,"他們唱了詩，就出來往橄欖山去。"],[26,31,"那時，耶穌對他們說：「今夜，你們為我的緣故都要跌倒。因為經上記著說：我要擊打牧人，羊就分散了。"],[26,32,"但我復活以後，要在你們以先往加利利去。」"],[26,33,"彼得說：「眾人雖然為你的緣故跌倒，我卻永不跌倒。」"],[26,34,"耶穌說：「我實在告訴你，今夜雞叫以先，你要三次不認我。」"],[26,35,"彼得說：「我就是必須和你同死，也總不能不認你。」眾門徒都是這樣說。"],[26,36,"耶穌同門徒來到一個地方，名叫客西馬尼，就對他們說：「你們坐在這裡，等我到那邊去禱告。」"],[26,37,"於是帶著彼得和西庇太的兩個兒子同去，就憂愁起來，極其難過，"],[26,38,"便對他們說：「我心裡甚是憂傷，幾乎要死；你們在這裡等候，和我一同警醒。」"],[26,39,"他就稍往前走，俯伏在地，禱告說：「我父啊，倘若可行，求你叫這杯離開我。然而，不要照我的意思，只要照你的意思。」"],[26,40,"來到門徒那裡，見他們睡著了，就對彼得說：「怎麼樣？你們不能同我警醒片時嗎？"],[26,41,"總要警醒禱告，免得入了迷惑。你們心靈固然願意，肉體卻軟弱了。」"],[26,42,"第二次又去禱告說：「我父啊，這杯若不能離開我，必要我喝，就願你的意旨成全。」"],[26,43,"又來，見他們睡著了，因為他們的眼睛困倦。"],[26,44,"耶穌又離開他們去了。第三次禱告，說的話還是與先前一樣。"],[26,45,"於是來到門徒那裡，對他們說：「現在你們仍然睡覺安歇吧（吧：或譯嗎？）！時候到了，人子被賣在罪人手裡了。"],[26,46,"起來！我們走吧。看哪，賣我的人近了。」"]]},{"w":8,"d":3,"ref":"馬太福音 26:47-75","sref":"太 26:47-75","t":"眾人下手拿住耶穌；他在公會前受審，彼得三次不認主。","theme":"受難、埋葬與復活的使命","v":[[26,47,"說話之間，那十二個門徒裡的猶大來了，並有許多人帶著刀棒，從祭司長和民間的長老那裡與他同來。"],[26,48,"那賣耶穌的給了他們一個暗號，說：「我與誰親嘴，誰就是他。你們可以拿住他。」"],[26,49,"猶大隨即到耶穌跟前，說：「請拉比安」，就與他親嘴。"],[26,50,"耶穌對他說：「朋友，你來要做的事，就做吧。」於是那些人上前，下手拿住耶穌。"],[26,51,"有跟隨耶穌的一個人伸手拔出刀來，將大祭司的僕人砍了一刀，削掉了他一個耳朵。"],[26,52,"耶穌對他說：「收刀入鞘吧！凡動刀的，必死在刀下。"],[26,53,"你想，我不能求我父現在為我差遣十二營多天使來嗎？"],[26,54,"若是這樣，經上所說，事情必須如此的話怎麼應驗呢？」"],[26,55,"當時，耶穌對眾人說：「你們帶著刀棒出來拿我，如同拿強盜嗎？我天天坐在殿裡教訓人，你們並沒有拿我。"],[26,56,"但這一切的事成就了，為要應驗先知書上的話。」當下，門徒都離開他逃走了。"],[26,57,"拿耶穌的人把他帶到大祭司該亞法那裡去；文士和長老已經在那裡聚會。"],[26,58,"彼得遠遠地跟著耶穌，直到大祭司的院子，進到裡面，就和差役同坐，要看這事到底怎樣。"],[26,59,"祭司長和全公會尋找假見證控告耶穌，要治死他。"],[26,60,"雖有好些人來作假見證，總得不著實據。末後有兩個人前來，說："],[26,61,"「這個人曾說：『我能拆毀　神的殿，三日內又建造起來。』」"],[26,62,"大祭司就站起來，對耶穌說：「你甚麼都不回答嗎？這些人作見證告你的是甚麼呢？」"],[26,63,"耶穌卻不言語。大祭司對他說：「我指著永生　神叫你起誓告訴我們，你是　神的兒子基督不是？」"],[26,64,"耶穌對他說：「你說的是。然而，我告訴你們，後來你們要看見人子坐在那權能者的右邊，駕著天上的雲降臨。」"],[26,65,"大祭司就撕開衣服，說：「他說了僭妄的話，我們何必再用見證人呢？這僭妄的話，現在你們都聽見了。"],[26,66,"你們的意見如何？」他們回答說：「他是該死的。」"],[26,67,"他們就吐唾沫在他臉上，用拳頭打他；也有用手掌打他的，說："],[26,68,"「基督啊！你是先知，告訴我們打你的是誰？」"],[26,69,"彼得在外面院子裡坐著，有一個使女前來，說：「你素來也是同那加利利人耶穌一夥的。」"],[26,70,"彼得在眾人面前卻不承認，說：「我不知道你說的是甚麼！」"],[26,71,"既出去，到了門口，又有一個使女看見他，就對那裡的人說：「這個人也是同拿撒勒人耶穌一夥的。」"],[26,72,"彼得又不承認，並且起誓說：「我不認得那個人。」"],[26,73,"過了不多的時候，旁邊站著的人前來，對彼得說：「你真是他們一黨的，你的口音把你露出來了。」"],[26,74,"彼得就發咒起誓地說：「我不認得那個人。」立時，雞就叫了。"],[26,75,"彼得想起耶穌所說的話：「雞叫以先，你要三次不認我。」他就出去痛哭。"]]},{"w":8,"d":4,"ref":"馬太福音 27:1-31","sref":"太 27:1-31","t":"耶穌被解到彼拉多那裡，猶大把銀錢拿回來；眾人要釘他十字架，兵丁戲弄他。","theme":"受難、埋葬與復活的使命","v":[[27,1,"到了早晨，眾祭司長和民間的長老大家商議要治死耶穌，"],[27,2,"就把他捆綁，解去，交給巡撫彼拉多。"],[27,3,"這時候，賣耶穌的猶大看見耶穌已經定了罪，就後悔，把那三十塊錢拿回來給祭司長和長老，說："],[27,4,"「我賣了無辜之人的血是有罪了。」他們說：「那與我們有甚麼相干？你自己承當吧！」"],[27,5,"猶大就把那銀錢丟在殿裡，出去吊死了。"],[27,6,"祭司長拾起銀錢來，說：「這是血價，不可放在庫裡。」"],[27,7,"他們商議，就用那銀錢買了窯戶的一塊田，為要埋葬外鄉人。"],[27,8,"所以那塊田直到今日還叫做「血田」。"],[27,9,"這就應了先知耶利米的話，說：「他們用那三十塊錢，就是被估定之人的價錢，是以色列人中所估定的，"],[27,10,"買了窯戶的一塊田；這是照著主所吩咐我的。」"],[27,11,"耶穌站在巡撫面前；巡撫問他說：「你是猶太人的王嗎？」耶穌說：「你說的是。」"],[27,12,"他被祭司長和長老控告的時候，甚麼都不回答。"],[27,13,"彼拉多就對他說：「他們作見證告你這麼多的事，你沒有聽見嗎？」"],[27,14,"耶穌仍不回答，連一句話也不說，以致巡撫甚覺希奇。"],[27,15,"巡撫有一個常例，每逢這節期，隨眾人所要的釋放一個囚犯給他們。"],[27,16,"當時有一個出名的囚犯叫巴拉巴。"],[27,17,"眾人聚集的時候，彼拉多就對他們說：「你們要我釋放哪一個給你們？是巴拉巴呢？是稱為基督的耶穌呢？」"],[27,18,"巡撫原知道他們是因為嫉妒才把他解了來。"],[27,19,"正坐堂的時候，他的夫人打發人來說：「這義人的事，你一點不可管，因為我今天在夢中為他受了許多的苦。」"],[27,20,"祭司長和長老挑唆眾人，求釋放巴拉巴，除滅耶穌。"],[27,21,"巡撫對眾人說：「這兩個人，你們要我釋放哪一個給你們呢？」他們說：「巴拉巴。」"],[27,22,"彼拉多說：「這樣，那稱為基督的耶穌我怎麼辦他呢？」他們都說：「把他釘十字架！」"],[27,23,"巡撫說：「為甚麼呢？他做了甚麼惡事呢？」他們便極力地喊著說：「把他釘十字架！」"],[27,24,"彼拉多見說也無濟於事，反要生亂，就拿水在眾人面前洗手，說：「流這義人的血，罪不在我，你們承當吧。」"],[27,25,"眾人都回答說：「他的血歸到我們和我們的子孫身上。」"],[27,26,"於是彼拉多釋放巴拉巴給他們，把耶穌鞭打了，交給人釘十字架。"],[27,27,"巡撫的兵就把耶穌帶進衙門，叫全營的兵都聚集在他那裡。"],[27,28,"他們給他脫了衣服，穿上一件朱紅色袍子，"],[27,29,"用荊棘編做冠冕，戴在他頭上，拿一根葦子放在他右手裡，跪在他面前，戲弄他，說：「恭喜，猶太人的王啊！」"],[27,30,"又吐唾沫在他臉上，拿葦子打他的頭。"],[27,31,"戲弄完了，就給他脫了袍子，仍穿上他自己的衣服，帶他出去，要釘十字架。"]]},{"w":8,"d":5,"ref":"馬太福音 27:32-66","sref":"太 27:32-66","t":"耶穌被釘在十字架上，氣就斷了；約瑟安放身體，他們將墳墓把守妥當。","theme":"受難、埋葬與復活的使命","v":[[27,32,"他們出來的時候，遇見一個古利奈人，名叫西門，就勉強他同去，好背著耶穌的十字架。"],[27,33,"到了一個地方名叫各各他，意思就是「髑髏地」。"],[27,34,"兵丁拿苦膽調和的酒給耶穌喝。他嘗了，就不肯喝。"],[27,35,"他們既將他釘在十字架上，就拈鬮分他的衣服，"],[27,36,"又坐在那裡看守他。"],[27,37,"在他頭以上安一個牌子，寫著他的罪狀，說：「這是猶太人的王耶穌。」"],[27,38,"當時，有兩個強盜和他同釘十字架，一個在右邊，一個在左邊。"],[27,39,"從那裡經過的人譏誚他，搖著頭，說："],[27,40,"「你這拆毀聖殿、三日又建造起來的，可以救自己吧！你如果是　神的兒子，就從十字架上下來吧！」"],[27,41,"祭司長和文士並長老也是這樣戲弄他，說："],[27,42,"「他救了別人，不能救自己。他是以色列的王，現在可以從十字架上下來，我們就信他。"],[27,43,"他倚靠　神，　神若喜悅他，現在可以救他；因為他曾說：『我是　神的兒子。』」"],[27,44,"那和他同釘的強盜也是這樣地譏誚他。"],[27,45,"從午正到申初，遍地都黑暗了。"],[27,46,"約在申初，耶穌大聲喊著說：「以利！以利！拉馬撒巴各大尼？」就是說：「我的　神！我的　神！為甚麼離棄我？」"],[27,47,"站在那裡的人，有的聽見就說：「這個人呼叫以利亞呢！」"],[27,48,"內中有一個人趕緊跑去，拿海絨蘸滿了醋，綁在葦子上，送給他喝。"],[27,49,"其餘的人說：「且等著，看以利亞來救他不來。」"],[27,50,"耶穌又大聲喊叫，氣就斷了。"],[27,51,"忽然，殿裡的幔子從上到下裂為兩半，地也震動，磐石也崩裂，"],[27,52,"墳墓也開了，已睡聖徒的身體多有起來的。"],[27,53,"到耶穌復活以後，他們從墳墓裡出來，進了聖城，向許多人顯現。"],[27,54,"百夫長和一同看守耶穌的人看見地震並所經歷的事，就極其害怕，說：「這真是　神的兒子了！」"],[27,55,"有好些婦女在那裡，遠遠地觀看；她們是從加利利跟隨耶穌來服事他的。"],[27,56,"內中有抹大拉的馬利亞，又有雅各和約西的母親馬利亞，並有西庇太兩個兒子的母親。"],[27,57,"到了晚上，有一個財主，名叫約瑟，是亞利馬太來的，他也是耶穌的門徒。"],[27,58,"這人去見彼拉多，求耶穌的身體；彼拉多就吩咐給他。"],[27,59,"約瑟取了身體，用乾淨細麻布裹好，"],[27,60,"安放在自己的新墳墓裡，就是他鑿在磐石裡的。他又把大石頭滾到墓門口，就去了。"],[27,61,"有抹大拉的馬利亞和那個馬利亞在那裡，對著墳墓坐著。"],[27,62,"次日，就是預備日的第二天，祭司長和法利賽人聚集來見彼拉多，說："],[27,63,"「大人，我們記得那誘惑人的還活著的時候曾說：『三日後我要復活。』"],[27,64,"因此，請吩咐人將墳墓把守妥當，直到第三日，恐怕他的門徒來，把他偷了去，就告訴百姓說：『他從死裡復活了。』這樣，那後來的迷惑比先前的更利害了！」"],[27,65,"彼拉多說：「你們有看守的兵，去吧！盡你們所能的把守妥當。」"],[27,66,"他們就帶著看守的兵同去，封了石頭，將墳墓把守妥當。"]]},{"w":8,"d":6,"ref":"馬太福音 28:1-20","sref":"太 28:1-20","t":"他不在這裡，已經復活了；你們要去，使萬民作我的門徒，我就常與你們同在。","theme":"受難、埋葬與復活的使命","v":[[28,1,"安息日將盡，七日的頭一日，天快亮的時候，抹大拉的馬利亞和那個馬利亞來看墳墓。"],[28,2,"忽然，地大震動；因為有主的使者從天上下來，把石頭滾開，坐在上面。"],[28,3,"他的相貌如同閃電，衣服潔白如雪。"],[28,4,"看守的人就因他嚇得渾身亂戰，甚至和死人一樣。"],[28,5,"天使對婦女說：「不要害怕！我知道你們是尋找那釘十字架的耶穌。"],[28,6,"他不在這裡，照他所說的，已經復活了。你們來看安放主的地方。"],[28,7,"快去告訴他的門徒，說他從死裡復活了，並且在你們以先往加利利去，在那裡你們要見他。看哪，我已經告訴你們了。」"],[28,8,"婦女們就急忙離開墳墓，又害怕，又大大地歡喜，跑去要報給他的門徒。"],[28,9,"忽然，耶穌遇見她們，說：「願你們平安！」她們就上前抱住他的腳拜他。"],[28,10,"耶穌對她們說：「不要害怕！你們去告訴我的弟兄，叫他們往加利利去，在那裡必見我。」"],[28,11,"她們去的時候，看守的兵有幾個進城去，將所經歷的事都報給祭司長。"],[28,12,"祭司長和長老聚集商議，就拿許多銀錢給兵丁，說："],[28,13,"「你們要這樣說：『夜間我們睡覺的時候，他的門徒來，把他偷去了。』"],[28,14,"倘若這話被巡撫聽見，有我們勸他，保你們無事。」"],[28,15,"兵丁受了銀錢，就照所囑咐他們的去行。這話就傳說在猶太人中間，直到今日。"],[28,16,"十一個門徒往加利利去，到了耶穌約定的山上。"],[28,17,"他們見了耶穌就拜他，然而還有人疑惑。"],[28,18,"耶穌進前來，對他們說：「天上地下所有的權柄都賜給我了。"],[28,19,"所以，你們要去，使萬民作我的門徒，奉父、子、聖靈的名給他們施洗（或譯：給他們施洗，歸於父、子、聖靈的名）。"],[28,20,"凡我所吩咐你們的，都教訓他們遵守，我就常與你們同在，直到世界的末了。」"]]}],"steps":[{"k":"S","t":"經文","e":"Scripture","q":"把當天對你特別有意義的一兩節經文寫下來。","ex":"耶和華說，「我的意念非同你們的意念，我的道路非同你們的道路。天怎樣高過地，照樣，我的道路高過你們的道路，我的意念高過你們的意念。」（以賽亞書 55:8-9）","ph":"撳上面經文加入，或者自己打/貼上一兩節"},{"k":"O","t":"觀察","e":"Observation","q":"重新寫下這些經文，用自己的話作意譯或寫出其重點，來幫你更了解當中的意思。","ex":"我們是人，所知所行都有限，但神卻不受任何限制，祂無所不知、無所不在、無所不能。","ph":"用自己的說話寫低重點"},{"k":"A","t":"應用","e":"Application","q":"思考一下，若要在你的生活中遵守這些命令，到底是什麼意思？","ex":"既然神是全知全能，而且祂的方法和道路最美好，我們就當跟隨神，凡事靠祂，而不靠自己的方法做事。","ph":"喺我生活入面，即係要點做？"},{"k":"P","t":"禱告","e":"Prayer","q":"把你的禱告寫下來，告訴神你的得着，以及你具體的實際行動。","ex":"主啊，我不知道如何過蒙你喜悅的生活，也不懂得如何幫助人。我的做法常有差錯，我的心思也有偏頗。請以袮的方法和道路教導我，在我跟隨袮的路上，求祢的聖靈帶領我。","ph":"主啊，……"},{"k":"S","t":"分享","e":"Sharing","q":"求神讓你知道該與誰分享你從神所得的領受或實踐應用。","ex":"我有個朋友史迪夫最近遇到生活上的困難，正面對要做重要決定的關口，他很需要指引。我想與他分享這些經文，幫助他如何實踐應用。","ph":"我想同邊個分享？分享乜？"}]},IMG={"group":"data:image/webp;base64,UklGRmDgAABXRUJQVlA4IFTgAADwSwOdASogA8IBPsFSoUsnpKMlMtfryPAYCU1aqLRh1D+DfUqdoHp18DyMOFyEy0ee814dp9/SxCrvfV8zrl3jvaWWQH1ZhBYNPUZ/Td575tfNf81r0curH9ADpu8b5lC+XfzffH6Adffwb/t+Rv2X/N80Pv8/0++35jf5Hgb9GNQ7zt6ccIDrXQH+tfv74wOtV1/e4H+1v7k+5vhOUB/Ji/7f3i9Pf65/4f3g+BD+wf7b/+/8VJIDFV9D1sdLroB+PGn+v6g82hs0i1KfXY7a/6/jPwLTdesh2MJNdIWMnpJn1EDpW3x6X//7+7Nl6ywn5GzcBZz7m+YXhoV1tD+4WnIeJLlsBrbqsdHAw1YLYJflYB282Kpyez3Y420PsFiSa7TwAP+0YRyi8dLctBwIKx6sGxZBnF3UWsH/teTVNFBdwZ9vz0UoAB6xtQir5OKelSv5wINRkRMRrWu+RVWoG54q3ca4KpfM90mBNCRqw2+hIsEFqaO1/zkvZBWfOs5IBYlAMoiiTsAsNzr2GYW3wnuP+Qfd6nTnsCF60B7gKHqx1cEuXxctY5VbzS0vKNX9wKoWelWLxyJ8l5UOEGFyvHsHL7W3n/VYycCP0kBB4p0h+0LMviriaBiandiJwmk3YZJtY+pfNOsNK9FXZpKHQiHOSH1I4Ugv6pZ7FUEFW2bBr/XtLyUgRgrL+sJgES3xJj51BSgHsLA3z+qCQJsR4kUWIfakvAEm2VKYu742Jc6Ib24/9+jQl9eeNrcpgRhjAJ18UgtZ73kkv7zuUQLkis4C4UZoz55bsIVwmF/8LI3Ce7NB7JTHWt4ZEMLfLABIJY6tCjE8Nm846o/k/cyMczipD9URPhWIpDBU2q9OGw5LlB5pdRaw4Z+J0rG9wasow+snWVKsqaQpelDFihE0PY/c6h4IHayqsMLaKXrtgkhrk4x/e7lcm0lANDfvKpBqSKtLaP63QgqT4zEw/DP38hZfmde  function tick(){if(!ac||!on)return;if(next<ac.currentTime)next=ac.currentTime+0.08;while(next<ac.currentTime+1.6){bar(G,next,bi++);next+=STEP}}
 function unlock(){try{var b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0)}catch(e){}}
 function play(){
  ac=ensureAC();if(!ac)return false;
  if(!G)G=graph(ac);
  unlock();on=true;if(next<ac.currentTime)next=ac.currentTime+0.12;tick();if(!timer)timer=setInterval(tick,280);fade(vol(),2.2);return true}
 function stop(s){if(!ac||!on){on=false;if(timer){clearInterval(timer);timer=null}return}on=false;fade(0,s||1.5);if(timer){clearInterval(timer);timer=null}
  setTimeout(function(){if(!on&&ac&&ac.state==='running')ac.suspend().catch(function(){})},((s||1.5)+0.2)*1000)}
 document.addEventListener('visibilitychange',function(){if(document.hidden){if(on){stop(0.3);Mus.wasOn=true}}else if(Mus.wasOn&&mpref!=='off'){Mus.wasOn=false;play()}});
 document.addEventListener('pointerdown',function(){if(on&&ac&&ac.state!=='running'&&ac.resume)ac.resume().catch(function(){})},true);
 return {play:play,stop:stop,vol:function(){if(on)fade(vol(),0.8)},playing:function(){return on},state:function(){return ac?ac.state:'none'},kind:'softpiano',wasOn:false}})();

// ---------- quiet countdown (wall-clock; one interval; does not control lessons) ----------
var quiet={remainMs:QUIET_SEC*1000,running:false,endAt:0,timer:0};
var quietChime={played:0,last:0};
function playQuietChime(){
 quietChime.played++;quietChime.last=Date.now();
 var ac=ensureAC();if(!ac)return;
 var t=ac.currentTime+0.02,out=ac.createGain();out.gain.value=1;out.connect(ac.destination);
 // short gentle bell, mixed independently of the piano master so it stays audible and distinct
 [[523.25,0.18,0],[784.87,0.12,0.04],[1046.5,0.07,0.08]].forEach(function(x){
  var o=ac.createOscillator();o.type='sine';o.frequency.value=x[0];
  var g=ac.createGain();g.gain.setValueAtTime(0.0001,t+x[2]);g.gain.exponentialRampToValueAtTime(x[1],t+x[2]+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+x[2]+1.6);
  var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
  o.connect(lp);lp.connect(g);g.connect(out);o.start(t+x[2]);o.stop(t+x[2]+1.7);
 });
}
function quietClear(){if(quiet.timer){clearInterval(quiet.timer);quiet.timer=0}}
function quietLeftMs(){if(quiet.running)return Math.max(0,quiet.endAt-Date.now());return Math.max(0,quiet.remainMs)}
function quietFinishIfDue(){if(!quiet.running)return false;if(quietLeftMs()>0)return false;quiet.running=false;quiet.remainMs=0;quiet.endAt=0;quietClear();playQuietChime();return true}
function quietSync(){if(quiet.running){if(!quietFinishIfDue())quiet.remainMs=quietLeftMs()}return Math.max(0,quiet.remainMs)}
function quietSec(){return Math.max(0,Math.ceil(quietSync()/1000))}
function quietText(){var s=quietSec();return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function quietPaint(){
 var el=$('#qtime'),st=$('#qstatus'),start=$('#qstart'),pause=$('#qpause');
 var s=quietSec();
 if(el){el.textContent=quietText();el.setAttribute('data-remain',String(s))}
 if(st){st.textContent=s===0?'時間到，安靜結束。可以按「開始」進入本課。':(quiet.running?'倒數進行中':(s===QUIET_SEC?'':'已暫停'))}
 if(start)start.disabled=!!(quiet.running||s===0);
 if(pause)pause.disabled=!quiet.running;
}
function quietTick(){quietPaint();if(!quiet.running)quietClear()}
function quietArm(){quietClear();if(quiet.running){if(!quietFinishIfDue())quiet.timer=setInterval(quietTick,200)}quietPaint()}
function quietStart(){if(quiet.running)return;var ms=quietSync();if(ms<=0)return;quiet.running=true;quiet.endAt=Date.now()+ms;quietArm()}
function quietPause(){if(!quiet.running)return;quiet.remainMs=quietLeftMs();quiet.running=false;quiet.endAt=0;quietClear();quietPaint()}
function quietReset(){quiet.running=false;quiet.remainMs=QUIET_SEC*1000;quiet.endAt=0;quietClear();quietPaint()}
function quietBind(){
 var b;if(b=$('#qstart'))b.onclick=function(){quietStart()};
 if(b=$('#qpause'))b.onclick=function(){quietPause()};
 if(b=$('#qreset'))b.onclick=function(){quietReset()};
 quietArm();
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')quietPaint()});
window.__quiet={state:function(){return {remainMs:quietSync(),running:quiet.running,timer:quiet.timer,sec:quietSec(),text:quietText(),chimePlayed:quietChime.played}},start:quietStart,pause:quietPause,reset:quietReset,paint:quietPaint};
window.__quietChime=quietChime;
// Answer values exist only in this open document.

// ---------- pieces ----------
function vChap(x){return x[0]}
function vSec(x){return x[1]}
function vText(x){return x[2]}
function passageCross(p){return vChap(p.v[0])!==vChap(p.v[p.v.length-1])}
function vSup(p,x){return passageCross(p)?(vChap(x)+':'+vSec(x)):String(vSec(x))}
function vCite(x){return '太 '+vChap(x)+':'+vSec(x)}
function passageHTML(p,tap){var h='<div class="verse" id="passage"><div class="vr">'+ic('i-book')+' '+esc(p.ref)+'（和合本）</div>'+(tap?'<p class="vh">撳一下經文，就可以加入下面嘅答案。</p>':'');
 p.v.forEach(function(x){h+=tap?'<button type="button" class="vbtn" data-c="'+vChap(x)+'" data-v="'+vSec(x)+'"><sup>'+esc(vSup(p,x))+'</sup>'+esc(vText(x))+'</button>':'<p class="vp"><sup>'+esc(vSup(p,x))+'</sup>'+esc(vText(x))+'</p>'});return h+'</div>'}
function todayCard(p){return '<div class="today" id="todaycard"><div class="wk">'+esc(lbl(p))+(p.theme?' ・'+esc(p.theme):'')+'</div><div class="rf">'+esc(p.ref)+'</div><div class="th">'+esc(p.t)+'</div></div>'}
function quietHTML(){
 return '<div class="quiet" id="quietbox">'+
  '<p class="qmsg" id="qmsg">'+esc(QUIET_MSG)+'</p>'+
  '<div class="qtime" id="qtime" data-remain="'+QUIET_SEC+'" aria-live="off">'+quietText()+'</div>'+

  '<button class="btn soft" type="button" id="qstart">開始</button>'+
  '<button class="btn soft" type="button" id="qpause">暫停</button>'+
  '<button class="btn soft" type="button" id="qreset">重設</button>'+
  '</div></div>';
}
// ---------- views ----------
function vHome(){var p=PLAN[BYID[curItem()]];
 return im('group','大樹下一班人坐喺草地上，一齊讀經')+
 '<h1 class="big">門徒小組 SOAPS 靈修</h1><p class="sub">「S.O.A.P.S. 肥皂讀經法」・馬太福音下篇試用版・第9–16週、每週 6 課，共 48 課（太 10:34–28:20），一步一步同神親近。</p>'+
 todayCard(p)+
 quietHTML()+
 '<button class="btn start" type="button" id="start">開始</button>'+
 '<button class="linkbtn" type="button" id="topick">揀第幾週／第幾課（48課目錄）</button>'+
 '<details class="fold" id="guide"><summary>'+ic('i-info')+'使用方法</summary>'+
 '<p><b>1.</b> 若要安靜片刻，可先用上面的 60 秒倒數；倒數不用完成也可以按「開始」進入本課。</p><p><b>2.</b> 按「開始」，一頁一步：經文 → 觀察 → 應用 → 禱告 → 分享。</p><p><b>3.</b> 每步都有「示範」，唔識寫可以撳開睇吓。</p><p><b>4.</b> 最後一頁按「COPY」，就可以將全部問題同答案貼去 WhatsApp、筆記或者小組。若未能自動複製，會出現可全選的文字框。</p><p><b>5.</b> 本次答案不會儲存，離開或重新整理前請先 COPY。</p>'+
 '<p class="small">背景輕音樂：右上角音符按鈕，「細聲 → 中聲 → 關」。聲音由瀏覽器即時合成柔和鋼琴和弦，並非錄音或網絡串流；撳一下畫面先會開始。60 秒倒數到 0 時會響一次溫和提示音。</p>'+
 '</details>'}
function vPick(){var c=curItem(),h='',w=0;
 PLAN.forEach(function(p){if(p.w!==w){if(w)h+='</ul>';w=p.w;h+='<div class="wkh">'+esc(weekHead(w))+'</div><ul class="pick">'}
  h+='<li><button type="button" data-id="'+p.id+'" class="'+(p.id===c?'cur':'')+'"><span class="pt"><span class="pr">靈修 '+p.d+'・'+esc(p.sref)+'</span><span class="pm">'+esc(p.t)+'</span></span></button></li>'});
 return '<h1>'+ic('i-list')+' 揀今日靈修</h1><p class="sub">接續先前課程，由第9週起至第16週，每週 6 課。撳一課就會揀咗佢。</p>'+h+'</ul><button class="btn soft wide" type="button" id="tohome" style="margin-top:1rem">返回首頁</button>'}
var STEPIMG=['bible','path','garden','candle','lake'],STEPALT=['窗邊書桌上打開的聖經','小路通往山上的教堂','花園中的小樹和長椅','燭光旁的聖經和湖景','晨光中的湖邊小碼頭'];
function dotsHTML(){var h='';for(var i=0;i<N;i++)h+='<i class="'+(i<si?'on':i===si?'cur':'')+'"></i>';return '<div class="dots" aria-hidden="true">'+h+'</div>'}
function vStep(){var p=PLAN[BYID[item]],x=ST[si],a=ans(item);
 return im(STEPIMG[si],STEPALT[si],'sm')+dotsHTML()+'<p class="snum" id="snum">'+esc(lbl(p))+'・第 '+(si+1)+'／'+N+' 步</p>'+
 '<div class="lhead"><div class="letter" aria-hidden="true">'+x.k+'</div><h1 class="stitle" id="stitle">'+esc(x.t)+' <small>'+esc(x.e)+'</small></h1></div>'+

 (si===0?todayCard(p)+passageHTML(p,true):
  (a[0].trim()?'<div class="mine"><b>你揀的經文</b>'+esc(a[0])+'</div>':'')+'<details class="fold" id="rp"><summary>'+ic('i-book')+'再睇今日經文（'+esc(p.sref)+'）</summary>'+passageHTML(p,false)+'</details>')+
 '<details class="fold" id="exf"><summary>'+ic('i-bulb')+'示範</summary><div class="ex" id="ex"><b>'+x.k+' '+esc(x.t)+' ──</b> '+esc(x.ex)+'</div></details>'+

 return '<div class="done-badge" id="donemsg">'+ic('i-check')+'完成今日靈修，感謝主！</div>'+

// ---------- copy to clipboard ----------
function legacyCopy(t){var ta=document.createElement('textarea'),ok=false,act=document.activeElement;ta.value=t;ta.setAttribute('readonly','');
 ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';document.body.appendChild(ta);
 try{ta.focus({preventScroll:true})}catch(e){}ta.select();try{ta.setSelectionRange(0,t.length)}catch(e){}
 try{ok=document.execCommand('copy')}catch(e){ok=false}document.body.removeChild(ta);try{act&&act.focus&&act.focus({preventScroll:true})}catch(e){}return ok}
function doCopy(t,done){
 var fin=function(ok,how){window.__lastCopy={ok:ok,how:how,text:t};done(ok)};
 if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext!==false){
  var p;try{p=navigator.clipboard.writeText(t)}catch(e){p=null}
  if(p&&p.then){p.then(function(){fin(true,'clipboard')},function(){fin(legacyCopy(t),'execCommand')});return}
 }
 fin(legacyCopy(t),'execCommand')}
function showManual(t){var mb=$('#manualbox');if(!mb)return;mb.innerHTML='<textarea class="manual" id="manual" readonly></textarea>';var m=$('#manual');m.value=t;try{m.focus();m.select();m.setSelectionRange(0,t.length)}catch(e){}}
function copied(btn,msgEl,ok,t){
 if(ok){if(msgEl){msgEl.classList.remove('fail');msgEl.textContent='已複製！'}btn.classList.add('ok');setTimeout(function(){btn.classList.remove('ok')},1800);toast('已複製！可以去其他地方貼上')}
 else{if(msgEl){msgEl.classList.add('fail');msgEl.textContent='手機唔俾自動複製，請長按下面文字，揀「全選」再「複製」。'}showManual(t)}}

function render(){

 a.innerHTML='<div class="scr" data-v="'+cur+'">'+h+'<p class="small" id="session-note" role="note">'+SESSION_NOTE+'</p></div>';
 var b;
 if(b=$('#start'))b.onclick=function(){musicOnStart();item=curItem();si=0;go('step')};
 $$('#topick').forEach(function(e){e.onclick=function(){go('pick')}});
 $$('.pick button').forEach(function(e){e.onclick=function(){selected=e.getAttribute('data-id');go('home')}});
 $$('#tohome').forEach(function(e){e.onclick=function(){go('home')}});
 $$('.vbtn').forEach(function(e){e.onclick=function(){var p=PLAN[BYID[item]],c=+e.getAttribute('data-c'),n=+e.getAttribute('data-v'),v=null;
  p.v.forEach(function(x){if(vChap(x)===c&&vSec(x)===n)v=vText(x)});if(v==null)return;
  var ta=$('#ans'),add=v+'（'+vCite([c,n])+'）';ta.value=(ta.value.trim()?ta.value.replace(/\s+$/,'')+'\n':'')+add;ta.oninput();e.classList.add('added');toast('已加入第 '+n+' 節')}});
 if(b=$('#prev'))b.onclick=function(){if(cur==='final'){si=N-1;go('step')}else if(si===0)go('home');else{si--;go('step')}};

 if(b=$('#copy'))b.onclick=function(){var btn=this,t=copyText(ans(item));doCopy(t,function(ok){copied(btn,$('#copied'),ok,t)})};

}
