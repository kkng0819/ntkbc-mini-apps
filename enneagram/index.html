<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fbf5e6">
<title>牛頭角浸信會門徒訓練，自我認識 (九型人格)</title>
<style>
:root{--ink:#2a2723;--muted:#4a443b;--bg:#fbf5e6;--card:#fffdf6;--line:#eadfc6;--pri:#2c5a78;--pri2:#3a7096;--acc:#a8502a;--soft:#e6f0f5;--gold:#80600f;--ok:#4a7a38;--sky:#dcecf5;--meadow:#e3efd6;--sun:#f3cf7a;--fs:19px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;line-height:1.75;letter-spacing:.02em}
a{color:var(--pri2)}
header.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topin{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:.4rem;padding:.45rem .8rem}
.brand{font-weight:700;font-size:clamp(.8rem,4.1vw,1.08rem);line-height:1.3;flex:1 1 auto;min-width:0;cursor:pointer;background:none;border:0;color:#fff;text-align:left;padding:.3rem 0;font-family:inherit;display:flex;align-items:center;gap:.45rem;overflow-wrap:anywhere}
.brand .ic{width:1.5em;height:1.5em;flex:0 0 auto;color:#f6c453;stroke-width:2.4}
.tbtn{flex:0 0 auto}
.tbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;min-height:44px;min-width:44px;padding:0 .6rem;font-size:.9rem;font-family:inherit;cursor:pointer}
nav.tabs{max-width:960px;margin:0 auto;display:flex;overflow-x:auto;gap:.3rem;padding:0 .6rem .5rem}
nav.tabs button{flex:0 0 auto;background:transparent;color:#e5edf7;border:0;border-bottom:3px solid transparent;font-size:.92rem;padding:.35rem .45rem;min-height:44px;font-family:inherit;cursor:pointer}
nav.tabs button.on{color:#fff;border-bottom-color:#f6c453;font-weight:700}
main{max-width:960px;margin:0 auto;padding:1rem .9rem 4rem}
h1{font-size:1.6rem;line-height:1.35;margin:.4rem 0 .8rem;color:var(--pri)}
h2{font-size:1.3rem;line-height:1.4;margin:1.6rem 0 .6rem;color:var(--pri);border-left:6px solid var(--acc);padding-left:.55rem}
h3{font-size:1.1rem;margin:1.1rem 0 .4rem;color:var(--ink)}
p{margin:.5rem 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin:.9rem 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.lead{font-size:1.08rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:56px;padding:.6rem 1.3rem;border-radius:14px;border:2px solid var(--pri);background:var(--pri);color:#fff;font-size:1.05rem;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;margin:.3rem .3rem .3rem 0}
.btn.ghost{background:#fff;color:var(--pri)}
.btn.warn{background:#fff;color:var(--acc);border-color:var(--acc)}
.btn:focus-visible,.opt:focus-visible,.tbtn:focus-visible,nav.tabs button:focus-visible,.tile:focus-visible{outline:4px solid #f6c453;outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:.2rem;margin:.8rem 0}
.notice{background:#fff7ed;border:2px solid #fdba74;border-radius:14px;padding:.8rem 1rem;color:#431407}
.verse{background:var(--soft);border-left:5px solid var(--pri2);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0}
.verse .vt{font-size:1.05rem}
.verse .vr{font-weight:700;color:var(--pri);margin-top:.25rem}
.verse .vw{color:var(--muted);font-size:.93rem;margin-top:.3rem}
ul.clean{padding-left:1.2rem;margin:.4rem 0}
ul.clean li{margin:.35rem 0}
.dimgrid{display:grid;gap:.7rem}
@media(min-width:720px){.dimgrid{grid-template-columns:1fr 1fr}}
/* quiz */
.prog{height:16px;background:#e5e7eb;border-radius:99px;overflow:hidden;border:1px solid #cbd5e1}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));width:0;transition:width .25s}
.progtxt{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);margin:.35rem 0 .2rem}
.qtext{font-size:1.35rem;font-weight:700;line-height:1.6;margin:1rem 0 1.1rem;min-height:4.4em}
.opts{display:grid;gap:.6rem}
.opt{display:flex;align-items:center;gap:.8rem;width:100%;min-height:62px;padding:.6rem 1rem;border:2px solid #9ca3af;border-radius:14px;background:#fff;color:var(--ink);font-size:1.1rem;font-family:inherit;text-align:left;cursor:pointer}
.opt .dot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:3px solid #6b7280;display:inline-block}
.opt.sel{border-color:var(--pri);background:#e8eef7;font-weight:700}
.opt.sel .dot{border-color:var(--pri);background:radial-gradient(circle,var(--pri) 0 45%,#fff 50%)}
@media(hover:hover){.opt:hover{border-color:var(--pri2)}}
.qnav{display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem}
/* result */
.typehero{background:var(--pri);color:#fff;border-radius:18px;padding:1.1rem 1.2rem;margin:.8rem 0}
.typehero .code{font-size:3rem;font-weight:800;letter-spacing:.12em;line-height:1.1}
.typehero .nm{font-size:1.45rem;font-weight:700}
.typehero .tg{opacity:.95;margin-top:.3rem}
.bar{margin:.9rem 0}
.bar .lbl{display:flex;justify-content:space-between;font-weight:700;font-size:1rem}
.bar .trk{position:relative;height:24px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:.3rem 0;border:1px solid #cbd5e1}
.bar .fl{position:absolute;top:0;bottom:0;background:var(--pri2)}
.bar .fl.b{background:var(--acc)}
.bar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#111}
.bar .cl{font-size:.92rem;color:var(--muted)}
.near{background:#fefce8;border:2px solid #facc15;border-radius:12px;padding:.6rem .8rem;margin:.4rem 0;font-size:.95rem;color:#422006}
.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem}
.stack div{border:1px solid var(--line);border-radius:12px;padding:.55rem .7rem;background:#fff}
.stack b{color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.chips button{font-family:inherit;color:var(--pri2);cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:0 .8rem;border:1px solid var(--pri2);border-radius:99px;background:#fff;text-decoration:none;font-size:.92rem}
.blind{border-left:5px solid var(--acc);padding:.2rem .8rem;margin:.6rem 0;background:#fff}
.blind b{color:var(--acc)}
.disc{border:1px solid var(--line);border-radius:14px;padding:.7rem .9rem;margin:.7rem 0;background:#fff}
.disc.str{border:2px dashed var(--gold);background:#fffbeb}
.disc h3{margin:.1rem 0 .3rem}
.disc ol{margin:.3rem 0;padding-left:1.4rem}
.disc ol li{margin:.25rem 0}
.why{color:var(--muted);font-size:.95rem}
.tag{display:inline-block;font-size:.8rem;background:var(--gold);color:#fff;border-radius:6px;padding:0 .4rem;margin-left:.3rem;vertical-align:middle}
/* browse */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:block;border:2px solid var(--line);border-radius:14px;padding:.7rem;background:#fff;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);min-height:96px}
.tile .c{font-size:1.4rem;font-weight:800;color:var(--pri);letter-spacing:.06em}
.tile .n{font-size:.95rem}
.tile.me{border-color:var(--acc);background:#fff7ed}
.small{font-size:.9rem;color:var(--muted)}
footer{max-width:960px;margin:0 auto;padding:1rem .9rem 2.5rem;font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#111;color:#fff;padding:.7rem 1.1rem;border-radius:12px;font-size:1rem;z-index:20;display:none}
.printonly{display:none}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:0 0 auto}
.hero,.guideart{display:block;width:100%;height:auto;border-radius:18px;margin:.6rem 0 .4rem;box-shadow:0 2px 8px rgba(31,58,95,.18)}
.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.08em;margin:.6rem 0 0}
.notes{display:flex;gap:.8rem;align-items:center;background:#fffbeb;border:2px solid #c9a54a;border-radius:16px;padding:.7rem 1rem;margin:.8rem 0;color:#1f2937}
.notes .nb{flex:0 0 auto;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--pri);color:#f6c453;display:flex;align-items:center;justify-content:center}
.notes .nb .ic{width:1.6em;height:1.6em;stroke-width:2.6}
.notes ul{list-style:none;margin:0;padding:0}
.notes li{font-weight:700;color:var(--pri);line-height:1.55;padding:.1rem 0}
.notes li+li{border-top:1px dashed #e5d3a1}
h2.ih{display:flex;align-items:center;gap:.55rem}
.hic{display:inline-flex;width:1.9em;height:1.9em;border-radius:50%;background:var(--pri);color:#f6c453;align-items:center;justify-content:center;flex:0 0 auto}
.hic .ic{width:1.15em;height:1.15em;stroke-width:2.1}
.dimcard h3{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.pole{display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border-radius:12px;background:var(--soft);color:var(--pri)}
.pole.b{background:#fdf0e8;color:var(--acc)}
.bar .lbl span{display:inline-flex;align-items:center;gap:.3rem}
.bar .lbl .ic{color:var(--pri2)} .bar .lbl span+span .ic{color:var(--acc)}
.progwrap{display:flex;align-items:center;gap:.5rem;padding-top:30px}
.progwrap .prog{flex:1;position:relative;overflow:visible}
.prog>i{border-radius:99px}
.walker{position:absolute;bottom:100%;width:28px;height:28px;color:var(--gold);transition:left .25s}
.walker .ic{width:28px;height:28px;stroke-width:2}
.fin{width:30px;height:30px;color:var(--gold);stroke-width:2.6}
.qcard{position:relative;overflow:hidden;padding-right:3.2rem}
.qcard .deco{position:absolute;right:.6rem;top:.6rem;width:2.4rem;height:2.4rem;color:#c9a54a;opacity:.7}
.qcard .qtext{margin:.3rem 0}
.disc h3{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.dic{display:inline-flex;width:2.1em;height:2.1em;border-radius:12px;background:var(--soft);color:var(--pri);align-items:center;justify-content:center;flex:0 0 auto}
.disc.str .dic{background:#fdf3c8;color:var(--gold)}
.emb{width:3.4rem;height:3.4rem;flex:0 0 auto}
.typehero{display:flex;gap:1rem;align-items:center}
.typehero .emb{width:4.6rem;height:4.6rem}
.typehero>div{min-width:0}
.tile{display:flex!important;gap:.6rem;align-items:center}
.tile .emb{width:2.4rem;height:2.4rem}
h2.gh{display:flex;align-items:center;gap:.6rem}
h2.gh .emb{width:2.4rem;height:2.4rem}
footer .fnotes{font-weight:700;color:var(--pri);margin-bottom:.4rem}

/* ===== rev2: soft watercolour / cream paper theme ===== */
body{background:var(--bg);background-image:radial-gradient(1200px 500px at 10% -10%,rgba(190,220,238,.55),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(250,226,170,.35),transparent 60%),radial-gradient(1200px 600px at 50% 110%,rgba(200,226,180,.45),transparent 60%);background-attachment:fixed}
header.top{background:rgba(255,251,240,.96);color:var(--pri);box-shadow:0 3px 14px rgba(120,96,50,.12);border-bottom:1px solid #efe3c8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{color:var(--pri)}
.brand .ic{color:#d9963a}
.tbtn{background:#fff;color:var(--pri);border:1.5px solid #d9cba8;border-radius:999px}
nav.tabs button{color:#4a5b66;border-radius:12px 12px 0 0}
nav.tabs button.on{color:var(--pri);border-bottom-color:#e0a64a;background:#fdf1d6}
h1{color:var(--pri);letter-spacing:.02em}
h2{border-left:0;padding-left:0;color:var(--pri)}
.card{background:var(--card);border:1px solid #eee3ca;border-radius:22px;box-shadow:0 6px 18px rgba(120,96,50,.08)}
.btn{border-radius:999px;border:0;background:linear-gradient(180deg,#4a83a8,#2c5a78);box-shadow:0 4px 12px rgba(44,90,120,.25);font-weight:700}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid #b9d0de;box-shadow:0 2px 8px rgba(120,96,50,.08)}
.btn.warn{background:#fff;color:var(--acc);border:2px solid #e7b9a0;box-shadow:none}
.btn.big{min-height:64px;font-size:1.2rem;padding:.7rem 1.8rem;width:100%;max-width:520px}
.notice{background:#fff5e8;border:1.5px solid #f0c9a0;border-radius:20px;color:#4a2a12}
.verse{background:#eef6e9;border-left:5px solid #9cc58f;border-radius:16px}
.verse .vr{color:#3d6b33}
.hic{background:var(--sky);color:var(--pri)}
.pole{background:var(--sky);color:var(--pri);border-radius:50%}
.pole.b{background:#fbe9d8;color:var(--acc)}
.notes{background:#fff7e0;border:2px solid #ecd08e;border-radius:22px}
.notes .nb{background:var(--sky);color:var(--pri)}
.notes li+li{border-top:1px dashed #ecd9a8}
.opt{border:2px solid #d8ccb2;border-radius:18px;background:#fffdf7}
.opt .dot{border-color:#a99d86}
.opt.sel{border-color:var(--pri2);background:#e6f1f8}
.prog{background:#efe7d4;border:1px solid #e0d4b8}
.prog>i{background:linear-gradient(90deg,#9cc58f,#5f9cc0)}
.walker{color:#d9963a}
.qcard .deco{color:#9cc58f}
.bar .trk{background:#f0e9d8;border:1px solid #e3d8bf}
.bar .fl{background:#5f9cc0}.bar .fl.b{background:#d48a5e}
.bar .mid{background:#6b6253}
.near{background:#fff7dc;border:1.5px solid #ecd08e}
.stack div{border:1px solid #eadfc6;border-radius:16px;background:#fffaf0}
.chips button{border-radius:999px;border:1.5px solid #b9d0de;color:var(--pri);background:#fff}
.blind{border-left:5px solid #e7b9a0;border-radius:0 14px 14px 0;background:#fffaf3}
.disc{border:1px solid #eee3ca;border-radius:22px;background:var(--card);box-shadow:0 6px 18px rgba(120,96,50,.07)}
.disc.str{border:2px dashed #e0b85a;background:#fff8e4}
.dic{background:var(--meadow);color:#3d6b33;border-radius:50%}
.disc.str .dic{background:#fbecc0;color:var(--gold)}
.tag{background:#e0a64a;color:#2a2723;border-radius:999px;padding:0 .55rem;font-weight:700}
.hero,.guideart{border-radius:26px;box-shadow:0 8px 24px rgba(120,96,50,.18);border:4px solid #fffaf0;object-fit:cover}
.banner{display:block;width:100%;height:auto;max-height:150px;object-fit:cover;border-radius:22px;border:3px solid #fffaf0;box-shadow:0 6px 16px rgba(120,96,50,.14);margin:.2rem 0 .7rem}
.eyebrow{color:#9a6b1a}
.toast{background:#3d3a33;border-radius:999px}
/* how-to card */
.howto{background:linear-gradient(180deg,#fff4d6,#fffcf3);border:3px solid #edc36a;border-radius:26px;padding:1.1rem 1.1rem 1.2rem;margin:1rem 0;box-shadow:0 10px 26px rgba(200,150,50,.18)}
.howto h2{margin:.1rem 0 .7rem;font-size:1.45rem;display:flex;align-items:center;gap:.55rem}
.howto h2 .hic{background:#f3cf7a;color:#5a3d06}
.howto ol{list-style:none;margin:0;padding:0;counter-reset:hs}
.howto ol>li{counter-increment:hs;position:relative;padding:.45rem 0 .45rem 3rem;min-height:2.6rem;font-size:1.08rem}
.howto ol>li::before{content:counter(hs);position:absolute;left:0;top:.35rem;width:2.2rem;height:2.2rem;border-radius:50%;background:#5f9cc0;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(44,90,120,.25)}
.howto ol>li+li{border-top:1px dashed #ecd9a8}
.likert{display:grid;gap:.25rem;margin:.4rem 0 .1rem;padding:0;list-style:none}
.likert li{display:flex;gap:.5rem;align-items:baseline;font-size:1rem}
.likert b{flex:0 0 7.2em;color:var(--pri)}
.howto .btnrow{justify-content:center;margin:1rem 0 .1rem}
/* characters */
.char{display:block;flex:0 0 auto;width:6.2rem;height:auto;aspect-ratio:280/313;border-radius:20px;background:#fbf5e6;object-fit:cover}
.typehero{background:linear-gradient(135deg,var(--gbg,#e6f0f5),#fffaf0);color:var(--ink);border:2px solid var(--gln,#cfe0ea);border-radius:26px;box-shadow:0 8px 22px rgba(120,96,50,.12)}
.typehero .code{color:var(--gfg,var(--pri))}
.typehero .nm{color:var(--ink)}
.typehero .tg{color:var(--muted)}
.typehero .meta{color:var(--muted);font-size:.9rem}
.typehero .grp{display:inline-block;background:#fff;border:1.5px solid var(--gln,#cfe0ea);color:var(--gfg,var(--pri));border-radius:999px;padding:0 .7rem;font-weight:700;font-size:.9rem}
.typehero .char{width:7.4rem;border:3px solid #fff;box-shadow:0 4px 12px rgba(120,96,50,.15)}
.g-NT{--gbg:#ece6f6;--gln:#cdbfe6;--gfg:#5a4790}
.g-NF{--gbg:#e3f0dc;--gln:#bcd9ad;--gfg:#3d6b33}
.g-SJ{--gbg:#ddeeee;--gln:#acd3d1;--gfg:#2c6664}
.g-SP{--gbg:#fbefcc;--gln:#ebd28e;--gfg:#7a5a0c}
.tiles{gap:.8rem}
.tile{flex-direction:column;align-items:center!important;text-align:center!important;border:2px solid var(--gln,#eadfc6);border-radius:22px;background:linear-gradient(180deg,var(--gbg,#fff),#fffdf6);box-shadow:0 4px 14px rgba(120,96,50,.08);padding:.7rem .5rem .8rem}
.tile .char{width:100%;max-width:150px;border-radius:18px}
.tile .c{color:var(--gfg,var(--pri))}
.tile.me{border-color:#e0a64a;border-width:3px;background:linear-gradient(180deg,#fff1cf,#fffdf6)}
h2.gh{color:var(--gfg,var(--pri))}
.c0{background:#f3cf7a}.c1{background:#bcdcae}.c2{background:#a9cfe4}.c3{background:#d5c8ee}.c4{background:#f2c9b2}
@media(min-width:720px){.char{width:7rem}.typehero .char{width:9rem}}
@media(max-width:560px){.typehero{flex-direction:column;text-align:center;align-items:center}.typehero .char{width:11rem}}
img[data-img]:not([src]){background:linear-gradient(135deg,#f3ead2,#e3eedc 55%,#dfeaf1);color:transparent}
/* enneagram additions */
.g-gut{--gbg:#fbefcc;--gln:#ebd28e;--gfg:#7a5a0c}
.g-heart{--gbg:#fbe5e1;--gln:#efbdb3;--gfg:#9a3f33}
.g-head{--gbg:#ddeeee;--gln:#acd3d1;--gfg:#2c6664}
.tip{display:flex;gap:.7rem;align-items:flex-start;background:#eef6fb;border:1.5px solid #b9d0de;border-radius:20px;padding:.7rem .9rem;margin:.8rem 0;font-size:.95rem;color:#23465c}
.tip .ic{width:1.6em;height:1.6em;color:var(--pri2);margin-top:.1rem}
.tip.strong{background:#fff5e8;border:2px solid #f0c9a0;color:#4a2a12}
.tip.strong .ic{color:var(--acc)}
.tip b{color:inherit}
.ebar{display:grid;grid-template-columns:5.6em 1fr 2.6em;align-items:center;gap:.5rem;margin:.45rem 0;font-size:.98rem}
.ebar .nm{font-weight:700;color:var(--gfg,var(--pri));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ebar .trk{height:22px;background:#f0e9d8;border:1px solid #e3d8bf;border-radius:99px;overflow:hidden}
.ebar .fl{display:block;height:100%;border-radius:99px;background:var(--gln,#5f9cc0)}
.ebar .sc{text-align:right;font-weight:700;color:var(--muted)}
.ebar.me{background:linear-gradient(90deg,#fff1cf,transparent);border-radius:12px;padding:.15rem .3rem;margin-left:-.3rem}
.ebar.me .fl{background:var(--gfg)}
.ebar.me .nm::after{content:" ★";color:#d9963a}
.enn{display:block;width:100%;max-width:300px;height:auto;margin:.4rem auto}
.enn text{font:700 13px -apple-system,"PingFang HK","Noto Sans CJK TC",sans-serif;text-anchor:middle;dominant-baseline:central}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;justify-content:center;font-size:.88rem;color:var(--muted)}

<script>var DATA={"items": [{"k": "t", "g": 1, "text": "我心中有一套清楚的對錯標準，事情要做得「對」，我才會安心。"}, {"k": "t", "g": 5, "text": "我很自然會計算時間、金錢和精力，希望用最少的付出換取最多。"}, {"k": "t", "g": 8, "text": "我很在意自己夠不夠強，最討厭顯得軟弱或被人打敗。"}, {"k": "i", "g": "SP", "text": "我的心思常放在生活的根基上：健康、作息和飲食是否妥當。"}, {"k": "t", "g": 3, "text": "在不同的場合，我很快知道自己該扮演甚麼角色，並且盡力做得稱職。"}, {"k": "t", "g": 7, "text": "做一件事，我最看重的是過程是否享受、是否有趣。"}, {"k": "t", "g": 2, "text": "在我重視的人心中，我很希望自己佔着最重要的位置。"}, {"k": "i", "g": "SO", "text": "我很自然會留意群體中的氣氛、角色和人際關係。"}, {"k": "t", "g": 6, "text": "對於說得太絕對、太極端的說法，我會本能地懷疑。"}, {"k": "t", "g": 9, "text": "我很容易融入群體、習慣或別人的立場之中，好像忘記了自己。"}, {"k": "t", "g": 4, "text": "我總覺得自己還在尋找和追求些甚麼，一停下來便覺得不對勁。"}, {"k": "i", "g": "SX", "text": "我渴望與一兩個特定的人建立深入而強烈的連結。"}, {"k": "t", "g": 2, "text": "我很懂得投其所好，知道怎樣做會令對方覺得窩心。"}, {"k": "t", "g": 9, "text": "要想清楚自己的立場和喜好很費神，我寧願跟着慣常的做法。"}, {"k": "t", "g": 4, "text": "「還未夠好」的感覺，反而會推動我不斷向前和進步。"}, {"k": "i", "g": "SP", "text": "我會花心思確保金錢、住所和生活所需穩妥足夠。"}, {"k": "t", "g": 7, "text": "心情不好時，我傾向去找開心的事做，把難過先收起來。"}, {"k": "t", "g": 1, "text": "看見錯處或做得馬虎的地方，我很想把它修正過來，連自己的錯也不會放過。"}, {"k": "t", "g": 6, "text": "在群體中，我不喜歡站在最前，也不想落在最後。"}, {"k": "i", "g": "SO", "text": "能夠在群體或團隊中有歸屬、有位置、有貢獻，對我很重要。"}, {"k": "t", "g": 3, "text": "別人的掌聲和肯定，令我覺得自己的身份有價值。"}, {"k": "t", "g": 8, "text": "對手越強，我反而越有鬥志、越興奮。"}, {"k": "t", "g": 5, "text": "當別人向我要求太多，我會本能地保護自己的資源和空間。"}, {"k": "i", "g": "SX", "text": "當我對一個人或一件事著迷時，會投入全部熱情和注意力。"}, {"k": "t", "g": 3, "text": "我心中常有一位榜樣，我會努力學習、活得像他一樣。"}, {"k": "t", "g": 6, "text": "落後時我會催逼自己追上，但走得太前時又會拉住自己。"}, {"k": "t", "g": 1, "text": "我對自己的要求比對別人更嚴，很少容許自己放鬆或隨便發脾氣。"}, {"k": "i", "g": "SP", "text": "家中的舒適和生活的秩序，是我很重要的安穩來源。"}, {"k": "t", "g": 8, "text": "看見弱小的人被欺負，我會忍不住挺身而出保護他們。"}, {"k": "t", "g": 4, "text": "我心裏常暗暗與某個人、某種標準或生活方式比較，想要超越它。"}, {"k": "t", "g": 9, "text": "我不介意做配角，但很介意被人忽略、不被尊重。"}, {"k": "i", "g": "SO", "text": "我關心教會、社會或團體的大事，並想參與其中。"}, {"k": "t", "g": 5, "text": "我不太願意投入太多感情，較習慣站在一旁觀察。"}, {"k": "t", "g": 2, "text": "如果感到自己不被重視，即使口裏不說，心裏也會很難受。"}, {"k": "t", "g": 7, "text": "我很怕生活變得沉悶乏味，總想有更多新鮮的經歷。"}, {"k": "i", "g": "SX", "text": "我容易被某一個有吸引力、有火花的人或事物強烈地吸引。"}, {"k": "t", "g": 4, "text": "我的好勝心很強，不甘心輸給心中比較的對象。"}, {"k": "t", "g": 8, "text": "我時刻保持警覺，不輕易讓人看見自己的弱點。"}, {"k": "t", "g": 2, "text": "我寧願主動揀選去照顧我在乎的人，多過被不同的人要求幫忙。"}, {"k": "i", "g": "SP", "text": "到了新環境，我會先留意自己是否安全、舒服、所需足夠。"}, {"k": "t", "g": 6, "text": "對於權威，我既想依靠他們，又會留意他們有沒有盡本份。"}, {"k": "t", "g": 9, "text": "不同意別人時，我常表面接受，但心裏和做法其實照舊。"}, {"k": "t", "g": 3, "text": "我很重視做出成績，給人一個有能力、有效率的印象。"}, {"k": "i", "g": "SO", "text": "我會留意自己在群體中的位置，以及別人怎樣看待我們這個團體。"}, {"k": "t", "g": 7, "text": "只要仍然覺得享受，我可以堅持很久，甚至非常努力。"}, {"k": "t", "g": 1, "text": "我對人和事的不滿，多數放在心裏慢慢修正，很少當面大聲指責。"}, {"k": "t", "g": 5, "text": "對於我認定是「自己人」的人，我會比較慷慨。"}, {"k": "i", "g": "SX", "text": "比起人多的聚會，我更享受深入的一對一傾談。"}, {"k": "t", "g": 5, "text": "我不想把時間和精力花在沒有用處的事情上，包括無關痛癢的知識。"}, {"k": "t", "g": 1, "text": "我常常忙着把事情做好，反而很少停下來問自己真正想要甚麼。"}, {"k": "t", "g": 7, "text": "為了之後可以好好享受，我願意先忍受一段辛苦的日子。"}, {"k": "i", "g": "SP", "text": "我習慣預早準備，例如儲蓄或帶備所需物品，以防萬一。"}, {"k": "t", "g": 4, "text": "即使達到了目標，我很快又覺得還欠了些甚麼，要繼續追求。"}, {"k": "t", "g": 2, "text": "即使心裏不開心，在人前我仍然會表現得積極開朗。"}, {"k": "t", "g": 8, "text": "我做事要夠勁、夠份量，一做便會做到盡。"}, {"k": "i", "g": "SO", "text": "我喜歡聯繫不同的人，讓大家走在一起。"}, {"k": "t", "g": 6, "text": "面對一件事，我常常一邊想向前衝，一邊又想退後。"}, {"k": "t", "g": 3, "text": "如果沒有一個清楚的角色，我會感到失落，不太知道自己是誰。"}, {"k": "t", "g": 9, "text": "我很少為自己爭取甚麼，但為了別人卻可以很努力。"}, {"k": "i", "g": "SX", "text": "如果一段重要的關係變得平淡、缺少熱度，我會感到不滿足。"}], "types": {"1": {"name": "標準（求正）主義", "short": "求正", "alt": "坊間常稱：完美者、改革者", "centre": "gut", "tag": "心中有一把最高的尺，渴求把「錯」修正為「對」", "summary": "認真、自律，忠於心中最高的標準，習慣把錯處修正過來。", "world": ["對", "錯"], "passion": "嬲怒（Wrath）", "passiond": "一股「要把錯處糾正過來」的怒氣。它很少爆發，多數在心裏靜靜地修正別人和自己，化成緊繃、執正和停不下來的忙碌。", "motive": "跟從心中最高的標準（神、權威或自己認定的準則），把錯的人和事——包括自己——修正過來，活在一個完全「對」的世界", "virtue": "安詳", "traits": ["對心中最高的權威非常忠心；當較小的權威與最高標準有衝突，會毫不猶豫地選擇最高標準。", "律己甚嚴，對自己比對別人更不留情；不滿多放在心裏修正，很少當面發作。", "常常很忙，忙着把事情做對，卻較少接觸自己內心的渴望，彷彿要先得到「批准」才敢想要。", "對被責罰很敏感，不喜歡突如其來的變化；是可靠的執行者，較少天馬行空的策略想像。"], "healthy": "健康的 1 型能容許「對」與「錯」同時存在於生命中：仍然持守原則，卻不再被每一個錯處綁住，也容許自己有渴望。", "overview": "第 1 型的人看世界，第一道濾鏡是「對」與「錯」。他們心中有一把最高的尺，可能來自神、來自重要的權威，也可能是自己認定的準則；一看見不合標準的地方，心裏便自然想把它修正過來，連自己也不放過。他們認真、自律、可靠，是群體中守原則的人。推動他們的是一股很少爆發的怒氣，常常化成內心的批評和停不下來的忙碌。信仰上要分辨：心中那把只會量度錯處的尺，並不等於神；真正的神是滿有恩典的，祂的接納不是靠我們做得「對」換來的。", "gifts": ["心中有清楚的「對」，能堅持原則，有道德勇氣", "修正的力量用得好，便成為改善的動力，推動群體走向更好", "忠於最高的標準，是可靠、盡責的執行者", "律己以嚴、以身作則，令人信任"], "blind": [["卡在「錯」的一極", "眼中先看見錯處，難以欣賞已經做得好的地方，對人對己都少有滿足。"], ["把自己的尺當作神", "把心中的標準等同神的標準，結果對人對己都缺少恩典。"], ["嬲怒收在心裏", "覺得發脾氣是「錯」的，於是把不滿收起，化成緊繃、冷淡或偶然的爆發。"], ["渴求停不下來", "要先把一切修正好才肯休息，忙碌蓋過了自己內心的渴望。"]], "stress": "壓力大時，「錯」的一極壓得太重，修正不了的嬲怒轉向自己；這時會帶上第 4 型不健康的一面——在「停頓下來」中不斷與理想比較，覺得自己永遠「還未夠好」，甚至想放下一切責任。", "growth": "健康時會吸收第 7 型健康的世界觀：容許自己「享受」，不必先把一切修正好才可以快樂；在「對」與「錯」並存的世界裏仍看見美好，活出輕鬆和喜樂。", "tips": ["練習讓「對」與「錯」並存：每天寫下一件「不完美，但已經足夠好」的事。", "察覺心中修正的聲音時，問自己：「這是神恩典的聲音，還是我自己的尺？」", "在嬲怒累積之前，溫和而清楚地說出自己的需要。", "容許自己有渴望：每星期做一件純粹享受、不為改善的事。", "先肯定別人做得好的地方，再提出建議。"], "verses": [{"k": "羅3:23-24", "why": "你渴求活在完全「對」的世界；這段經文把兩極同時放在你面前——世人都犯了罪（錯），卻蒙恩典白白地稱義（對）。真正的「對」不是靠你修正得來，而是神白白賜下的。"}, {"k": "弗4:26-27", "why": "你的嬲怒多數收在心裏、靜靜地修正人和自己；聖經沒有說不可生氣，卻提醒不要因此犯罪，也不要含怒到日落——及早把不滿溫和地說出來，交給神處理。"}], "disc": [{"k": "sabbath", "why": "你最容易卡在「錯」的一極，停不下修正；安息日讓你在一段時間裏不改善、不執正，經歷世界不靠你修正，也穩穩在神手中。"}, {"k": "celebration", "why": "你常常要先「批准」自己才敢享受；慶祝培養你被忽略的一面，也正是你成長方向（第 7 型）健康的享受——在「對」與「錯」並存之中，仍為神的美善歡喜。"}], "reflect": ["我心中那把尺，有多少來自聖經，有多少來自我自己？", "最近一次我看見「錯」、心裏嬲怒卻沒有說出來，是甚麼事？我可以怎樣以愛心說出來？", "如果神已經稱我為義，今天我可以放下哪一件「必須修正」的事，又可以容許自己想要甚麼？"], "group": "分享一件你「明知已經足夠好，卻仍想再修正」的事。組員可以怎樣幫助你在「對」與「錯」之間經歷恩典？"}, "2": {"name": "被愛（討好）主義", "short": "被愛", "alt": "坊間常稱：助人者、給予者", "centre": "heart", "tag": "渴求成為對方心中最重要的那一位", "summary": "溫暖、懂得投其所好，渴望被愛、被重視，被放在心中的第一位。", "world": ["被愛、被重視", "不被愛、不被重視"], "passion": "傲慢（Pride）", "passiond": "一份「只有我最懂得溫暖你」的自信。它推動他們用心經營每一段重要的關係，令自己在對方心中變得不可取代。", "motive": "以「最重要、最好」的姿態吸引對方，讓對方把自己放在心中第一位並珍而重之，從而感到被愛、被重視", "virtue": "謙卑", "traits": ["生活上可以很獨立，心靈上卻很難「獨自存活」，需要被人當作心愛的那一位。", "很懂得投其所好，對不同的人可以呈現不同的面貌，總能給人想要的溫暖。", "未必喜歡被人依賴；他們會主動揀選自己想付出的對象，而不是誰有需要便幫誰。", "越不健康，越會在人前顯得正面開朗，把失落和受傷藏起來。"], "myth": "坊間常把 2 型看成「無私的助人者」。其實他們的付出背後，是渴望在對方心中佔最重要的位置；論浪漫，2 型往往才是九型中最浪漫的一型。", "healthy": "健康的 2 型能容許「被愛」與「不被愛」都存在：即使不是對方心中的第一位，仍然知道自己被神所愛，可以自由地愛人。", "overview": "第 2 型的人看世界，第一道濾鏡是「我有沒有被愛、被重視」。他們溫暖、細心，很快讀懂別人的心意，也很懂得令人窩心；但他們想要的不只是「幫到你」，而是成為你心中最重要、最好的那一位。推動他們的是一份驕傲——相信只有自己最懂得溫暖你的心。當付出換不到應有的位置，他們便容易受傷，卻仍在人前保持笑容。當他們明白自己早已被神放在心上，便能放下「要做第一位」的需要，謙卑地愛人，也坦然接受別人的愛。", "gifts": ["對人的需要很敏銳，懂得投其所好，令人感到窩心", "用心經營關係，帶來溫暖和家的感覺", "慷慨付出，懂得欣賞和肯定別人", "健康時能把「被愛」的渴求，化為不帶條件地愛人"], "blind": [["卡在「不被重視」的一極", "一感到被忽略便很受傷，即使口裏不說，心裏也耿耿於懷。"], ["以付出換取位置", "付出時暗暗期待在對方心中排第一；換不到便覺委屈。"], ["傲慢的盲點", "相信「只有我最懂你」，卻看不見自己也需要被照顧。"], ["笑容背後的受傷", "越不健康，越在人前表現開朗，令人不知道你其實需要關心。"]], "stress": "壓力大時，卡在「不被重視」的一極，傲慢便由溫暖變成強硬；這時會帶上第 8 型不健康的一面——用力量爭取位置，指責對方不懂感恩，甚至想控制關係。", "growth": "健康時會吸收第 4 型健康的「追求」：轉而追求真實的自己，誠實面對自己的感受和需要；即使不是對方心中的第一位，也知道自己是被愛的。", "tips": ["練習讓「被愛」與「不被重視」並存：即使不是第一位，也提醒自己「我被神所愛」。", "付出前停一停：「這是對方需要的，還是我需要在他心中有位置？」", "練習說「不」，並相信這不會令你失去愛。", "學習開口求助，讓別人也有機會愛你。", "難過時，容許自己在信任的人面前不用笑。"], "verses": [{"k": "約一4:9-10", "why": "你渴求被愛、被重視；這段經文說明愛的源頭——不是我們先愛神、先付出，乃是神先愛我們。你在祂心中的位置，早已不用以付出去換。"}, {"k": "路10:40-42", "why": "馬大忙於伺候，卻問主「你不在意嗎？」——正是卡在「不被重視」的心聲；耶穌溫柔地指出，不可少的只有一件：先坐下領受主的愛，比在人心中爭取位置更重要。"}], "disc": [{"k": "secrecy", "why": "你的傲慢令付出暗暗期待換來位置；隱密的服事換不到任何重視，幫助你鬆開這份期待，單純地愛主愛人。"}, {"k": "solitude", "why": "你常常只看見別人的需要，忽略了自己；獨處讓你離開所有關係，單單領受神的愛，也有空間誠實面對自己的需要（這也是你成長方向第 4 型健康的一面）。"}], "reflect": ["最近我付出時，心裏有沒有暗暗期待在對方心中佔某個位置？", "如果我不是某人心中最重要的一位，我仍然相信自己被愛嗎？", "我有哪一個需要一直沒有說出口？可以向誰說？"], "group": "分享一次你感到「不被重視」的經歷，當時你怎樣反應？小組可以怎樣讓你也有被照顧的空間？"}, "3": {"name": "成功角色（展現）主義", "short": "角色", "alt": "坊間常稱：成就者、實踐者", "centre": "heart", "tag": "在角色中展現自己，渴求以掌聲確認身份", "summary": "目標清晰、適應力強，在不同角色中都能稱職演出，渴望得到掌聲。", "world": ["有角色身份", "沒有角色身份"], "passion": "自負虛誇（Vanity）", "passiond": "一股不停為自己「包裝」的推動力：按角色的需要塑造形象，讓人看見一個成功、稱職的自己。", "motive": "透過外在的掌聲和肯定，確認自己的角色和身份", "virtue": "真誠", "traits": ["目標往往跟角色連在一起：做老師便要像個好老師，做父母便要像個好父母。", "角色常以心中某位「模範人物」為藍本；他們努力追近，卻很少想超越那位模範。", "可以同時擁有多個角色，靈活轉換；投入角色時，連自己也會被說服。", "追求的是「勝利」本身，而不一定是打敗別人；重視能力和效率。"], "healthy": "健康的 3 型能容許「有角色」與「沒有角色」並存：即使台下沒有掌聲，仍然知道自己是誰。", "overview": "第 3 型的人看世界，第一道濾鏡是「我有沒有一個清楚的角色和身份」。在任何場合，他們很快知道自己該扮演甚麼角色，並且演得稱職、出色；角色往往以心中某位模範人物為藍本。推動他們的是不停為自己包裝的「虛誇」，渴望外在的掌聲確認「我是誰」。和 2、4 型一樣，他們較難單靠自己肯定自己。當他們明白自己在神眼中的身份不靠角色和掌聲，便能活出台前幕後一致的真誠，以恩賜榮耀神而不是榮耀自己。", "gifts": ["很快掌握角色的要求，在不同崗位上稱職地發揮", "目標清晰、有效率，能把願景化為行動", "善於學習榜樣，把好的模範活出來", "充滿活力和自信，懂得帶動和激勵別人"], "blind": [["卡在「有角色」的一極", "把價值等同角色和掌聲；一失去位置，便不知道自己是誰。"], ["虛誇的包裝", "只讓人看見成功的一面，久而久之連自己也被形象說服。"], ["忽略感受", "忙於演好角色，把真實的情緒放在一邊。"], ["追近而不超越", "一直模仿心中的模範，卻少問神給自己獨特的呼召是甚麼。"]], "stress": "壓力大時，卡在「沒有角色」的一極，包裝不下去便突然失去動力；這時會帶上第 9 型不健康的一面——把自己忘掉，麻木、拖延，用娛樂和瑣事逃避。", "growth": "健康時會吸收第 6 型健康的「中庸」：不再走極端地追求掌聲，懂得在群體中找到合適的位置，與人合作、關心「我們」的成功；也懂得懷疑形象，回到真實。", "tips": ["練習讓「有角色」與「沒有角色」並存：每天留幾分鐘，除去角色，問自己真實的感受。", "刻意做一些沒有人看見、也不會被評分的事。", "在信任的人面前分享自己的失敗和軟弱。", "寫下神對你身份的宣告：你是神的兒女，這身份不靠角色。", "問自己：「我心中的模範是誰？我在跟隨他，還是跟隨基督？」"], "verses": [{"k": "西3:1-3", "why": "你渴求以角色確認「我是誰」；保羅說你的生命已與基督一同藏在神裏面——你最深的身份是隱藏在祂裏面的，不靠台前的角色和掌聲。"}, {"k": "撒上16:7", "why": "虛誇令你不斷包裝外在的形象；神卻說人看外貌、耶和華看內心——在祂面前，你可以除下包裝。"}], "disc": [{"k": "centering", "why": "你很難離開「有角色」的一極；歸心禱告沒有角色、沒有觀眾，也沒有表現可言，讓你經歷：不扮演任何角色，你仍然被神所愛。"}, {"k": "confession", "why": "你較少讓人看見失敗和真實的感受；坦誠認罪與問責培養你被忽略的「真誠」，讓你在「沒有角色」的時候也被接納。"}], "reflect": ["如果明天失去了所有角色和頭銜，我會怎樣看自己？", "我心中的模範人物是誰？我是在跟隨他，還是在跟隨基督？", "最近我有沒有為了形象，說了或做了不完全真實的事？"], "group": "分享一件你沒有做好、卻從中學到功課的事。組員可以怎樣肯定「你這個人」，而不只是你的角色？"}, "4": {"name": "個人（追求）主義", "short": "追求", "alt": "坊間常稱：自我者、浪漫者、藝術家", "centre": "heart", "tag": "總在追求的路上，渴求以超越讓自己不停前進", "summary": "有強烈的追求感和好勝心；「不足」的感覺是推動他們前進的燃料。", "world": ["追求中", "停頓下來"], "passion": "妒忌比較（Envy）", "passiond": "一股不斷與「你」比較的推動力。這個「你」可以是一個人、一套制度，甚至一種生活態度；他們暗暗盼望對方有所失，好讓自己勝過它。", "motive": "透過超越心中比較的對象，讓自己持續感到仍在追求、仍在前進", "virtue": "知足平衡", "traits": ["追求的是「正在追求」的感覺：1 型追求對，2 型追求愛，3 型追求掌聲，4 型追求的是「追求」本身。", "「欠缺」的感覺不一定是負面的，反而是推動他們前進的燃料。", "好勝心很強，但那是「超越式」的贏，與 3 型追求勝利、8 型追求全勝不同；心中常有一個想像的對手。", "自我要求很高，有時看來像 1 型；不健康時，甚至會在「誰更差、誰更慘」上比較。"], "myth": "坊間常說 4 型「喜歡憂傷、追求與眾不同」。按這套理解，憂傷並不是 4 型的核心；真正推動他們的，是那份不停追求、要超越的感覺。", "healthy": "健康的 4 型能容許「追求」與「停頓」並存：可以停下來安息、知足，而不覺得自己失去了方向。", "overview": "第 4 型的人看世界，第一道濾鏡是「我是否仍在追求」。一停下來，他們便覺得不對勁；心中那份「還欠一點」的感覺，正是推動他們前進的燃料。推動他們的是「妒忌比較」：心中總有一個要超越的對象，可能是某個人、某種制度或一種生活方式。他們是九型中最好勝的一群，卻不是要打敗人，而是要「超越」。這份力量是一把雙刃劍：用得好，帶來創意、深度和不斷的進步；用得不好，便陷入無止境的比較和不滿足。當他們明白自己是神奇妙的創造，在基督裏已經完整，便能在追求之中也學會知足和安息。", "gifts": ["有強大的推動力和上進心，不甘停滯", "自我要求高，追求深度和質素", "能看見現狀的不足和更好的可能，富有創意", "好勝而有韌力，願意一次又一次再出發"], "blind": [["卡在「追求中」的一極", "一停下來便不安，難以安息，也難以享受已經擁有的。"], ["無止境的比較", "總有一個要超越的對象，很難真正滿足。"], ["暗中的妒忌", "對比較的對象暗暗盼望他有所失，令關係變得緊張。"], ["在「差」上比較", "不健康時，甚至會比較誰更不幸、誰更辛苦。"]], "stress": "壓力大時，害怕「停頓下來」，便轉向在人身上追求；這時會帶上第 2 型不健康的一面——過度依附和討好，要從別人的重視中證明自己仍在前進。", "growth": "健康時會吸收第 1 型健康的世界觀：把追求放在清楚而「對」的方向上，有紀律、有原則地一步一步走；不再為了超越別人而追，而是為了做對的事。", "tips": ["練習讓「追求」與「停頓」並存：每星期安排一段甚麼也不追求的安息時間。", "察覺自己與人比較時，為對方的好祝福和感恩。", "每天記錄三件已經擁有的美好，練習知足。", "問自己：「我想超越的對象是誰？神要我追求的又是甚麼？」", "建立簡單而穩定的生活節奏，讓「停下來」也成為習慣。"], "verses": [{"k": "腓3:12-14", "why": "你天生是追求的人；保羅也「竭力追求」，但他追求的不是超越某人，而是基督耶穌所以得着他的——你的追求可以在神裏找到真正的方向和獎賞。"}, {"k": "羅12:15-16", "why": "妒忌比較會令人暗暗盼望對方有所失；經文邀請你與喜樂的人同樂、與哀哭的人同哭——為對方的好真心歡喜，正是妒忌的解藥。"}], "disc": [{"k": "gratitude", "why": "你的目光常落在「還欠甚麼、要超越誰」；感恩日記鬆開無止境的比較，讓你看見已經擁有的，在追求之中學會知足。"}, {"k": "hours", "why": "你最怕「停頓下來」；定時祈禱讓你每天按時停下、回到神面前，練習被你忽略的一極，經歷停頓也是安全的。"}], "reflect": ["我心中最常比較、想超越的對象是誰？", "如果我停下來不再追求，我害怕會失去甚麼？", "今天有哪一件已經擁有的美好，值得我感恩？"], "group": "分享一件你一直在追求、卻很難滿足的事。組員可以怎樣幫助你看見神已經給你的恩典？"}, "5": {"name": "資源效益（計算）主義", "short": "資源", "alt": "坊間常稱：觀察者、思考者", "centre": "head", "tag": "精打細算，渴求以最少付出換取資源豐盛", "summary": "冷靜、善於計算，重視資源的效益，習慣在旁觀察而不輕易投入。", "world": ["資源豐盛", "資源缺乏"], "passion": "貪婪（Avarice）", "passiond": "一股「節省」加上「攝取」的推動力：盡量不讓自己的時間、精力、金錢和感情流失，同時把有用的資源收歸己有。", "motive": "透過計算資源的效益，並防止外界向自己索取資源，達至資源豐盛的狀態", "virtue": "不執著（敞開與分享）", "traits": ["凡事先計算「值不值得」，希望用最少的付出換取最大的效益；只要計得過，也樂意做善事。", "知識只是其中一種資源；不同的 5 型因成長背景不同，看重的資源也不一樣。", "對認定是「自己人」的人並不吝嗇，因為那等同照顧自己的資源。", "因為計算，較少投放感情和自己，於是常以旁觀者的身份，抽離地觀察。"], "myth": "坊間常把 5 型形容為「渴求知識的人」。按這套理解，知識只是資源的一種；5 型真正在意的，是資源的效益和豐盛。", "healthy": "健康的 5 型能容許「豐盛」與「缺乏」並存：即使資源有限，仍然願意分享，因為相信神是豐富的供應者。", "overview": "第 5 型的人看世界，第一道濾鏡是「資源夠不夠」。時間、精力、金錢、知識、感情，都是要好好計算的資源；他們很自然地問「這樣做划不划算」，希望用最少的付出得到最多。推動他們的是「貪婪」——不是要奢華，而是緊守自己的、收集有用的，並防止別人不斷索取。因此他們冷靜、客觀、不浪費，常能看見別人忽略的全局；但也容易站在一旁觀察，不輕易把感情和自己投入。當他們明白神是豐富的供應者，便能放下緊握，勇敢地把自己和所有的分享出來。", "gifts": ["精打細算，善用時間、金錢和精力，以最少的付出達到最大的效果", "冷靜客觀，在壓力和危機中保持清晰", "能看見全局和別人忽略的細節", "對「自己人」忠心慷慨，是可靠的支援"], "blind": [["卡在「缺乏」的一極", "總覺得資源不夠；被要求付出時，會本能地退後。"], ["只觀察不參與", "站在旁邊看，遲遲不投入行動和關係。"], ["節省感情", "少投放感情和自己，令身邊的人覺得冷淡、難以接近。"], ["計算過了頭", "凡事先問值不值得，錯過了不能計算的恩典和關係。"]], "stress": "壓力大時，卡在「資源缺乏」的一極，便急於攝取更多；這時會帶上第 7 型不健康的一面——思緒分散，不停收集新資訊和新刺激，卻逃避真正要面對的事。", "growth": "健康時會吸收第 8 型健康的力量：把收藏的資源化為實際行動，果斷地投入，並用自己所有的去保護和幫助別人，不再只在旁觀察。", "tips": ["練習讓「豐盛」與「缺乏」並存：每星期刻意慷慨地分享一次時間、金錢或知識。", "留意自己何時在計算，問：「這件事可以不計算嗎？」", "在信任的人面前說出感受，而不只是想法。", "參與一項需要身體力行的服事，即使覺得自己未準備好。", "擴闊「自己人」的圈子，讓更多人得到你的資源。"], "verses": [{"k": "腓4:19", "why": "你渴求資源豐盛，總怕不夠；保羅應許神必照祂榮耀的豐富，使你一切所需用的都充足——真正的豐盛來自供應者，而不是你的精打細算。"}, {"k": "箴11:24-25", "why": "貪婪令你緊守資源、凡事計算；智慧書卻說施散的反更增添、吝惜過度的反致窮乏——打開手，才經歷真正的豐裕。"}], "disc": [{"k": "generosity", "why": "你最容易卡在「資源缺乏」的一極；慷慨施予讓你不先計算回報地付出，親身經歷神的供應，鬆開對資源的緊握。"}, {"k": "hospitality", "why": "你習慣在旁觀察，少投放感情；款待與團契培養你被忽略的參與，把資源和自己帶進群體，擴闊「自己人」的圈子。"}], "reflect": ["我最緊守的資源是甚麼（時間、金錢、精力、感情）？為甚麼？", "我在甚麼時候會在情感上抽離？身邊的人有甚麼感受？", "如果神是豐富的供應者，我可以放開手分享甚麼？"], "group": "分享一件你一直在「計算」卻未行動的事。組員可以怎樣陪你踏出第一步？"}, "6": {"name": "中庸（懷疑）主義", "short": "中庸", "alt": "坊間常稱：忠誠者、懷疑者", "centre": "head", "tag": "以懷疑拉住極端，渴求回到中間的平衡", "summary": "審慎、重視平衡和位置，對任何太絕對的事都會本能地懷疑。", "world": ["中庸、相對", "極端、絕對"], "passion": "怯懦恐懼（Cowardice）", "passiond": "一股同時帶着「推」與「拉」的推動力：推力令人向前對抗，拉力令人退後逃避，兩股力量在心裏交替出現。", "motive": "以懷疑去否定任何正面或負面的極端，讓自己回到中間的位置", "virtue": "勇氣", "traits": ["懷疑本身是中性的，甚至是正面的：它幫助人看見盲點、避開風險。", "對位置很敏感：落後時會推自己向前，走得太前時又會拉自己回來；不想做第一，也不想做最後。", "同一個人身上同時有「對抗」與「逃避」兩種反應，不必再把 6 型分成兩種人。", "對權威又愛又恨，很在意權威有沒有盡本份，彷彿一邊想向前、一邊又拉住自己；但太過中庸本身也是一種極端，壓抑太久可能突然反彈。"], "myth": "坊間常說 6 型「怕事、缺乏安全感」，又把他們分為「恐懼型」與「反恐懼型」。按這套理解，有恐懼不等於是 6 型；而推與拉兩種反應，其實同時存在於每一位 6 型身上。", "healthy": "健康的 6 型能容許「中庸」與「極端」並存：有時也能全心投入、站在前面，而不必時刻拉住自己。", "overview": "第 6 型的人看世界，第一道濾鏡是「這樣會不會太極端」。任何說得太絕對、走得太前或跌得太後的事，都會引起他們本能的懷疑；他們最安心的位置，是不前不後的中間。推動他們的是一股「怯懦恐懼」，裏面同時有向前對抗的推力和向後逃避的拉力。因此他們審慎、重視平衡、能預見風險，對權威既想依靠又會監察。這份懷疑本是中性的恩賜；但若時刻拉住自己，便難以全心委身。當他們把安全感建立在神的信實上，便能從反覆拉扯走向勇氣，安然信靠。", "gifts": ["審慎周全，能預見風險，善於策劃和預備", "重視平衡，能在兩極之間找到中肯的位置", "會留意權威是否盡責，為群體把關", "忠心可靠，一旦委身便有承擔"], "blind": [["卡在「中庸」的一極", "怕走極端，以致難以全心投入和委身。"], ["時刻拉住自己", "剛想向前便懷疑，推與拉不停交替，令自己很累。"], ["對權威又愛又恨", "有時很想依靠，有時又強烈質疑，令人摸不著頭腦。"], ["壓抑後的反彈", "太久保持中庸，壓下的推力可能突然走向另一個極端。"]], "stress": "壓力大時，拉扯太久而失去中間的位置，推力便突然變強；這時會帶上第 3 型不健康的一面——急於表現、過度忙碌，以角色和成績掩蓋心裏的不安。", "growth": "健康時會吸收第 9 型健康的「存在」：放下時刻的拉扯，安然地融入群體和神的看顧之中；不必監察每一件事，也能自在地「在」。", "tips": ["練習讓「中庸」與「極端」並存：試一次全心投入、站在前面，或安心地落在後面。", "懷疑出現時，寫下來並問：「這是審慎，還是怯懦？」", "記錄神過去的信實，在拉扯時重溫。", "作小決定時，練習相信自己的判斷。", "把對未來的擔憂化為具體的禱告。"], "verses": [{"k": "賽26:3-4", "why": "你渴求在中庸的位置得到安穩；先知說堅心倚賴神的，祂必保守他十分平安——你真正的安穩在永久的磐石，而不在不前不後的位置。"}, {"k": "提後1:7", "why": "怯懦恐懼令你在推與拉之間拉扯；保羅說神賜的不是膽怯的心，乃是剛強、仁愛、謹守的心——勇氣與謹守（中庸）可以同時並存。"}], "disc": [{"k": "breath", "why": "當懷疑和「萬一」令你在推與拉之間不停拉扯，呼吸禱告讓你隨時回到神面前，把拉扯交給祂，鬆開時刻拉住自己的力量。"}, {"k": "direction", "why": "你對權威又愛又恨，也難以全心委身；屬靈指導與同行讓你在一段健康的關係中學習信任，並在神面前作出決定、踏前一步。"}], "reflect": ["最近令我反覆拉扯的是甚麼事？我可以怎樣把它交託給神？", "我對身邊的權威（包括教會的領袖）有甚麼又愛又恨的感受？", "神過去有哪些具體的信實，值得我記念？"], "group": "分享一件令你在「向前」與「退後」之間拉扯的事。組員可以怎樣陪伴你，而不只是給你意見？"}, "7": {"name": "自我（享受）主義", "short": "享受", "alt": "坊間常稱：熱情者、享樂者", "centre": "head", "tag": "追求更多美好的享受，渴求自我感覺良好", "summary": "樂觀、懂得享受，不斷尋找更多樂趣和刺激，對「乏味」特別敏感。", "world": ["享受", "捱苦"], "passion": "貪吃（Gluttony）", "passiond": "一股停不下來的「想要更多」：像好胃口的人不斷品嚐，把一個又一個美好的經歷吸收進來。", "motive": "不停尋找更多樂趣、刺激和正面的享受，保持自我感覺良好", "virtue": "節制", "traits": ["追求「自我感覺良好」，喜歡展示自己好的一面，有時看來像 3 型。", "只要過程享受，可以非常努力和持久，並不一定是「三分鐘熱度」或膚淺。", "懂得先苦後甜：為了之後的享受，可以先忍受辛苦。", "難過時反而玩得更多，把痛苦鎖進心底的箱子；即使幫人，也常不自覺地以自己的感受為中心。"], "myth": "坊間常把 7 型看成「貪玩、膚淺、不能堅持」。其實只要仍然享受，他們可以很專注、很能捱；他們真正逃避的，是乏味和被困住。", "healthy": "健康的 7 型能容許「享受」與「捱苦」並存：願意留在痛苦和平淡中，而不急於逃走，也能在其中與神相遇。", "overview": "第 7 型的人看世界，第一道濾鏡是「這是享受，還是捱苦」。他們樂觀、反應快、充滿點子，總能在事情中找到樂趣，也很懂得讓自己和別人感覺良好。推動他們的是「貪吃」——不是指食物，而是對美好經歷停不下來的胃口。他們對乏味、受限制和沒有選擇特別敏感；難過時，傾向用更多的開心事把痛苦收起來。只要仍然享受，他們其實可以非常投入和堅持。當他們在神裏面找到真正的滿足，便能從「永遠想要更多」走向節制，深深地享受當下，也敢於面對痛苦。", "gifts": ["樂觀開朗，為人帶來希望和喜樂", "創意豐富、反應快，善於想出新方法", "投入享受的事時，有驚人的幹勁和堅持", "懂得先苦後甜，能帶動群體一同捱過艱難"], "blind": [["卡在「享受」的一極", "一覺得苦便想離開，把痛苦鎖在心底，不肯停下來面對。"], ["對乏味過敏", "一覺得沉悶便想轉換，錯過了需要耐性才得到的祝福。"], ["貪吃式的想要更多", "一個經歷未完已想下一個，衝動地答應或購買，事後負擔太重。"], ["不自覺的自我中心", "連幫助人也以自己感覺良好為先，未必察覺別人真正的需要。"]], "stress": "壓力大時，被迫留在「捱苦」的一極，便變得煩躁；這時會帶上第 1 型不健康的一面——挑剔、急躁，覺得是別人和環境「錯」了，害自己不能享受。", "growth": "健康時會吸收第 5 型健康的「節省」：不再貪多，懂得專注在一件事上深入發掘；安靜下來，連捱苦和平淡也願意面對。", "tips": ["練習讓「享受」與「捱苦」並存：想逃避時停一停，問自己：「我在避開甚麼感受？」", "開始新計劃前，先完成手上一項。", "每天留一段安靜時間，不計劃、不找刺激。", "學習在痛苦中與神同在，閱讀詩篇中的哀歌。", "幫助人時問：「對方真正需要的是甚麼？」而不只是「我覺得怎樣好」。"], "verses": [{"k": "詩16:11", "why": "你渴求更多美好的享受；詩人說在神面前有滿足的喜樂、在祂右手中有永遠的福樂——你最深的享受，原來在祂裏面。"}, {"k": "腓4:11-13", "why": "貪吃式的「想要更多」令你逃避捱苦；保羅卻在飽足和飢餓、有餘和缺乏中都學會知足——「享受」與「捱苦」都可以在基督裏並存。"}], "disc": [{"k": "fasting", "why": "你最容易卡在「享受」的一極；禁食讓你自願留在一點「捱苦」之中，把貪吃式的胃口轉化為對神的渴慕。"}, {"k": "simplicity", "why": "你常常一個未完已想下一個；簡樸與專注培養你的節制，一次只深入一件事，也是你成長方向（第 5 型）健康的一面。"}], "reflect": ["我最近在逃避哪一種不舒服的感受？", "甚麼情況會令我覺得「乏味」而想離開？神可能在其中給我甚麼？", "如果今天不能有任何新鮮的經歷，我仍然可以喜樂嗎？"], "group": "分享一件你一直逃避去面對的事。組員可以怎樣陪你一同停下來？"}, "8": {"name": "力量強者（保護）主義", "short": "強者", "alt": "坊間常稱：挑戰者、領袖、保護者", "centre": "gut", "tag": "遇強越強，以力量保護弱者，渴求感到自己夠強", "summary": "意志堅強、好勝、重視力量，會挺身保護弱小，有領袖的氣魄。", "world": ["強（勝利）", "弱（挫敗）"], "passion": "重口味（Lust）", "passiond": "一股要「更多、更大、更強、更重」的推動力：做事全情投入、不留餘地，很少先想後果。", "motive": "在「遇強越強」和「保護弱者」的爭戰中，持續感到自己是強的", "virtue": "純真（溫柔的心）", "traits": ["好勝心強，追求的是徹底的「全勝」，與 4 型的超越式贏法不同。", "因為重視強、對弱很敏感，所以會挺身保護弱者，自然形成領袖的心態。", "他們最敏感的「弱」，首先是自己的生命，所以時刻保持警覺，不輕易讓人看見軟肋。", "把世界看成一個要靠實力生存的森林；保護別人的同時，其實也在保護自己。"], "healthy": "健康的 8 型能容許「強」與「弱」並存：敢於在信任的人面前示弱，明白溫柔也是一種力量。", "overview": "第 8 型的人看世界，第一道濾鏡是「強」與「弱」。對手越強，他們越興奮；看見弱小被欺負，他們會挺身而出。推動他們的是「重口味」——做甚麼都要夠份量、夠強烈，全力以赴，很少先想後果。他們剛強、直接、有魄力，天生有領袖氣質，是群體在困難中的支柱。然而，他們對自己的軟弱最敏感，因此時刻防備，不輕易讓人走近；力量用得不好，便會令人感到壓迫。當他們明白真正的力量在於溫柔和服事，便能以強大的心守護人，以謙卑展現基督的大能。", "gifts": ["有魄力、果斷，敢於承擔和帶領", "重視公義，勇於保護弱勢", "直接坦率，說話清楚、不轉彎", "有毅力，遇強越強，在逆境中越戰越勇"], "blind": [["卡在「強」的一極", "認為示弱就是輸，難以向人敞開內心的傷痛。"], ["重口味", "做事、說話都「去到盡」，事後才看見對人的傷害。"], ["過於強勢", "不自覺地主導局面，令別人不敢表達意見。"], ["時刻防備", "把世界看成戰場，難以放心信任和接受別人的帶領。"]], "stress": "壓力大時，害怕被人看見「弱」，便退回自己的堡壘；這時會帶上第 5 型不健康的一面——封閉、獨自計算，緊守資源，對人冷淡和不信任。", "growth": "健康時會吸收第 2 型健康的愛：把力量化為溫暖的關顧，懂得體會人的心意；不只保護弱者，也讓人可以親近自己。", "tips": ["練習讓「強」與「弱」並存：向一位信任的人分享一次自己的軟弱。", "察覺怒氣上升時，先停十秒，問：「我在保護甚麼？」", "作決定前，先邀請別人表達意見，耐心聆聽。", "做事前想一想：「這樣做的後果是甚麼？有需要去到盡嗎？」", "每天做一件溫柔的小事，經歷溫柔也是力量。"], "verses": [{"k": "林後12:9-10", "why": "你渴求感到自己是強的；神對保羅說祂的能力在人的軟弱上顯得完全——「我甚麼時候軟弱，甚麼時候就剛強了」，強與弱在恩典中可以並存。"}, {"k": "可10:42-45", "why": "重口味的力量容易變成「操權管束」；耶穌重新定義強者：誰願為首，就必作眾人的僕人——真正的力量是用來服事人。"}], "disc": [{"k": "submission", "why": "你最容易卡在「強」的一極，想主導一切；順服與退讓讓你刻意讓別人帶領，經歷放下控制並不等於失敗。"}, {"k": "serve_weak", "why": "你本來就有保護弱者的心；服事軟弱的人讓這份力量化為溫柔（你成長方向第 2 型健康的愛），也讓你學習接納自己的「弱」。"}], "reflect": ["我最近一次發怒，背後其實在保護甚麼？", "有誰在我面前不敢說真話？為甚麼？", "如果溫柔也是力量，我今天可以怎樣溫柔地對待一個人？"], "group": "分享一次你覺得「示弱很難」的經歷。組員可以怎樣成為你可以放心敞開的地方？"}, "9": {"name": "存在的（忘我）主義", "short": "存在", "alt": "坊間常稱：和平者、調停者", "centre": "gut", "tag": "在忘我中尋找存在感，渴求「無我之中仍有我」", "summary": "隨和、容易融入，寧願忘記自己，卻非常在意自己是否被尊重。", "world": ["無我中有我", "有我中無我"], "passion": "怠惰（Sloth）", "passiond": "一種「忘我」和懶於動腦的狀態：懶得思考自己的立場和喜好，寧願依循習慣、框架或別人的意見。", "motive": "透過忘我，把自己融入第三者（習慣、制度、群體或別人的立場）之中，從而找到自己的存在感", "virtue": "積極行動", "traits": ["對「被尊重」非常敏感；內心深處其實知道，最不尊重自己的正是自己，所以對自己的怒氣很大。", "心裏「有我」與「無我」不斷拉扯，因此內在並不真正平和。", "常以退為進：表面接受意見，態度卻沒有改變；或乾脆「消失」、「hang 機」。表達怒氣太「有我」，不表達又太「無我」。", "很少為自己爭取，卻可以為別人非常進取；可以做配角，但不能被當作可有可無。健康的 9 型胸襟廣闊，是真正的領袖。"], "myth": "坊間常稱 9 型為「和平型」。按這套理解，9 型心裏「有我」和「無我」不斷拉扯，內在其實並不和平，也常被視為最難明白的一型；所以本工具不再以「和平者」作主要名稱。", "healthy": "健康的 9 型能容許「有我」與「無我」並存：敢於說出自己的立場，也能真心包容別人。", "overview": "第 9 型的人看世界，第一道濾鏡是「我在不在」。他們很容易把自己融入習慣、制度、群體或別人的立場之中，好像忘記了自己；但在這份忘我裏，他們其實渴望找到自己的存在感。推動他們的是「怠惰」——不是懶惰做事，而是懶得花心思想清楚自己要甚麼。因此他們隨和、包容，能看見每一方的觀點；但被忽略、不被尊重時，心裏會非常憤怒，常以表面順從、內裏不變的方式回應。當他們明白自己在神眼中被看見、被尊重，便能從忘我走向積極行動，真正成為使人和睦、有胸襟的領袖。", "gifts": ["包容、接納，令人感到安心和被尊重", "能看見不同觀點，善於調和與連結人", "為別人和群體可以非常進取和忠心", "穩定、有耐性，胸襟廣闊，有真正領袖的潛質"], "blind": [["卡在「無我」的一極", "太習慣融入別人和習慣，以致不清楚自己想要甚麼、被呼召做甚麼。"], ["怠惰", "懶得花心思想清楚立場，忙於次要的瑣事和慣常的做法。"], ["以退為進", "表面同意，內裏卻默默抗拒，或乾脆「消失」，令人摸不著頭腦。"], ["對自己的怒氣", "很在意被尊重，卻常常不尊重自己，怒氣藏在心底。"]], "stress": "壓力大時，忘我太久，存在感變得模糊；這時會帶上第 6 型不健康的一面——焦慮、多疑，在不同意見之間來回拉扯，難以作決定。", "growth": "健康時會吸收第 3 型健康的「角色」：清楚神給自己的角色，積極行動，為自己的立場發聲，在群體中「有我」地參與。", "tips": ["練習讓「有我」與「無我」並存：每天問自己「我真正想要的是甚麼？」並把它寫下來。", "練習說出自己的意見，即使只是「我想吃中菜」這樣的小事。", "不同意時，誠實地說出來，而不是表面答應、內裏不變。", "把重要的事排在一天最前，先做最重要的。", "相信你的聲音也重要——神在群體中需要「有你」的參與。"], "verses": [{"k": "賽43:1", "why": "你渴求在無我之中仍然有我；神說「我曾提你的名召你，你是屬我的」——你的存在在神眼中清清楚楚，不會因融入別人而消失。"}, {"k": "弗5:15-17", "why": "怠惰令你懶得想清楚立場，被習慣和瑣事帶走；保羅提醒要謹慎行事、愛惜光陰、明白主的旨意——醒覺過來，為神給你的位置積極行動。"}], "disc": [{"k": "journal", "why": "你常把自己收起來，連自己想要甚麼也不清楚；屬靈日記幫助你聽見被忘記的自己，寫下立場和渴求，在神面前「有我」。"}, {"k": "examen", "why": "你容易被習慣和別人的立場帶走；省察禱告每天早晚在神面前分辨最重要的事，鬆開怠惰的慣性，練習積極行動。"}], "reflect": ["最近一次我說「無所謂」，其實心裏想要的是甚麼？", "甚麼時候我覺得自己不被尊重？我又有沒有尊重自己？", "我在哪些關係中為了融入而放下了真實的自己？"], "group": "分享一件你想說卻沒有說出口的意見。組員可以怎樣鼓勵你表達「有我」的自己？"}}, "centres": {"gut": {"n": "行動智慧中心", "full": "行動經驗智慧中心", "s": "行", "types": [8, 9, 1], "way": "先從「做」和親身經驗去認識世界", "d": "這個中心的人，主要透過行動和身體的經驗去理解事情：做過、經歷過，才算真正明白。他們重視事實，也重視你實際「做了甚麼」，多於你說了甚麼或感覺如何。8、9、1 型屬於這個中心——8 型以力量面對世界，9 型把自己融入其中，1 型以心中的標準修正它。", "rel": ["多講事實，少講空泛的道理；用行動表達關心，比言語更有說服力。", "教導或解釋時，按部就班，讓他們一步一步親身試做。", "一起做事、一起經歷，是與他們建立關係最好的方法。"]}, "heart": {"n": "情感智慧中心", "full": "情感智慧中心", "s": "情", "types": [2, 3, 4], "way": "先從感受和人與人之間的交流去認識世界", "d": "這個中心的人，主要透過情感的交流去理解事情：氣氛對不對、別人怎樣回應，都直接影響他們。他們重視一件事對人「有沒有意義」。2、3、4 型屬於這個中心，三者都不太容易單靠自己肯定自己——2 型渴求被愛，3 型渴求掌聲，4 型渴求仍在追求。", "rel": ["營造支持和接納的氣氛；你的表情和語氣，往往比內容更影響他們。", "送禮或表達關心時，重點是心思和意義，而不是價錢。", "多給真誠的肯定和回應，幫助他們看見自己的價值。"]}, "head": {"n": "思考智慧中心", "full": "思考認知智慧中心", "s": "思", "types": [5, 6, 7], "way": "先從想法、分析和邏輯去認識世界", "d": "這個中心的人，主要透過思考和概念去理解事情：要先在腦中想通、說得出道理，才會安心行動。他們喜歡交流想法，也重視有人陪伴一起思考。5、6、7 型屬於這個中心——5 型計算資源的效益，6 型以懷疑保持中庸，7 型尋找更多的享受。", "rel": ["多分享想法和理由；例如一同計劃一次旅行，讓他們參與構思和比較。", "陪伴比說教重要；你自己的焦慮和不安，會很容易感染他們。", "給他們時間消化和提問，尊重他們先想清楚才行動。"]}}, "inst": {"SP": {"n": "自保", "full": "自保本能（SP）", "d": "自保本能令一型的激情原動力和渴求，主要落在「生活的根基」上：身體、健康、金錢、住所和家。健康時踏實、穩重、懂得照顧；卡住時，容易把世界觀的「負」一極放大成生活上的憂慮、囤積或不願冒險。"}, "SO": {"n": "社交", "full": "社交本能（SO）", "d": "社交本能令一型的激情原動力和渴求，主要落在「群體」上：在團體中的位置、角色、規範和歸屬。健康時有承擔、善於連結人；卡住時，容易太在意自己在群體中的位置，或為群體而忘記自己。"}, "SX": {"n": "一對一", "full": "一對一本能（SX）", "d": "一對一本能令一型的激情原動力和渴求，主要落在「一個特定的人或一件事」上，追求深入而強烈的連結。健康時熱情、投入、帶來生命力；卡住時，容易把渴求全押在一個人身上，變得佔有或在平淡中感到空虛。"}}, "disc": {"breath": {"n": "呼吸禱告（耶穌禱文）", "i": "i-dove", "d": "源自東方教父的「耶穌禱文」：配合呼吸，簡短地呼求主名，可以隨時隨地進行。當心裏的推與拉不停交替時，它幫助我們回到神面前，把拉扯交給祂。", "s": ["選一句短禱，例如吸氣時說「主耶穌基督」，呼氣時說「求你憐憫我」；或「堅心倚賴你」／「你必保守我平安」。", "每天早上先慢慢呼吸十次，配合禱詞。", "每當懷疑、「萬一」或想退後的念頭出現，停一停，用三次呼吸禱告回應。", "睡前把今天令你拉扯的事逐一說出，每說一件，就用呼吸禱告交給神。", "一星期後留意：心裏的推與拉有沒有安靜一點？"]}, "celebration": {"n": "慶祝與享受", "i": "i-star", "d": "慶祝是教會傳統中的一項操練：刻意為神的美善歡喜快樂，享受祂所賜的好東西。它不是獎勵做得好的人，而是回應神白白的恩典。", "s": ["每星期選一件已經「足夠好」的事（不必完美），用一頓飯、一首詩歌或一次散步慶祝它。", "為一件純粹享受、不為改善的事預留時間，例如欣賞音樂、品嚐美食或與朋友談天。", "享受時留意心中「還有地方未做好」的聲音，告訴自己：「主喜悅我享受祂的恩典。」", "與家人或組員分享一件值得感恩的事，一同向神說謝謝。", "月底回顧：容許自己享受，怎樣改變了你看「對」與「錯」的眼光？"]}, "centering": {"n": "歸心禱告", "i": "i-candle", "d": "一種源自默觀傳統、「不做甚麼」的禱告：安靜地在神面前，不用說話，也不用表現，只是單純地與祂同在，讓心歸回神。在這裏沒有角色，也沒有觀眾。", "s": ["每天選一個時段，安靜地坐下，計時十五至二十分鐘。", "選一個簡單的禱詞，例如「主」或「阿爸」，作為心歸向神的記號。", "當腦中出現待辦事項、目標或別人對你的評價時，輕輕回到那個禱詞。", "不需要「禱告得好」或有甚麼收穫，只是安靜地在神面前。", "結束時默想：「我的生命與基督一同藏在神裏面；不扮演任何角色，我仍然被愛。」"]}, "confession": {"n": "坦誠認罪與問責", "i": "d-confession", "d": "找一位可信任、成熟的屬靈同伴，定期坦誠分享自己的掙扎、失敗和真實的感受。雅各書提醒我們要彼此認罪、互相代求。這操練幫助我們放下包裝，活出真誠。", "s": ["禱告求神帶領你找一位可信任、能保守秘密的同伴。", "約定每兩星期見面一次，每次約一小時。", "分享時不只講成就，也要講失敗、懼怕和沒有角色時的感受。", "留意自己想「包裝」的時候，嘗試說出更真實的版本。", "彼此代禱，並一同記念：在基督裏，我們不用靠形象被接納。"]}, "direction": {"n": "屬靈指導與同行", "i": "d-direction", "d": "定期與一位成熟、可信任的屬靈導師或同行者傾談，一同分辨神在生命中的帶領。這操練讓我們在一段健康的關係中，學習信任屬靈的帶領，也學習信任自己在神面前的判斷。", "s": ["禱告後，邀請一位你尊敬、成熟的信徒或牧者，每月與你傾談一次。", "每次帶着一件令你反覆拉扯的事，坦誠說出你的推力和拉力。", "留意自己對這位同行者「又想依靠、又想質疑」的感受，也可以坦白說出來。", "一同禱告後，為這件事定下一個具體、可行的小決定，然後去做。", "下次見面時回顧：在神面前作了決定之後，發生了甚麼？"]}, "examen": {"n": "省察禱告", "i": "d-examen", "d": "源自依納爵的省察禱告：每天花十分鐘，在神面前回顧一天，看見神的同在，也看見自己的選擇。它幫助我們從被習慣帶走的生活中醒覺過來，分辨甚麼是最重要的事。", "s": ["早上先求神指示：「今天你要我先做的一件重要的事是甚麼？」把它寫下來。", "晚上找一個安靜的地方，求聖靈帶領你回顧今天。", "留意今天哪些時間被習慣、瑣事或別人的立場帶走了。", "留意今天哪一刻你清楚地「有我」：說出了意見、作了決定、做了重要的事，為此感謝神。", "以一句禱告結束：「主，明天我願意在你面前活出你給我的位置。」"]}, "fasting": {"n": "禁食", "i": "d-fasting", "d": "在一段時間內，自願放下食物或某些享受（例如社交媒體、購物、娛樂），把騰出來的渴求轉向神。禁食讓我們發現：沒有更多的享受，神仍然是我們的滿足。", "s": ["由簡單開始：選一餐不吃，或一天不用社交媒體、不購物。", "在原本享受的時間，改為讀經和禱告。", "留意不舒服或煩躁的感覺，不急於逃開，對神說：「主，我想要的，其實是你。」", "把禁食所省下的金錢捐給有需要的人。", "結束後寫下：留在一點「捱苦」之中，你經歷到甚麼？"]}, "generosity": {"n": "慷慨施予", "i": "i-gift", "d": "有計劃地把時間、金錢和知識分給別人，不先計算回報。施予的操練打破「資源缺乏」的恐慌，讓我們親身經歷神豐富的供應。", "s": ["每月預留一筆固定的金錢或時間，專門用來施予，作為給神的第一份。", "選擇一位有需要的人或一個事工，在不計算「值不值得」的情況下給予。", "留意心裏「不夠用」、「之後怎辦」的聲音，把它帶到神面前，讀腓立比書 4:19。", "嘗試慷慨地分享你的知識或技能，例如教人一樣你擅長的事。", "月底回顧：付出之後，你真的變得缺乏了嗎？神怎樣供應你？"]}, "gratitude": {"n": "感恩日記", "i": "d-gratitude", "d": "每天記錄神在平凡生活中已經賜下的恩典。這個操練把目光從「還欠甚麼、要超越誰」轉向「已經擁有甚麼」，在追求之中學會知足。", "s": ["準備一本小簿，放在床邊。", "每晚寫下三件今天已經擁有、平凡但美好的事，而不只是特別的經歷。", "當你察覺自己與人比較時，寫下對方一件值得高興的事，並為他祝福。", "寫下一件神給你獨特的恩典，提醒自己不必靠超越別人才有價值。", "每月重讀一次，向神獻上感謝。"]}, "hospitality": {"n": "款待與團契", "i": "d-hospitality", "d": "主動打開自己的生活和家，邀請人一同吃飯、傾談、分享生命。款待讓我們從旁觀者走進群體，擴闊「自己人」的圈子。", "s": ["每月邀請一位或一家人到家中或一同吃飯。", "事前不用準備得完美，簡單的飯菜已經足夠。", "在交談中練習分享自己的感受和生活，而不只是交流想法和資訊。", "留意自己想抽離、想計算精力的時刻，選擇再留下多一會。", "事後為對方禱告，並記下這次相聚帶給你的豐盛。"]}, "hours": {"n": "定時祈禱", "i": "d-hours", "d": "在一天中固定的時間（例如早、午、晚）停下來簡短禱告，是教會延續千年的傳統。不論正在追求甚麼、心情高低，都按時停下來回到神面前，讓穩定的節奏教我們：停頓也是安全的。", "s": ["選定每天三個固定時間，例如早上起床、午飯時、睡前，並設定提醒。", "每次只需三至五分鐘：讀一段短詩篇、靜默片刻、說一句簡短的禱告。", "即使手上的事正在進行、不想停下，也按時停下來。", "停下時留意：「我現在追求的是甚麼？我在與誰比較？」把它交給神。", "一個月後回顧：按時停下來，怎樣改變了你追求的方式？"]}, "journal": {"n": "屬靈日記", "i": "d-journal", "d": "定期用文字記錄自己的想法、感受和渴求，以及與神的對話。這幫助我們聽見自己內心真正的聲音，也看見神一路的帶領。", "s": ["每天或隔天花十分鐘寫日記，不用寫得好，只要真實。", "以這三個問題開始：「今天我真正的感受是甚麼？」、「我想要的是甚麼？」、「我在哪裏把自己收起來了？」", "寫下一件你有意見、卻沒有說出口的事，以及你真正的立場。", "把日記的內容化成一句禱告。", "每星期重讀一次，留意神怎樣回應，以及你內心反覆出現的渴求。"]}, "sabbath": {"n": "守安息日", "i": "d-sabbath", "d": "每星期留一段時間停下工作、改善和修正，單單享受神、享受人和受造的美好。安息提醒我們：世界不靠我們修正才變好，神才是掌管一切的主。", "s": ["在日曆上預先選定每星期一段固定的安息時間（最少三小時），像約會一樣保護它。", "開始時禱告：「主啊，這段時間我把要修正的事都交給你。」把待辦清單收起來。", "選擇令你放鬆和感恩的事：散步、與家人慢慢吃飯、欣賞大自然、閱讀詩篇。", "當你發現自己又想「改善」或「執正」時，溫柔地對自己說：「今天不用做到最對。」", "結束時寫下一件在「不完美」之中仍然體會到的恩典。"]}, "secrecy": {"n": "隱密的服事", "i": "d-service", "d": "刻意做一些沒有人知道、也換不到感謝或位置的善事。這是耶穌在登山寶訓中教導的操練，幫助我們的付出從「需要被重視、被看見」轉向單單為愛主而做。", "s": ["每星期選一件小事暗中去做，例如為人代禱、匿名送上祝福、默默收拾地方。", "完成後不告訴任何人，也不暗示是你做的。", "留意心裏想讓人知道、想在對方心中加分的衝動，把它帶到神面前。", "禱告：「主，你在暗中察看，你的看見已經足夠。」", "一個月後回顧：沒有人重視你的付出時，你經歷到甚麼自由？"]}, "serve_weak": {"n": "服事軟弱的人", "i": "d-service", "d": "以溫柔和耐心陪伴、服事軟弱和有需要的人，例如長者、病人、小孩或有困難的家庭。這操練讓保護的力量化為溫柔，也讓我們學習接受自己的軟弱。", "s": ["選擇一個服事軟弱者的機會，例如探訪長者、陪伴病人或照顧小孩。", "服事時放慢速度，聆聽多於說話，讓對方決定節奏。", "留意自己想「快快解決問題」或想主導的衝動，選擇溫柔地陪伴。", "問自己：「我在對方身上看見自己哪一份軟弱？」", "把這份軟弱帶到神面前，禱告：「主，你的能力在我的軟弱上顯得完全。」"]}, "simplicity": {"n": "簡樸與專注", "i": "d-simplicity", "d": "刻意減少選擇、物品和活動，一次只專心做一件事。簡樸讓我們從「越多越好」中得自由，學習在眼前平凡的事上深深地享受神。", "s": ["每星期選一天，不開新計劃，只完成已經開始的事。", "整理一個抽屜或清單，送出或刪去不需要的東西。", "吃一頓飯時，不看手機，專心品嚐和與人交談。", "計劃新活動前先問：「我是在逃避某種感受嗎？」", "每天睡前感謝神一件今天簡單卻深刻的經歷。"]}, "solitude": {"n": "獨處", "i": "d-silence", "d": "定期離開人群和別人的需要，單獨與神相處。在獨處中，我們不需要在任何人心中佔位置，只是一個被神愛的孩子，也有空間聽見自己的需要。", "s": ["每星期安排一段一小時、不被打擾的時間，關掉電話，去一個安靜的地方。", "頭十分鐘甚麼也不做，只是安靜地呼吸，留意心裏掛念着誰、想為誰做甚麼。", "把這些人交託給神，然後問自己：「我自己需要甚麼？」並誠實地告訴神。", "慢慢讀約翰一書 4:9-10，讓「神先愛我」這句話停留在心裏。", "結束前寫下一句：「我被愛，不是因為我付出了甚麼。」"]}, "submission": {"n": "順服與退讓", "i": "i-cross", "d": "順服是古典的屬靈操練：效法基督放下自己的權利，在適當的時候讓別人帶領、讓別人的意見先行。這不是軟弱，而是出於信任神的力量。", "s": ["每星期在一個場合中刻意讓別人先發言、先作決定，自己最後才說。", "當你很想主導局面時，停一停，問：「這件事一定要由我掌控嗎？」", "練習接受別人的帶領，即使你覺得自己可以做得更快更好。", "每天以這句禱告開始：「主，今天我把我的力量放在你手中。」", "一個月後回顧：讓出主導權時，你經歷到神怎樣的保護？"]}}, "wings": {"1w2": ["求正・帶被愛色彩", "第 2 型「被重視」的色彩，令 1 型較溫暖、主動：常以教導和服事去修正人，也較在意別人是否接納自己的「對」，較易執正身邊的人。"], "1w9": ["求正・帶存在色彩", "第 9 型「忘我、融入」的色彩，令 1 型的修正較安靜、內斂：較少表露嬲怒，傾向融入制度和規範，默默地把事情做對。"], "2w1": ["被愛・帶求正色彩", "第 1 型「對錯」的色彩，令 2 型的付出較克制、講求合宜：希望自己是那位「做得對」的重要的人。"], "2w3": ["被愛・帶角色色彩", "第 3 型「角色」的色彩，令 2 型較外向、有魅力：喜歡在人群中擔當受歡迎、被欣賞的角色。"], "3w2": ["角色・帶被愛色彩", "第 2 型「被愛」的色彩，令 3 型的角色更重視人際：渴望被喜愛，角色常是照顧和帶動人的那一位。"], "3w4": ["角色・帶追求色彩", "第 4 型「追求」的色彩，令 3 型較內省：重視角色的深度和質素，想在角色中不斷進步。"], "4w3": ["追求・帶角色色彩", "第 3 型「角色」的色彩，令 4 型較外向、有抱負：追求時重視成果，也希望被人看見。"], "4w5": ["追求・帶資源色彩", "第 5 型「計算資源」的色彩，令 4 型較內向、深思：追求時傾向獨自鑽研，較為抽離。"], "5w4": ["資源・帶追求色彩", "第 4 型「追求」的色彩，令 5 型較有創意和感性：收集的資源帶個人風格，喜歡獨特的觀點。"], "5w6": ["資源・帶中庸色彩", "第 6 型「中庸」的色彩，令 5 型較實際、有系統：重視合作，穩妥地管理資源。"], "6w5": ["中庸・帶資源色彩", "第 5 型「計算資源」的色彩，令 6 型較內斂、審慎：傾向獨立分析風險，拉力較明顯。"], "6w7": ["中庸・帶享受色彩", "第 7 型「享受」的色彩，令 6 型較外向、友善、幽默：以人際和樂觀舒緩心裏的拉扯，推力較明顯。"], "7w6": ["享受・帶中庸色彩", "第 6 型「中庸」的色彩，令 7 型較重視人際和承擔：享受時顧及群體，帶着忠誠和責任感。"], "7w8": ["享受・帶強者色彩", "第 8 型「強」的色彩，令 7 型較果斷、有魄力：追求享受時更直接、更大膽。"], "8w7": ["強者・帶享受色彩", "第 7 型「享受」的色彩，令 8 型較外向、精力旺盛、愛冒險：行動快，連爭戰也當作一種享受。"], "8w9": ["強者・帶存在色彩", "第 9 型「忘我、融入」的色彩，令 8 型較沉穩、溫和、有耐性：力量平時隱而不露，需要時才出手保護。"], "9w1": ["存在・帶求正色彩", "第 1 型「對錯」的色彩，令 9 型較有原則和秩序：融入群體時，也追求「對」的做法。"], "9w8": ["存在・帶強者色彩", "第 8 型「強」的色彩，令 9 型較堅定、實際：有需要時會站出來，「有我」較易被人看見。"]}, "sub": {"1SO": ["群體求正", "社交型 1 把最高標準用在群體上：規則、制度和公義。他們渴求以身作則，成為群體中「對」的榜樣，原則上很少讓步，容易顯得嚴肅或說教。成長的路，是記得群體由有血有肉的人組成，以恩慈代替修正。"], "1SP": ["生活求正", "自保型 1 把心中那把「對」的尺用在生活細節上：金錢、健康、家居、時間都要妥當。嬲怒常化成對小事的憂慮，怕自己有沒有出錯；外表溫和，內裏緊繃。成長的路，是相信神的供應，容許生活中的「錯」與「對」並存。"], "1SX": ["關係求正", "一對一型 1 把修正的熱忱投向最親近的一位，渴望伴侶或摯友也活出心中的「對」；嬲怒較容易直接表露出來。成長的路，是放下改造對方的衝動，先接納對方本來的樣子。"], "2SO": ["群體中的被重視", "社交型 2 渴望在群體中成為最重要的支持者，以幫助和人脈得到眾人的重視，常擔當有影響力的角色。成長的路，是分辨服事是為了愛人，還是為了在眾人心中有位置。"], "2SP": ["被照顧的被愛", "自保型 2 在生活層面渴求被愛：希望自己也被照顧、被寵愛，同時以實際的照顧換取在對方心中的位置；較含蓄，害怕不被重視。成長的路，是坦然承認自己的需要，不必以可愛或退讓換取愛。"], "2SX": ["最重要的一位", "一對一型 2 的渴求最直接：成為某一個人心中最重要的那一位。他們熱情、浪漫而投入，傲慢在於相信只有自己最懂對方。成長的路，是在關係中保持自我，讓愛不帶條件。"], "3SO": ["群體中的角色", "社交型 3 最在意群體中的角色和名聲，虛誇的包裝最明顯，渴望群體的掌聲確認自己的身份。成長的路，是讓神的肯定取代人的掌聲，活出台前幕後一致的真誠。"], "3SP": ["可靠的角色", "自保型 3 把角色放在生活保障上：可靠的供應者、勤奮的工作者。他們低調、不張揚，虛誇藏在「做得穩妥」之中，最怕失去穩定的角色。成長的路，是停下忙碌，承認自己也有需要和感受。"], "3SX": ["被欣賞的角色", "一對一型 3 的角色是「令所愛的人欣賞的那一位」，常以支持伴侶或家人的成功為目標，形象重於個人名聲。成長的路，是相信不用演得最出色，也值得被愛。"], "4SO": ["追上群體", "社交型 4 比較的對象多是群體的標準，很在意自己在群體中是否「還未夠好」，因而不斷追趕。成長的路，是相信自己在基督的身體中有不可取代的位置，從比較走向感恩。"], "4SP": ["超越自己", "自保型 4 比較的對象多是自己和生活的挑戰：默默捱苦，以堅毅和行動超越困難，很少訴苦。成長的路，是容許自己停下來被安慰，不必獨自承擔一切。"], "4SX": ["超越某人", "一對一型 4 比較的對象多是某一個具體的人，好勝心強烈，較易表露不滿和渴望。成長的路，是為比較的對象祝福，把強烈的推動力化為對人的成全。"], "5SO": ["知識資源", "社交型 5 把知識和理念看作群體中最有效益的資源，喜歡在專業圈子分享見解，以學問建立位置和歸屬。成長的路，是讓知識連結到真實的人和生活，而不只是理論。"], "5SP": ["守護資源", "自保型 5 最重視私人空間和自給自足，像守護城堡一樣保護自己的時間、金錢和精力。成長的路，是打開城門，相信神會補足，學習與人分享生活。"], "5SX": ["知己資源", "一對一型 5 外表冷靜，卻把最珍貴的資源留給一兩位視為「自己人」的知己，渴望深入而安全的交流。成長的路，是在安全的關係中慢慢敞開，也容許別人走進自己的世界。"], "6SO": ["規範的中庸", "社交型 6 以規則、職責和群體的秩序保持中庸，也很留意權威有沒有盡本份。成長的路，是分辨規則背後的精神，在恩典中而不是在懷疑中盡責。"], "6SP": ["安穩的中庸", "自保型 6 在生活中尋找「不前不後」的安穩：建立溫暖、可靠的關係和保障，拉力較明顯，較為謹慎。成長的路，是學習相信自己的判斷，把最終的依靠放在神身上。"], "6SX": ["迎上的中庸", "一對一型 6 的推力較明顯，傾向直接迎上令自己不安的人和事，表現得勇敢甚至強勢；但拉力其實仍在。成長的路，是承認心裏的拉扯，不再以硬撐證明自己。"], "7SO": ["群體中的享受", "社交型 7 刻意壓下個人的享受，為群體和理想付出，享受「被視為無私」的好感覺。成長的路，是誠實面對自己的需要，讓付出出於自由而不是證明。"], "7SP": ["生活中的享受", "自保型 7 善於為自己和家人建立一個充滿好處和享受的小圈子，務實、精明，懂得爭取最好的。成長的路，是學習知足和慷慨，不再以擁有更多來保障美好。"], "7SX": ["著迷的享受", "一對一型 7 容易被新的人和事物深深吸引，對未來充滿浪漫的想像，渴望與一個人一同經歷更多美好。成長的路，是在平凡的現實中扎根，欣賞眼前的人和事。"], "8SO": ["守護群體的強者", "社交型 8 把力量用在保護群體和弱勢，忠心而有承擔，常為人仗義執言。成長的路，是讓保護成為服事，而不是控制。"], "8SP": ["生存的強者", "自保型 8 把力量用在確保自己和家人的生活所需，務實、低調，以實力和資源保護所愛的人。成長的路，是信任神的供應，放下事事親力親為的控制。"], "8SX": ["全情的強者", "一對一型 8 在親密關係中全力以赴，重口味最為明顯，渴望完全的信任和連結，也較易佔有。成長的路，是學習以溫柔和尊重來愛，給對方自由。"], "9SO": ["融入群體", "社交型 9 把自己融入群體，為團體勤奮付出而感到存在，卻很少說出自己的需要。成長的路，是相信自己在群體中也值得被聆聽和尊重。"], "9SP": ["融入習慣", "自保型 9 把自己融入日常的舒適和習慣，例如飲食、睡眠和喜愛的興趣，在其中找到存在感。成長的路，是察覺舒適何時成了忘我的逃避，勇於面對真正重要的事。"], "9SX": ["融入某人", "一對一型 9 容易與親近的人融為一體，吸收對方的喜好和情緒，忘記自己的立場。成長的路，是在親密中保持「有我」，發現神獨特地創造的自己。"]}, "verses": {"來10:24-25": {"ref": "希伯來書 10:24-25", "text": "又要彼此相顧，激發愛心，勉勵行善。你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉，既知道（原文是看見）那日子臨近，就更當如此。"}, "創1:27": {"ref": "創世記 1:27", "text": "神就照著自己的形像造人，乃是照著他的形像造男造女。"}, "加2:20": {"ref": "加拉太書 2:20", "text": "我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信　神的兒子而活；他是愛我，為我捨己。"}, "可10:42-45": {"ref": "馬可福音 10:42-45", "text": "耶穌叫他們來，對他們說：「你們知道，外邦人有尊為君王的，治理他們，有大臣操權管束他們。只是在你們中間，不是這樣。你們中間，誰願為大，就必作你們的用人；在你們中間，誰願為首，就必作眾人的僕人。因為人子來，並不是要受人的服事，乃是要服事人，並且要捨命作多人的贖價。」"}, "弗4:26-27": {"ref": "以弗所書 4:26-27", "text": "生氣卻不要犯罪；不可含怒到日落，也不可給魔鬼留地步。"}, "弗5:15-17": {"ref": "以弗所書 5:15-17", "text": "你們要謹慎行事，不要像愚昧人，當像智慧人。要愛惜光陰，因為現今的世代邪惡。不要作糊塗人，要明白主的旨意如何。"}, "提後1:7": {"ref": "提摩太後書 1:7", "text": "因為　神賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心。"}, "撒上16:7": {"ref": "撒母耳記上 16:7", "text": "耶和華卻對撒母耳說：「不要看他的外貌和他身材高大，我不揀選他。因為，耶和華不像人看人：人是看外貌；耶和華是看內心。」"}, "林前12:4-7": {"ref": "哥林多前書 12:4-7", "text": "恩賜原有分別，聖靈卻是一位。職事也有分別，主卻是一位。功用也有分別，　神卻是一位，在眾人裡面運行一切的事。聖靈顯在各人身上，是叫人得益處。"}, "林後12:9-10": {"ref": "哥林多後書 12:9-10", "text": "他對我說：「我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。」所以，我更喜歡誇自己的軟弱，好叫基督的能力覆庇我。我為基督的緣故，就以軟弱、凌辱、急難、逼迫、困苦為可喜樂的；因我甚麼時候軟弱，甚麼時候就剛強了。"}, "林後3:18": {"ref": "哥林多後書 3:18", "text": "我們眾人既然敞著臉得以看見主的榮光，好像從鏡子裡返照，就變成主的形狀，榮上加榮，如同從主的靈變成的。"}, "林後5:17": {"ref": "哥林多後書 5:17", "text": "若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。"}, "箴11:24-25": {"ref": "箴言 11:24-25", "text": "有施散的，卻更增添；有吝惜過度的，反致窮乏。好施捨的，必得豐裕；滋潤人的，必得滋潤。"}, "約一4:9-10": {"ref": "約翰一書 4:9-10", "text": "神差他獨生子到世間來，使我們藉著他得生，　神愛我們的心在此就顯明了。不是我們愛　神，乃是　神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了。"}, "羅12:15-16": {"ref": "羅馬書 12:15-16", "text": "與喜樂的人要同樂；與哀哭的人要同哭。要彼此同心；不要志氣高大，倒要俯就卑微的人（人：或譯事）。不要自以為聰明。"}, "羅3:23-24": {"ref": "羅馬書 3:23-24", "text": "因為世人都犯了罪，虧缺了　神的榮耀；如今卻蒙　神的恩典，因基督耶穌的救贖，就白白地稱義。"}, "腓1:6": {"ref": "腓立比書 1:6", "text": "我深信那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子。"}, "腓3:12-14": {"ref": "腓立比書 3:12-14", "text": "這不是說我已經得著了，已經完全了；我乃是竭力追求，或者可以得著基督耶穌所以得著我的（所以得著我的：或譯所要我得的）。弟兄們，我不是以為自己已經得著了；我只有一件事，就是忘記背後，努力面前的，向著標竿直跑，要得　神在基督耶穌裡從上面召我來得的獎賞。"}, "腓4:11-13": {"ref": "腓立比書 4:11-13", "text": "我並不是因缺乏說這話；我無論在甚麼景況都可以知足，這是我已經學會了。我知道怎樣處卑賤，也知道怎樣處豐富；或飽足，或飢餓；或有餘，或缺乏，隨事隨在，我都得了祕訣。我靠著那加給我力量的，凡事都能做。"}, "腓4:19": {"ref": "腓立比書 4:19", "text": "我的　神必照他榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足。"}, "西3:1-3": {"ref": "歌羅西書 3:1-3", "text": "所以，你們若真與基督一同復活，就當求在上面的事；那裡有基督坐在　神的右邊。你們要思念上面的事，不要思念地上的事。因為你們已經死了，你們的生命與基督一同藏在　神裡面。"}, "詩139:23-24": {"ref": "詩篇 139:23-24", "text": "神啊，求你鑒察我，知道我的心思，試煉我，知道我的意念，看在我裡面有甚麼惡行沒有，引導我走永生的道路。"}, "詩16:11": {"ref": "詩篇 16:11", "text": "你必將生命的道路指示我。在你面前有滿足的喜樂；在你右手中有永遠的福樂。"}, "賽26:3-4": {"ref": "以賽亞書 26:3-4", "text": "堅心倚賴你的，你必保守他十分平安，因為他倚靠你。你們當倚靠耶和華直到永遠，因為耶和華是永久的磐石。"}, "賽43:1": {"ref": "以賽亞書 43:1", "text": "雅各啊，創造你的耶和華，以色列啊，造成你的那位，現在如此說：你不要害怕！因為我救贖了你。我曾提你的名召你，你是屬我的。"}, "路10:40-42": {"ref": "路加福音 10:40-42", "text": "馬大伺候的事多，心裡忙亂，就進前來，說：「主啊，我的妹子留下我一個人伺候，你不在意嗎？請吩咐她來幫助我。」耶穌回答說：「馬大！馬大！你為許多的事思慮煩擾，但是不可少的只有一件；馬利亞已經選擇那上好的福分，是不能奪去的。」"}}};

<script>
"use strict";
const KEY='discipleEnneagram.v1', FKEY='discipleEnneagram.font';
const ITEMS=DATA.items, N=ITEMS.length, TY=DATA.types, CEN=DATA.centres, INS=DATA.inst, IORD=['SP','SO','SX'];
const LIK=[[5,'非常同意'],[4,'同意'],[3,'中立／一半半'],[2,'不同意'],[1,'非常不同意']];
const ARROW={1:[7,4],2:[4,8],3:[6,9],4:[1,2],5:[8,7],6:[9,3],7:[5,1],8:[2,5],9:[3,6]};
const app=document.getElementById('app');
const APP='牛頭角浸信會門徒訓練，自我認識 (九型人格)';
const store={ok:(function(){try{const k='__t';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);return true}catch(e){return false}})(),mem:{},get(k){try{const v=window.localStorage.getItem(k);return v==null&&k in this.mem?this.mem[k]:v}catch(e){return k in this.mem?this.mem[k]:null}},set(k,v){this.mem[k]=v;try{window.localStorage.setItem(k,v)}catch(e){}}};
function ic(id,c){return `<svg class="ic${c?' '+c:''}" aria-hidden="true"><use href="#${id}"/></svg>`}
const GRP={gut:['i-peak','#dcb24f','行動智慧中心'],heart:['i-F','#e09a8f','情感智慧中心'],head:['i-N','#6fb0ad','思考智慧中心']};
function im(k,w,h){const u=IMG[k];return `data-img="${k}" style="aspect-ratio:${w}/${h}"${u?` src="${u}"`:''}`}
function fillImgs(){document.querySelectorAll('img[data-img]:not([src])').forEach(i=>{const u=IMG[i.dataset.img];if(u)i.src=u})}
function cof(n){return TY[n].centre}
function charImg(n){return `<img class="char" ${im('c'+n,280,313)} width="280" height="313" alt="第${n}型 ${esc(TY[n].name)}插圖">`}
function emblemG(g,label){const [id,col]=GRP[g];return `<svg class="emb" viewBox="0 0 48 48" role="img" aria-label="${label||GRP[g][2]}"><circle cx="24" cy="24" r="21.5" fill="${col}" stroke="#fffaf0" stroke-width="3"/><use href="#${id}" x="12" y="12" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
const NOTES=['內容謹供參考之用','牛頭角浸信會門徒訓練參與者使用','吳國强牧師 2026年建立'];
function notesCard(){return `<div class="notes" role="note" aria-label="使用說明"><span class="nb">${ic('i-cross')}</span><ul>${NOTES.map(n=>`<li>${n}</li>`).join('')}</ul></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{const s=JSON.parse(store.get(KEY)||'null');if(s&&Array.isArray(s.answers)&&s.answers.length===N)return s}catch(e){}return {answers:Array(N).fill(null),idx:0,result:null}}
let S=load();
function save(){store.set(KEY,JSON.stringify(S))}
function answered(){return S.answers.filter(v=>v!==null).length}
function nb(n,d){return ((n-1+d+9)%9)+1}
function wingCode(t,w){return w?t+'w'+w:String(t)}
function score(ans){
  const sum={},c5={},c4={};
  ITEMS.forEach((it,i)=>{const g=it.g,v=ans[i];if(!(g in sum)){sum[g]=0;c5[g]=0;c4[g]=0}if(v==null)return;sum[g]+=v;if(v===5)c5[g]++;if(v>=4)c4[g]++});
  const cmp=(a,b)=>(sum[b]-sum[a])||(c5[b]-c5[a])||(c4[b]-c4[a]);
  const rank=[1,2,3,4,5,6,7,8,9].sort((a,b)=>cmp(a,b)||a-b);
  const t=rank[0],second=rank[1];
  const L=nb(t,-1),R=nb(t,1);const wc=cmp(L,R);const wing=wc<0?L:wc>0?R:null;
  const stack=IORD.slice().sort((a,b)=>cmp(a,b)||IORD.indexOf(a)-IORD.indexOf(b));
  const scores={};rank.forEach(n=>scores[n]=sum[n]);const inst={};IORD.forEach(k=>inst[k]=sum[k]);
  return {type:t,wing,rank,scores,inst,stack,gap:sum[t]-sum[second],tie:sum[t]===sum[second],igap:sum[stack[0]]-sum[stack[1]]};
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
function ask(msg,yes){const d=document.createElement('div');d.className='modal';d.id='modal';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.innerHTML=`<div class="box"><p>${esc(msg)}</p><div class="btnrow"><button class="btn warn" id="mYes">確定</button><button class="btn ghost" id="mNo">取消</button></div></div>`;document.body.appendChild(d);const close=()=>d.remove();d.querySelector('#mNo').onclick=close;d.querySelector('#mYes').onclick=()=>{close();yes()};d.querySelector('#mYes').focus()}
function fontStep(d){const cur=parseInt(store.get(FKEY)||'19',10);const n=Math.max(16,Math.min(28,cur+d*2));store.set(FKEY,String(n));document.documentElement.style.setProperty('--fs',n+'px')}
(function(){const f=store.get(FKEY);if(f)document.documentElement.style.setProperty('--fs',f+'px')})();
function verse(k,why){const v=DATA.verses[k];return `<div class="verse"><div class="vt">${esc(v.text)}</div><div class="vr">——${esc(v.ref)}（和合本）</div>${why?`<div class="vw">${esc(why)}</div>`:''}</div>`}
function tlink(n){return `<a href="#type/${n}" onclick="go('type/${n}');return false">第 ${n} 型 ${esc(TY[n].name)}</a>`}
function subName(t,k){return INS[k].n+'型 '+t}
let CUR='home',NOHASH=false;
function curView(){return NOHASH?CUR:((location.hash||'').slice(1)||'home')}
function go(v){CUR=v;if(!NOHASH){if(location.hash==='#'+v){route();return}try{location.hash=v}catch(e){}if(location.hash==='#'+v)return;NOHASH=true}route()}
function route(){

// enneagram diagram; hl = {t, w, g, s} (main, wing, growth, stress)
function ennSvg(hl,label){
  const P=n=>{const a=(n*40-90)*Math.PI/180;return [100+78*Math.cos(a),100+78*Math.sin(a)]};
  const ln=(a,b,st)=>{const [x1,y1]=P(a),[x2,y2]=P(b);return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" ${st}/>`};
  const hex=[1,4,2,8,5,7,1],tri=[3,6,9,3];let s='';
  for(const p of [hex,tri])for(let i=0;i<p.length-1;i++)s+=ln(p[i],p[i+1],'stroke="#d8ccb2" stroke-width="1.6"');
  if(hl){const ar=(a,b,c,dash)=>{const [x1,y1]=P(a),[x2,y2]=P(b);const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ex=x2-ux*15,ey=y2-uy*15;const hx=ex-ux*9,hy=ey-uy*9;return `<line x1="${(x1+ux*15).toFixed(1)}" y1="${(y1+uy*15).toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${c}" stroke-width="3.2" stroke-linecap="round"${dash?' stroke-dasharray="5 4"':''}/><path d="M${ex.toFixed(1)} ${ey.toFixed(1)}L${(hx-uy*5).toFixed(1)} ${(hy+ux*5).toFixed(1)}L${(hx+uy*5).toFixed(1)} ${(hy-ux*5).toFixed(1)}Z" fill="${c}"/>`};
    s+=ar(hl.t,hl.g,'#5d9a4e',false)+ar(hl.t,hl.s,'#d0805a',true)}
  s=`<circle cx="100" cy="100" r="78" fill="none" stroke="#e3d8bf" stroke-width="2"/>`+s;
  for(let n=1;n<=9;n++){const [x,y]=P(n);const g=cof(n),col=GRP[g][1];const me=hl&&hl.t===n,wg=hl&&hl.w===n;
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${me?15:12}" fill="${me?col:'#fffdf6'}" stroke="${wg?'#e0a64a':col}" stroke-width="${wg?4:2.6}"/><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="${me?'#fff':'#2a2723'}">${n}</text>`}
  return `<svg class="enn" viewBox="0 0 200 200" role="img" aria-label="${esc(label||'九型人格圖')}">${s}</svg>`;
}

let busy=false;
function answer(v){
  if(busy)return;const i=Math.min(S.idx||0,N-1);S.answers[i]=v;
  document.querySelectorAll('.opt').forEach(b=>{const on=+b.dataset.v===v;b.classList.toggle('sel',on);b.setAttribute('aria-checked',on)});
  busy=true;
  setTimeout(()=>{busy=false;
    if(i===N-1){if(answered()===N){finish()}else{S.idx=S.answers.indexOf(null);save();toast('尚有題目未作答');viewQuiz()}return}
    S.idx=i+1;save();viewQuiz();
  },180);
  save();
}
function prevQ(){if(S.idx>0){S.idx=Math.min(S.idx,N)-1;save();viewQuiz()}}
function nextQ(){if(S.idx<N-1){S.idx++;save();viewQuiz()}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function finish(){const first=S.answers.indexOf(null);if(first>=0){S.idx=first;save();toast('尚有題目未作答');viewQuiz();return}
  S.result=Object.assign(score(S.answers),{date:today()});S.idx=N;save();go('result')}
document.addEventListener('keydown',e=>{if(curView()!=='quiz'||e.target.tagName==='INPUT'||document.getElementById('modal'))return;if(e.key>='1'&&e.key<='5'){answer(6-parseInt(e.key,10))}else if(e.key==='ArrowLeft')prevQ();else if(e.key==='ArrowRight'&&S.answers[S.idx]!=null)nextQ()});

  const s2=r.rank[1];

  const I=r.inst,st=r.stack,dk=st[0],sub=DATA.sub[t+dk];
  const ibars=IORD.map(k=>`<div class="ebar${k===dk?' me':''}" style="--gfg:#2c5a78;--gln:#9cc58f"><span class="nm">${esc(INS[k].n)} ${k}</span><span class="trk"><i class="fl" style="width:${(I[k]/max*100).toFixed(1)}%"></i></span><span class="sc">${I[k]}</span></div>`).join('');
  const L=nb(t,-1),R=nb(t,1);

    :`<p id="wingbal">你兩邊的翼型分數相同（第 ${L} 型與第 ${R} 型各 ${r.scores[L]} 分），可視為<b>兩翼平衡</b>：兩個鄰居的世界觀都為你的主型染上色彩。請閱讀以下兩種描述，看看哪一種較像你：</p><ul class="clean"><li><b>${wingCode(t,L)}「${esc(DATA.wings[wingCode(t,L)][0])}」</b>：${esc(DATA.wings[wingCode(t,L)][1])}</li><li><b>${wingCode(t,R)}「${esc(DATA.wings[wingCode(t,R)][0])}」</b>：${esc(DATA.wings[wingCode(t,R)][1])}</li></ul>`;
  app.innerHTML=`
  <h1>我的結果</h1>

  ${hero(t,r)}

  <div class="card" id="bars"><h2 class="ih" style="margin-top:.2rem"><span class="hic">${ic('i-chart')}</span>九型分數排名</h2>${bars}${near}
  <p class="small">每型 5 題，分數範圍 5–25 分。分數顯示你與各型世界觀的共鳴程度，並非能力高低；我們每個人身上都有九型的影子。</p></div>
  <section id="s0"><h2 class="ih"><span class="hic">${ic('i-wing')}</span>翼型與本能副型</h2><div class="card">
  <h3>翼型</h3>${wingTxt}
  <h3>本能次序</h3>${ibars}
  <div class="istack" id="istack">${st.map((k,i)=>`<span class="${i===0?'on':''}">${esc(INS[k].n)}（${k}）</span>${i<2?ic('i-arrow'):''}`).join('')}</div>
  ${r.igap<=2?`<div class="near" id="instnear">你的三種本能分數較接近，即是你的激情原動力和渴求，未必明顯集中在某一個生活範疇。也可以閱讀第 ${t} 型的其他副型描述（見「九型」頁），看看哪一個較像你。</div>`:''}
  <div class="subc g-${cof(t)} me" id="subcard"><h3>你的副型：${esc(subName(t,dk))}<span class="k">${esc(sub[0])}</span></h3><p>${esc(sub[1])}</p></div>
  <p class="small">${esc(INS[dk].full)}：${esc(INS[dk].d)}</p>
  </div></section>

function typeBody(n,r){
  const t=TY[n],c=cof(n),[g,s]=ARROW[n],L=nb(n,-1),R=nb(n,1);
  const SI={s1:'i-gift',s2:'i-blind',s3:'i-grow',s4:'i-book',s5:'i-candle',s6:'i-chat'};const H=(id,x)=>`<h2 class="ih"><span class="hic">${ic(SI[id])}</span>${x}</h2>`;
  const sec=[['s1','性格概覽與恩賜'],['s2','原有性格的盲點'],['s3','九型人格成長建議'],['s4','建議成長的聖經經文'],['s5','屬靈操練的方法及途徑'],['s6','反思與小組分享']];
  const d=o=>{const x=DATA.disc[o.k];return `<div class="disc"><h3><span class="dic">${ic(x.i)}</span>${esc(x.n)}</h3><p>${esc(x.d)}</p><p class="why"><b>為甚麼適合你：</b>${esc(o.why)}</p><b>實踐步驟：</b><ol>${x.s.map(z=>`<li>${esc(z)}</li>`).join('')}</ol></div>`};
  const wl=w=>`<b>${wingCode(n,w)}「${esc(DATA.wings[wingCode(n,w)][0])}」</b>：${esc(DATA.wings[wingCode(n,w)][1])}`;
  const myW=r&&r.wing;
  return `
  <div class="chips" aria-label="章節">${(r?[['s0','翼型與副型']]:[]).concat(sec).map(([id,x])=>`<button type="button" onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth'})">${x}</button>`).join('')}</div>
  <section id="s1">${H('s1','一、性格概覽與恩賜')}<div class="card"><p>${esc(t.overview)}</p>
  <div class="stack"><div><b>潛意識世界觀</b><br>「${esc(t.world[0])}」與「${esc(t.world[1])}」</div><div><b>潛意識激情原動力</b><br>${esc(t.passion)}：${esc(t.passiond)}</div><div><b>潛意識渴求</b><br>${esc(t.motive)}</div><div><b>所屬智慧中心</b><br>${esc(CEN[c].n)}：${esc(CEN[c].way)}</div>
  <div><b>翼型</b><br>${myW?wl(myW):`${wl(L)}<br>${wl(R)}`}</div><div><b>整合與解離</b><br>健康時吸收 ${tlink(g)} 健康的一面；壓力下帶上 ${tlink(s)} 不健康的一面</div></div>
  <h3>整體特質</h3><ul class="clean">${t.traits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  ${t.myth?`<div class="near"><b>常見的誤解：</b>${esc(t.myth)}</div>`:''}
  ${ennSvg({t:n,w:myW||0,g,s},`第${n}型：成長方向第${g}型，壓力方向第${s}型`)}${legend(true)}
  <h3>神給你的恩賜</h3><ul class="clean">${t.gifts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>
  <section id="s2">${H('s2','二、原有性格的盲點')}<div class="card"><p class="small">盲點不是罪名，多數是卡在世界觀的其中一極，或被激情原動力推得太過。請以恩典的眼光閱讀。</p>${t.blind.map(([a,b])=>`<div class="blind"><b>${esc(a)}：</b>${esc(b)}</div>`).join('')}
  <div class="blind"><b>壓力之下（解離方向 → 第 ${s} 型「${esc(TY[s].short)}」）：</b>${esc(t.stress)}</div></div></section>
  <section id="s3">${H('s3','三、九型人格成長建議')}<div class="card"><h3>成長方向：由激情原動力走向德行</h3><div class="pv"><span class="a">${esc(t.passion)}</span>${ic('i-arrow')}<span class="b">${esc(t.virtue)}</span></div>
  <p><b>健康的方向：</b>${esc(t.healthy)}</p>
  <p><b>整合方向 → 第 ${g} 型「${esc(TY[g].short)}」：</b>${esc(t.growth)}</p><h3>具體建議</h3><ul class="clean">${t.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>
  <section id="s4">${H('s4','四、建議成長的聖經經文')}<p>第一段經文說明你的渴求（${esc(t.short)}）怎樣在神的恩典中得着真正的滿足；第二段針對你的激情原動力「${esc(t.passion.replace(/（.*$/,''))}」。</p>${t.verses.map(v=>verse(v.k,v.why)).join('')}</section>
  <section id="s5">${H('s5','五、屬靈操練的方法及途徑')}<p>以下兩項操練特別針對第 ${n} 型（${esc(t.short)}）的世界觀和渴求，幫助你讓「${esc(t.world[0])}」與「${esc(t.world[1])}」在神面前並存：第一項幫助你鬆開最容易卡住的一極，第二項培養較被忽略的一面。建議先選一項，持續實踐四至六星期，並與一位屬靈同伴分享進度。</p>${t.disc.map(d).join('')}</section>
  <section id="s6">${H('s6','六、反思與小組分享')}<div class="card"><h3>個人反思問題</h3><ol>${t.reflect.map(q=>`<li>${esc(q)}</li>`).join('')}<li>讀完以上描述，「${esc(t.world[0])}」與「${esc(t.world[1])}」這個世界觀，哪一句最貼近你？哪一句你不認同？為甚麼？</li></ol><h3>小組分享（可選）</h3><p>${esc(t.group)}</p><p class="small">分享時請尊重每位組員，只分享自己願意分享的部分，不替別人貼標籤。</p></div></section>`;
}

function viewGuide(){
  app.innerHTML=`<h1>組長使用指引</h1>
  <img class="guideart" ${im('guide',860,484)} width="860" height="484" alt="幾位朋友在小屋門廊前圍坐，中間放着聖經和茶壺">
  <p class="lead">本工具適合在門徒訓練或小組中使用，目的是幫助組員認識自己潛意識的世界觀和渴求、彼此欣賞，並在基督裏成長。</p>
  <h2 class="ih"><span class="hic">${ic('d-hours')}</span>所需時間</h2><div class="card"><ul class="clean">
  <li><b>作答問卷：</b>約 10–12 分鐘（共 ${N} 題）。</li><li><b>閱讀結果：</b>約 20–30 分鐘，建議分兩次慢慢閱讀和反思。</li><li><b>小組分享：</b>每次約 45–60 分鐘，建議按以下步驟分三次進行。</li></ul></div>
  <h2 class="ih"><span class="hic">${ic('d-direction')}</span>建議流程</h2><div class="card"><ol>
  <li><b>預備：</b>組長先自己完成問卷並閱讀結果，親身體會內容；並先讀一遍九型的描述。</li>
  <li><b>第一個步驟（約20分鐘）：</b>一同閱讀「簡介」，特別是「潛意識世界觀」、「三個關鍵詞」、「先天的類型，後天的健康」和「從信仰角度看性格」；強調本工具不是官方測驗，也不是診斷。</li>
  <li><b>在家作答：</b>邀請組員回家安靜作答，按「平常的自己」而不是「理想的自己」回答。（建議用 WhatsApp 傳送連結時，提醒組員用 Chrome 或 Safari 開啟。）</li>
  <li><b>第二個步驟（認識自己）：</b>每人用三至五分鐘分享：「我這一型的世界觀和渴求，哪一句最觸動我？哪一句不太像我？」再用「小組分享」題目傾談。</li>
  <li><b>第三個步驟（一同成長）：</b>分享各自「健康的方向」：自己最常卡在世界觀的哪一極？壓力時帶上哪一型不健康的一面？健康時又可以吸收哪一型健康的一面？再分享一項想實踐的屬靈操練；兩人一組成為「操練伙伴」，四至六星期後回顧。</li>
  <li><b>延伸：</b>瀏覽「九型」頁，討論不同的世界觀在小組和事奉中如何互補，例如「強者」與「存在」（8 型與 9 型）、「求正」與「享受」（1 型與 7 型）怎樣彼此學習；也可按三個智慧中心，練習用對方聽得懂的方式關心彼此。</li></ol></div>
  <h2 class="ih"><span class="hic">${ic('i-chat')}</span>帶領分享（Debrief）的提示</h2><div class="card"><ul class="clean">
  <li><b>先問世界觀，後問行為：</b>例如「當你這樣做時，心裏最想追求的是甚麼？最想避開的又是甚麼？」</li>
  <li><b>留意智慧中心：</b>對行動中心的組員多講事實、一起做；對情感中心的組員多營造接納的氣氛；對思考中心的組員多分享想法和理由。</li>
  <li><b>結果只是起點：</b>不少人需要幾星期甚至更長時間，才確定自己的主型。鼓勵組員閱讀分數接近的類型，比較哪一個世界觀和渴求最觸動自己，並觀察自己在健康和壓力時卡在哪一極。</li>
  <li><b>多聆聽，少分析：</b>組長的角色是陪伴，不是替人「斷症」或判定類型。</li>
  <li><b>以恩典回應盲點：</b>盲點多是卡在世界觀的一極；當組員分享軟弱時，先感謝他的坦誠，再一同禱告，避免即時給予「解決方法」。</li>
  <li><b>回到福音：</b>每一型潛意識的渴求，最終都在基督裏得到滿足；可用每型的兩段經文作結。</li></ul></div>
  <h2 class="ih"><span class="hic">${ic('i-shield')}</span>帶領時的提醒</h2><div class="card"><ul class="clean">
  <li><b>自我認識的工具，不是標籤：</b>不要說「你是 8 型，所以很霸道」或「他是 6 型，所以多疑」。類型描述傾向，不定義一個人。</li>
  <li><b>不是藉口：</b>提醒組員不要以「我的性格就是這樣」拒絕成長或推卸責任。</li>
  <li><b>不能代替屬靈指導或輔導：</b>本工具不能代替牧養、屬靈指導或專業輔導。</li>
  <li><b>尊重私隱：</b>結果只儲存在個人裝置；分享與否由組員自己決定，組長不應要求收集結果。</li>
  <li><b>不以類型分派事奉：</b>事奉崗位應按恩賜、呼召、屬靈成熟度及教會需要禱告分辨。</li>
  <li><b>結果不準確時：</b>作答時的情緒和處境會影響結果；九型看的是長期、潛意識的世界觀，鼓勵組員以禱告和時間慢慢分辨。</li>
  <li><b>敏感情況：</b>九型人格會觸及內心深處的掙扎和傷痛。若組員流露嚴重的情緒困擾、創傷或抑鬱跡象，請轉介牧者或專業輔導。</li></ul></div>
  <h2 class="ih"><span class="hic">${ic('i-dove')}</span>建議的結束禱告</h2><div class="card"><p>親愛的天父，感謝你按你的形像創造我們每一個人，也深知我們內心深處的渴求和掙扎。求你鑒察我們，幫助我們看見自己的盲點，不以性格為藉口，而是讓聖靈天天更新我們；也幫助我們彼此欣賞、互相補足，在基督的身體裏各盡其職。奉主耶穌基督的名求，阿們。</p></div>
  ${verse('來10:24-25','組員彼此相顧、激發愛心，正是使用本工具的目的。')}
  ${verse('腓1:6','成長是神在我們身上動的善工，祂必成全。')}
  ${notesCard()}`;
}
