<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fbf5e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="靈修打卡">
<title>牛頭角浸信會門徒訓練，靈修打卡及讀經進度表</title>
<style>

:root{--ink:#2a2723;--muted:#4a443b;--bg:#fbf5e6;--card:#fffdf6;--line:#eadfc6;--pri:#2c5a78;--pri2:#3a7096;--acc:#a8502a;--soft:#e6f0f5;--gold:#80600f;--ok:#4a7a38;--sky:#dcecf5;--meadow:#e3efd6;--sun:#f3cf7a;--fs:19px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;line-height:1.75;letter-spacing:.02em}
a{color:var(--pri2)}
header.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topin{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:.4rem;padding:.45rem .8rem}
.brand{font-weight:700;font-size:clamp(.8rem,4.1vw,1.08rem);line-height:1.3;flex:1 1 auto;min-width:0;cursor:pointer;background:none;border:0;color:#fff;text-align:left;padding:.3rem 0;font-family:inherit;display:flex;align-items:center;gap:.45rem;overflow-wrap:anywhere}
.brand .ic{width:1.5em;height:1.5em;flex:0 0 auto;color:#f6c453;stroke-width:2.4}
.tbtn{flex:0 0 auto}
.tbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;min-height:44px;min-width:44px;padding:0 .6rem;font-size:.9rem;font-family:inherit;cursor:pointer}
nav.tabs{max-width:960px;margin:0 auto;display:flex;overflow-x:auto;gap:.3rem;padding:0 .6rem .5rem}
nav.tabs button{flex:0 0 auto;background:transparent;color:#e5edf7;border:0;border-bottom:3px solid transparent;font-size:.92rem;padding:.35rem .45rem;min-height:44px;font-family:inherit;cursor:pointer}
nav.tabs button.on{color:#fff;border-bottom-color:#f6c453;font-weight:700}
main{max-width:960px;margin:0 auto;padding:1rem .9rem 4rem}
h1{font-size:1.6rem;line-height:1.35;margin:.4rem 0 .8rem;color:var(--pri)}
h2{font-size:1.3rem;line-height:1.4;margin:1.6rem 0 .6rem;color:var(--pri);border-left:6px solid var(--acc);padding-left:.55rem}
h3{font-size:1.1rem;margin:1.1rem 0 .4rem;color:var(--ink)}
p{margin:.5rem 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin:.9rem 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.lead{font-size:1.08rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:56px;padding:.6rem 1.3rem;border-radius:14px;border:2px solid var(--pri);background:var(--pri);color:#fff;font-size:1.05rem;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;margin:.3rem .3rem .3rem 0}
.btn.ghost{background:#fff;color:var(--pri)}
.btn.warn{background:#fff;color:var(--acc);border-color:var(--acc)}
.btn:focus-visible,.opt:focus-visible,.tbtn:focus-visible,nav.tabs button:focus-visible,.tile:focus-visible{outline:4px solid #f6c453;outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:.2rem;margin:.8rem 0}
.notice{background:#fff7ed;border:2px solid #fdba74;border-radius:14px;padding:.8rem 1rem;color:#431407}
.verse{background:var(--soft);border-left:5px solid var(--pri2);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0}
.verse .vt{font-size:1.05rem}
.verse .vr{font-weight:700;color:var(--pri);margin-top:.25rem}
.verse .vw{color:var(--muted);font-size:.93rem;margin-top:.3rem}
ul.clean{padding-left:1.2rem;margin:.4rem 0}
ul.clean li{margin:.35rem 0}
.dimgrid{display:grid;gap:.7rem}
@media(min-width:720px){.dimgrid{grid-template-columns:1fr 1fr}}
/* quiz */
.prog{height:16px;background:#e5e7eb;border-radius:99px;overflow:hidden;border:1px solid #cbd5e1}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));width:0;transition:width .25s}
.progtxt{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);margin:.35rem 0 .2rem}
.qtext{font-size:1.35rem;font-weight:700;line-height:1.6;margin:1rem 0 1.1rem;min-height:4.4em}
.opts{display:grid;gap:.6rem}
.opt{display:flex;align-items:center;gap:.8rem;width:100%;min-height:62px;padding:.6rem 1rem;border:2px solid #9ca3af;border-radius:14px;background:#fff;color:var(--ink);font-size:1.1rem;font-family:inherit;text-align:left;cursor:pointer}
.opt .dot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:3px solid #6b7280;display:inline-block}
.opt.sel{border-color:var(--pri);background:#e8eef7;font-weight:700}
.opt.sel .dot{border-color:var(--pri);background:radial-gradient(circle,var(--pri) 0 45%,#fff 50%)}
@media(hover:hover){.opt:hover{border-color:var(--pri2)}}
.qnav{display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem}
/* result */
.typehero{background:var(--pri);color:#fff;border-radius:18px;padding:1.1rem 1.2rem;margin:.8rem 0}
.typehero .code{font-size:3rem;font-weight:800;letter-spacing:.12em;line-height:1.1}
.typehero .nm{font-size:1.45rem;font-weight:700}
.typehero .tg{opacity:.95;margin-top:.3rem}
.bar{margin:.9rem 0}
.bar .lbl{display:flex;justify-content:space-between;font-weight:700;font-size:1rem}
.bar .trk{position:relative;height:24px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:.3rem 0;border:1px solid #cbd5e1}
.bar .fl{position:absolute;top:0;bottom:0;background:var(--pri2)}
.bar .fl.b{background:var(--acc)}
.bar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#111}
.bar .cl{font-size:.92rem;color:var(--muted)}
.near{background:#fefce8;border:2px solid #facc15;border-radius:12px;padding:.6rem .8rem;margin:.4rem 0;font-size:.95rem;color:#422006}
.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem}
.stack div{border:1px solid var(--line);border-radius:12px;padding:.55rem .7rem;background:#fff}
.stack b{color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.chips button{font-family:inherit;color:var(--pri2);cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:0 .8rem;border:1px solid var(--pri2);border-radius:99px;background:#fff;text-decoration:none;font-size:.92rem}
.blind{border-left:5px solid var(--acc);padding:.2rem .8rem;margin:.6rem 0;background:#fff}
.blind b{color:var(--acc)}
.disc{border:1px solid var(--line);border-radius:14px;padding:.7rem .9rem;margin:.7rem 0;background:#fff}
.disc.str{border:2px dashed var(--gold);background:#fffbeb}
.disc h3{margin:.1rem 0 .3rem}
.disc ol{margin:.3rem 0;padding-left:1.4rem}
.disc ol li{margin:.25rem 0}
.why{color:var(--muted);font-size:.95rem}
.tag{display:inline-block;font-size:.8rem;background:var(--gold);color:#fff;border-radius:6px;padding:0 .4rem;margin-left:.3rem;vertical-align:middle}
/* browse */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:block;border:2px solid var(--line);border-radius:14px;padding:.7rem;background:#fff;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);min-height:96px}
.tile .c{font-size:1.4rem;font-weight:800;color:var(--pri);letter-spacing:.06em}
.tile .n{font-size:.95rem}
.tile.me{border-color:var(--acc);background:#fff7ed}
.small{font-size:.9rem;color:var(--muted)}
footer{max-width:960px;margin:0 auto;padding:1rem .9rem 2.5rem;font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#111;color:#fff;padding:.7rem 1.1rem;border-radius:12px;font-size:1rem;z-index:20;display:none}
.printonly{display:none}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:0 0 auto}
.hero,.guideart{display:block;width:100%;height:auto;border-radius:18px;margin:.6rem 0 .4rem;box-shadow:0 2px 8px rgba(31,58,95,.18)}
.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.08em;margin:.6rem 0 0}
.notes{display:flex;gap:.8rem;align-items:center;background:#fffbeb;border:2px solid #c9a54a;border-radius:16px;padding:.7rem 1rem;margin:.8rem 0;color:#1f2937}
.notes .nb{flex:0 0 auto;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--pri);color:#f6c453;display:flex;align-items:center;justify-content:center}
.notes .nb .ic{width:1.6em;height:1.6em;stroke-width:2.6}
.notes ul{list-style:none;margin:0;padding:0}
.notes li{font-weight:700;color:var(--pri);line-height:1.55;padding:.1rem 0}
.notes li+li{border-top:1px dashed #e5d3a1}
h2.ih{display:flex;align-items:center;gap:.55rem}
.hic{display:inline-flex;width:1.9em;height:1.9em;border-radius:50%;background:var(--pri);color:#f6c453;align-items:center;justify-content:center;flex:0 0 auto}
.hic .ic{width:1.15em;height:1.15em;stroke-width:2.1}
.dimcard h3{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.pole{display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border-radius:12px;background:var(--soft);color:var(--pri)}
.pole.b{background:#fdf0e8;color:var(--acc)}
.bar .lbl span{display:inline-flex;align-items:center;gap:.3rem}
.bar .lbl .ic{color:var(--pri2)} .bar .lbl span+span .ic{color:var(--acc)}
.progwrap{display:flex;align-items:center;gap:.5rem;padding-top:30px}
.progwrap .prog{flex:1;position:relative;overflow:visible}
.prog>i{border-radius:99px}
.walker{position:absolute;bottom:100%;width:28px;height:28px;color:var(--gold);transition:left .25s}
.walker .ic{width:28px;height:28px;stroke-width:2}
.fin{width:30px;height:30px;color:var(--gold);stroke-width:2.6}
.qcard{position:relative;overflow:hidden;padding-right:3.2rem}
.qcard .deco{position:absolute;right:.6rem;top:.6rem;width:2.4rem;height:2.4rem;color:#c9a54a;opacity:.7}
.qcard .qtext{margin:.3rem 0}
.disc h3{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.dic{display:inline-flex;width:2.1em;height:2.1em;border-radius:12px;background:var(--soft);color:var(--pri);align-items:center;justify-content:center;flex:0 0 auto}
.disc.str .dic{background:#fdf3c8;color:var(--gold)}
.emb{width:3.4rem;height:3.4rem;flex:0 0 auto}
.typehero{display:flex;gap:1rem;align-items:center}
.typehero .emb{width:4.6rem;height:4.6rem}
.typehero>div{min-width:0}
.tile{display:flex!important;gap:.6rem;align-items:center}
.tile .emb{width:2.4rem;height:2.4rem}
h2.gh{display:flex;align-items:center;gap:.6rem}
h2.gh .emb{width:2.4rem;height:2.4rem}
footer .fnotes{font-weight:700;color:var(--pri);margin-bottom:.4rem}

/* ===== rev2: soft watercolour / cream paper theme ===== */
body{background:var(--bg);background-image:radial-gradient(1200px 500px at 10% -10%,rgba(190,220,238,.55),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(250,226,170,.35),transparent 60%),radial-gradient(1200px 600px at 50% 110%,rgba(200,226,180,.45),transparent 60%);background-attachment:fixed}
header.top{background:rgba(255,251,240,.96);color:var(--pri);box-shadow:0 3px 14px rgba(120,96,50,.12);border-bottom:1px solid #efe3c8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{color:var(--pri)}
.brand .ic{color:#d9963a}
.tbtn{background:#fff;color:var(--pri);border:1.5px solid #d9cba8;border-radius:999px}
nav.tabs button{color:#4a5b66;border-radius:12px 12px 0 0}
nav.tabs button.on{color:var(--pri);border-bottom-color:#e0a64a;background:#fdf1d6}
h1{color:var(--pri);letter-spacing:.02em}
h2{border-left:0;padding-left:0;color:var(--pri)}
.card{background:var(--card);border:1px solid #eee3ca;border-radius:22px;box-shadow:0 6px 18px rgba(120,96,50,.08)}
.btn{border-radius:999px;border:0;background:linear-gradient(180deg,#4a83a8,#2c5a78);box-shadow:0 4px 12px rgba(44,90,120,.25);font-weight:700}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid #b9d0de;box-shadow:0 2px 8px rgba(120,96,50,.08)}
.btn.warn{background:#fff;color:var(--acc);border:2px solid #e7b9a0;box-shadow:none}
.btn.big{min-height:64px;font-size:1.2rem;padding:.7rem 1.8rem;width:100%;max-width:520px}
.notice{background:#fff5e8;border:1.5px solid #f0c9a0;border-radius:20px;color:#4a2a12}
.verse{background:#eef6e9;border-left:5px solid #9cc58f;border-radius:16px}
.verse .vr{color:#3d6b33}
.hic{background:var(--sky);color:var(--pri)}
.pole{background:var(--sky);color:var(--pri);border-radius:50%}
.pole.b{background:#fbe9d8;color:var(--acc)}
.notes{background:#fff7e0;border:2px solid #ecd08e;border-radius:22px}
.notes .nb{background:var(--sky);color:var(--pri)}
.notes li+li{border-top:1px dashed #ecd9a8}
.opt{border:2px solid #d8ccb2;border-radius:18px;background:#fffdf7}
.opt .dot{border-color:#a99d86}
.opt.sel{border-color:var(--pri2);background:#e6f1f8}
.prog{background:#efe7d4;border:1px solid #e0d4b8}
.prog>i{background:linear-gradient(90deg,#9cc58f,#5f9cc0)}
.walker{color:#d9963a}
.qcard .deco{color:#9cc58f}
.bar .trk{background:#f0e9d8;border:1px solid #e3d8bf}
.bar .fl{background:#5f9cc0}.bar .fl.b{background:#d48a5e}
.bar .mid{background:#6b6253}
.near{background:#fff7dc;border:1.5px solid #ecd08e}
.stack div{border:1px solid #eadfc6;border-radius:16px;background:#fffaf0}
.chips button{border-radius:999px;border:1.5px solid #b9d0de;color:var(--pri);background:#fff}
.blind{border-left:5px solid #e7b9a0;border-radius:0 14px 14px 0;background:#fffaf3}
.disc{border:1px solid #eee3ca;border-radius:22px;background:var(--card);box-shadow:0 6px 18px rgba(120,96,50,.07)}
.disc.str{border:2px dashed #e0b85a;background:#fff8e4}
.dic{background:var(--meadow);color:#3d6b33;border-radius:50%}
.disc.str .dic{background:#fbecc0;color:var(--gold)}
.tag{background:#e0a64a;color:#2a2723;border-radius:999px;padding:0 .55rem;font-weight:700}
.hero,.guideart{border-radius:26px;box-shadow:0 8px 24px rgba(120,96,50,.18);border:4px solid #fffaf0;object-fit:cover}
.banner{display:block;width:100%;height:auto;max-height:150px;object-fit:cover;border-radius:22px;border:3px solid #fffaf0;box-shadow:0 6px 16px rgba(120,96,50,.14);margin:.2rem 0 .7rem}
.eyebrow{color:#9a6b1a}
.toast{background:#3d3a33;border-radius:999px}
/* how-to card */
.howto{background:linear-gradient(180deg,#fff4d6,#fffcf3);border:3px solid #edc36a;border-radius:26px;padding:1.1rem 1.1rem 1.2rem;margin:1rem 0;box-shadow:0 10px 26px rgba(200,150,50,.18)}
.howto h2{margin:.1rem 0 .7rem;font-size:1.45rem;display:flex;align-items:center;gap:.55rem}
.howto h2 .hic{background:#f3cf7a;color:#5a3d06}
.howto ol{list-style:none;margin:0;padding:0;counter-reset:hs}
.howto ol>li{counter-increment:hs;position:relative;padding:.45rem 0 .45rem 3rem;min-height:2.6rem;font-size:1.08rem}
.howto ol>li::before{content:counter(hs);position:absolute;left:0;top:.35rem;width:2.2rem;height:2.2rem;border-radius:50%;background:#5f9cc0;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(44,90,120,.25)}
.howto ol>li+li{border-top:1px dashed #ecd9a8}
.likert{display:grid;gap:.25rem;margin:.4rem 0 .1rem;padding:0;list-style:none}
.likert li{display:flex;gap:.5rem;align-items:baseline;font-size:1rem}
.likert b{flex:0 0 7.2em;color:var(--pri)}
.howto .btnrow{justify-content:center;margin:1rem 0 .1rem}
/* characters */
.char{display:block;flex:0 0 auto;width:6.2rem;height:auto;aspect-ratio:280/313;border-radius:20px;background:#fbf5e6;object-fit:cover}
.typehero{background:linear-gradient(135deg,var(--gbg,#e6f0f5),#fffaf0);color:var(--ink);border:2px solid var(--gln,#cfe0ea);border-radius:26px;box-shadow:0 8px 22px rgba(120,96,50,.12)}
.typehero .code{color:var(--gfg,var(--pri))}
.typehero .nm{color:var(--ink)}
.typehero .tg{color:var(--muted)}
.typehero .meta{color:var(--muted);font-size:.9rem}
.typehero .grp{display:inline-block;background:#fff;border:1.5px solid var(--gln,#cfe0ea);color:var(--gfg,var(--pri));border-radius:999px;padding:0 .7rem;font-weight:700;font-size:.9rem}
.typehero .char{width:7.4rem;border:3px solid #fff;box-shadow:0 4px 12px rgba(120,96,50,.15)}
.g-NT{--gbg:#ece6f6;--gln:#cdbfe6;--gfg:#5a4790}
.g-NF{--gbg:#e3f0dc;--gln:#bcd9ad;--gfg:#3d6b33}
.g-SJ{--gbg:#ddeeee;--gln:#acd3d1;--gfg:#2c6664}
.g-SP{--gbg:#fbefcc;--gln:#ebd28e;--gfg:#7a5a0c}
.tiles{gap:.8rem}
.tile{flex-direction:column;align-items:center!important;text-align:center!important;border:2px solid var(--gln,#eadfc6);border-radius:22px;background:linear-gradient(180deg,var(--gbg,#fff),#fffdf6);box-shadow:0 4px 14px rgba(120,96,50,.08);padding:.7rem .5rem .8rem}
.tile .char{width:100%;max-width:150px;border-radius:18px}
.tile .c{color:var(--gfg,var(--pri))}
.tile.me{border-color:#e0a64a;border-width:3px;background:linear-gradient(180deg,#fff1cf,#fffdf6)}
h2.gh{color:var(--gfg,var(--pri))}
.c0{background:#f3cf7a}.c1{background:#bcdcae}.c2{background:#a9cfe4}.c3{background:#d5c8ee}.c4{background:#f2c9b2}
@media(min-width:720px){.char{width:7rem}.typehero .char{width:9rem}}
@media(max-width:560px){.typehero{flex-direction:column;text-align:center;align-items:center}.typehero .char{width:11rem}}
img[data-img]:not([src]){background:linear-gradient(135deg,#f3ead2,#e3eedc 55%,#dfeaf1);color:transparent}
/* ===== devotion tracker additions (same palette as MBTI app) ===== */
.datebig{font-size:1.15rem;font-weight:700;color:var(--muted);margin:-.3rem 0 .6rem}
.chk{display:flex;align-items:center;gap:.8rem;min-height:60px;padding:.55rem 1rem;margin:.45rem 0;border:2px solid #d8ccb2;border-radius:18px;background:#fffdf7;cursor:pointer;font-size:1.1rem;-webkit-tap-highlight-color:transparent}
.chk input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:34px;height:34px;margin:0;border:3px solid #a99d86;border-radius:10px;background:#fff;display:grid;place-content:center;cursor:pointer}
.chk input::after{content:"";width:16px;height:9px;border-left:4px solid #fff;border-bottom:4px solid #fff;transform:rotate(-45deg) translate(1px,-2px);opacity:0}
.chk input:checked{background:#6ea85c;border-color:#5a9149}
.chk input:checked::after{opacity:1}
.chk input:focus-visible{outline:4px solid #f6c453;outline-offset:2px}
.chk:has(input:checked){border-color:#9cc58f;background:#eef6e9;font-weight:700}
.chk .sub{display:block;font-size:.85rem;color:var(--muted);font-weight:400}
.chk.big{font-size:1.2rem;min-height:66px}
textarea,input[type=text],input[type=date],select{width:100%;font-family:inherit;font-size:1.05rem;color:var(--ink);background:#fff;border:2px solid #d8ccb2;border-radius:14px;padding:.65rem .8rem;min-height:56px}
textarea{min-height:5.2em;resize:vertical;line-height:1.6}
textarea:focus,input:focus,select:focus{outline:3px solid #f6c453;border-color:#e0a64a}
label.fl{display:block;font-weight:700;margin:.8rem 0 .3rem;color:var(--pri)}
.cnt{font-size:.85rem;color:var(--muted);text-align:right}
.planopt{display:flex;gap:.8rem;align-items:flex-start;width:100%;text-align:left;font-family:inherit;color:var(--ink);background:#fffdf7;border:2px solid #d8ccb2;border-radius:20px;padding:.8rem 1rem;margin:.5rem 0;cursor:pointer;font-size:1rem;min-height:64px}

<script>
"use strict";
const APP='牛頭角浸信會門徒訓練，靈修打卡及讀經進度表';
const KEY='ntkbcDevotion.v1', FKEY='ntkbcDevotion.font';
const BOOKS=DATA.books, NB=BOOKS.length, NT0=39, PLAN_DAYS=365;
const PLANS={
  bible:{n:'一年讀完全本聖經',d:'由創世記讀到啟示錄，共 1189 章，分 365 日，每日約 3 至 4 章。'},
  ntps:{n:'一年讀完新約＋詩篇＋箴言',d:'新約 260 章，配合詩篇 150 篇及箴言 31 章，分 365 日，每日 1 至 2 章，較輕鬆。'},
  free:{n:'自由記錄',d:'不跟計劃，自己揀讀哪卷書、哪幾章，讀完便剔選記錄。'}
};
const app=document.getElementById('app');
// ---------- storage (with graceful fallback) ----------
const MEM={};let STORE_OK=true;
(function(){try{const t='__t'+Math.random();localStorage.setItem(t,'1');if(localStorage.getItem(t)!=='1')throw 0;localStorage.removeItem(t)}catch(e){STORE_OK=false}})();
const store={get(k){if(STORE_OK){try{return localStorage.getItem(k)}catch(e){}}return k in MEM?MEM[k]:null},
  set(k,v){MEM[k]=v;if(STORE_OK){try{localStorage.setItem(k,v);return true}catch(e){STORE_OK=false;renderBanners()}}return false},
  del(k){delete MEM[k];if(STORE_OK){try{localStorage.removeItem(k)}catch(e){}}}};
function blank(){return {v:1,plan:null,start:null,name:'',read:{},days:{}}}
function clean(o){
  if(!o||typeof o!=='object')return null;
  const s=blank();const D=/^\d{4}-\d{2}-\d{2}$/;
  if(o.plan&&PLANS[o.plan])s.plan=o.plan;
  if(typeof o.start==='string'&&D.test(o.start))s.start=o.start;
  if(typeof o.name==='string')s.name=o.name.slice(0,40);
  if(o.read&&typeof o.read==='object')for(const k in o.read){if(validKey(k)&&typeof o.read[k]==='string'&&D.test(o.read[k]))s.read[k]=o.read[k]}
  if(o.days&&typeof o.days==='object')for(const d in o.days){const r=o.days[d];if(!D.test(d)||!r||typeof r!=='object')continue;
    const x={ch:Array.isArray(r.ch)?r.ch.filter(validKey):[],dev:!!r.dev,pray:!!r.pray,note:typeof r.note==='string'?r.note.slice(0,500):'',pn:typeof r.pn==='string'?r.pn.slice(0,500):''};
    if(hasAny(x))s.days[d]=x}
  if(s.plan&&!s.start)s.start=today();
  return s;
}
function validKey(k){const m=/^(\d+):(\d+)$/.exec(k);if(!m)return false;const b=+m[1],c=+m[2];return b>=0&&b<NB&&c>=1&&c<=BOOKS[b][2]}
function hasAny(r){return !!(r&&((r.ch&&r.ch.length)||r.dev||r.pray||(r.note||'').trim()||(r.pn||'').trim()))}
function load(){try{const s=clean(JSON.parse(store.get(KEY)||'null'));if(s)return s}catch(e){}return blank()}
let S=load();
function save(){return store.set(KEY,JSON.stringify(S))}
// ---------- 全組打卡（網上版：名稱＋是否已打卡會傳到全組打卡表；領受及禱告永不傳出） ----------
const GKEY='ntkbcDevotion.group', ONLINE_URL='https://sites.google.com/view/ntkbc-devotion';
const ONLINE=!!(window.google&&window.google.script&&window.google.script.run);
const DRE=/^\d{4}-\d{2}-\d{2}$/;
function cleanName(v){return Array.from(String(v==null?'':v).replace(/[\u0000-\u001f\u007f<>]/g,'').replace(/\s+/g,' ').trim().replace(/^[=+\-@'\s]+/,'')).slice(0,20).join('').trim()}
function gload(){try{const o=JSON.parse(store.get(GKEY)||'null');if(o&&typeof o==='object')return {name:cleanName(o.name),pend:Array.isArray(o.pend)?o.pend.filter(p=>p&&DRE.test(p.d)&&(p.op==='in'||p.op==='out')).map(p=>({op:p.op,d:p.d,x:String(p.x||'').slice(0,40)})).slice(-60):[]}}catch(e){}return {name:'',pend:[]}}
let G=gload();
function gsave(){store.set(GKEY,JSON.stringify(G))}
function gcall(fn,args){return new Promise((res,rej)=>{let done=false;const tm=setTimeout(()=>{if(!done){done=true;rej(new Error('timeout'))}},25000);
  const fin=(f,v)=>{if(done)return;done=true;clearTimeout(tm);f(v)};
  try{google.script.run.withSuccessHandler(v=>fin(res,v)).withFailureHandler(e=>fin(rej,e))[fn](...args)}catch(e){fin(rej,e)}})}
function extraOf(r){const a=[];if(r&&r.ch&&r.ch.length)a.push('讀經 '+r.ch.length+' 章');if(r&&r.dev)a.push('靈修');if(r&&r.pray)a.push('禱告');return a.join('・')||'已打卡'}
function queue(op,d,x){G.pend=G.pend.filter(p=>p.d!==d);G.pend.push({op,d,x:x||''});gsave()}
let SYNC='',FLUSHING=null;
function flush(){
  if(!ONLINE)return Promise.resolve(false);
  if(!G.name){SYNC=G.pend.length?'noname':'';syncUi();return Promise.resolve(false)}
  if(FLUSHING)return FLUSHING;
  if(!G.pend.length)return Promise.resolve(true);
  SYNC='busy';syncUi();

function cnt(el){el.nextElementSibling.firstElementChild.textContent=el.value.length}
function applyPend(t){let added=0,removed=0;
  for(const k in PEND){if(!validKey(k))continue;
    if(PEND[k]&&!S.read[k]){S.read[k]=t;added++;const r=S.days[t]||(S.days[t]={ch:[],dev:false,pray:false,note:'',pn:''});if(!r.ch.includes(k))r.ch.push(k)}
    else if(!PEND[k]&&S.read[k]){delete S.read[k];removed++;for(const d in S.days){const r=S.days[d];r.ch=r.ch.filter(x=>x!==k);if(!hasAny(r))delete S.days[d]}}}
  PEND={};return {added,removed}}
function saveToday(){if(SHOWN_DAY&&SHOWN_DAY!==today()){viewToday();toast('已經是新的一天，請重新填寫今天的打卡');return}
  const t=today();const had=isIn(t);const gn=document.getElementById('gname');if(ONLINE&&gn&&!G.name&&cleanName(gn.value))setName(cleanName(gn.value));
  const r=S.days[t]||{ch:[],dev:false,pray:false,note:'',pn:''};S.days[t]=r;
  r.dev=document.getElementById('dev').checked;r.pray=document.getElementById('pray').checked;
  r.note=document.getElementById('note').value.trim().slice(0,200);r.pn=document.getElementById('pn').value.trim().slice(0,200);
  const ch=applyPend(t);
  if(S.days[t]&&S.days[t].ch)S.days[t].ch.sort((a,b)=>ALL.indexOf(a)-ALL.indexOf(b));
  if(!hasAny(S.days[t])){delete S.days[t];save();if(ONLINE&&had){queue('out',t);viewToday();flush();toast('已取消今日打卡');return}toast('未有剔選任何項目');return}
  const ok=save();const sk=streak();
  if(ONLINE)queue('in',t,extraOf(S.days[t]));
  viewToday();renderBanners();if(ONLINE)flush();
  const msg=ENC[Math.floor(Math.random()*ENC.length)];
  document.getElementById('enc').innerHTML=`<div class="encour" id="encour" role="status">${ic('x-sun')}<div>${msg}<span class="s">${ch.added?`今天記錄了 ${ch.added} 章經文。`:''}已連續打卡 ${sk} 日${ok?'':'（注意：這個瀏覽器未能儲存紀錄）'}。</span></div></div>`;

function upcoming(st){const p=plan(S.plan);const s=Math.max(0,Math.min(st.n-1,PLAN_DAYS-1));const rows=[];
  for(let d=s;d<Math.min(s+7,PLAN_DAYS);d++)rows.push(`<li><b>第 ${d+1} 日（${sdate(addD(S.start,d))}）</b>${dayDone(p[d])?' <span class="pill g">已讀</span>':''}<br>${esc(fmt(p[d]))}</li>`);
  return `<details class="more" id="upcoming"><summary>${ic('x-cal')}接下來七日的經文</summary><div class="in"><ul class="clean">${rows.join('')}</ul></div></details>`}
function tiles(a,z){let h='';for(let b=a;b<z;b++){const n=BOOKS[b][2];let r=0;for(let c=1;c<=n;c++)if(S.read[K(b,c)])r++;const f=r/n;const l=r===0?0:r===n?3:f>=.5?2:1;
  h+=`<button type="button" class="btile l${l}${SELB===b?' cur':''}" data-b="${b}" onclick="showBook(${b})" aria-label="${BOOKS[b][0]}：已讀 ${r}／${n}"><span class="bn">${BOOKS[b][0]}</span><span class="bc">${r===n?'✓ 完成':r+'／'+n}</span><span class="bf" style="width:${(f*100).toFixed(1)}%"></span></button>`}return h}
function showBook(b,noScroll){SELB=b;PEND={};const n=BOOKS[b][2];let r=0;for(let c=1;c<=n;c++)if(S.read[K(b,c)])r++;

  el.innerHTML=`<div class="card" id="bookcard"><div class="dayhead"><h3 style="margin:.1rem 0">${BOOKS[b][0]}</h3><span class="pill${r===n?' g':''}">已讀 ${r}／${n}</span></div>

   <div class="btnrow"><button class="btn" id="saveBook" onclick="saveBook()">儲存</button><button class="btn ghost" onclick="SELB=null;document.getElementById('bookpanel').innerHTML='';document.querySelectorAll('.btile').forEach(t=>t.classList.remove('cur'))">關閉</button></div></div>`;

function saveBook(){const t=today();let a=0,rm=0;
  for(const k in PEND){if(!validKey(k))continue;if(PEND[k]&&!S.read[k]){S.read[k]=t;a++}else if(!PEND[k]&&S.read[k]){delete S.read[k];rm++;for(const d in S.days){const r=S.days[d];r.ch=r.ch.filter(x=>x!==k);if(!hasAny(r))delete S.days[d]}}}
  PEND={};save();const y=scrollY;viewProgress();renderBanners();window.scrollTo(0,y);toast(a||rm?`已更新（新增 ${a} 章${rm?`，取消 ${rm} 章`:''}）`:'沒有更改')}
function lvl(d){const r=S.days[d];if(!hasAny(r))return 0;const n=r.ch.length+(r.dev?1:0)+(r.pray?1:0);return r.ch.length>=3&&r.dev&&r.pray||n>=5?3:r.ch.length?2:1}
function calHtml(){const [y,m]=CAL;const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),t=today();let cnt=0;
  let h=`<div class="calhead"><button class="btn ghost" onclick="calMove(-1)" aria-label="上一個月">‹</button><b id="calm">${y}年${m+1}月</b><button class="btn ghost" onclick="calMove(1)" aria-label="下一個月">›</button></div><div class="cal">`;

  h+=`</div><div class="legend"><span><i style="background:#fbe7b0"></i>靈修／禱告</span><span><i style="background:#c9e2b8"></i>有讀經</span><span><i style="background:#7fb26a"></i>讀經＋靈修＋禱告</span></div><p>本月打卡 <b id="calcnt">${cnt}</b> 日</p><div id="calday">${SELD?dayDetail(SELD):''}</div>`;return h}

function entryHtml(d){const r=S.days[d];
  if(EDIT===d)return `<div class="entry" id="e-${d}"><div class="ed">${cdate(d,1)}</div><label class="fl" for="en">一句領受／默想</label><textarea id="en" maxlength="200">${esc(r.note)}</textarea><label class="fl" for="ep">禱告事項</label><textarea id="ep" maxlength="200">${esc(r.pn)}</textarea><div class="btnrow"><button class="btn" onclick="saveEdit('${d}')">儲存</button><button class="btn ghost" onclick="EDIT=null;viewRecords()">取消</button></div></div>`;
  return `<div class="entry" id="e-${d}"><div class="ed">${cdate(d,1)}</div>${r.ch.length?`<div class="er">讀經：${esc(fmt(r.ch))}</div>`:''}${r.note?`<p><b>領受：</b>${esc(r.note)}</p>`:''}${r.pn?`<p><b>禱告事項：</b>${esc(r.pn)}</p>`:''}<div class="btnrow" style="margin:.3rem 0 0"><button class="btn ghost" onclick="EDIT='${d}';viewRecords();document.getElementById('e-${d}').scrollIntoView({block:'center'})">編輯</button><button class="btn warn" onclick="delEntry('${d}')">刪除</button></div></div>`}
function saveEdit(d){const r=S.days[d];r.note=document.getElementById('en').value.trim().slice(0,200);r.pn=document.getElementById('ep').value.trim().slice(0,200);if(!hasAny(r))delete S.days[d];EDIT=null;save();viewRecords();toast('已儲存')}
function delEntry(d){if(!confirm(`刪除 ${cdate(d)} 的領受及禱告事項？（讀經及打卡紀錄會保留）`))return;const r=S.days[d];r.note='';r.pn='';if(!hasAny(r))delete S.days[d];save();viewRecords();toast('已刪除')}
function last7(){const out=[];for(let i=6;i>=0;i--){const d=addD(today(),-i);out.push([d,isIn(d)])}return out}
function summaryData(){const st=planStatus(),pk=planKeys(),rd=readCount(pk);
  return {name:S.name,date:today(),plan:S.plan?PLANS[S.plan].n:'未設定',pct:pk.length?Math.floor(rd/pk.length*1000)/10:0,rd,tot:pk.length,day:st&&!st.notStarted?Math.min(st.n,PLAN_DAYS):null,behind:st?st.behind.length:0,
   streak:streak(),longest:longest(),total:totalDays(),all:readCount(ALL),books:booksDone(),wk:last7(),badges:badges().filter(b=>b[2]).map(b=>b[0])}}
function summaryText(x){return `【${APP}】\n${x.name?x.name+' ':''}進度摘要（${cdate(x.date)}）\n讀經計劃：${x.plan}${x.day?`（第 ${x.day} 日）`:''}\n計劃進度：${x.pct}%（${x.rd}／${x.tot} 章）\n連續打卡：${x.streak} 日｜累計打卡：${x.total} 日\n最近七日打卡：${x.wk.filter(w=>w[1]).length}／7 日\n全本聖經已讀：${x.all}／1189 章，讀完 ${x.books} 卷書\n徽章：${x.badges.length?x.badges.join('、'):'（未有）'}`}
function genSummary(){S.name=document.getElementById('nm').value.trim().slice(0,40);save();const x=summaryData();
  document.getElementById('sumout').innerHTML=`<div class="summary" id="sumcard"><div class="st">${APP}</div><div class="sn">${x.name?esc(x.name)+' 的':'我的'}進度摘要</div><div class="small">${cdate(x.date,1)}</div>
  <table><tr><td>讀經計劃</td><td>${esc(x.plan)}${x.day?`<br><span class="small">第 ${x.day} 日</span>`:''}</td></tr><tr><td>計劃進度</td><td>${x.pct}%（${x.rd}／${x.tot} 章）</td></tr><tr><td>連續打卡</td><td>${x.streak} 日</td></tr><tr><td>累計打卡</td><td>${x.total} 日</td></tr>
  <tr><td>最近七日</td><td><div class="wk">${x.wk.map(([d,y])=>`<i class="${y?'y':''}" title="${d}">${WD[parseD(d).getDay()]}</i>`).join('')}</div></td></tr><tr><td>全本聖經</td><td>${x.all}／1189 章・${x.books} 卷</td></tr><tr><td>徽章</td><td>${x.badges.length?esc(x.badges.join('、')):'—'}</td></tr></table>
  <div class="sf">牛頭角浸信會門徒訓練參與者使用｜吳國强牧師 2026年建立</div></div>
  <div class="btnrow"><button class="btn" id="copySum" onclick="copyText(summaryText(summaryData()))">${ic('x-copy')}複製文字（WhatsApp 用）</button></div><p class="small">亦可以截圖上面的摘要卡，再傳給組長。</p>`;
  document.getElementById('sumcard').scrollIntoView({behavior:'smooth',block:'center'})}
function copyText(t){const done=()=>toast('已複製，可以貼到 WhatsApp');
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);if(ok)done();else prompt('請長按以下文字複製：',t)};
  try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb()}catch(e){fb()}}
function backupObj(){return {app:'ntkbc-devotion',v:1,exported:new Date().toISOString(),data:S}}
function exportData(){const txt=JSON.stringify(backupObj());const name='靈修打卡備份-'+today()+'.json';
  try{const blob=new Blob([txt],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);toast('已匯出：'+name)}
  catch(e){showBackupText();toast('未能下載檔案，請改用文字備份')}}
function showBackupText(){const ta=document.getElementById('bktext');ta.value=JSON.stringify(backupObj());ta.closest('details').open=true;ta.focus();ta.select()}
function restoreFrom(txt){let o=null;try{o=JSON.parse(txt)}catch(e){}
  const d=o&&o.app==='ntkbc-devotion'&&o.data?clean(o.data):null;
  if(!d){alert('這不是有效的備份檔，未有更改任何紀錄。');return false}
  const n=Object.keys(d.days).length,c=Object.keys(d.read).length;
  if(!confirm(`還原這個備份？（${n} 日打卡、${c} 章已讀）\n目前裝置上的紀錄會被取代。`))return false;
  S=d;save();toast('已還原備份');go(S.plan?'today':'help');return true}
function importFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{restoreFrom(String(r.result));inp.value=''};r.readAsText(f)}
function importText(){const t=document.getElementById('bktext').value.trim();if(!t){toast('請先貼上備份文字');return}restoreFrom(t)}
function resetAll(){if(!confirm('確定要清除這部裝置上的所有紀錄嗎？'))return;if(!confirm('再確認一次：清除後不能復原（除非你有備份）。'))return;S=blank();store.del(KEY);save();toast('已清除所有紀錄');go('help')}
// ---------- 使用說明 ----------
function viewHelp(){
  app.innerHTML=`${im('hero',960,540,'hero','清晨窗前的聖經、熱茶與小麻雀，遠處山丘上有小教堂')}
  <p class="eyebrow">每天與主同行</p>
  <h1>${APP}</h1>
  <p class="lead">一個簡單的小工具，幫助你每天記錄讀經、靈修和禱告，看見自己一步一步的成長。</p>
  <div class="notes" role="note" aria-label="使用者及建立者"><span class="nb">${ic('i-cross')}</span><ul><li>牛頭角浸信會門徒訓練參與者使用</li><li>吳國强牧師 2026年建立</li><li>免費使用・毋須登記・領受及禱告只存於本機</li></ul></div>
  ${tipCard()}
  ${S.plan?`<div class="btnrow"><button class="btn big" id="toToday" onclick="go('today')">${ic('x-check')}去今日打卡</button></div>`:setupCard(false)}
  <div class="howto" id="howto"><h2><span class="hic">${ic('d-journal')}</span>怎樣使用</h2><ol>
   <li>第一次使用時，揀選一個<b>讀經計劃</b>和開始日期。</li>
   <li>每天打開「<b>今日打卡</b>」，讀完經文便剔選章數；靈修和禱告後亦剔選。</li>
   <li>可以寫下<b>一句領受</b>或<b>禱告事項</b>（可選），最後按「儲存今日打卡」。</li>
   <li>漏了的日子可以在「慢慢追讀」補讀，不用心急。</li>
   <li>在「<b>讀經進度</b>」看六十六卷書和打卡月曆；在「<b>我的紀錄</b>」看徽章、產生進度摘要給組長，並定期<b>匯出備份</b>。</li>
   <li>在「<b>全組打卡</b>」填一個名稱（或暱稱），便可以看到組員這星期有沒有打卡（只顯示 ✓，不顯示內容）。${ONLINE?'':'（需要用網上版連結開啟）'}</li></ol></div>
  <h2 class="ih"><span class="hic">${ic('i-book')}</span>三個讀經計劃</h2>
  ${Object.keys(PLANS).map(k=>`<div class="card"><h3 style="margin-top:.1rem">${PLANS[k].n}</h3><p>${PLANS[k].d}</p></div>`).join('')}
  ${verse('詩119:105')}
  <h2 class="ih" id="leader"><span class="hic">${ic('i-E')}</span>組長指引</h2>
  ${im('guide',800,450,'guideart','幾位朋友在大樹下圍坐，中間放着聖經和茶壺')}
  <div class="card"><h3 style="margin-top:.1rem">怎樣在小組介紹</h3><ol>
   <li>在聚會中把連結傳到 WhatsApp 群組，即場陪組員用 Chrome／Safari 開啟，並「加到主畫面」。</li>
   <li>一起揀選讀經計劃。全組揀同一個計劃，方便彼此分享；初信或較忙的組員可以揀「新約＋詩篇＋箴言」。</li>
   <li>示範一次「今日打卡」：剔選章數、寫一句領受、按儲存。</li>
   <li>提醒大家每月按「匯出備份」，並把備份檔傳給自己保存。</li></ol></div>
  <div class="card"><h3 style="margin-top:.1rem">建議每週分享</h3><ul class="clean">
   <li>每星期聚會用 5 至 10 分鐘，邀請組員自願分享<b>一句本週領受</b>。</li>

   <li>以彼此代禱作結，為進度較慢或忙碌的組員打氣。</li></ul></div>
  <div class="card"><h3 style="margin-top:.1rem">帶領時的提醒：恩典，不是律法</h3><ul class="clean">

   <li><b>不責備漏打卡：</b>漏了便重新開始，連續紀錄中斷也沒關係；本程式不會出現責備的字眼。</li>
   <li><b>重質不重量：</b>讀得慢、讀得少但用心默想，比趕進度更寶貴。</li>

  ${verse('太11:28')}`;
}
renderBanners();route();
if(ONLINE&&G.pend.length&&G.name)flush();
window.APPREADY=true;

</script>
