<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fbf5e6">
<title>牛頭角浸信會門徒訓練，屬靈恩賜自我認識</title>
<style>
:root{--ink:#2a2723;--muted:#4a443b;--bg:#fbf5e6;--card:#fffdf6;--line:#eadfc6;--pri:#2c5a78;--pri2:#3a7096;--acc:#a8502a;--soft:#e6f0f5;--gold:#80600f;--ok:#4a7a38;--sky:#dcecf5;--meadow:#e3efd6;--sun:#f3cf7a;--fs:19px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;line-height:1.75;letter-spacing:.02em}
a{color:var(--pri2)}
header.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topin{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:.4rem;padding:.45rem .8rem}
.brand{font-weight:700;font-size:clamp(.8rem,4.1vw,1.08rem);line-height:1.3;flex:1 1 auto;min-width:0;cursor:pointer;background:none;border:0;color:#fff;text-align:left;padding:.3rem 0;font-family:inherit;display:flex;align-items:center;gap:.45rem;overflow-wrap:anywhere}
.brand .ic{width:1.5em;height:1.5em;flex:0 0 auto;color:#f6c453;stroke-width:2.4}
.tbtn{flex:0 0 auto}
.tbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;min-height:44px;min-width:44px;padding:0 .6rem;font-size:.9rem;font-family:inherit;cursor:pointer}
nav.tabs{max-width:960px;margin:0 auto;display:flex;overflow-x:auto;gap:.3rem;padding:0 .6rem .5rem}
nav.tabs button{flex:0 0 auto;background:transparent;color:#e5edf7;border:0;border-bottom:3px solid transparent;font-size:.92rem;padding:.35rem .45rem;min-height:44px;font-family:inherit;cursor:pointer}
nav.tabs button.on{color:#fff;border-bottom-color:#f6c453;font-weight:700}
main{max-width:960px;margin:0 auto;padding:1rem .9rem 4rem}
h1{font-size:1.6rem;line-height:1.35;margin:.4rem 0 .8rem;color:var(--pri)}
h2{font-size:1.3rem;line-height:1.4;margin:1.6rem 0 .6rem;color:var(--pri);border-left:6px solid var(--acc);padding-left:.55rem}
h3{font-size:1.1rem;margin:1.1rem 0 .4rem;color:var(--ink)}
p{margin:.5rem 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin:.9rem 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.lead{font-size:1.08rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:56px;padding:.6rem 1.3rem;border-radius:14px;border:2px solid var(--pri);background:var(--pri);color:#fff;font-size:1.05rem;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;margin:.3rem .3rem .3rem 0}
.btn.ghost{background:#fff;color:var(--pri)}
.btn.warn{background:#fff;color:var(--acc);border-color:var(--acc)}
.btn:focus-visible,.opt:focus-visible,.tbtn:focus-visible,nav.tabs button:focus-visible,.tile:focus-visible{outline:4px solid #f6c453;outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:.2rem;margin:.8rem 0}
.notice{background:#fff7ed;border:2px solid #fdba74;border-radius:14px;padding:.8rem 1rem;color:#431407}
.verse{background:var(--soft);border-left:5px solid var(--pri2);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0}
.verse .vt{font-size:1.05rem}
.verse .vr{font-weight:700;color:var(--pri);margin-top:.25rem}
.verse .vw{color:var(--muted);font-size:.93rem;margin-top:.3rem}
ul.clean{padding-left:1.2rem;margin:.4rem 0}
ul.clean li{margin:.35rem 0}
.dimgrid{display:grid;gap:.7rem}
@media(min-width:720px){.dimgrid{grid-template-columns:1fr 1fr}}
/* quiz */
.prog{height:16px;background:#e5e7eb;border-radius:99px;overflow:hidden;border:1px solid #cbd5e1}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));width:0;transition:width .25s}
.progtxt{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);margin:.35rem 0 .2rem}
.qtext{font-size:1.35rem;font-weight:700;line-height:1.6;margin:1rem 0 1.1rem;min-height:4.4em}
.opts{display:grid;gap:.6rem}
.opt{display:flex;align-items:center;gap:.8rem;width:100%;min-height:62px;padding:.6rem 1rem;border:2px solid #9ca3af;border-radius:14px;background:#fff;color:var(--ink);font-size:1.1rem;font-family:inherit;text-align:left;cursor:pointer}
.opt .dot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:3px solid #6b7280;display:inline-block}
.opt.sel{border-color:var(--pri);background:#e8eef7;font-weight:700}
.opt.sel .dot{border-color:var(--pri);background:radial-gradient(circle,var(--pri) 0 45%,#fff 50%)}
@media(hover:hover){.opt:hover{border-color:var(--pri2)}}
.qnav{display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem}
/* result */
.typehero{background:var(--pri);color:#fff;border-radius:18px;padding:1.1rem 1.2rem;margin:.8rem 0}
.typehero .code{font-size:3rem;font-weight:800;letter-spacing:.12em;line-height:1.1}
.typehero .nm{font-size:1.45rem;font-weight:700}
.typehero .tg{opacity:.95;margin-top:.3rem}
.bar{margin:.9rem 0}
.bar .lbl{display:flex;justify-content:space-between;font-weight:700;font-size:1rem}
.bar .trk{position:relative;height:24px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:.3rem 0;border:1px solid #cbd5e1}
.bar .fl{position:absolute;top:0;bottom:0;background:var(--pri2)}
.bar .fl.b{background:var(--acc)}
.bar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#111}
.bar .cl{font-size:.92rem;color:var(--muted)}
.near{background:#fefce8;border:2px solid #facc15;border-radius:12px;padding:.6rem .8rem;margin:.4rem 0;font-size:.95rem;color:#422006}
.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5rem}
.stack div{border:1px solid var(--line);border-radius:12px;padding:.55rem .7rem;background:#fff}
.stack b{color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.chips button{font-family:inherit;color:var(--pri2);cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:0 .8rem;border:1px solid var(--pri2);border-radius:99px;background:#fff;text-decoration:none;font-size:.92rem}
.blind{border-left:5px solid var(--acc);padding:.2rem .8rem;margin:.6rem 0;background:#fff}
.blind b{color:var(--acc)}
.disc{border:1px solid var(--line);border-radius:14px;padding:.7rem .9rem;margin:.7rem 0;background:#fff}
.disc.str{border:2px dashed var(--gold);background:#fffbeb}
.disc h3{margin:.1rem 0 .3rem}
.disc ol{margin:.3rem 0;padding-left:1.4rem}
.disc ol li{margin:.25rem 0}
.why{color:var(--muted);font-size:.95rem}
.tag{display:inline-block;font-size:.8rem;background:var(--gold);color:#fff;border-radius:6px;padding:0 .4rem;margin-left:.3rem;vertical-align:middle}
/* browse */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:block;border:2px solid var(--line);border-radius:14px;padding:.7rem;background:#fff;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);min-height:96px}
.tile .c{font-size:1.4rem;font-weight:800;color:var(--pri);letter-spacing:.06em}
.tile .n{font-size:.95rem}
.tile.me{border-color:var(--acc);background:#fff7ed}
.small{font-size:.9rem;color:var(--muted)}
footer{max-width:960px;margin:0 auto;padding:1rem .9rem 2.5rem;font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#111;color:#fff;padding:.7rem 1.1rem;border-radius:12px;font-size:1rem;z-index:20;display:none}
.printonly{display:none}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:0 0 auto}
.hero,.guideart{display:block;width:100%;height:auto;border-radius:18px;margin:.6rem 0 .4rem;box-shadow:0 2px 8px rgba(31,58,95,.18)}
.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.08em;margin:.6rem 0 0}
.notes{display:flex;gap:.8rem;align-items:center;background:#fffbeb;border:2px solid #c9a54a;border-radius:16px;padding:.7rem 1rem;margin:.8rem 0;color:#1f2937}
.notes .nb{flex:0 0 auto;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--pri);color:#f6c453;display:flex;align-items:center;justify-content:center}
.notes .nb .ic{width:1.6em;height:1.6em;stroke-width:2.6}
.notes ul{list-style:none;margin:0;padding:0}
.notes li{font-weight:700;color:var(--pri);line-height:1.55;padding:.1rem 0}
.notes li+li{border-top:1px dashed #e5d3a1}
h2.ih{display:flex;align-items:center;gap:.55rem}
.hic{display:inline-flex;width:1.9em;height:1.9em;border-radius:50%;background:var(--pri);color:#f6c453;align-items:center;justify-content:center;flex:0 0 auto}
.hic .ic{width:1.15em;height:1.15em;stroke-width:2.1}
.dimcard h3{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.pole{display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border-radius:12px;background:var(--soft);color:var(--pri)}
.pole.b{background:#fdf0e8;color:var(--acc)}
.bar .lbl span{display:inline-flex;align-items:center;gap:.3rem}
.bar .lbl .ic{color:var(--pri2)} .bar .lbl span+span .ic{color:var(--acc)}
.progwrap{display:flex;align-items:center;gap:.5rem;padding-top:30px}
.progwrap .prog{flex:1;position:relative;overflow:visible}
.prog>i{border-radius:99px}
.walker{position:absolute;bottom:100%;width:28px;height:28px;color:var(--gold);transition:left .25s}
.walker .ic{width:28px;height:28px;stroke-width:2}
.fin{width:30px;height:30px;color:var(--gold);stroke-width:2.6}
.qcard{position:relative;overflow:hidden;padding-right:3.2rem}
.qcard .deco{position:absolute;right:.6rem;top:.6rem;width:2.4rem;height:2.4rem;color:#c9a54a;opacity:.7}
.qcard .qtext{margin:.3rem 0}
.disc h3{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.dic{display:inline-flex;width:2.1em;height:2.1em;border-radius:12px;background:var(--soft);color:var(--pri);align-items:center;justify-content:center;flex:0 0 auto}
.disc.str .dic{background:#fdf3c8;color:var(--gold)}
.emb{width:3.4rem;height:3.4rem;flex:0 0 auto}
.typehero{display:flex;gap:1rem;align-items:center}
.typehero .emb{width:4.6rem;height:4.6rem}
.typehero>div{min-width:0}
.tile{display:flex!important;gap:.6rem;align-items:center}
.tile .emb{width:2.4rem;height:2.4rem}
h2.gh{display:flex;align-items:center;gap:.6rem}
h2.gh .emb{width:2.4rem;height:2.4rem}
footer .fnotes{font-weight:700;color:var(--pri);margin-bottom:.4rem}

/* ===== rev2: soft watercolour / cream paper theme ===== */
body{background:var(--bg);background-image:radial-gradient(1200px 500px at 10% -10%,rgba(190,220,238,.55),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(250,226,170,.35),transparent 60%),radial-gradient(1200px 600px at 50% 110%,rgba(200,226,180,.45),transparent 60%);background-attachment:fixed}
header.top{background:rgba(255,251,240,.96);color:var(--pri);box-shadow:0 3px 14px rgba(120,96,50,.12);border-bottom:1px solid #efe3c8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{color:var(--pri)}
.brand .ic{color:#d9963a}
.tbtn{background:#fff;color:var(--pri);border:1.5px solid #d9cba8;border-radius:999px}
nav.tabs button{color:#4a5b66;border-radius:12px 12px 0 0}
nav.tabs button.on{color:var(--pri);border-bottom-color:#e0a64a;background:#fdf1d6}
h1{color:var(--pri);letter-spacing:.02em}
h2{border-left:0;padding-left:0;color:var(--pri)}
.card{background:var(--card);border:1px solid #eee3ca;border-radius:22px;box-shadow:0 6px 18px rgba(120,96,50,.08)}
.btn{border-radius:999px;border:0;background:linear-gradient(180deg,#4a83a8,#2c5a78);box-shadow:0 4px 12px rgba(44,90,120,.25);font-weight:700}
.btn.ghost{background:#fff;color:var(--pri);border:2px solid #b9d0de;box-shadow:0 2px 8px rgba(120,96,50,.08)}
.btn.warn{background:#fff;color:var(--acc);border:2px solid #e7b9a0;box-shadow:none}
.btn.big{min-height:64px;font-size:1.2rem;padding:.7rem 1.8rem;width:100%;max-width:520px}
.notice{background:#fff5e8;border:1.5px solid #f0c9a0;border-radius:20px;color:#4a2a12}
.verse{background:#eef6e9;border-left:5px solid #9cc58f;border-radius:16px}
.verse .vr{color:#3d6b33}
.hic{background:var(--sky);color:var(--pri)}
.pole{background:var(--sky);color:var(--pri);border-radius:50%}
.pole.b{background:#fbe9d8;color:var(--acc)}
.notes{background:#fff7e0;border:2px solid #ecd08e;border-radius:22px}
.notes .nb{background:var(--sky);color:var(--pri)}
.notes li+li{border-top:1px dashed #ecd9a8}
.opt{border:2px solid #d8ccb2;border-radius:18px;background:#fffdf7}
.opt .dot{border-color:#a99d86}
.opt.sel{border-color:var(--pri2);background:#e6f1f8}
.prog{background:#efe7d4;border:1px solid #e0d4b8}
.prog>i{background:linear-gradient(90deg,#9cc58f,#5f9cc0)}
.walker{color:#d9963a}
.qcard .deco{color:#9cc58f}
.bar .trk{background:#f0e9d8;border:1px solid #e3d8bf}
.bar .fl{background:#5f9cc0}.bar .fl.b{background:#d48a5e}
.bar .mid{background:#6b6253}
.near{background:#fff7dc;border:1.5px solid #ecd08e}
.stack div{border:1px solid #eadfc6;border-radius:16px;background:#fffaf0}
.chips button{border-radius:999px;border:1.5px solid #b9d0de;color:var(--pri);background:#fff}
.blind{border-left:5px solid #e7b9a0;border-radius:0 14px 14px 0;background:#fffaf3}
.disc{border:1px solid #eee3ca;border-radius:22px;background:var(--card);box-shadow:0 6px 18px rgba(120,96,50,.07)}
.disc.str{border:2px dashed #e0b85a;background:#fff8e4}
.dic{background:var(--meadow);color:#3d6b33;border-radius:50%}
.disc.str .dic{background:#fbecc0;color:var(--gold)}
.tag{background:#e0a64a;color:#2a2723;border-radius:999px;padding:0 .55rem;font-weight:700}
.hero,.guideart{border-radius:26px;box-shadow:0 8px 24px rgba(120,96,50,.18);border:4px solid #fffaf0;object-fit:cover}
.banner{display:block;width:100%;height:auto;max-height:150px;object-fit:cover;border-radius:22px;border:3px solid #fffaf0;box-shadow:0 6px 16px rgba(120,96,50,.14);margin:.2rem 0 .7rem}
.eyebrow{color:#9a6b1a}
.toast{background:#3d3a33;border-radius:999px}
/* how-to card */
.howto{background:linear-gradient(180deg,#fff4d6,#fffcf3);border:3px solid #edc36a;border-radius:26px;padding:1.1rem 1.1rem 1.2rem;margin:1rem 0;box-shadow:0 10px 26px rgba(200,150,50,.18)}
.howto h2{margin:.1rem 0 .7rem;font-size:1.45rem;display:flex;align-items:center;gap:.55rem}
.howto h2 .hic{background:#f3cf7a;color:#5a3d06}
.howto ol{list-style:none;margin:0;padding:0;counter-reset:hs}
.howto ol>li{counter-increment:hs;position:relative;padding:.45rem 0 .45rem 3rem;min-height:2.6rem;font-size:1.08rem}
.howto ol>li::before{content:counter(hs);position:absolute;left:0;top:.35rem;width:2.2rem;height:2.2rem;border-radius:50%;background:#5f9cc0;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(44,90,120,.25)}
.howto ol>li+li{border-top:1px dashed #ecd9a8}
.likert{display:grid;gap:.25rem;margin:.4rem 0 .1rem;padding:0;list-style:none}
.likert li{display:flex;gap:.5rem;align-items:baseline;font-size:1rem}
.likert b{flex:0 0 7.2em;color:var(--pri)}
.howto .btnrow{justify-content:center;margin:1rem 0 .1rem}
/* characters */
.char{display:block;flex:0 0 auto;width:6.2rem;height:auto;aspect-ratio:280/313;border-radius:20px;background:#fbf5e6;object-fit:cover}
.typehero{background:linear-gradient(135deg,var(--gbg,#e6f0f5),#fffaf0);color:var(--ink);border:2px solid var(--gln,#cfe0ea);border-radius:26px;box-shadow:0 8px 22px rgba(120,96,50,.12)}
.typehero .code{color:var(--gfg,var(--pri))}
.typehero .nm{color:var(--ink)}
.typehero .tg{color:var(--muted)}
.typehero .meta{color:var(--muted);font-size:.9rem}
.typehero .grp{display:inline-block;background:#fff;border:1.5px solid var(--gln,#cfe0ea);color:var(--gfg,var(--pri));border-radius:999px;padding:0 .7rem;font-weight:700;font-size:.9rem}
.typehero .char{width:7.4rem;border:3px solid #fff;box-shadow:0 4px 12px rgba(120,96,50,.15)}
.g-NT{--gbg:#ece6f6;--gln:#cdbfe6;--gfg:#5a4790}
.g-NF{--gbg:#e3f0dc;--gln:#bcd9ad;--gfg:#3d6b33}
.g-SJ{--gbg:#ddeeee;--gln:#acd3d1;--gfg:#2c6664}
.g-SP{--gbg:#fbefcc;--gln:#ebd28e;--gfg:#7a5a0c}
.tiles{gap:.8rem}
.tile{flex-direction:column;align-items:center!important;text-align:center!important;border:2px solid var(--gln,#eadfc6);border-radius:22px;background:linear-gradient(180deg,var(--gbg,#fff),#fffdf6);box-shadow:0 4px 14px rgba(120,96,50,.08);padding:.7rem .5rem .8rem}
.tile .char{width:100%;max-width:150px;border-radius:18px}
.tile .c{color:var(--gfg,var(--pri))}
.tile.me{border-color:#e0a64a;border-width:3px;background:linear-gradient(180deg,#fff1cf,#fffdf6)}
h2.gh{color:var(--gfg,var(--pri))}
.c0{background:#f3cf7a}.c1{background:#bcdcae}.c2{background:#a9cfe4}.c3{background:#d5c8ee}.c4{background:#f2c9b2}
@media(min-width:720px){.char{width:7rem}.typehero .char{width:9rem}}
@media(max-width:560px){.typehero{flex-direction:column;text-align:center;align-items:center}.typehero .char{width:11rem}}
img[data-img]:not([src]){background:linear-gradient(135deg,#f3ead2,#e3eedc 55%,#dfeaf1);color:transparent}
/* enneagram additions */
.g-gut{--gbg:#fbefcc;--gln:#ebd28e;--gfg:#7a5a0c}
.g-heart{--gbg:#fbe5e1;--gln:#efbdb3;--gfg:#9a3f33}
.g-head{--gbg:#ddeeee;--gln:#acd3d1;--gfg:#2c6664}
.tip{display:flex;gap:.7rem;align-items:flex-start;background:#eef6fb;border:1.5px solid #b9d0de;border-radius:20px;padding:.7rem .9rem;margin:.8rem 0;font-size:.95rem;color:#23465c}
.tip .ic{width:1.6em;height:1.6em;color:var(--pri2);margin-top:.1rem}
.tip.strong{background:#fff5e8;border:2px solid #f0c9a0;color:#4a2a12}
.tip.strong .ic{color:var(--acc)}
.tip b{color:inherit}
.ebar{display:grid;grid-template-columns:5.6em 1fr 2.6em;align-items:center;gap:.5rem;margin:.45rem 0;font-size:.98rem}
.ebar .nm{font-weight:700;color:var(--gfg,var(--pri));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ebar .trk{height:22px;background:#f0e9d8;border:1px solid #e3d8bf;border-radius:99px;overflow:hidden}
.ebar .fl{display:block;height:100%;border-radius:99px;background:var(--gln,#5f9cc0)}
.ebar .sc{text-align:right;font-weight:700;color:var(--muted)}
.ebar.me{background:linear-gradient(90deg,#fff1cf,transparent);border-radius:12px;padding:.15rem .3rem;margin-left:-.3rem}
.ebar.me .fl{background:var(--gfg)}
.ebar.me .nm::after{content:" ★";color:#d9963a}
.enn{display:block;width:100%;max-width:300px;height:auto;margin:.4rem auto}
.enn text{font:700 13px -apple-system,"PingFang HK","Noto Sans CJK TC",sans-serif;text-anchor:middle;dominant-baseline:central}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;justify-content:center;font-size:.88rem;color:var(--muted)}

<script>var DATA={"items": [{"g": "A", "t": "讀經禱告時，我常感到神有話要我轉達給教會或身邊的人，好造就他們。"}, {"g": "B", "t": "我願意長期委身於同一群信徒，陪伴他們走過信仰路上的高低起跌。"}, {"g": "C", "t": "我喜歡預備查經或課程，把一段經文的道理有條理地講解給別人。"}, {"g": "D", "t": "我常渴望在複雜的處境中，找出最合神心意的做法。"}, {"g": "E", "t": "我很享受深入研究聖經和信仰的課題，發掘新的亮光。"}, {"g": "F", "t": "看見有人灰心或軟弱時，我很想用說話鼓勵和扶持他。"}, {"g": "G", "t": "聽講道或屬靈分享時，我很快便能察覺當中有沒有偏離聖經的地方。"}, {"g": "H", "t": "我樂意簡化自己的生活開支，好把更多金錢奉獻給神的工作。"}, {"g": "I", "t": "我樂意在背後支援其他同工，好讓他們能專心發揮自己的恩賜。"}, {"g": "J", "t": "看見受苦或被忽略的人，我會很自然地想走近他們、陪伴他們。"}, {"g": "K", "t": "我很渴望到不同文化或族群的人當中，把福音帶給他們。"}, {"g": "L", "t": "我很想與未信的朋友分享耶穌，渴望他們認識主。"}, {"g": "M", "t": "我很喜歡打開家門，招待別人吃飯或聚會。"}, {"g": "N", "t": "即使事情看來不可能，我仍很確信神會成就祂所應許的事。"}, {"g": "O", "t": "在一個群體中，我常會清楚看見需要達成的目標和方向。"}, {"g": "P", "t": "我很享受把一件事工的細節計劃清楚，並安排好人手和時間。"}, {"g": "Q", "t": "我曾為一些看似不可能的處境禱告，並經歷神超越自然的奇妙作為。"}, {"g": "R", "t": "看見有人患病，我會很自然地想為他按聖經的教導禱告，求神醫治。"}, {"g": "S", "t": "我曾在禱告中，用一種自己從未學過的語言向神禱告或讚美。"}, {"g": "T", "t": "我曾聽見別人說方言時，心中明白那信息的意思，並能用大家明白的話表達出來。"}, {"g": "U", "t": "為了把更多時間和資源投放在神的國度，我樂意選擇簡樸的生活方式。"}, {"g": "V", "t": "保持單身時，我感到滿足和自由，並不覺得欠缺甚麼。"}, {"g": "W", "t": "我很享受長時間為別人和教會的需要禱告。"}, {"g": "X", "t": "我曾奉耶穌的名禱告，看見受邪靈困擾的人得着釋放。"}, {"g": "Y", "t": "我很容易看見教會或小組中實際需要做的事，並會主動去做。"}, {"g": "A", "t": "我曾在合適的時候說出一句提醒或勸勉，後來證實正切中對方或群體的需要。"}, {"g": "B", "t": "我曾持續關心一些弟兄姊妹，留意他們的靈命是否健康，並在需要時主動跟進。"}, {"g": "C", "t": "我曾用簡單易明的方法，把一段難明的經文解釋給別人聽。"}, {"g": "D", "t": "面對兩難的決定時，我曾按聖經原則看出一條合宜的出路，結果證實是對的。"}, {"g": "E", "t": "我曾透過仔細比較經文和查考資料，發現一些以前沒有留意的真理。"}, {"g": "F", "t": "我曾用一番安慰或鼓勵的話，幫助一位弟兄姊妹重新振作。"}, {"g": "G", "t": "我曾分辨出某些看似屬靈的言行，其實並不是出於神，後來證實是對的。"}, {"g": "H", "t": "我曾在知道某人或某事工有經濟需要時，慷慨而喜樂地供應。"}, {"g": "I", "t": "我曾為一位領袖或同工分擔實際工作，令他的事奉更有果效。"}, {"g": "J", "t": "我曾持續探訪或照顧病人、長者或身處困境的人，並在其中經歷喜樂。"}, {"g": "K", "t": "我曾與不同文化背景的人相處，並能較快地適應和建立關係。"}, {"g": "L", "t": "我曾與未信的人分享福音，並帶領他們決志信主。"}, {"g": "M", "t": "我曾接待需要地方留宿或需要照顧的人，並以此為樂。"}, {"g": "N", "t": "我曾在前路不明朗時，憑着對神應許的確信作出決定，後來看見神的成就。"}, {"g": "O", "t": "我曾帶領一項事工，同工們在我帶領下同心向前，達成了目標。"}, {"g": "P", "t": "我曾統籌一些教會活動，使它們有條不紊、順利完成。"}, {"g": "Q", "t": "我相信神會透過我的禱告和事奉，行出超越一般解釋的大事，以彰顯祂的榮耀。"}, {"g": "R", "t": "我曾為病人禱告，之後看見他們的身體或心靈有明顯的好轉。"}, {"g": "S", "t": "用這種未學過的語言禱告時，我感到與神更親近，靈裏得着造就。"}, {"g": "T", "t": "我所翻出的方言信息，經教會察驗後，曾造就了在場的人。"}, {"g": "U", "t": "我曾為了事奉或接觸貧窮人，放棄一些物質上的舒適，並為此感到喜樂。"}, {"g": "V", "t": "單身讓我能更專心、更有彈性地事奉主，我為此感恩。"}, {"g": "W", "t": "我曾恆切地為一些人或事禱告，並看見神清楚的回應。"}, {"g": "X", "t": "面對與邪靈有關的處境時，我在主裏有平安和勇氣，而不是恐懼。"}, {"g": "Y", "t": "我曾在沒有人吩咐的情況下，自發地把一件需要處理的事做好。"}, {"g": "A", "t": "弟兄姊妹曾表示，我按聖經說出的提醒令他們知罪、得安慰或重新得力。"}, {"g": "B", "t": "組員或朋友曾說，因為我的長期陪伴，他們的信仰得以穩定下來。"}, {"g": "C", "t": "曾有人告訴我，聽我講解後，他們讀聖經時更有領受、更懂得應用。"}, {"g": "D", "t": "弟兄姊妹遇到難題或重要抉擇時，常會來問我的意見。"}, {"g": "E", "t": "有人曾說，我整理的資料或解釋，幫助他們看清楚經文的背景和重點。"}, {"g": "F", "t": "常有人說，與我傾談之後，他們感到被明白、有盼望。"}, {"g": "G", "t": "教會的領袖或朋友曾邀請我，一同分辨某些教導或現象是否合乎聖經。"}, {"g": "H", "t": "曾有人因我適時的經濟支援渡過難關，並因此感謝神。"}, {"g": "I", "t": "同工常說我是一位可靠的好幫手，找我幫忙很放心。"}, {"g": "J", "t": "受苦的人常說，在我身邊感到被明白、被接納。"}, {"g": "K", "t": "我與外籍或其他族群的人相處時，常能自然地表達基督的愛，他們也樂意接近我。"}, {"g": "L", "t": "我與未信的人相處時很自然，常能把話題轉到信仰上，而不會令對方反感。"}, {"g": "M", "t": "新朋友常說，與我接觸後很快便感到自在，好像回到家一樣。"}, {"g": "N", "t": "當教會或小組遇到困難時，別人常說我的信心鼓勵了他們。"}, {"g": "O", "t": "別人常會在群體需要方向時，自然地望向我、跟隨我。"}, {"g": "P", "t": "同工常說，由我負責安排的事情，大家都清楚知道自己要做甚麼。"}, {"g": "Q", "t": "曾有人因為神透過我的禱告所行的奇妙作為，而更認識或相信神。"}, {"g": "R", "t": "弟兄姊妹患病時，常會邀請我為他們禱告。"}, {"g": "S", "t": "我曾在合宜的場合，以這種語言傳達的信息經翻出後，造就了在場的人。"}, {"g": "T", "t": "我渴望公開聚會中的屬靈經歷，都能讓眾人明白並得着造就。"}, {"g": "U", "t": "我曾在基層或貧困的群體中生活或服侍，並能與他們打成一片。"}, {"g": "V", "t": "我認同保羅「願意眾人像我一樣」的那份心志，並不覺得是勉強。"}, {"g": "W", "t": "弟兄姊妹遇到困難時，常會特別請我為他們禱告。"}, {"g": "X", "t": "牧者或弟兄姊妹曾在處理屬靈困擾的情況時，邀請我一同禱告事奉。"}, {"g": "Y", "t": "同工常說，有我在，很多細節都不用擔心。"}, {"g": "A", "t": "看見教會或身邊的人偏離真理時，我會感到很大的負擔，覺得需要按聖經直言。"}, {"g": "B", "t": "當有人在群體中漸漸冷淡或缺席，我會放在心上，想辦法把他帶回來。"}, {"g": "C", "t": "聽到別人對聖經的錯誤理解時，我會想耐心地把正確的意思解釋清楚。"}, {"g": "D", "t": "在討論中，我常能把複雜的事情整理成簡單、可行的方向。"}, {"g": "E", "t": "遇到信仰上的疑難，我會主動翻查資料，直至把問題弄清楚為止。"}, {"g": "F", "t": "我很自然會留意到別人的努力和進步，並真誠地肯定他們。"}, {"g": "G", "t": "面對新興的屬靈潮流或說法，我會很自然地以聖經去仔細察驗。"}, {"g": "H", "t": "奉獻對我來說不是負擔，而是一件令我真心喜樂的事。"}, {"g": "I", "t": "即使工作細小、沒有人注意，我也樂意把它做好。"}, {"g": "J", "t": "我願意為了照顧有需要的人，放下自己的舒適和方便。"}, {"g": "K", "t": "我常為其他國家或族群中未聽過福音的人禱告，並關注他們的處境。"}, {"g": "L", "t": "有機會分享信仰時，我會感到興奮多於害怕。"}, {"g": "M", "t": "我很自然會留意到聚會中孤單一人的新朋友，並主動上前歡迎他。"}, {"g": "N", "t": "在一般人覺得太冒險的事工上，我常感到平安，願意憑信心踏出去。"}, {"g": "O", "t": "我能夠把一個目標清楚地向人表達，並推動大家同心完成。"}, {"g": "P", "t": "看見事情雜亂無章時，我會很自然地想把它整理出一個清楚的流程。"}, {"g": "Q", "t": "每當經歷神奇妙的作為時，我只想把榮耀歸給神，並以此堅固別人的信心。"}, {"g": "R", "t": "我相信神今天仍會回應為病人的禱告，並樂意在這方面事奉。"}, {"g": "S", "t": "我渴望在禱告中更多經歷聖靈的工作，包括以未學過的語言禱告。"}, {"g": "T", "t": "我曾有翻方言的經歷，並願意讓牧者按聖經察驗。"}, {"g": "U", "t": "比起擁有更多，我更享受生活簡樸、無所掛慮的自由。"}, {"g": "V", "t": "我能在單身中保持聖潔和喜樂，而不會過分受到困擾。"}, {"g": "W", "t": "我常把別人的需要記在心裏，在日常生活中隨時為他們禱告。"}, {"g": "X", "t": "我深信基督已勝過一切黑暗的權勢，並願意在教會的監督下參與屬靈爭戰的禱告。"}, {"g": "Y", "t": "我享受在幕後把場地、物資等實際安排預備妥當。"}], "gifts": {"A": {"n": "預言", "alt": "傳講神的心意", "cl": "word", "tag": "把神的心意清楚、適時地向人傳講，造就、安慰、勸勉人。", "d": "預言的恩賜，是聖靈使一些信徒能夠領會並傳達神對某個人、群體或處境的心意，使人得造就、安慰和勸勉。在今天的教會，這恩賜常見於帶着屬靈洞見和負擔的講道與勸勉；一切傳講都要以聖經為準則，並由群體察驗。", "refs": "林前十二10、28；弗四11-14；羅十二6；路七26；徒十五32；徒二十一9-11", "verses": [{"k": "林前14:3", "why": "預言的目的，是造就、安慰、勸勉人，而不是顯出自己。"}, {"k": "帖前5:19-22", "why": "既不藐視，也要凡事察驗；這是教會對待一切傳講的健康態度。"}], "serve": ["在小組查經或分享中，按聖經真理說出切中處境的提醒", "參與講道、靈修分享或禱告會的勸勉", "在教會面對方向抉擇時，與領袖一同禱告、分享負擔", "以文字（例如靈修短文）把神的話應用到今天的生活"], "blind": [["說話太直", "看見問題便急於指出，忽略了說話的時間、方式和對方的承受力。"], ["以為自己的感動就是神的話", "要讓聖經和屬靈群體察驗，願意被修正。"], ["容易論斷", "看見罪和軟弱時，要記得自己同樣需要恩典。"]], "grow": ["每次分享前先問：這番話能否造就、安慰、勸勉對方？", "找一位成熟的牧者或長輩，定期請他回饋你的分享", "多讀先知書，學習先知如何在責備中滿有憐憫"]}, "B": {"n": "牧養", "alt": "長期照顧屬靈的群羊", "cl": "care", "tag": "願意長期承擔一群信徒的屬靈成長，像牧人照顧羊群。", "d": "牧養的恩賜，是聖靈使一些信徒願意並能夠長期承擔一群信徒的屬靈福祉：關心他們的生命、餵養、保護和引導他們。這恩賜不限於受薪牧師，小組組長、團契導師、門訓導師都可能有牧養的恩賜。", "refs": "弗四11-14；提前三1-7；約十1-18；彼前五1-3", "verses": [{"k": "彼前5:2-3", "why": "牧養是甘心樂意的照管，以榜樣而非轄制帶領人。"}, {"k": "約10:11", "why": "一切牧養都以好牧人耶穌為榜樣。"}], "serve": ["帶領或協助帶領小組、團契、門徒訓練", "定期關心幾位組員的屬靈狀況，陪伴他們成長", "跟進新來的朋友或初信者", "在組員遇到困難時，持續探望、禱告和陪伴"], "blind": [["一手包辦", "以為只有自己才能照顧好群羊，忘記牧養也包括培養其他同工。"], ["身心透支", "長期承擔別人的重擔，忽略了自己的安息和家庭。"], ["過度保護", "太怕羊受傷，反而阻礙他們學習獨立面對信仰。"]], "grow": ["每星期為你所牧養的人逐一點名禱告", "安排固定的安息時間，並找一位能牧養你的人", "刻意培育一位副組長，學習放手和交棒"]}, "C": {"n": "教導", "alt": "把真理講得明白", "cl": "word", "tag": "能把聖經真理講得清楚、有條理，使人明白並能應用。", "d": "教導的恩賜，是聖靈使一些信徒能夠把聖經和信仰的真理，清楚、準確而有系統地解釋出來，使別人明白、記得並能應用在生活中，從而建立基督的身體。", "refs": "林前十二28；弗四11-14；羅十二7；徒十八24-28；徒二十20-21", "verses": [{"k": "提後2:2", "why": "教導的果效，是把真理代代相傳，培養能再教導別人的人。"}, {"k": "雅3:1", "why": "教導是重要的託付，也帶着更重的責任。"}], "serve": ["帶領查經、主日學或門徒訓練課程", "預備查經材料或靈修指引", "一對一陪讀，幫助初信者讀懂聖經", "在小組中以簡單的例子解釋難明的經文"], "blind": [["只重知識", "教導的目標是生命改變，不只是傳遞資料。"], ["不耐煩", "對學得慢或問題多的人失去耐性。"], ["驕傲自大", "因為懂得多而輕看別人的看法或經驗。"]], "grow": ["每次教導前，先讓經文改變自己", "每次教導後問一位學員：你最記得甚麼？會怎樣應用？", "持續進修，例如有系統地研讀一卷書或參加神學課程"]}, "D": {"n": "智慧", "alt": "把真理應用在處境中", "cl": "word", "tag": "在複雜的處境中，按神的心意看見最合宜的做法。", "d": "智慧的恩賜，是聖靈使一些信徒能夠洞察神在某個處境中的心意，把屬靈的真理和知識，恰當地應用在具體的難題和決定上，為個人或群體指出合神心意的路。", "refs": "林前二1-13；林前十二8；徒六3、10；雅一5-6；彼後三15-16", "verses": [{"k": "雅1:5", "why": "智慧從神而來，這恩賜的人更要不斷謙卑求問。"}, {"k": "雅3:17", "why": "從上頭來的智慧帶着清潔、和平與憐憫。"}], "serve": ["在教會會議或小組討論中，協助大家整理方向，作合神心意的決定", "陪伴面對人生抉擇的弟兄姊妹禱告和思考", "在衝突中協助各方看見更合宜的出路", "作年輕信徒的屬靈導師"], "blind": [["以為自己總是對", "當別人不接納你的意見時，容易覺得被輕視。"], ["給答案太快", "未聆聽清楚就提出解決方法。"], ["只靠經驗", "忘記仍要倚靠禱告和聖經，而非只靠人生閱歷。"]], "grow": ["在給意見前，先多問兩條問題，聆聽對方的處境", "研讀箴言和雅各書，每天默想一節", "在重要決定上，學習與他人一同禱告分辨"]}, "E": {"n": "知識", "alt": "發掘和整理真理", "cl": "word", "tag": "喜歡深入發掘、整理和釐清聖經及信仰的知識。", "d": "知識的恩賜，是聖靈使一些信徒能夠深入發掘、整理、分析和釐清與教會成長和信徒生命有關的真理和資料，幫助群體更準確地認識神和祂的話。", "refs": "林前二14；林前十二8；徒五1-11；西二2-3；林後十一6", "verses": [{"k": "林前8:1-3", "why": "知識要與愛心同行，才能真正造就人。"}, {"k": "羅11:33", "why": "最深的知識，帶領我們敬拜那測不透的神。"}], "serve": ["為查經或講道搜集背景資料、預備研經材料", "協助教會建立圖書或資源庫", "回答弟兄姊妹關於聖經和信仰的疑問", "協助整理教會歷史、數據或研究報告，供領袖參考"], "blind": [["知識叫人自高自大", "容易輕看知道得較少的人。"], ["停留在頭腦", "研究得很多，實踐得很少。"], ["忽略人的感受", "只顧對錯，忘了說話的溫度。"]], "grow": ["每學到一個新的真理，寫下一個具體的應用", "與有關懷恩賜的人配搭，學習把知識化為愛", "把研究成果整理成簡單材料，讓更多人受益"]}, "F": {"n": "勸化", "alt": "鼓勵與安慰", "cl": "word", "tag": "用話語鼓勵、安慰和激勵人，使灰心的人重新得力。", "d": "勸化（勸勉）的恩賜，是聖靈使一些信徒能夠用安慰、鼓勵、勸導的話，陪伴和扶持身邊的人，幫助他們在信仰上重新站起來，向着神的心意前行。", "refs": "羅十二8；提前四13；來十25；徒十四22", "verses": [{"k": "來3:13", "why": "天天彼此相勸，是保護信徒的心不致剛硬的方法。"}, {"k": "帖前5:14", "why": "勸勉有不同方式：警戒、勉勵、扶助，都要帶着忍耐。"}], "serve": ["關心和探訪灰心、軟弱或剛經歷困難的弟兄姊妹", "寫鼓勵卡或傳送鼓勵訊息", "參與關懷小組或陪談事工", "在小組中帶出積極、建立人的分享氣氛"], "blind": [["只說好聽的話", "為了鼓勵而迴避需要面對的真相。"], ["急於解決問題", "對方需要被聆聽時，你已給了一大堆建議。"], ["承擔太多情緒", "長期吸收別人的負面情緒，令自己疲累。"]], "grow": ["學習先聆聽三分鐘，才開始回應", "用聖經的應許去鼓勵人，而不只是自己的經驗", "定期把所關心的人交託給神，不把擔子全放在自己身上"]}, "G": {"n": "辨別諸靈", "alt": "分辨真偽", "cl": "sign", "tag": "能分辨言行、教導和現象背後，是出於神、出於人，還是出於邪惡。", "d": "辨別諸靈的恩賜，是聖靈使一些信徒能夠分辨某些言論、教導、行為或屬靈現象，究竟是出於神、出於人的私意，還是出於邪惡的影響，從而保護群體免受迷惑。這恩賜必須以聖經為準則，並以愛心和謙卑運用。", "refs": "林前十二10；徒五1-11；徒十六16-18；約壹四1-6；太十六21-23", "verses": [{"k": "約一4:1", "why": "辨別的基礎，是按真理試驗一切。"}, {"k": "來5:14", "why": "分辨好歹的能力，也在屬靈成熟中操練出來。"}], "serve": ["協助教會領袖評估新的教導、課程或屬靈潮流", "在禱告事工中，與同工一同謹慎分辨", "幫助弟兄姊妹辨識似是而非的網上信仰資訊", "在揀選同工或處理困難個案時，提供屬靈的觀察"], "blind": [["多疑", "把謹慎變成懷疑一切，難以信任別人。"], ["批判", "看見問題卻缺乏愛心和恩慈的表達。"], ["過分屬靈化", "把一般的人際或心理問題都看成屬靈爭戰。"]], "grow": ["把你的觀察先帶到禱告中，再與成熟的領袖商量", "持續熟讀聖經的核心教義，作為分辨的準則", "說出觀察時，同時提出建立人的方向"], "note": "辨別諸靈有時與屬靈爭戰有關；本工具着重以聖經察驗教導和言行的一面。"}, "H": {"n": "施惠", "alt": "慷慨奉獻", "cl": "serve", "tag": "樂意、慷慨地把物質資源奉獻給神的工作和有需要的人。", "d": "施惠（奉獻）的恩賜，是聖靈使一些信徒以特別甘心、慷慨和喜樂的態度，把自己的金錢和物質資源奉獻出來，支持神的工作和幫助有需要的人。這恩賜與收入多少無關，而是與心態和信心有關。", "refs": "羅十二8；林後八1-7；林後九2-8；可十二41-44", "verses": [{"k": "林後9:7-8", "why": "神喜愛捐得樂意的人，也供應人去行善。"}, {"k": "提前6:17-19", "why": "把錢財用在好事上，是為將來積成美好的根基。"}], "serve": ["默默支持宣教士、福音機構或有需要的家庭", "協助教會的慈惠或扶貧事工", "以金錢以外的物資、交通或工具支援事工", "在教會財政上作忠心的管家，鼓勵他人學習奉獻"], "blind": [["以金錢代替參與", "奉獻了錢，便覺得不用再親身參與。"], ["期望影響力", "因為奉獻多而期望對教會決策有更大話語權。"], ["論斷別人", "覺得別人奉獻得不夠。"]], "grow": ["定期禱告，求神指示你支持哪些人和事工", "保持暗中奉獻，不讓左手知道右手所做的", "學習在奉獻之外，也付出時間與受助者同行"]}, "I": {"n": "幫助人", "alt": "在背後扶持", "cl": "serve", "tag": "樂意支援其他肢體，使他們更有效地發揮自己的恩賜。", "d": "幫助人（輔助）的恩賜，是聖靈使一些信徒樂意把自己的才幹和時間，投放在支援其他肢體的生命和事奉上，令被幫助的人更能專心發揮他們的恩賜。他們往往是事工背後不可或缺的「 row": ["每作重要決定前，先聆聽至少三位同工的意見", "定期與同工單獨傾談，關心他們的生命", "學習耶穌的僕人式領導，例如每季做一件不顯眼的服事"]}, "P": {"n": "治理事", "alt": "行政與組織", "cl": "lead", "tag": "善於把目標轉化為計劃、分工和流程，令事工運作暢順。", "d": "治理事（行政）的恩賜，是聖靈使一些信徒能夠清楚明白群體的短期和長期目標，並為達成這些目標設計和執行有效的計劃，包括安排人手、資源、時間和流程，讓事工有秩序地進行。", "refs": "林前十二28；徒六1-7；徒二十七11；路十四28-30；多一5", "verses": [{"k": "徒6:2-4", "why": "早期教會透過合宜的分工，使使徒能專心祈禱傳道。"}, {"k": "林前14:40", "why": "神是有秩序的神，教會的事也要有次序地進行。"}], "serve": ["統籌教會活動、營會或特別聚會", "協助建立事工流程、名單、時間表或財務記錄", "作事工小組的秘書或統籌", "協助領袖把異象轉化為具體的步驟"], "blind": [["太重程序", "把流程看得比人更重要。"], ["缺乏彈性", "計劃有變時容易焦躁。"], ["把人當成工具", "只看見工作分配，忽略同工的感受。"]], "grow": ["每次統籌後，也為參與的同工逐一禱告、致謝", "學習預留空間給聖靈的帶領和意外", "與有牧養或憐憫恩賜的人配搭，平衡事與人"]}, "Q": {"n": "異能", "alt": "行神蹟", "cl": "sign", "tag": "神透過人行出超越自然的大能作為，見證福音。", "d": "異能（行神蹟）的恩賜，是指神透過一些信徒，行出超越一般自然程序的大能作為，以印證福音、彰顯神的國度。神蹟的主權在神；福音派教會對此恩賜今天的運作有不同理解，但都同意神今天仍然聽禱告、施行奇事。", "refs": "林前十二10、28；徒九36-42；徒十九11-20；徒二十7-12；羅十五18-19；林後十二12", "verses": [{"k": "來2:3-4", "why": "神蹟奇事的目的，是為福音作見證；主權在於神「按自己的旨意」。"}, {"k": "林前2:4-5", "why": "保羅的傳講倚靠聖靈的大能，叫人的信只在乎神。"}], "serve": ["在禱告會中為看似不可能的處境恆切禱告", "分享神奇妙作為的見證，把榮耀歸給神", "在佈道或宣教事工中，以禱告支援福音工作", "與牧者一同按聖經教導，謹慎處理有關的屬靈經歷"], "blind": [["追求經歷", "把焦點放在奇事，而不是基督自己。"], ["屬靈驕傲", "把神的作為當成自己的能力。"], ["令他人跌倒", "當禱告沒有得到預期的回應時，給人錯誤的期望或責備。"]], "grow": ["把一切經歷交給教會牧者一同察驗", "以林前十三章為座右銘：沒有愛，就算不得甚麼", "不論神蹟有否發生，都操練感恩和順服"], "note": "福音派及浸信會傳統中，對「異能」等神蹟性恩賜今天如何運作有不同理解。本工具不作定論，只鼓勵你在聖經和教會群體中謹慎分辨。"}, "R": {"n": "醫病", "alt": "為病人禱告", "cl": "sign", "tag": "神透過人的禱告，使病人得醫治和恢復。", "d": "醫病的恩賜，是指神透過一些信徒的禱告和事奉，使病人在身體、心靈或情緒上得到醫治和恢復。醫治的主權在神；為病人禱告是全教會的責任，同時亦不排斥醫學和專業治療，因為醫學同樣是神普遍恩典的一部分。", "refs": "林前十二9、28；徒三1-10；徒五12-16；徒九32-35；徒二十八7-10", "verses": [{"k": "雅5:14-16", "why": "為病人禱告是教會的託付；彼此代求，使人得醫治。"}], "serve": ["參與探病和醫院關懷事工", "在小組或禱告會中為病人禱告", "陪伴長期病患者及其家人", "與醫護背景的弟兄姊妹配搭，關心身心靈的全人健康"], "blind": [["給人錯誤期望", "令病人覺得「沒有痊癒是因為信心不夠」。"], ["輕視醫學", "勸人停止治療，這並不合乎聖經的智慧。"], ["焦點偏移", "把注意力放在醫治的經歷，而非醫治的主。"]], "grow": ["學習安慰未得醫治的人，與他們一同承擔", "與牧者一同按雅各書五章的原則事奉", "為自己的動機禱告：是愛人，還是想看見結果？"], "note": "為病人禱告是每位信徒的責任；醫學治療同樣是神的恩典，不應因禱告而放棄。"}, "S": {"n": "方言", "alt": "以未學過的語言禱告", "cl": "sign", "tag": "以未學過的語言向神禱告或讚美。", "d": "方言的恩賜，是指一些信徒以未學過的語言向神禱告、讚美，或在有翻譯的情況下傳達信息。福音派教會對方言今天的性質和運作有不同理解；聖經清楚指出，並非人人都說方言，而在公開聚會中必須有人翻出來，凡事以造就教會為目標。", "refs": "林前十二10、28；林前十四13-19；徒二1-13；徒十44-46；徒十九1-7；可十六17", "verses": [{"k": "林前14:2", "why": "說方言主要是對神說，在心靈裏講說奧祕。"}, {"k": "林前14:18-19", "why": "保羅肯定方言，但在教會中更重視用悟性造就人。"}], "serve": ["在個人禱告生活中，以此親近神", "在合乎教會秩序的情況下，於禱告會中使用（並須有人翻出）", "與牧者坦誠分享你的經歷，一同按聖經分辨", "更重要的是：以愛心和其他恩賜造就教會"], "blind": [["屬靈優越感", "覺得自己比不說方言的人更屬靈。"], ["製造分裂", "在不同理解的群體中強調方言，引起紛爭。"], ["忽略秩序", "未按聖經在公開聚會中有人翻出。"]], "grow": ["熟讀林前十二至十四章，特別是十三章的愛", "在教會中尊重不同的理解，以合一為重", "追求多得造就教會的恩賜（林前十四12）"], "note": "聖經清楚表示「豈都是說方言的麼？」（林前十二30）。這一項分數低是十分正常的，並不代表屬靈程度高低。"}, "T": {"n": "翻方言", "alt": "把方言翻出", "cl": "sign", "tag": "能把方言所傳達的信息，用大家明白的語言表達出來。", "d": "翻方言的恩賜，是指一些信徒能夠把方言所傳達的信息，用會眾明白的語言表達出來，使教會得着造就。聖經教導在公開聚會中說方言，必須有人翻出來。福音派教會對此恩賜今天的運作有不同理解。", "refs": "林前十二10、30；林前十四13；林前十四26-28", "verses": [{"k": "林前14:13", "why": "說方言的人當求能翻出來，目的是造就教會。"}, {"k": "林前14:27-28", "why": "聖經為方言和翻方言設立了清楚的秩序。"}], "serve": ["在合乎教會秩序的禱告聚會中事奉", "與牧者一同按聖經察驗所翻出的內容", "以其他恩賜在教會中多作造就人的事", "幫助群體明白林前十四章的教導，持守秩序與合一"], "blind": [["把個人想法當作信息", "須讓聖經和群體察驗。"], ["製造神祕感", "令人覺得你有特別的屬靈地位。"], ["忽略秩序", "在不適合的場合使用，引起混亂。"]], "grow": ["每次事奉後，與成熟的領袖一同察驗", "持守以聖經為最高權威", "尊重教會對此恩賜的立場，以合一為重"], "note": "此恩賜與「方言」密切相關，分數低是常見的。請與牧者一同按聖經分辨。"}, "U": {"n": "自願清貧", "alt": "簡樸生活，專心事主", "cl": "serve", "tag": "甘心放棄物質享受，過簡樸的生活，好更專心事奉神。", "d": "自願清貧的恩賜，是聖靈使一些信徒能夠甘心樂意地放棄物質上的舒適和享受，選擇過一種簡樸、接近貧窮人程度的生活，使他們能更有效地事奉神和接觸貧窮人。這恩賜的關鍵是喜樂和自由，而不是勉強或苦行。", "refs": "林前十三1-3；徒二44-45；徒四34-37；林後六10；林後八9", "verses": [{"k": "林後8:9", "why": "主耶穌本來富足，卻為我們成了貧窮。"}, {"k": "提前6:6-8", "why": "敬虔加上知足的心，才是真正的大利。"}], "serve": ["參與基層或貧困社區的長期服侍", "以簡樸生活的見證挑戰教會的消費文化", "把節省下來的資源投放在福音和扶貧工作上", "支援宣教或福音機構的前線工作"], "blind": [["道德優越感", "看不起生活較富裕的弟兄姊妹。"], ["勉強家人", "把自己的生活選擇強加給家人。"], ["忽略合理需要", "因過分節儉而忽略健康和家庭責任。"]], "grow": ["與家人一同禱告商量生活方式", "以恩典而非律法看待別人的選擇", "定期檢視：這份簡樸是否仍然帶來喜樂和自由？"]}, "V": {"n": "獨身", "alt": "單身而專心事主", "cl": "serve", "tag": "在單身中感到滿足和自由，能更專心事奉主。", "d": "獨身的恩賜，是聖靈使一些信徒在單身的狀態中感到滿足和喜樂，不會因未婚而過分受困擾，並能善用這份自由更專心地事奉神。單身和婚姻都是神的恩賜，沒有高低之分。", "refs": "林前七7-8；太十九10-12", "verses": [{"k": "林前7:7", "why": "保羅說：各人領受神的恩賜，「一個是這樣，一個是那樣」。"}, {"k": "太19:11-12", "why": "耶穌指出，這是神賜給人「能領受」的特別恩賜。"}], "serve": ["以較彈性的時間投入短宣、營會或長時間的事工", "作年輕人或單身弟兄姊妹的屬靈同伴", "在教會推動對單身人士的接納和關懷", "善用自由時間進修或接受神學訓練"], "blind": [["孤立", "缺乏親密的屬靈群體支持。"], ["被過度使用", "別人以為你「有時間」便不斷加工作。"], ["隱藏的孤單", "不願承認自己也有情感的需要。"]], "grow": ["建立兩三位可以坦誠分享的屬靈同伴", "為自己的事奉設下合理的界線", "定期在神面前重新確認這份呼召和平安"], "note": "已婚的弟兄姊妹在此項分數低是自然的。婚姻和單身同樣是神所賜的恩賜。"}, "W": {"n": "代禱", "alt": "恆切為人禱告", "cl": "care", "tag": "比一般信徒更經常、更長時間地為人和事禱告。", "d": "代禱的恩賜，是聖靈使一些信徒比平常的信徒更經常、更長時間、更恆切地為人和事代求，而且常在他們的禱告中看見神明確的回應。他們往往是教會屬靈上的「守望者」。", "refs": "雅五14-16；提前二1-2；西一9-12；西四12-13；徒十二12；路二十二41-44", "verses": [{"k": "西4:12", "why": "以巴弗「常為你們竭力地祈求」，是代禱者的美好榜樣。"}, {"k": "提前2:1-2", "why": "代求的範圍包括萬人和一切在位的。"}], "serve": ["參與或帶領教會禱告會", "加入代禱事工，接收和跟進代禱事項", "為牧者、同工和宣教士恆常代禱", "為社區、城市和世界的需要禱告守望"], "blind": [["只禱告不行動", "在需要實際幫助時只說「我會為你禱告」。"], ["洩露私隱", "分享代禱事項時，不小心透露別人的私事。"], ["屬靈驕傲", "覺得別人禱告得不夠。"]], "grow": ["建立代禱記錄，記下神的回應並感恩", "學習以聖經的禱告（例如保羅書信）為範本", "在合適時，配合實際的關心行動"]}, "X": {"n": "趕鬼", "alt": "屬靈爭戰與釋放", "cl": "sign", "tag": "在屬靈爭戰中，奉主的名抵擋和趕逐邪靈的工作。", "d": "趕鬼的恩賜，是指一些信徒能奉耶穌的名，抵擋和趕逐邪靈的工作，使受捆綁的人得釋放。福音派教會都承認屬靈爭戰的真實，但對此恩賜和相關事奉的理解和做法並不一致；這類事奉必須在牧者的監督下，以聖經為準則、謹慎而有秩序地進行。", "refs": "太十二22-32；路十12-20；徒八5-8；徒十六16-18", "verses": [{"k": "路10:17-20", "why": "耶穌提醒門徒：最值得歡喜的，是名字記錄在天上。"}, {"k": "雅4:7", "why": "屬靈爭戰的根本，是順服神、抵擋魔鬼。"}], "serve": ["在牧者帶領下參與屬靈爭戰的禱告", "協助弟兄姊妹斷絕過往的偶像崇拜或玄祕活動", "在佈道中以禱告守望", "與輔導及醫護專業配搭，關心受困擾者的全人需要"], "blind": [["過分屬靈化", "把一切問題都歸咎於鬼魔，忽略身心和醫療的需要。"], ["好奇與炫耀", "對邪靈的事過分好奇或津津樂道。"], ["獨行獨斷", "未經教會授權和監督便單獨進行。"]], "grow": ["一切事奉都在牧者的監督和團隊中進行", "分辨屬靈、心理和醫學的問題，必要時轉介專業", "把焦點放在基督已經得勝的福音上"], "note": "屬靈爭戰的事奉必須在牧者監督下進行，並要分辨屬靈、心理和醫療的需要；如有疑慮，請先與牧者商量。"}, "Y": {"n": "執事", "alt": "實際服務", "cl": "serve", "tag": "能看見教會實際的需要，並主動用手邊的資源去滿足。", "d": "執事（服務）的恩賜，是聖靈使一些信徒能夠察覺教會事工中尚未被滿足的實際需要，並主動運用可用的資源去滿足這些需要，協助教會達成目標。他們往往是默默付出、令教會運作得以順暢的一群。", "refs": "提後一16-18；羅十二7；徒六1-7；多三14；加六2、10", "verses": [{"k": "加5:13", "why": "基督徒的自由，是用愛心互相服事的自由。"}, {"k": "西3:23-24", "why": "無論做甚麼，都是給主做的。"}], "serve": ["參與主日的招待、音響、佈置或清潔", "負責教會設施維修、物資或後勤", "在活動中負責交通、餐飲或場地", "在小組中留意實際需要，例如搬屋、接送"], "blind": [["忙到失去靈修", "只顧做事，忽略與主的關係。"], ["暗中比較", "覺得別人不夠投入。"], ["不懂交託", "凡事親力親為，令自己疲於奔命。"]], "grow": ["服事前先與神安靜片刻，記住你是為誰而做", "邀請一位新同工一同服事，學習傳承", "每月至少有一個主日只參加崇拜，不負責任何崗位"]}}, "clusters": {"word": {"n": "話語恩賜", "d": "透過說話、教導和分享真理，造就、堅固和裝備人。", "i": "i-book"}, "care": {"n": "關懷恩賜", "d": "透過陪伴、接待、代求和實際的愛，照顧身邊的人。", "i": "i-dove"}, "lead": {"n": "帶領恩賜", "d": "透過異象、組織、信心和開拓，帶動群體向前。", "i": "i-peak"}, "serve": {"n": "服事恩賜", "d": "透過默默付出、資源和生活方式，支援神的工作。", "i": "i-gift"}, "sign": {"n": "彰顯恩賜", "d": "與屬靈分辨及神蹟性經驗有關的恩賜；不同教會傳統理解不一，需要在群體中謹慎分辨。", "i": "i-star"}}, "corder": ["word", "care", "lead", "serve", "sign"], "verses": {"來10:24-25": {"ref": "希伯來書 10:24-25", "text": "又要彼此相顧，激發愛心，勉勵行善。你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉，既知道（原文是看見）那日子臨近，就更當如此。"}, "來11:6": {"ref": "希伯來書 11:6", "text": "人非有信，就不能得　神的喜悅；因為到　神面前來的人必須信有　神，且信他賞賜那尋求他的人。"}, "來13:2": {"ref": "希伯來書 13:2", "text": "不可忘記用愛心接待客旅；因為曾有接待客旅的，不知不覺就接待了天使。"}, "來2:3-4": {"ref": "希伯來書 2:3-4", "text": "我們若忽略這麼大的救恩，怎能逃罪呢？這救恩起先是主親自講的，後來是聽見的人給我們證實了。神又按自己的旨意，用神蹟、奇事和百般的異能，並聖靈的恩賜，同他們作見證。"}, "來3:13": {"ref": "希伯來書 3:13", "text": "總要趁著還有今日，天天彼此相勸，免得你們中間有人被罪迷惑，心裡就剛硬了。"}, "來5:14": {"ref": "希伯來書 5:14", "text": "惟獨長大成人的才能吃乾糧；他們的心竅習練得通達，就能分辨好歹了。"}, "加5:13": {"ref": "加拉太書 5:13", "text": "弟兄們，你們蒙召是要得自由，只是不可將你們的自由當作放縱情慾的機會，總要用愛心互相服事。"}, "加6:2": {"ref": "加拉太書 6:2", "text": "你們各人的重擔要互相擔當，如此，就完全了基督的律法。"}, "可10:42-45": {"ref": "馬可福音 10:42-45", "text": "耶穌叫他們來，對他們說：「你們知道，外邦人有尊為君王的，治理他們，有大臣操權管束他們。只是在你們中間，不是這樣。你們中間，誰願為大，就必作你們的用人；在你們中間，誰願為首，就必作眾人的僕人。因為人子來，並不是要受人的服事，乃是要服事人，並且要捨命作多人的贖價。」"}, "太19:11-12": {"ref": "馬太福音 19:11-12", "text": "耶穌說：「這話不是人都能領受的，惟獨賜給誰，誰才能領受。因為有生來是閹人，也有被人閹的，並有為天國的緣故自閹的。這話誰能領受就可以領受。」"}, "尼2:17-18": {"ref": "尼希米記 2:17-18", "text": "以後，我對他們說：「我們所遭的難，耶路撒冷怎樣荒涼，城門被火焚燒，你們都看見了。來吧，我們重建耶路撒冷的城牆，免得再受凌辱！」我告訴他們我　神施恩的手怎樣幫助我，並王對我所說的話。他們就說：「我們起來建造吧！」於是他們奮勇做這善工。"}, "帖前5:14": {"ref": "帖撒羅尼迦前書 5:14", "text": "我們又勸弟兄們，要警戒不守規矩的人，勉勵灰心的人，扶助軟弱的人，也要向眾人忍耐。"}, "帖前5:19-22": {"ref": "帖撒羅尼迦前書 5:19-22", "text": "不要消滅聖靈的感動；不要藐視先知的講論。但要凡事察驗；善美的要持守，各樣的惡事要禁戒不做。"}, "弗4:11-16": {"ref": "以弗所書 4:11-16", "text": "他所賜的，有使徒，有先知，有傳福音的，有牧師和教師，為要成全聖徒，各盡其職，建立基督的身體，直等到我們眾人在真道上同歸於一，認識　神的兒子，得以長大成人，滿有基督長成的身量，使我們不再作小孩子，中了人的詭計和欺騙的法術，被一切異教之風搖動，飄來飄去，就隨從各樣的異端；惟用愛心說誠實話，凡事長進，連於元首基督，全身都靠他聯絡得合式，百節各按各職，照著各體的功用彼此相助，便叫身體漸漸增長，在愛中建立自己。"}, "弗4:7": {"ref": "以弗所書 4:7", "text": "我們各人蒙恩，都是照基督所量給各人的恩賜。"}, "彼前4:10-11": {"ref": "彼得前書 4:10-11", "text": "各人要照所得的恩賜彼此服事，作　神百般恩賜的好管家。若有講道的，要按著　神的聖言講；若有服事人的，要按著　神所賜的力量服事，叫　神在凡事上因耶穌基督得榮耀。原來榮耀、權能都是他的，直到永永遠遠。阿們！"}, "彼前4:9-10": {"ref": "彼得前書 4:9-10", "text": "你們要互相款待，不發怨言。各人要照所得的恩賜彼此服事，作　神百般恩賜的好管家。"}, "彼前5:2-3": {"ref": "彼得前書 5:2-3", "text": "務要牧養在你們中間　神的群羊，按著　神旨意照管他們；不是出於勉強，乃是出於甘心；也不是因為貪財，乃是出於樂意；也不是轄制所託付你們的，乃是作群羊的榜樣。"}, "徒13:2-3": {"ref": "使徒行傳 13:2-3", "text": "他們事奉主、禁食的時候，聖靈說：「要為我分派巴拿巴和掃羅，去做我召他們所做的工。」於是禁食禱告，按手在他們頭上，就打發他們去了。"}, "徒20:35": {"ref": "使徒行傳 20:35", "text": "我凡事給你們作榜樣，叫你們知道應當這樣勞苦，扶助軟弱的人，又當記念主耶穌的話，說：『施比受更為有福。』」"}, "徒6:2-4": {"ref": "使徒行傳 6:2-4", "text": "十二使徒叫眾門徒來，對他們說：「我們撇下　神的道去管理飯食，原是不合宜的。所以弟兄們，當從你們中間選出七個有好名聲、被聖靈充滿、智慧充足的人，我們就派他們管理這事。但我們要專心以祈禱、傳道為事。」"}, "提前2:1-2": {"ref": "提摩太前書 2:1-2", "text": "我勸你，第一要為萬人懇求、禱告、代求、祝謝；為君王和一切在位的，也該如此，使我們可以敬虔、端正、平安無事地度日。"}, "提前6:17-19": {"ref": "提摩太前書 6:17-19", "text": "你要囑咐那些今世富足的人，不要自高，也不要倚靠無定的錢財；只要倚靠那厚賜百物給我們享受的　神。又要囑咐他們行善，在好事上富足，甘心施捨，樂意供給（或譯：體貼）人，為自己積成美好的根基，預備將來，叫他們持定那真正的生命。"}, "提前6:6-8": {"ref": "提摩太前書 6:6-8", "text": "然而，敬虔加上知足的心便是大利了；因為我們沒有帶甚麼到世上來，也不能帶甚麼去。只要有衣有食，就當知足。"}, "提後2:2": {"ref": "提摩太後書 2:2", "text": "你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。"}, "提後4:5": {"ref": "提摩太後書 4:5", "text": "你卻要凡事謹慎，忍受苦難，做傳道的工夫，盡你的職分。"}, "林前12:11": {"ref": "哥林多前書 12:11", "text": "這一切都是這位聖靈所運行、隨己意分給各人的。"}, "林前12:21-22": {"ref": "哥林多前書 12:21-22", "text": "眼不能對手說：「我用不著你。」頭也不能對腳說：「我用不著你。」不但如此，身上肢體人以為軟弱的，更是不可少的。"}, "林前12:4-7": {"ref": "哥林多前書 12:4-7", "text": "恩賜原有分別，聖靈卻是一位。職事也有分別，主卻是一位。功用也有分別，　神卻是一位，在眾人裡面運行一切的事。聖靈顯在各人身上，是叫人得益處。"}, "林前13:1-3": {"ref": "哥林多前書 13:1-3", "text": "我若能說萬人的方言，並天使的話語，卻沒有愛，我就成了鳴的鑼，響的鈸一般。我若有先知講道之能，也明白各樣的奧祕，各樣的知識，而且有全備的信，叫我能夠移山，卻沒有愛，我就算不得甚麼。我若將所有的賙濟窮人，又捨己身叫人焚燒，卻沒有愛，仍然與我無益。"}, "林前13:2": {"ref": "哥林多前書 13:2", "text": "我若有先知講道之能，也明白各樣的奧祕，各樣的知識，而且有全備的信，叫我能夠移山，卻沒有愛，我就算不得甚麼。"}, "林前14:12": {"ref": "哥林多前書 14:12", "text": "你們也是如此，既是切慕屬靈的恩賜，就當求多得造就教會的恩賜。"}, "林前14:13": {"ref": "哥林多前書 14:13", "text": "所以那說方言的，就當求著能翻出來。"}, "林前14:18-19": {"ref": "哥林多前書 14:18-19", "text": "我感謝　神，我說方言比你們眾人還多。但在教會中，寧可用悟性說五句教導人的話，強如說萬句方言。"}, "林前14:2": {"ref": "哥林多前書 14:2", "text": "那說方言的，原不是對人說，乃是對　神說，因為沒有人聽出來。然而，他在心靈裡卻是講說各樣的奧祕。"}, "林前14:27-28": {"ref": "哥林多前書 14:27-28", "text": "若有說方言的，只好兩個人，至多三個人，且要輪流著說，也要一個人翻出來。若沒有人翻，就當在會中閉口，只對自己和　神說就是了。"}, "林前14:3": {"ref": "哥林多前書 14:3", "text": "但作先知講道的，是對人說，要造就、安慰、勸勉人。"}, "林前14:40": {"ref": "哥林多前書 14:40", "text": "凡事都要規規矩矩地按著次序行。"}, "林前2:4-5": {"ref": "哥林多前書 2:4-5", "text": "我說的話、講的道，不是用智慧委婉的言語，乃是用聖靈和大能的明證，叫你們的信不在乎人的智慧，只在乎　神的大能。"}, "林前7:7": {"ref": "哥林多前書 7:7", "text": "我願意眾人像我一樣；只是各人領受　神的恩賜，一個是這樣，一個是那樣。"}, "林前8:1-3": {"ref": "哥林多前書 8:1-3", "text": "論到祭偶像之物，我們曉得我們都有知識。但知識是叫人自高自大，惟有愛心能造就人。若有人以為自己知道甚麼，按他所當知道的，他仍是不知道。若有人愛　神，這人乃是　神所知道的。"}, "林前9:22-23": {"ref": "哥林多前書 9:22-23", "text": "向軟弱的人，我就作軟弱的人，為要得軟弱的人。向甚麼樣的人，我就作甚麼樣的人。無論如何，總要救些人。凡我所行的，都是為福音的緣故，為要與人同得這福音的好處。"}, "林後8:9": {"ref": "哥林多後書 8:9", "text": "你們知道我們主耶穌基督的恩典：他本來富足，卻為你們成了貧窮，叫你們因他的貧窮，可以成為富足。"}, "林後9:7-8": {"ref": "哥林多後書 9:7-8", "text": "各人要隨本心所酌定的，不要作難，不要勉強，因為捐得樂意的人是　神所喜愛的。神能將各樣的恩惠多多地加給你們，使你們凡事常常充足，能多行各樣善事。"}, "約10:11": {"ref": "約翰福音 10:11", "text": "我是好牧人；好牧人為羊捨命。"}, "約一4:1": {"ref": "約翰一書 4:1", "text": "親愛的弟兄啊，一切的靈，你們不可都信，總要試驗那些靈是出於　神的不是，因為世上有許多假先知已經出來了。"}, "羅11:33": {"ref": "羅馬書 11:33", "text": "深哉，　神豐富的智慧和知識！他的判斷何其難測！他的蹤跡何其難尋！"}, "羅12:4-5": {"ref": "羅馬書 12:4-5", "text": "正如我們一個身子上有好些肢體，肢體也不都是一樣的用處。我們這許多人，在基督裡成為一身，互相聯絡作肢體，也是如此。"}, "羅12:6-8": {"ref": "羅馬書 12:6-8", "text": "按我們所得的恩賜，各有不同。或說預言，就當照著信心的程度說預言；或作執事，就當專一執事；或作教導的，就當專一教導；或作勸化的，就當專一勸化；施捨的，就當誠實；治理的，就當殷勤；憐憫人的，就當甘心。"}, "羅1:16": {"ref": "羅馬書 1:16", "text": "我不以福音為恥；這福音本是　神的大能，要救一切相信的，先是猶太人，後是希臘人。"}, "西3:12": {"ref": "歌羅西書 3:12", "text": "所以，你們既是　神的選民，聖潔蒙愛的人，就要存（原文是穿；下同）憐憫、恩慈、謙虛、溫柔、忍耐的心。"}, "西3:23-24": {"ref": "歌羅西書 3:23-24", "text": "無論做甚麼，都要從心裡做，像是給主做的，不是給人做的，因你們知道從主那裡必得著基業為賞賜；你們所事奉的乃是主基督。"}, "西4:12": {"ref": "歌羅西書 4:12", "text": "有你們那裡的人，作基督耶穌僕人的以巴弗問你們安。他在禱告之間，常為你們竭力地祈求，願你們在　神一切的旨意上得以完全，信心充足，能站立得穩。"}, "路10:17-20": {"ref": "路加福音 10:17-20", "text": "那七十個人歡歡喜喜地回來，說：「主啊！因你的名，就是鬼也服了我們。」耶穌對他們說：「我曾看見撒但從天上墜落，像閃電一樣。我已經給你們權柄可以踐踏蛇和蠍子，又勝過仇敵一切的能力，斷沒有甚麼能害你們。然而，不要因鬼服了你們就歡喜，要因你們的名記錄在天上歡喜。」"}, "路6:36": {"ref": "路加福音 6:36", "text": "你們要慈悲，像你們的父慈悲一樣。」"}, "雅1:5": {"ref": "雅各書 1:5", "text": "你們中間若有缺少智慧的，應當求那厚賜與眾人、也不斥責人的　神，主就必賜給他。"}, "雅3:1": {"ref": "雅各書 3:1", "text": "我的弟兄們，不要多人作師傅，因為曉得我們要受更重的判斷。"}, "雅3:17": {"ref": "雅各書 3:17", "text": "惟獨從上頭來的智慧，先是清潔，後是和平，溫良柔順，滿有憐憫，多結善果，沒有偏見，沒有假冒。"}, "雅4:7": {"ref": "雅各書 4:7", "text": "故此，你們要順服　神。務要抵擋魔鬼，魔鬼就必離開你們逃跑了。"}, "雅5:14-16": {"ref": "雅各書 5:14-16", "text": "你們中間有病了的呢，他就該請教會的長老來；他們可以奉主的名用油抹他，為他禱告。出於信心的祈禱要救那病人，主必叫他起來；他若犯了罪，也必蒙赦免。所以你們要彼此認罪，互相代求，使你們可以得醫治。義人祈禱所發的力量是大有功效的。"}}};

<script>
"use strict";
const KEY='discipleGifts.v1', FKEY='discipleGifts.font';
const ITEMS=DATA.items, N=ITEMS.length, GF=DATA.gifts, CL=DATA.clusters, CORD=DATA.corder, GK=Object.keys(GF), PER=4, MAX=PER*3;
const LIK=[[3,'許多','經常如此，很像我'],[2,'有些','間中如此'],[1,'少少','很少如此'],[0,'沒有','從未如此／不像我']];
const app=document.getElementById('app');
const APP='牛頭角浸信會門徒訓練，屬靈恩賜自我認識';
const store={ok:(function(){try{const k='__t';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);return true}catch(e){return false}})(),mem:{},get(k){try{const v=window.localStorage.getItem(k);return v==null&&k in this.mem?this.mem[k]:v}catch(e){return k in this.mem?this.mem[k]:null}},set(k,v){this.mem[k]=v;try{window.localStorage.setItem(k,v)}catch(e){}}};
function ic(id,c){return `<svg class="ic${c?' '+c:''}" aria-hidden="true"><use href="#${id}"/></svg>`}
const CCOL={word:'#4f9a96',care:'#d98475',lead:'#8a74c0',serve:'#6e9f5c',sign:'#c99a2e'};
function im(k,w,h){const u=IMG[k];return `data-img="${k}" style="aspect-ratio:${w}/${h}"${u?` src="${u}"`:''}`}
function fillImgs(){document.querySelectorAll('img[data-img]:not([src])').forEach(i=>{const u=IMG[i.dataset.img];if(u)i.src=u})}
function emb(cl,big,label){const id=CL[cl].i,col=CCOL[cl];return `<svg class="emb${big?' big':''}" viewBox="0 0 48 48" role="img" aria-label="${esc(label||CL[cl].n)}"><circle cx="24" cy="24" r="21.5" fill="${col}" stroke="#fffaf0" stroke-width="3"/><use href="#${id}" x="12" y="12" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
const NOTES=['內容謹供參考之用','牛頭角浸信會門徒訓練參與者使用','吳國强牧師 2026年建立'];
function notesCard(){return `<div class="notes" role="note" aria-label="使用說明"><span class="nb">${ic('i-cross')}</span><ul>${NOTES.map(n=>`<li>${n}</li>`).join('')}</ul></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fresh(){return {answers:Array(N).fill(null),idx:0,result:null,refl:{}}}
function load(){try{const s=JSON.parse(store.get(KEY)||'null');if(s&&Array.isArray(s.answers)&&s.answers.length===N){s.refl=s.refl||{};return s}}catch(e){}return fresh()}
let S=load();
function save(){store.set(KEY,JSON.stringify(S))}
function answered(){return S.answers.filter(v=>v!==null).length}
function gname(k){return GF[k].n}
function score(ans){
  const sum={},c3={},c2={};GK.forEach(k=>{sum[k]=0;c3[k]=0;c2[k]=0});
  ITEMS.forEach((it,i)=>{const v=ans[i];if(v==null)return;sum[it.g]+=v;if(v===3)c3[it.g]++;if(v===2)c2[it.g]++});
  const cmp=(a,b)=>(sum[b]-sum[a])||(c3[b]-c3[a])||(c2[b]-c2[a]);
  const rank=GK.slice().sort((a,b)=>cmp(a,b)||GK.indexOf(a)-GK.indexOf(b));
  const cl={};CORD.forEach(c=>{const ks=GK.filter(k=>GF[k].cl===c);cl[c]=Math.round(ks.reduce((t,k)=>t+sum[k],0)/(ks.length*MAX)*100)});
  return {rank,scores:sum,cl,top:rank.slice(0,3),sec:rank.slice(3,6),tie3:sum[rank[2]]===sum[rank[3]],gap3:sum[rank[2]]-sum[rank[3]]};
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
function ask(msg,yes){const d=document.createElement('div');d.className='modal';d.id='modal';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.innerHTML=`<div class="box"><p>${esc(msg)}</p><div class="btnrow"><button class="btn warn" id="mYes">確定</button><button class="btn ghost" id="mNo">取消</button></div></div>`;document.body.appendChild(d);const close=()=>d.remove();d.querySelector('#mNo').onclick=close;d.querySelector('#mYes').onclick=()=>{close();yes()};d.querySelector('#mYes').focus()}
function fontStep(d){const cur=parseInt(store.get(FKEY)||'19',10);const n=Math.max(16,Math.min(28,cur+d*2));store.set(FKEY,String(n));document.documentElement.style.setProperty('--fs',n+'px')}
(function(){const f=store.get(FKEY);if(f)document.documentElement.style.setProperty('--fs',f+'px')})();
function verse(k,why){const v=DATA.verses[k];return `<div class="verse"><div class="vt">${esc(v.text)}</div><div class="vr">——${esc(v.ref)}（和合本）</div>${why?`<div class="vw">${esc(why)}</div>`:''}</div>`}
function glink(k){return `<a href="#gift/${k}" onclick="go('gift/${k}');return false">${esc(gname(k))}</a>`}
let CUR='home',NOHASH=false;
function curView(){return NOHASH?CUR:((location.hash||'').slice(1)||'home')}
function go(v){CUR=v;if(!NOHASH){if(location.hash==='#'+v){route();return}try{location.hash=v}catch(e){}if(location.hash==='#'+v)return;NOHASH=true}route()}
function route(){
  const m=document.getElementById('modal');if(m)m.remove();
  const h=curView();const [v,arg]=h.split('/');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(v==='gift'&&b.dataset.v==='gifts')));
  if(v==='quiz')viewQuiz();else if(v==='result')viewResult();else if(v==='gifts')viewGifts();else if(v==='gift'&&GF[arg])viewGift(arg);else if(v==='guide')viewGuide();else viewHome();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
function inApp(){return /WhatsApp|FBAN|FBAV|Instagram|Line\/|MicroMessenger|; wv\)/i.test(navigator.userAgent||'')}
function tipBox(){const s=inApp();return `<div class="tip${s||!store.ok?' strong':''}" id="tip" role="note">${ic('i-phone')}<div>${!store.ok?'<b>注意：此瀏覽器未能長期保存答案</b>，關閉頁面後進度可能會消失。<br>':s?'<b>看來你正在應用程式（例如 WhatsApp）的內置瀏覽器中開啟。</b><br>':''}<b>小貼士：</b>如由 WhatsApp 開啟此連結，建議按右上角「⋮」或分享鍵，選擇「在 Chrome 開啟」（Android）或「在 Safari 開啟」（iPhone），答案會較穩妥地保存在你的手機上。</div></div>`}
function clusterList(){return `<div class="dimgrid">${CORD.map(c=>`<div class="card dimcard g-${c}"><h3>${emb(c)}${esc(CL[c].n)}</h3><p>${esc(CL[c].d)}</p><p class="small">${GK.filter(k=>GF[k].cl===c).map(k=>glink(k)).join('、')}</p></div>`).join('')}</div>`}

function viewHome(){
  const n=answered();
  const startBtns = S.result ? `<button class="btn" onclick="go('result')">查看我的結果（${S.result.top.map(gname).join('、')}）</button><button class="btn ghost" onclick="retake()">重新作答</button>`
    : n>0 ? `<button class="btn" id="resume" onclick="go('quiz')">繼續作答（已完成 ${n}／${N} 題）</button><button class="btn ghost" onclick="retake()">重新開始</button>`
    : `<button class="btn big" id="start" onclick="go('quiz')">開始作答</button>`;
  app.innerHTML=`
  <img class="hero" ${im('hero',1000,562)} width="1000" height="562" alt="大樹下的長木桌上，放着聖經、麵包、茶壺、燈、澆花壺、工具箱、小結他和信件，每件都繫上絲帶，好像一份份禮物；遠處山上有小教堂">
  <p class="eyebrow">發現・發展・發揮神所賜的恩賜</p>
  <h1>${APP}</h1>
  <p class="lead">這是一份為牛頭角浸信會門徒訓練而設的自我反思工具。透過 ${N} 道問題，幫助你初步發現聖靈賜給你的屬靈恩賜，並思考怎樣在教會和小組中用愛心事奉，建立基督的身體。</p>
  ${notesCard()}
  ${tipBox()}
  <div class="notice"><b>重要聲明：</b>本工具參考李察侯氏（Richard F. Houts）及彼得韋拿（C. Peter Wagner）《你的屬靈恩賜測試表》的恩賜分類和計分概念設計，但<b>所有問題、定義和建議均為本工具原創</b>，並非該測試表的內容。結果只是初步評估，需要在禱告、事奉和群體中一同印證。</div>

  <h2 class="ih"><span class="hic">${ic('i-gift')}</span>甚麼是屬靈恩賜？</h2>
  <div class="card">
  <p>屬靈恩賜是聖靈按自己的旨意，分給每一位信徒的特別能力，<b>目的是建立教會、使人得益處</b>，而不是為了顯出自己。每一位重生得救的基督徒，都至少有一樣屬靈恩賜。</p>
  ${verse('林前12:4-7')}
  ${verse('林前12:11','恩賜是聖靈「隨己意」所賜的，不是憑我們的努力賺取。')}
  <p>聖經中列出屬靈恩賜的主要經文包括：羅馬書十二章、哥林多前書十二章、以弗所書四章和彼得前書四章。</p>
  ${verse('羅12:6-8')}
  ${verse('彼前4:10-11','我們是恩賜的「好管家」：恩賜屬於神，我們負責忠心地使用。')}
  </div>

  <h2 class="ih"><span class="hic">${ic('i-chart')}</span>恩賜、才幹與果子</h2>
  <div class="card"><ul class="clean">
  <li><b>天然才幹：</b>與生俱來或後天學會的能力，例如音樂、設計、計算；信主前後都可能有。才幹可以被神使用，但不等於屬靈恩賜。</li>
  <li><b>屬靈恩賜：</b>聖靈賜給信徒、為建立教會而有的能力。有時與才幹重疊，有時完全出人意表。</li>
  <li><b>聖靈的果子：</b>仁愛、喜樂、和平……是每位信徒都要長出的生命品格（加五22-23）。<b>恩賜顯出我們做甚麼，果子顯出我們是怎樣的人。</b></li>
  <li><b>基督徒的本分：</b>即使沒有某項恩賜，每位信徒仍要傳福音、代禱、奉獻、款待和互相服事。</li></ul>
  ${verse('林前13:1-3','沒有愛，最屬靈的恩賜也算不得甚麼。')}
  </div>

  <h2 class="ih"><span class="hic">${ic('i-peak')}</span>本工具的 ${GK.length} 項恩賜（五大類）</h2>
  <p>為方便理解，本工具把恩賜分為五大類。點按名稱可閱讀詳細介紹。</p>
  ${clusterList()}
  <div class="card"><p class="small">說明：使徒、殉道等恩賜不適合用問卷評估，故未列入；亦有學者把音樂、技藝等列為恩賜。聖經的恩賜清單並非一份完整的「目錄」，而是舉例說明聖靈多樣的工作。</p></div>

  <h2 class="ih"><span class="hic">${ic('i-shield')}</span>關於神蹟性的恩賜</h2>
  <div class="card"><p>方言、翻方言、醫病、異能、趕鬼等恩賜，在不同的福音派教會傳統中有不同理解：有教會認為今天仍照樣運作，也有教會認為主要屬於使徒時代。本工具<b>不作定論</b>，只按聖經經文描述，並提醒：</p>
  <ul class="clean"><li>這幾項分數偏低是十分常見的，並不代表你的屬靈程度較低；聖經明言「豈都是說方言的麼？」（林前十二30）。</li><li>如你在這方面有經歷，請與牧者坦誠分享，一同按聖經分辨，並以造就教會和合一為重。</li><li>無論哪一種恩賜，最大的仍是愛。</li></ul></div>

  <h2 class="ih"><span class="hic">${ic('i-cross')}</span>在群體中印證</h2>
  <div class="card"><p>問卷結果只是起點。恩賜最可靠的印證來自三方面：<b>（一）你在事奉中感到喜樂和負擔；（二）事奉帶來實際的果效；（三）熟悉你的弟兄姊妹和屬靈領袖也看見。</b>建議你多嘗試不同的事奉，並把結果與組長和牧者分享。</p>
  ${verse('羅12:4-5')}</div>

  <div class="howto" id="howto"><h2><span class="hic">${ic('d-journal')}</span>怎樣作答</h2><ol>
  <li>共 <b>${N} 題</b>，約 <b>15–20 分鐘</b>。可以分幾次完成，程式會記住進度。</li>
  <li>請按你<b>過往的生命和事奉經驗</b>作答，而不是「希望」或「以為」自己是怎樣。坦誠作答，結果才有參考價值。</li>
  <li>每題有四個選項：<ul class="likert"><li><b>許多</b><span>經常如此，很像我（3 分）</span></li><li><b>有些</b><span>間中如此（2 分）</span></li><li><b>少少</b><span>很少如此（1 分）</span></li><li><b>沒有</b><span>從未如此／不像我（0 分）</span></li></ul></li>
  <li>很多題目答「少少」或「沒有」是<b>正常的</b>：每人只有某幾項較突出的恩賜。如信主不久、事奉經驗不多，可按你的渴望和有限的經驗作答，並在一兩年後重做。</li>
  <li>可按「上一題」<b>修改答案</b>。答案只儲存在你自己的裝置。完成後可<b>截圖</b>，帶到小組一同分享。</li>
  </ol><div class="btnrow">${startBtns}</div></div>`;
}

function retake(){const doit=()=>{const r=S.refl;S=fresh();S.refl=r||{};save();go('quiz')};if(answered()>0)ask('確定要清除之前的答案，重新作答嗎？（反思筆記會保留）',doit);else doit()}

function viewQuiz(){
  if(S.result&&answered()===N&&S.idx>=N){go('result');return}
  let i=Math.min(S.idx||0,N-1);
  const it=ITEMS[i],cur=S.answers[i],n=answered();
  app.innerHTML=`
  <img class="banner" ${im('quiz',760,319)} width="760" height="319" alt="">
  <div class="progtxt"><span>第 <b id="qn">${i+1}</b> 題／共 ${N} 題</span><span>已答 ${n}／${N}</span></div>
  <div class="progwrap"><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${n}" aria-label="作答進度"><i style="width:${(n/N*100).toFixed(1)}%"></i><span class="walker" style="left:calc(${(n/N*100).toFixed(1)}% - 14px)" aria-hidden="true">${ic('i-walker')}</span></div>${ic('i-cross','fin')}</div>
  <div class="card qcard">${ic('i-grow','deco')}<div class="qtext" id="qtext">${esc(it.t)}</div></div>
  <div class="opts" role="radiogroup" aria-label="這句話有多符合你過往的經驗">
  ${LIK.map(([v,l,s])=>`<button class="opt${cur===v?' sel':''}" role="radio" aria-checked="${cur===v}" data-v="${v}" onclick="answer(${v})"><span class="dot"></span><span class="lb">${l}<small>${s}</small></span></button>`).join('')}
  </div>
  <div class="qnav">
   <button class="btn ghost" id="back" onclick="prevQ()" ${i===0?'disabled style="opacity:.4"':''}>‹ 上一題</button>
   ${cur!=null&&i<N-1?`<button class="btn ghost" id="fwd" onclick="nextQ()">下一題 ›</button>`:''}
   ${n===N?`<button class="btn" id="done" onclick="finish()">查看結果</button>`:''}
  </div>
  <p class="small">提示：按你過往真實的生命和經驗作答；選擇後會自動進入下一題。資料只儲存在本機，可隨時關閉，稍後繼續。</p>`;
}
let busy=false;
function answer(v){
  if(busy)return;const i=Math.min(S.idx||0,N-1);S.answers[i]=v;
  document.querySelectorAll('.opt').forEach(b=>{const on=+b.dataset.v===v;b.classList.toggle('sel',on);b.setAttribute('aria-checked',on)});
  busy=true;
  setTimeout(()=>{busy=false;
    if(i===N-1){if(answered()===N){finish()}else{S.idx=S.answers.indexOf(null);save();toast('尚有題目未作答');viewQuiz()}return}
    S.idx=i+1;save();viewQuiz();
  },180);
  save();
}
function prevQ(){if(S.idx>0){S.idx=Math.min(S.idx,N)-1;save();viewQuiz()}}
function nextQ(){if(S.idx<N-1){S.idx++;save();viewQuiz()}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function finish(){const first=S.answers.indexOf(null);if(first>=0){S.idx=first;save();toast('尚有題目未作答');viewQuiz();return}
  S.result=Object.assign(score(S.answers),{date:today()});S.idx=N;save();go('result')}
document.addEventListener('keydown',e=>{if(curView()!=='quiz'||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||document.getElementById('modal'))return;if(e.key>='1'&&e.key<='4'){answer(4-parseInt(e.key,10))}else if(e.key==='ArrowLeft')prevQ();else if(e.key==='ArrowRight'&&S.answers[S.idx]!=null)nextQ()});

  app.innerHTML=`<h1>組長使用指引</h1>
  <img class="guideart" ${im('guide',860,484)} width="860" height="484" alt="溫暖的小組聚會室，圓桌上放着打開的聖經、筆記本、茶杯和曲奇，窗外是青翠山丘">
  <p class="lead">本工具適合在門徒訓練或小組中使用，目的是幫助組員發現神所賜的恩賜，並在基督的身體中彼此配搭、用愛心事奉。</p>
  <h2 class="ih"><span class="hic">${ic('d-hours')}</span>所需時間</h2><div class="card"><ul class="clean">
  <li><b>作答問卷：</b>約 15–20 分鐘（共 ${N} 題，可分次完成）。</li><li><b>閱讀結果：</b>約 20–30 分鐘，建議慢慢閱讀前三項恩賜的介紹和經文。</li><li><b>小組分享：</b>每個步驟約 45–60 分鐘。</li></ul></div>
  <h2 class="ih"><span class="hic">${ic('d-direction')}</span>建議流程</h2><div class="card"><ol>
  <li><b>預備：</b>組長先自己完成問卷並閱讀結果；亦可先瀏覽「恩賜一覽」，熟悉各項恩賜。</li>
  <li><b>第一個步驟（認識恩賜）：</b>一同閱讀「簡介」，特別是「恩賜、才幹與果子」和「關於神蹟性的恩賜」；強調結果只是初步評估。邀請組員回家安靜作答。（用 WhatsApp 傳送連結時，提醒組員用 Chrome 或 Safari 開啟。）</li>
  <li><b>第二個步驟（發現恩賜）：</b>每人用三至五分鐘分享：「我的前三項恩賜是甚麼？哪一項最令我意外？過往哪一次事奉經驗印證了它？」其他組員可補充：「我在你身上看見……」</li>
  <li><b>第三個步驟（發揮恩賜）：</b>一同討論結果頁的「事奉配搭反思」，每人定下一項想嘗試的具體事奉；組長可與教會同工跟進，協助組員找到合適的崗位，三至六個月後一同回顧。</li>
  <li><b>延伸：</b>把全組的主要恩賜寫在白板上，看看小組像一個怎樣的「身體」——哪些恩賜很多？缺少甚麼？可以怎樣彼此配搭？</li></ol></div>
  <h2 class="ih"><span class="hic">${ic('i-chat')}</span>帶領分享的提示</h2><div class="card"><ul class="clean">
  <li><b>先問經驗，後看分數：</b>例如「做哪一種事奉時，你最感到喜樂和有負擔？」</li>
  <li><b>讓群體說話：</b>恩賜常常是別人先看見的。邀請組員互相肯定在彼此身上看見的恩賜。</li>
  <li><b>欣賞不同：</b>強調沒有「高級」或「低級」的恩賜；幕後默默服事的恩賜同樣寶貴（林前十二21-22）。</li>
  <li><b>由恩賜走到事奉：</b>結果的目的不是貼標籤，而是幫助組員踏出一步，實際參與事奉。</li>
  <li><b>回到愛：</b>可用林前十三章作結——恩賜是工具，愛才是目標。</li></ul></div>
  <h2 class="ih"><span class="hic">${ic('i-shield')}</span>帶領時的提醒</h2><div class="card"><ul class="clean">
  <li><b>初步評估，不是定論：</b>問卷反映的是過往經驗和自我感覺；信主不久或事奉經驗少的組員，分數可能普遍偏低，這是正常的。</li>
  <li><b>不是推卸的藉口：</b>「這不是我的恩賜」不等於不用參與；傳福音、代禱、奉獻、款待等是所有信徒的本分。</li>
  <li><b>神蹟性恩賜：</b>不同教會傳統理解不一。帶領時保持尊重和開放，不爭論、不標籤；如組員分享相關經歷，請與牧者跟進，一同按聖經分辨。</li>
  <li><b>屬靈爭戰與醫治：</b>如組員提及受困擾或疾病，請轉介牧者；並提醒醫學及專業輔導同樣是神的恩典。</li>
  <li><b>尊重私隱：</b>結果和反思筆記只儲存在個人裝置；分享與否由組員自己決定，組長不應要求收集結果。</li>
  <li><b>事奉安排：</b>事奉崗位應按恩賜、品格、屬靈成熟度和教會需要，禱告分辨，並由教會按程序安排。</li></ul></div>
  <h2 class="ih"><span class="hic">${ic('i-dove')}</span>建議的結束禱告</h2><div class="card"><p>親愛的天父，感謝你藉着聖靈把各樣的恩賜分給我們每一個人。求你幫助我們不自高、也不自卑，忠心地作你百般恩賜的好管家；叫我們在基督的身體中彼此相顧、互相配搭，用愛心建立教會，使你的名得着榮耀。奉主耶穌基督的名求，阿們。</p></div>
  ${verse('弗4:11-16','恩賜的目的，是「成全聖徒，各盡其職，建立基督的身體」。')}
  ${verse('弗4:7')}
  ${verse('來10:24-25','組員彼此相顧、激發愛心，正是使用本工具的目的。')}
  ${notesCard()}`;
}
route();
window.APPREADY=true;
</script>
