<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">

<title>個人每日省察｜牛頭角浸信會</title>
<style>
:root{--ink:#3a3848;--muted:#6b6878;--bg:#fbf7f1;--card:#ffffff;--pri:#6b7cc0;--pri-d:#4e5d9e;--peach:#f7d3c1;--mint:#d3ecdf;--butter:#fbecb3;--lav:#e3dcf5;--fs:20px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;line-height:1.7;letter-spacing:.03em;background:var(--bg);background-image:radial-gradient(700px 380px at 0% 0%,rgba(227,220,245,.7),transparent 70%),radial-gradient(700px 380px at 100% 100%,rgba(211,236,223,.7),transparent 70%);background-attachment:fixed;min-height:100vh}
header.top{position:sticky;top:0;z-index:5;background:rgba(251,247,241,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.topin{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:.35rem;padding:.45rem .7rem}
.brand{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:.4rem;background:none;border:0;padding:.3rem 0;font:inherit;font-weight:800;font-size:clamp(.9rem,4.4vw,1.05rem);color:var(--pri-d);cursor:pointer;text-align:left}
.brand .cube{width:1.6em;height:1.6em;flex:0 0 auto}
.tbtn{flex:0 0 auto;min-height:44px;min-width:44px;padding:0 .55rem;border-radius:14px;border:0;background:#fff;color:var(--pri-d);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #e2ddd3,0 4px 10px rgba(80,70,120,.08)}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #e2ddd3}
.tbtn.mus{display:inline-flex;align-items:center;gap:.25rem;padding:0 .7rem;background:var(--mint);color:#2f5e4a;box-shadow:0 3px 0 #b5d6c5,0 4px 10px rgba(80,70,120,.08)}
.tbtn.mus.mid{background:var(--butter);color:#6a5212;box-shadow:0 3px 0 #e8d488,0 4px 10px rgba(80,70,120,.08)}
.tbtn.mus.off{background:#f1eee9;color:#8d8a95;box-shadow:0 3px 0 #dcd8d0}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:0 0 auto}
main{max-width:620px;margin:0 auto;padding:.6rem 1.1rem 2.5rem}
.scr{animation:fin .35s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:1.75rem;line-height:1.35;margin:.3rem 0 .4rem;color:var(--ink);font-weight:800}
h1.big{font-size:2.15rem;margin:.2rem 0 .1rem}
p{margin:.45rem 0}
.sub{color:var(--muted);font-size:1.05rem;margin:0 0 .6rem}
.art{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:32px;margin:.2rem 0 .6rem;background:linear-gradient(135deg,#f3eee6,#ece6f6)}
.art.sm{aspect-ratio:16/10}
.card{background:var(--card);border-radius:28px;padding:1.05rem 1.2rem;margin:.9rem 0;box-shadow:0 10px 30px rgba(90,80,140,.08)}
.notice{background:#fff;border-radius:22px;padding:.7rem 1rem;color:var(--muted);font-size:.92rem;box-shadow:0 6px 18px rgba(90,80,140,.06)}
.notice b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:58px;padding:.55rem 1.3rem;border-radius:22px;border:0;font:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;text-align:center;color:#fff;background:var(--pri);box-shadow:0 6px 0 var(--pri-d),0 10px 20px rgba(78,93,158,.25);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pri-d),0 4px 10px rgba(78,93,158,.2)}
.btn.soft{background:#fff;color:var(--pri-d);box-shadow:0 5px 0 #e3dfd6,0 8px 16px rgba(90,80,140,.08)}
.btn.soft:active{box-shadow:0 1px 0 #e3dfd6}
.btn.peach{background:#f2a98a;box-shadow:0 6px 0 #d7876a,0 10px 20px rgba(215,135,106,.3)}
.btn.warn{background:#fff;color:#b5523a;box-shadow:0 4px 0 #efd3c9}
.btn.sm{min-height:48px;font-size:.95rem;padding:.35rem 1rem;border-radius:18px}
.btn:focus-visible,.tbtn:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid #f6c453;outline-offset:3px}
.start{display:flex;width:100%;min-height:86px;font-size:1.7rem;letter-spacing:.25em;margin:1.1rem 0 .8rem;border-radius:28px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.6rem 0}
.row2 .btn{width:100%;font-size:1rem;padding:.5rem .6rem}
.week{display:flex;justify-content:space-between;gap:.3rem;margin:.4rem 0 .2rem}
.week div{flex:1;text-align:center;font-size:.8rem;color:var(--muted)}
.week i{display:flex;align-items:center;justify-content:center;margin:0 auto .2rem;width:2.1rem;height:2.1rem;border-radius:12px;background:#ebe6de;font-style:normal;font-size:1rem;color:#fff;transform:rotate(45deg) scale(.82)}
.week i span{transform:rotate(-45deg)}
.week .on i{background:linear-gradient(135deg,#9fd8bd,#6fb79a);box-shadow:0 3px 0 #59a083}
.week .td{color:var(--pri-d);font-weight:800}
.streak{text-align:center;font-weight:800;color:#a2751c;margin:.2rem 0}
.done-badge{display:flex;align-items:center;justify-content:center;gap:.5rem;background:var(--mint);color:#2f5e4a;border-radius:20px;padding:.6rem .9rem;font-weight:800;margin:.6rem 0}
/* step */
.dots{display:flex;gap:.45rem;justify-content:center;margin:.3rem 0 .5rem}
.dots i{width:.8rem;height:.8rem;border-radius:4px;background:#e7e2da;transform:rotate(45deg)}
.dots i.on{background:var(--pri)}
.dots i.cur{background:#f2a98a;transform:rotate(45deg) scale(1.3)}
.snum{text-align:center;color:var(--muted);font-size:.95rem;font-weight:700;margin:0}
.stitle{text-align:center;font-size:2rem;margin:.1rem 0 .5rem}
.guide{font-size:1.28rem;line-height:1.75;text-align:center;margin:.3rem 0 .4rem}
.guide p{margin:.2rem 0}
.think{background:var(--lav);border-radius:24px;padding:.7rem 1.1rem;margin:.8rem 0}
.think .k{font-size:.9rem;font-weight:800;color:var(--pri-d)}
.think p{font-size:1.15rem;margin:.25rem 0}
.verse{background:#fffaf0;border-radius:24px;padding:.8rem 1.1rem;margin:.8rem 0;box-shadow:inset 0 0 0 2px #f4e8c8}
.verse .vr{font-size:.9rem;font-weight:800;color:#a2751c}
.verse p{font-size:1.2rem;line-height:1.85;margin:.25rem 0}
.verse sup{font-size:.7em;color:#a2751c;margin-right:.15em}
.field{margin:.8rem 0}
.field label{display:block;font-weight:800;font-size:1rem;margin:0 0 .3rem;color:var(--ink)}
.field .hint{font-weight:400;color:var(--muted);font-size:.85rem}
textarea,input.joy{width:100%;font:inherit;font-size:1.1rem;line-height:1.6;color:var(--ink);background:#fff;border:2px solid #e9e4dc;border-radius:20px;padding:.65rem .9rem}
textarea{min-height:5.5rem;resize:vertical}
.joybox{background:var(--butter);border-radius:24px;padding:.8rem 1rem;margin:.9rem 0;box-shadow:0 5px 0 #eedb92}
.joybox label{color:#6a5212}
input.joy{border-color:#f0dc95}
.nav{display:grid;grid-template-columns:1fr 1.5fr;gap:.7rem;margin:1.2rem 0 .4rem}
.nav .btn{width:100%;white-space:nowrap;padding:.5rem .6rem}
.pray{font-size:1.25rem;line-height:1.9}
details.fold{background:#fff;border-radius:24px;padding:.35rem 1.1rem;margin:.8rem 0;box-shadow:0 6px 18px rgba(90,80,140,.06)}
details.fold summary{cursor:pointer;min-height:50px;display:flex;align-items:center;gap:.45rem;font-weight:800;color:var(--pri-d);list-style:none}
details.fold summary::-webkit-details-marker{display:none}
.small{font-size:.88rem;color:var(--muted)}
/* stats + calendar */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.6rem 0}
.stats div{background:#fff;border-radius:22px;padding:.55rem .3rem;text-align:center;box-shadow:0 5px 0 #ece8df}
.stats div:nth-child(1){background:var(--mint);box-shadow:0 5px 0 #b5d6c5}
.stats div:nth-child(2){background:var(--lav);box-shadow:0 5px 0 #cbc1ea}
.stats div:nth-child(3){background:var(--butter);box-shadow:0 5px 0 #eedb92}
.stats b{display:block;font-size:1.8rem;line-height:1.2}
.stats span{font-size:.82rem;color:var(--muted)}
.calhd{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin-bottom:.5rem}
.calhd b{font-size:1rem;white-space:nowrap}
.calhd .btn{min-width:48px;padding:0 .7rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;text-align:center}
.cal .h{font-size:.8rem;color:var(--muted);font-weight:700}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:.92rem;background:#f7f4ef}
.cal .d.e{background:none}
.cal .d.on{background:linear-gradient(135deg,#9fd8bd,#6fb79a);color:#fff;font-weight:800;box-shadow:0 3px 0 #59a083}
.cal .d.today{outline:2.5px solid #f2a98a;outline-offset:-2px}
.hist{list-style:none;padding:0;margin:.4rem 0}
.hist li{background:#fff;border-radius:22px;padding:.7rem 1rem;margin:.6rem 0;box-shadow:0 5px 0 #ece8df}
.hist .dt{font-weight:800;color:var(--pri-d)}
.hist .jy{background:var(--butter);border-radius:14px;padding:.3rem .7rem;margin:.35rem 0;font-size:1rem}
.hist .nt{font-size:.95rem;color:var(--ink);margin:.2rem 0;white-space:pre-wrap;word-break:break-word}
.hist .nt b{color:var(--muted);font-weight:700;font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:1rem}
.confirm{background:#fff3ee;border-radius:20px;padding:.8rem 1rem;margin:.6rem 0}
.confirm .btn{margin:.2rem .3rem .2rem 0}
footer{max-width:620px;margin:0 auto;padding:.6rem 1.1rem 2.4rem;font-size:.82rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:1.3rem;transform:translateX(-50%);background:#3a3848;color:#fff;padding:.65rem 1.2rem;border-radius:18px;font-size:1rem;z-index:20;display:none;max-width:90vw;text-align:center}
@media(prefers-reduced-motion:reduce){.scr{animation:none}.btn{transition:none}}
@media(max-width:350px){.brand span{display:none}}
</style>

<script>var DATA={"steps":[{"t":"安靜，意識神同在","ic":"i-candle","g":["坐好，放低手機以外嘅嘢。","慢慢深呼吸三次。","記住：神而家就喺你身邊。"],"p":["靜靜咁同神講：「主，我喺度。」","留意一下：我此刻嘅心情係點？"],"v":{"ref":"詩篇 46:10","verses":[[10,"你們要休息，要知道我是　神！我必在外邦中被尊崇，在遍地上也被尊崇。"]]}},{"t":"感恩","ic":"i-heart","g":["回想今日，有咩值得感恩？","大事細事都得：一餐飯、一句說話、一個人。"],"p":["今日邊一刻，令我最開心或者最平安？","為一件細小嘅恩典，多謝神。"],"v":{"ref":"詩篇 103:2","verses":[[2,"我的心哪，你要稱頌耶和華！不可忘記他的一切恩惠！"]]}},{"t":"回顧今日","ic":"i-eye","g":["求聖靈光照你。","好似睇片咁，由朝早慢慢睇到而家。"],"p":["今日幾時，我覺得同神好接近？","幾時，我覺得遠離神、心裡面唔平安？"],"v":{"ref":"詩篇 139:23-24","verses":[[23,"神啊，求你鑒察我，知道我的心思，試煉我，知道我的意念，"],[24,"看在我裡面有甚麼惡行沒有，引導我走永生的道路。"]]}},{"t":"認罪、領受饒恕","ic":"i-hands","g":["有冇講錯、做錯，或者應該做而冇做？","誠實咁告訴神，唔使驚。"],"p":["「主，求你赦免我……」","相信神已經赦免你，安心領受佢嘅饒恕同平安。"],"v":{"ref":"約翰壹書 1:9","verses":[[9,"我們若認自己的罪，　神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。"]]}},{"t":"展望明日、交託","ic":"i-sunrise","g":["想一想明日嘅安排。","將擔心同盼望，一樣一樣交託畀神。"],"p":["明日有咩事要面對？","求神喺一件具體嘅事上帶領我。"],"v":{"ref":"箴言 3:5-6","verses":[[5,"你要專心仰賴耶和華，不可倚靠自己的聰明，"],[6,"在你一切所行的事上都要認定他，他必指引你的路。"]]}}],"closing":"親愛嘅天父，多謝你今日一直同我同在。求你赦免我嘅軟弱，賜我今晚安睡；明日，我願意再跟隨你。奉主耶穌基督嘅名求，阿們。","lords":{"ref":"馬太福音 6:9-13","verses":[[9,"所以，你們禱告要這樣說：我們在天上的父：願人都尊你的名為聖。"],[10,"願你的國降臨；願你的旨意行在地上，如同行在天上。"],[11,"我們日用的飲食，今日賜給我們。"],[12,"免我們的債，如同我們免了人的債。"],[13,"不叫我們遇見試探；救我們脫離兇惡（或譯：脫離惡者）。因為國度、權柄、榮耀，全是你的，直到永遠。阿們（有古卷沒有因為……阿們等字）！"]]}},IMG={"cover":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wgARCAHCAlgDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAECAwQFBv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/9oADAMBAAIQAxAAAAH2AGNAAAAAA0AAAAAAwEwQADBDAAAAAAAAEDhCauVMyYO5TAABDBDBAAAAAAAAAAAAAAAAAAAAAAMEMEMEMBMAAAAAAAAAAAAAABiGgIQmroUZZrbXys2enVx5Ks672jka7NzyWXOqeaWsaCidzYJ3IAAAAAAAAACGCGCGCGCGCAAGIYAAAAAAAAAMEMEMEMEDEMExDIQmrY0Z5rZXy82enTyZDOpQEoNQqraTXt522zQ4SqU62l88rTVLLZZpsyvWNJRZc2IdyhoAAAAAAAAAAAAAAAAAYCGCYCYAAAAAAAAAEYLZGrPneuvm5M76uPE5qcBSslNKbJRs   pad(G,t,PAD[c[0]]);bass(G,t,c[1]);
  var up=(i+cyc)%2===0,pat=up?[0,1,2,3,4,3,2,1]:[4,3,2,1,0,1,2,3],shift=Math.floor(r()*2);
