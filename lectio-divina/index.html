<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>牛頭角浸信會 團契小組 · 聖言誦讀</title>
<style>
:root{--ink:#2a2723;--muted:#4a443b;--bg:#fbf5e6;--card:#fffdf6;--line:#eadfc6;--pri:#2c5a78;--pri2:#3a7096;--acc:#a8502a;--soft:#e6f0f5;--gold:#80600f;--ok:#4a7a38;--sky:#dcecf5;--meadow:#e3efd6;--sun:#f3cf7a;--u:13.66px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;line-height:1.6;letter-spacing:.02em;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
#stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#fbf5e6 0%,#f6efdc 100%)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--u)*3) calc(var(--u)*4.5) calc(var(--u)*4.2);animation:fade .5s ease}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.breath{animation:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slide.dark{background:radial-gradient(ellipse at 30% 60%,#2d3b52 0%,#141b26 75%);color:#f3ead6}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.slide>*{position:relative;z-index:1}
.slide>.bgimg,.slide>.shade,.slide>.ov{position:absolute;z-index:0}
.slide>.foot{position:absolute}
.pill{display:inline-flex;align-items:center;gap:.5em;align-self:flex-start;background:var(--pri);color:#fff;border-radius:999px;padding:.25em 1em;font-weight:700;font-size:max(calc(var(--u)*1.7),15px)}
.pill small{font-weight:400;opacity:.85}
.dark .pill{background:rgba(255,255,255,.14);color:#f6e3b4}
.head{display:flex;align-items:center;gap:calc(var(--u)*1.2);flex-wrap:wrap;min-height:0}
.reader{font-size:max(calc(var(--u)*1.7),15px);color:var(--acc);font-weight:700;border:2px solid var(--acc);border-radius:999px;padding:.15em .9em;background:#fffaf0}
.dots{margin-left:auto;display:flex;gap:.35em;font-size:max(calc(var(--u)*1.15),12px);color:var(--muted)}
.dots span{padding:.1em .55em;border-radius:999px;border:1px solid var(--line);background:rgba(255,253,246,.7)}
.dots span.on{background:var(--sun);border-color:var(--gold);color:#3b2c05;font-weight:700}
.dark .dots span{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#cfc6b2}
.dark .dots span.on{background:#f3cf7a;color:#2a2105}
h1.big{font-size:max(calc(var(--u)*4.6),28px);line-height:1.3;margin:.2em 0 .25em;color:var(--pri)}
h2.st{font-size:max(calc(var(--u)*3.4),24px);line-height:1.3;margin:.35em 0 .3em;color:var(--pri)}
.dark h2.st{color:#f6e3b4}
.say{font-size:max(calc(var(--u)*2.5),19px);line-height:1.6;margin:.2em 0}
.say b{color:var(--acc)}
.dark .say b{color:#f3cf7a}
.muted{color:var(--muted)}
.dark .muted{color:#cfc6b2}
/* cover */
.cover{justify-content:flex-end;padding-bottom:calc(var(--u)*5)}
.cover .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(251,245,230,.96) 0%,rgba(251,245,230,.88) 40%,rgba(251,245,230,.15) 68%,rgba(251,245,230,0) 100%);z-index:0}
.cover .ctext{max-width:60%}
.kicker{color:var(--gold);font-weight:700;font-size:max(calc(var(--u)*2),16px);letter-spacing:.12em}
.notice{display:inline-block;margin-top:.6em;border:2px solid var(--sun);background:rgba(255,253,246,.92);border-radius:16px;padding:.5em 1em;font-size:max(calc(var(--u)*1.75),15px);font-weight:700;color:var(--pri);line-height:1.6}
/* passage */
.passage{flex:1 1 auto;min-height:0;overflow:hidden;margin-top:calc(var(--u)*.8);font-size:calc(var(--u)*3.6);line-height:1.5;font-weight:500;color:#1f1c18;text-align:justify}
.dark .passage{color:#f3ead6}
.passage .vn{font-size:.5em;vertical-align:.7em;color:var(--acc);font-weight:700;margin:0 .12em 0 .25em;letter-spacing:0}
.ref{font-size:max(calc(var(--u)*2.2),18px);color:var(--pri);font-weight:700;margin-top:calc(var(--u)*.6)}
.ref .pg{color:var(--muted);font-weight:400;margin-left:.6em;font-size:.85em}
.prompt{flex:0 0 auto;margin-top:calc(var(--u)*.8);background:var(--card);border:1px solid var(--line);border-left:8px solid var(--acc);border-radius:14px;padding:.35em .9em;font-size:max(calc(var(--u)*2.1),17px);font-weight:700;color:var(--pri)}
/* two-column timer */
.two{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.5fr 1fr;gap:calc(var(--u)*3);align-items:center}
.two .txt{min-width:0}
.tbox{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1)}
.ring{position:relative;width:min(calc(var(--u)*25),48vh);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--pri2);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.dark .ring .bgc{stroke:rgba(255,255,255,.12)}
.dark .ring .fgc{stroke:#e9c46a}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ring .num b{font-size:min(calc(var(--u)*6.5),12vh);font-weight:600;color:var(--pri);line-height:1.1}
.dark .ring .num b{color:#f6e3b4}
.ring .num span{font-size:max(calc(var(--u)*1.5),14px);color:var(--muted)}
.dark .ring .num span{color:#cfc6b2}
.ring.done .fgc{stroke:var(--ok)}
.tctl{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center}
.tb{min-height:44px;min-width:44px;border-radius:12px;border:2px solid var(--pri);background:#fff;color:var(--pri);font-size:max(calc(var(--u)*1.4),15px);font-weight:700;padding:.2em .9em;cursor:pointer}
.tb.main{background:var(--pri);color:#fff}
.dark .tb{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35);color:#f3ead6}
.dark .tb.main{background:#e9c46a;color:#2a2105;border-color:#e9c46a}
.tb:focus-visible,.cb:focus-visible,.btn:focus-visible{outline:4px solid #f6c453;outline-offset:2px}
.breath{width:calc(var(--u)*5);height:calc(var(--u)*5);min-width:40px;min-height:40px;border-radius:50%;background:radial-gradient(circle,#cfe3ee,#9cc3d8);margin:.4em 0;animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.6);opacity:.6}40%{transform:scale(1.15);opacity:1}}
.breathlbl{font-size:max(calc(var(--u)*1.6),15px);color:var(--pri2)}
ul.tips{margin:.3em 0;padding-left:1.2em;font-size:max(calc(var(--u)*2.2),18px);line-height:1.6}
ul.tips li{margin:.15em 0}
.side{display:flex;gap:calc(var(--u)*3);flex:1 1 auto;min-height:0;align-items:center}
.side .art{flex:0 0 36%;border-radius:22px;overflow:hidden;box-shadow:0 6px 24px rgba(60,40,10,.18);border:4px solid #fffdf6;align-self:center}
.side .art img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.side .body{flex:1 1 auto;min-width:0}
.verse{font-size:max(calc(var(--u)*3.2),22px);line-height:1.6;font-weight:500}
.verse cite{display:block;font-style:normal;font-size:.55em;color:var(--pri);margin-top:.4em;font-weight:700}
.dark .verse cite{color:#e9c46a}
/* plan */
.plan{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:auto 1fr auto auto;gap:0 calc(var(--u)*1.6);align-content:center;font-size:max(calc(var(--u)*1.85),15px)}
.plan>div{padding:.28em 0;border-bottom:1px dashed var(--line)}
.plan .s{color:var(--acc);font-weight:700}
.plan .t{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.plan .m{font-weight:700;color:var(--pri);text-align:right;font-variant-numeric:tabular-nums}
.plan .tot{font-weight:700;color:var(--pri);border-bottom:0;padding-top:.5em}
/* setup */
.setup{overflow:auto;padding:calc(var(--u)*2) calc(var(--u)*3) calc(var(--u)*5);font-size:max(calc(var(--u)*1.25),15px)}
.setup h2.st{font-size:max(calc(var(--u)*2.6),22px);margin:.1em 0 .2em}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:calc(var(--u)*1.6)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.7em 1em;margin-bottom:calc(var(--u)*1.2)}
.card h3{margin:.1em 0 .45em;font-size:1.12em;color:var(--pri);border-left:6px solid var(--acc);padding-left:.5em}
.row{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;margin:.35em 0}
.row label{min-width:8.5em}
select,input[type=text],textarea{font-size:1em;padding:.35em .55em;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
select:focus,input:focus,textarea:focus{border-color:var(--pri2);outline:none}
textarea{width:100%;min-height:7em;resize:vertical;line-height:1.5}
input[type=text]{flex:1 1 10em;min-width:0}
.pv{max-height:9.5em;overflow:auto;background:#fbf7ec;border-radius:10px;padding:.5em .8em;line-height:1.7;margin-top:.4em}
.pv .vn{font-size:.7em;color:var(--acc);font-weight:700;vertical-align:.3em;margin:0 .15em}
.cb{display:inline-flex;align-items:center;gap:.4em;min-height:44px;cursor:pointer;margin-right:1em}
.cb input{width:1.3em;height:1.3em}
.est{font-size:1.35em;font-weight:700;color:var(--pri);background:var(--sky);border-radius:12px;padding:.4em .8em;margin:.2em 0 .6em}
.est.over{background:#fbe3d6;color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:.4em 1.2em;border-radius:14px;border:2px solid var(--pri);background:var(--pri);color:#fff;font-size:1.08em;font-weight:700;cursor:pointer;margin:.25em .4em .25em 0}
.btn.ghost{background:#fff;color:var(--pri)}
.keys{font-size:.95em;line-height:1.8}
kbd{display:inline-block;border:1px solid #c9bb98;border-bottom-width:3px;border-radius:6px;padding:0 .4em;background:#fff;font-family:inherit;font-size:.9em;min-width:1.6em;text-align:center}
.small{font-size:.9em}
/* controls */
#ctl{position:fixed;right:calc(var(--u)*1.2);bottom:calc(var(--u)*1);z-index:20;display:flex;gap:.4em;align-items:center;background:rgba(42,39,35,.72);border-radius:999px;padding:.35em .5em;transition:opacity .5s;font-size:max(calc(var(--u)*1.15),14px)}
#ctl button{min-height:44px;min-width:44px;border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:1em;font-weight:700;padding:0 .9em;cursor:pointer}
#ctl button:hover{background:rgba(255,255,255,.3)}
#ctl #pos{color:#eee;padding:0 .4em;font-variant-numeric:tabular-nums;white-space:nowrap}
body.idle #ctl{opacity:0;pointer-events:none}
body.idle{cursor:none}
#blank{position:fixed;inset:0;background:#000;z-index:30;display:none;align-items:flex-end;justify-content:flex-end;color:#333;font-size:12px;padding:8px}
#blank.on{display:flex}
#toast{position:fixed;left:50%;top:calc(var(--u)*2);transform:translateX(-50%);background:var(--pri);color:#fff;padding:.5em 1.2em;border-radius:12px;z-index:40;font-size:max(calc(var(--u)*1.4),15px);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.foot{position:absolute;left:calc(var(--u)*4.5);bottom:calc(var(--u)*1.4);font-size:max(calc(var(--u)*1),12px);color:var(--muted);z-index:1;max-width:60%}
.dark .foot{color:#9d957f}
.hint{font-size:max(calc(var(--u)*1.35),14px);color:var(--muted);margin-top:.5em}
/* portrait / phone */
@media (orientation:portrait){
 .slide{padding:16px 16px 76px}
 .cover .shade{background:linear-gradient(0deg,rgba(251,245,230,.97) 0%,rgba(251,245,230,.9) 55%,rgba(251,245,230,.1) 85%)}
 .cover .ctext{max-width:100%}
 .two{grid-template-columns:1fr;gap:12px;align-content:center}
 .ring{width:min(60vw,34vh)}
 .ring .num b{font-size:min(14vw,7vh)}
 .side{flex-direction:column;align-items:stretch;gap:12px;overflow:auto}
 .side .art{flex:0 0 auto}
 .grid{grid-template-columns:1fr}
 .setup{padding:14px 12px 90px}
 .dots{display:none}
 .plan{grid-template-columns:auto 1fr auto;font-size:15px}
 .plan .t{display:none}
 .foot{left:16px;bottom:64px;max-width:90%}
 #ctl{left:8px;right:8px;justify-content:space-between;bottom:8px}
 #ctl .wide{display:none}
}
</style>

  [2, "所以，地雖改變，山雖搖動到海心，"],
  [3, "其中的水雖匉訇翻騰，山雖因海漲而戰抖，我們也不害怕。（細拉）"],
  [4, "有一道河，這河的分汊使　神的城歡喜；這城就是至高者居住的聖所。"],
  [5, "神在其中，城必不動搖；到天一亮，　神必幫助這城。"],
  [6, "外邦喧嚷，列國動搖；　神發聲，地便鎔化。"],
  [7, "萬軍之耶和華與我們同在；雅各的　神是我們的避難所！（細拉）"],
  [8, "你們來看耶和華的作為，看他使地怎樣荒涼。"],
  [9, "他止息刀兵，直到地極；他折弓、斷槍，把戰車焚燒在火中。"],
  [10, "你們要休息，要知道我是　神！我必在外邦中被尊崇，在遍地上也被尊崇。"],
  [11, "萬軍之耶和華與我們同在；雅各的　神是我們的避難所！"],
 ]},
 {id:"psa131", ref:"詩篇 131篇", theme:"我的心平穩安靜", verses:[
  [1, "（大衛上行之詩。）耶和華啊，我的心不狂傲，我的眼不高大；重大和測不透的事，我也不敢行。"],
  [2, "我的心平穩安靜，好像斷過奶的孩子在他母親的懷中；我的心在我裡面真像斷過奶的孩子。"],
  [3, "以色列啊，你當仰望耶和華，從今時直到永遠！"],
 ]},
 {id:"isa40", ref:"以賽亞書 40:28-31", theme:"等候耶和華的必重新得力", verses:[
  [28, "你豈不曾知道嗎？你豈不曾聽見嗎？永在的　神耶和華，創造地極的主，並不疲乏，也不困倦；他的智慧無法測度。"],
  [29, "疲乏的，他賜能力；軟弱的，他加力量。"],
  [30, "就是少年人也要疲乏困倦；強壯的也必全然跌倒。"],
  [31, "但那等候耶和華的必重新得力。他們必如鷹展翅上騰；他們奔跑卻不困倦，行走卻不疲乏。"],
 ]},
 {id:"isa43", ref:"以賽亞書 43:1-4", theme:"我曾提你的名召你", verses:[
  [1, "雅各啊，創造你的耶和華，以色列啊，造成你的那位，現在如此說：你不要害怕！因為我救贖了你。我曾提你的名召你，你是屬我的。"],
  [2, "你從水中經過，我必與你同在；你蹚過江河，水必不漫過你；你從火中行過，必不被燒，火焰也不著在你身上。"],
  [3, "因為我是耶和華─你的　神，是以色列的聖者─你的救主；我已經使埃及作你的贖價，使古實和西巴代替你。"],
  [4, "因我看你為寶為尊；又因我愛你，所以我使人代替你，使列邦人替換你的生命。"],
 ]},
 {id:"mat11", ref:"馬太福音 11:28-30", theme:"到我這裡來得安息", verses:[
  [28, "凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。"],
  [29, "我心裡柔和謙卑，你們當負我的軛，學我的樣式；這樣，你們心裡就必得享安息。"],
  [30, "因為我的軛是容易的，我的擔子是輕省的。」"],
 ]},
 {id:"mrk4", ref:"馬可福音 4:35-41", theme:"住了吧！靜了吧！", verses:[
  [35, "當那天晚上，耶穌對門徒說：「我們渡到那邊去吧。」"],
  [36, "門徒離開眾人，耶穌仍在船上，他們就把他一同帶去；也有別的船和他同行。"],
  [37, "忽然起了暴風，波浪打入船內，甚至船要滿了水。"],
  [38, "耶穌在船尾上，枕著枕頭睡覺。門徒叫醒了他，說：「夫子！我們喪命，你不顧嗎？」"],
  [39, "耶穌醒了，斥責風，向海說：「住了吧！靜了吧！」風就止住，大大地平靜了。"],
  [40, "耶穌對他們說：「為甚麼膽怯？你們還沒有信心嗎？」"],
  [41, "他們就大大地懼怕，彼此說：「這到底是誰，連風和海也聽從他了。」"],
 ]},
 {id:"luk10", ref:"路加福音 10:38-42", theme:"不可少的只有一件", verses:[
  [38, "他們走路的時候，耶穌進了一個村莊。有一個女人，名叫馬大，接他到自己家裡。"],
  [39, "她有一個妹子，名叫馬利亞，在耶穌腳前坐著聽他的道。"],
  [40, "馬大伺候的事多，心裡忙亂，就進前來，說：「主啊，我的妹子留下我一個人伺候，你不在意嗎？請吩咐她來幫助我。」"],
  [41, "耶穌回答說：「馬大！馬大！你為許多的事思慮煩擾，"],
  [42, "但是不可少的只有一件；馬利亞已經選擇那上好的福分，是不能奪去的。」"],
 ]},
 {id:"joh15", ref:"約翰福音 15:1-8", theme:"常在我裡面", verses:[
  [1, "「我是真葡萄樹，我父是栽培的人。"],
  [2, "凡屬我不結果子的枝子，他就剪去；凡結果子的，他就修理乾淨，使枝子結果子更多。"],
  [3, "現在你們因我講給你們的道，已經乾淨了。"],
  [4, "你們要常在我裡面，我也常在你們裡面。枝子若不常在葡萄樹上，自己就不能結果子；你們若不常在我裡面，也是這樣。"],
  [5, "我是葡萄樹，你們是枝子。常在我裡面的，我也常在他裡面，這人就多結果子；因為離了我，你們就不能做甚麼。"],
  [6, "人若不常在我裡面，就像枝子丟在外面枯乾，人拾起來，扔在火裡燒了。"],
  [7, "你們若常在我裡面，我的話也常在你們裡面，凡你們所願意的，祈求，就給你們成就。"],
  [8, "你們多結果子，我父就因此得榮耀，你們也就是我的門徒了。"],
 ]},
 {id:"joh21", ref:"約翰福音 21:15-17", theme:"你愛我嗎？", verses:[
  [15, "他們吃完了早飯，耶穌對西門•彼得說：「約翰（在馬太十六章十七節稱約拿）的兒子西門，你愛我比這些更深嗎？」彼得說：「主啊，是的，你知道我愛你。」耶穌對他說：「你餵養我的小羊。」"],
  [16, "耶穌第二次又對他說：「約翰的兒子西門，你愛我嗎？」彼得說：「主啊，是的，你知道我愛你。」耶穌說：「你牧養我的羊。」"],
  [17, "第三次對他說：「約翰的兒子西門，你愛我嗎？」彼得因為耶穌第三次對他說「你愛我嗎」，就憂愁，對耶穌說：「主啊，你是無所不知的；你知道我愛你。」耶穌說：「你餵養我的羊。"],
 ]},
 {id:"rom8", ref:"羅馬書 8:35-39", theme:"誰能使我們與基督的愛隔絕", verses:[
  [35, "誰能使我們與基督的愛隔絕呢？難道是患難嗎？是困苦嗎？是逼迫嗎？是飢餓嗎？是赤身露體嗎？是危險嗎？是刀劍嗎？"],
  [36, "如經上所記：我們為你的緣故終日被殺；人看我們如將宰的羊。"],
  [37, "然而，靠著愛我們的主，在這一切的事上已經得勝有餘了。"],
  [38, "因為我深信無論是死，是生，是天使，是掌權的，是有能的，是現在的事，是將來的事，"],
  [39, "是高處的，是低處的，是別的受造之物，都不能叫我們與　神的愛隔絕；這愛是在我們的主基督耶穌裡的。"],
 ]},
 {id:"php4", ref:"腓立比書 4:4-9", theme:"應當一無掛慮", verses:[
  [4, "你們要靠主常常喜樂。我再說，你們要喜樂。"],
  [5, "當叫眾人知道你們謙讓的心。主已經近了。"],
  [6, "應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴　神。"],
  [7, "神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。"],
  [8, "弟兄們，我還有未盡的話：凡是真實的、可敬的、公義的、清潔的、可愛的、有美名的，若有甚麼德行，若有甚麼稱讚，這些事你們都要思念。"],
  [9, "你們在我身上所學習的，所領受的，所聽見的，所看見的，這些事你們都要去行，賜平安的　神就必與你們同在。"],
 ]},
],
bless: {"id": "bless", "ref": "民數記 6:24-26", "theme": "", "verses": [[24, "『願耶和華賜福給你，保護你。"], [25, "願耶和華使他的臉光照你，賜恩給你。"], [26, "願耶和華向你仰臉，賜你平安。』"]]},

<script>
(function(){

var KEY='lectioGroup.v1';

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function parseCustom(){
  var lines=S.ctext.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean),out=[];
  lines.forEach(function(l){var m=l.match(/^(\d{1,3})\s*[:：.．、]?\s*(\S.*)$/);if(m)out.push([+m[1],m[2]]);else out.push([0,l])});
  return out;
}
function passage(){
  if(S.pid==='custom'){var v=parseCustom();if(v.length)return {id:'custom',ref:S.cref.trim()||'自訂經文',verses:v}}
  for(var i=0;i<P.length;i++)if(P[i].id===S.pid)return P[i];
  return P[0];
}
function vhtml(v){return v.map(function(x){return (x[0]?'<span class="vn">'+x[0]+'</span>':'')+esc(x[1])}).join('')}

function readMin(){var n=0;passage().verses.forEach(function(v){n+=v[1].length});return Math.max(.5,Math.round(n/180*2)/2)}
var STAGES=[
 {k:'r1',name:'第一次誦讀 · 讀',lat:'Lectio',short:'讀',read:'聆聽時，留意觸動你的字詞',sil:'在心裡輕輕重複那個字或詞，不用分析，只是讓它停留在心中。',shareT:'分享：只說那個字或詞',share:['每人只說出那個字或詞，<b>不需要解釋</b>。','例如：「平安」、「你與我同在」。','也可以說「我想先靜默」，這是完全可以的。','大家只是聆聽，不回應、不討論。']},
 {k:'r2',name:'第二次誦讀 · 默想',lat:'Meditatio',short:'默想',read:'這段經文如何觸及你今天的生命？',sil:'那個字詞與你今天的處境、感受或掛慮有甚麼連結？讓聖靈提醒你。',shareT:'分享：經文怎樣觸及我',share:['用一兩句分享：「這段經文觸及我……」','簡短、真誠地說，<b>不用講道理</b>。','其他人用心聆聽，不給意見、不作糾正。','分享內容留在小組之內，彼此保密。']},
 {k:'r3',name:'第三次誦讀 · 禱告',lat:'Oratio',short:'禱告',read:'神透過經文邀請你作出甚麼回應？',sil:'把你的回應化成簡短的禱告：感謝、認罪、求助，或順服神的帶領。',shareT:'小組彼此代禱',share:['每人用一句話說出：「我感到神邀請我……」','然後<b>為右邊的弟兄姊妹禱告</b>，記念他／她剛才的分享。','禱告可以很簡短，一兩句已經足夠。','不想出聲的，可以在心裡默禱，然後輕拍右邊的人表示完成。']}
];
function plan(){
  var rm=readMin(),rows=[];

}

function clock(m){m=Math.round(m);return Math.floor(m/60)+':'+('0'+(m%60)).slice(-2)}
// ---------- passage fit / pagination ----------
function U(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||13}
function fits(el){return el.scrollHeight<=el.clientHeight+1}
function minF(){return Math.max(U()*3.2,19)}
function maxF(){return Math.max(U()*4.4,24)}
function paginate(el,vs){
  var lo=minF(),hi=maxF();el.innerHTML=vhtml(vs);el.style.fontSize=lo+'px';
  if(fits(el)){for(var i=0;i<14;i++){var m=(lo+hi)/2;el.style.fontSize=m+'px';if(fits(el))lo=m;else hi=m}return [{v:vs,f:Math.floor(lo)}]}
  var f=Math.max(U()*3.5,20);if(f<minF())f=minF();el.style.fontSize=f+'px';
  var out=[],cur=[];
  vs.forEach(function(v){var trial=cur.concat([v]);el.innerHTML=vhtml(trial);if(!fits(el)&&cur.length){out.push(cur);cur=[v]}else cur=trial});
  if(cur.length)out.push(cur);
  // balance: try equal-ish split into same number of pages
  var n=out.length,tot=vs.reduce(function(a,v){return a+v[1].length},0),bal=[],c=[],acc=0,ok=true;
  vs.forEach(function(v){c.push(v);acc+=v[1].length;if(acc>=tot*(bal.length+1)/n&&bal.length<n-1){bal.push(c);c=[]}});if(c.length)bal.push(c);
  if(bal.length===n){bal.forEach(function(p){el.innerHTML=vhtml(p);if(!fits(el))ok=false});if(ok)out=bal}
  return out.map(function(p){el.innerHTML=vhtml(p);var lo2=f,hi2=Math.max(f,maxF()*.92);el.style.fontSize=lo2+'px';if(!fits(el)){for(var i=0;i<10&&!fits(el)&&lo2>14;i++){lo2-=2;el.style.fontSize=lo2+'px'}return {v:p,f:lo2}}for(var j=0;j<10;j++){var m=(lo2+hi2)/2;el.style.fontSize=m+'px';if(fits(el))lo2=m;else hi2=m}return {v:p,f:Math.floor(lo2)}});
}

// swipe on touch
var sx=null,sy=0;document.addEventListener('touchstart',function(e){if(e.target.closest('.setup,#ctl'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){dx<0?next():prev()}},{passive:true});
// idle controls
var it=0;function wake(){document.body.classList.remove('idle');clearTimeout(it);it=setTimeout(function(){if(SC[idx]&&SC[idx].id!=='setup')document.body.classList.add('idle')},2500)}
document.addEventListener('mousemove',wake);document.addEventListener('touchstart',wake,{passive:true});
function sizeU(){var u=Math.min(innerWidth,innerHeight*16/9)/100;document.documentElement.style.setProperty('--u',u+'px')}
var rz=0;addEventListener('resize',function(){sizeU();clearTimeout(rz);rz=setTimeout(function(){pageCache=null;if(SC[idx].id==='read')layoutRead();else if(SC[idx].id==='setup')updSetup()},120)});
sizeU();build();render();wake();
window.APPREADY=true;
})();
</script>
</body>
</html>
