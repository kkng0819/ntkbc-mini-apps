<style>

.tbtn.mus{display:inline-flex;align-items:center;gap:.25rem;padding:0 .6rem;font-weight:700}.tbtn.mus .ic{width:1.15em;height:1.15em;stroke-width:2.4}.tbtn.mus.off{color:#8a8170;background:#f4efe4}.tbtn.mus.off .ic{opacity:.55}

main{max-width:760px;margin:0 auto;padding:.8rem .9rem 3rem}

.strip{display:block;width:100%;height:76px;object-fit:cover;border-radius:18px;border:3px solid #fffaf0;margin:.1rem 0 .5rem}

.small{font-size:.9rem;color:var(--muted)}
.links{display:flex;flex-direction:column;gap:.5rem;margin:.4rem 0 1rem}.links .btn{width:100%}
details.fold{background:var(--card);border:1px solid #eee3ca;border-radius:20px;padding:.4rem 1rem;margin:.8rem 0}
details.fold summary{cursor:pointer;min-height:48px;display:flex;align-items:center;gap:.4rem;font-weight:700;color:var(--pri)}
.donebadge{display:flex;align-items:center;gap:.5rem;background:#eef6e9;border:2px solid #bcd9ad;color:#2f5a27;border-radius:18px;padding:.6rem .9rem;font-weight:700;margin:.6rem 0}
.streak{font-weight:700;color:#9a6b1a}

.qnum{font-size:1.15rem;font-weight:800;color:var(--pri)}

.verse .vr{font-weight:700;color:#3d6b33;margin-bottom:.2rem}
.verse p{margin:.2rem 0;font-size:1.12rem}
.verse sup{color:#3d6b33;font-weight:700;font-size:.72em;margin-right:.15em}
.timer{display:flex;align-items:center;gap:.7rem;background:#fff;border:1.5px solid #e3d6b8;border-radius:18px;padding:.5rem .8rem;margin:.7rem 0}
.timer .tt{flex:1;min-width:0}
.timer .tl{font-size:.95rem;color:var(--muted)}
.timer .tb{height:10px;background:#efe7d4;border-radius:99px;overflow:hidden;margin-top:.25rem}
.timer .tb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f3cf7a,#d9963a);border-radius:99px}
.timer.ok .tl{color:#2f5a27;font-weight:700}
details.note summary{cursor:pointer;min-height:48px;display:flex;align-items:center;gap:.4rem;font-weight:700;color:var(--pri)}
textarea{width:100%;min-height:6.5em;font-family:inherit;font-size:1.05rem;line-height:1.6;padding:.7rem .8rem;border-radius:16px;border:2px solid #d8ccb2;background:#fffefb;color:var(--ink);resize:vertical}

.nav{display:grid;grid-template-columns:2fr 3fr;gap:.6rem;margin:1.1rem 0 .4rem}
.nav .btn{width:100%;min-height:68px;font-size:1.2rem;white-space:nowrap;padding:.5rem .6rem}
.pray{font-size:1.3rem;line-height:1.8;font-weight:700;color:#4a3305}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;text-align:center;margin:.4rem 0}
.cal .h{font-size:.8rem;color:var(--muted);font-weight:700}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.95rem;background:#fffdf7;border:1px solid #eee3ca}

.cal .d.today{outline:3px solid #f3cf7a;outline-offset:1px}
.cal .d.e{background:none;border:0}
.calhd{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
.calhd b{font-size:1.1rem;color:var(--pri);white-space:nowrap}
.calhd .btn{min-width:48px;padding:0 .8rem}
.stats{display:flex;gap:.6rem;margin:.6rem 0}
.stats div{flex:1;background:#fff7e0;border:2px solid #ecd08e;border-radius:18px;padding:.5rem;text-align:center}
.stats b{display:block;font-size:1.7rem;color:#9a6b1a;line-height:1.2}
.stats span{font-size:.9rem;color:var(--muted)}
.confirm{background:#fff5e8;border:2px solid #e7b9a0;border-radius:18px;padding:.8rem 1rem;margin:.6rem 0}
.confirm .btn{margin:.2rem .3rem .2rem 0}
footer{max-width:760px;margin:0 auto;padding:1rem .9rem 2.5rem;font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#3d3a33;color:#fff;padding:.7rem 1.2rem;border-radius:999px;font-size:1rem;z-index:20;display:none;max-width:90vw;text-align:center}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}

<script>var DATA={"steps": [{"t": "安靜，意識神同在", "ic": "i-candle", "g": ["坐好，放低手機以外嘅嘢。", "慢慢深呼吸三次。", "記住：神而家就喺你身邊。"], "p": ["靜靜咁同神講：「主，我喺度。」", "留意一下：我此刻嘅心情係點？"], "v": {"ref": "詩篇 46:10", "verses": [[10, "你們要休息，要知道我是　神！我必在外邦中被尊崇，在遍地上也被尊崇。"]]}}, {"t": "感恩", "ic": "i-heart", "g": ["回想今日，有咩值得感恩？", "大事細事都得：一餐飯、一句說話、一個人。"], "p": ["今日邊一刻，令我最開心或者最平安？", "為一件細小嘅恩典，多謝神。"], "v": {"ref": "詩篇 103:2", "verses": [[2, "我的心哪，你要稱頌耶和華！不可忘記他的一切恩惠！"]]}}, {"t": "回顧今日", "ic": "i-eye", "g": ["求聖靈光照你。", "好似睇片咁，由朝早慢慢睇到而家。"], "p": ["今日幾時，我覺得同神好接近？", "幾時，我覺得遠離神、心裡面唔平安？"], "v": {"ref": "詩篇 139:23-24", "verses": [[23, "神啊，求你鑒察我，知道我的心思，試煉我，知道我的意念，"], [24, "看在我裡面有甚麼惡行沒有，引導我走永生的道路。"]]}}, {"t": "認罪、領受饒恕", "ic": "i-hands", "g": ["有冇講錯、做錯，或者應該做而冇做？", "誠實咁告訴神，唔使驚。"], "p": ["「主，求你赦免我……」", "相信神已經赦免你，安心領受佢嘅饒恕同平安。"], "v": {"ref": "約翰壹書 1:9", "verses": [[9, "我們若認自己的罪，　神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。"]]}}, {"t": "展望明日、交託", "ic": "i-sunrise", "g": ["想一想明日嘅安排。", "將擔心同盼望，一樣一樣交託畀神。"], "p": ["明日有咩事要面對？", "求神喺一件具體嘅事上帶領我。"], "v": {"ref": "箴言 3:5-6", "verses": [[5, "你要專心仰賴耶和華，不可倚靠自己的聰明，"], [6, "在你一切所行的事上都要認定他，他必指引你的路。"]]}}], "closing": "親愛嘅天父，多謝你今日一直同我同在。求你赦免我嘅軟弱，賜我今晚安睡；明日，我願意再跟隨你。奉主耶穌基督嘅名求，阿們。", "lords": {"ref": "馬太福音 6:9-13", "verses": [[9, "所以，你們禱告要這樣說：我們在天上的父：願人都尊你的名為聖。"], [10, "願你的國降臨；願你的旨意行在地上，如同行在天上。"], [11, "我們日用的飲食，今日賜給我們。"], [12, "免我們的債，如同我們免了人的債。"], [13, "不叫我們遇見試探；救我們脫離兇惡（或譯：脫離惡者）。因為國度、權柄、榮耀，全是你的，直到永遠。阿們（有古卷沒有因為……阿們等字）！"]]}, "guide": ["第一個步驟：每晚臨睡前，揀一個安靜嘅位置，打開呢個程式，按「開始」。", "第二個步驟：跟住畫面一步一步做，每步大約 1 分鐘；想寫低就寫，唔寫都得。", "第三個步驟：最後讀結束禱告，按「完成」；程式會記低今日，日曆上會見到你嘅足跡。"]};
